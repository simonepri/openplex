# GitHub Actions workflow running the Format, Lint, and Test gates in parallel.

name: CI
"on":
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read # Required to read repository contents
jobs:
  format:
    name: Format
    if: vars.USE_BUILDBUDDY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BAZEL_CACHE: format
    steps:
      - &free-disk-space
        # The root disk starts with about 87 GB free and a cold full Test run
        # peaks at 64 GB, late in the build. Deleting the five largest
        # preinstalled toolchains (29 GB) in the background widens the margin
        # to about 50 GB within a few minutes without delaying the job.
        name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift > /dev/null 2>&1 &
      - &checkout
        # v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &mise
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          cache: true
      - &restore-bazel-cache
        # Every save uses a fresh key and restores take the newest prefix
        # match, so the cache follows main instead of freezing at its first
        # save; GitHub evicts the least recently used generations.
        # v4.2.2
        name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: &bazel-cache-paths |
            ~/.cache/bazel/repository
            ~/.cache/bazel/disk_cache
          key: bazel-${{ runner.os }}-${{ env.BAZEL_CACHE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-${{ runner.os }}-${{ env.BAZEL_CACHE }}-
      - &configure-bazel
        # Scoping the cache flags to the ci config keeps them after its empty
        # cache defaults even when a command passes --config=ci again. The
        # pruning step bounds the cache, so Bazel's idle garbage collection
        # stays off instead of deleting entries while the cache is saved.
        name: Configure CI Bazel profile
        run: |
          cat << EOF >> .bazelrc.user
          common:ci --repository_cache=$HOME/.cache/bazel/repository
          build:ci --disk_cache=$HOME/.cache/bazel/disk_cache
          build:ci --experimental_disk_cache_gc_max_size=0
          EOF
          touch "$RUNNER_TEMP/bazel-cache-restored"
      - name: Verify formatting and code generation
        run: bazel run --config=ci //:fix -- --check
      - &prune-bazel-cache
        # GitHub caps a repository's caches at 10 GB. Bazel refreshes the
        # mtime of the cache entries it uses, so pruning drops entries this
        # run left unused before used ones, and the largest first within each
        # group: large blobs are cheap downloads and copies, while small ones
        # carry most of the action results.
        name: Prune Bazel caches
        if: always() && steps.bazel-cache.outcome == 'success'
        env:
          MAX_BYTES: 5000000000
        run: |
          # Bazel servers still write cache entries after their last command.
          bazel shutdown
          if [ -n "${BAZEL_OUTPUT_ROOT:-}" ]; then
            bazel --output_user_root="$BAZEL_OUTPUT_ROOT" shutdown
          fi
          cache="$HOME/.cache/bazel"
          mkdir -p "$cache/repository" "$cache/disk_cache"
          find "$cache/repository" "$cache/disk_cache" -type f -printf '%T@ %s %p\n' |
            awk -v start="$(stat -c %Y "$RUNNER_TEMP/bazel-cache-restored")" '{ print ($1 >= start), $2, $3 }' |
            sort -k1,1nr -k2,2n |
            awk -v max="$MAX_BYTES" '{ if (total + $2 <= max) total += $2; else print $3 }' |
            xargs -r rm -f
          du -sh "$cache/repository" "$cache/disk_cache"
      - &save-bazel-cache
        # Saving after failed runs keeps the next run warm.
        # v4.2.2
        name: Save Bazel caches
        if: always() && steps.bazel-cache.outcome == 'success'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf
        with:
          path: *bazel-cache-paths
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
  lint:
    name: Lint
    if: vars.USE_BUILDBUDDY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BAZEL_CACHE: build
    steps:
      - *free-disk-space
      - *checkout
      - *mise
      - *restore-bazel-cache
      - *configure-bazel
      - name: Run static analysis checks
        env:
          BAZEL_CONFIG_FLAGS: --config=ci
        run: bazel run --config=ci //:check
  test:
    name: Test
    if: vars.USE_BUILDBUDDY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BAZEL_CACHE: build
    steps:
      - *free-disk-space
      - *checkout
      - *mise
      - *restore-bazel-cache
      - *configure-bazel
      - name: Run affected test suite
        run: python3 src/bazel/tools/diff/cli.py test --config=ci
      - *prune-bazel-cache
      - *save-bazel-cache
