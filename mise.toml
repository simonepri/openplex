# Configures root mise workspace settings, toolchain versions, monorepo tasks, and sub-project delegation.

monorepo_root = true

[monorepo]
config_roots = ["src/examples/*", "src/infra"]

[tools]
# keep-sorted start block=yes
"aqua:aws/aws-cli" = "2.37.10"
"aqua:boyter/scc" = "4.1.0"
"aqua:google/osv-scanner" = "2.6.0"
"aqua:kubescape/kubescape" = "4.0.15"
"aqua:kyverno/chainsaw" = "0.2.15"
"aqua:oras-project/oras" = "1.3.4"
"cargo:ifttt-lint" = { version = "0.11.2", depends = "rust" }
"github:anchore/syft" = "1.54.1"
"github:buildbuddy-io/bazel" = { version = "5.0.492", bin = "bb" }
"github:google/keep-sorted" = "0.10.0"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = { version = "0.6.0", depends = "go" }
"npm:cf" = { version = "1.0.0-beta.13", depends = "node" }
"npm:jscpd" = { version = "5.4.0", depends = "node", trust_policy_excludes = [
  "jscpd@4.3.0",
] }
"npm:oxlint" = { version = "1.87.0", depends = "node" }
"npm:renovate" = { version = "44.147.0", depends = "node", trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
"npm:rulesync" = { version = "28.0.0", depends = "node" }
agy = "1.3.1"
argocd = "3.5.4"
bazel = "9.3.0"
bazel-watcher = "0.33.0"
buildifier = "10.1.0"
claude = "2.1.294"
coder = "2.38.0"
codex = "0.159.0"
colima = "0.10.3"
docker-cli = "29.8.2"
docker-compose = "5.6.0"
gcloud = "584.0.0"
go = "1.27.2"
helm = "4.3.0"
jq = "1.8.2"
kube-linter = "0.8.3"
kubeconform = "0.8.0"
kubectl = "1.37.1"
lima = "2.2.1"
node = "24.21.0"
opentofu = "1.13.1"
oxfmt = "0.72.0"
pnpm = "12.10.1"
python = "3.13.15"
ripgrep = "15.2.0"
rust = { version = "1.99.0", profile = "minimal" }
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
terraform = "1.16.5"
tflint = "0.64.0"
trivy = "0.75.0"
ty = "0.0.85"
uv = "0.12.23"
yq = "4.54.1"
# keep-sorted end

[env]
REPO_CACHE_DIR = '{{env.XDG_CACHE_HOME | default(value=env.HOME ~ "/.cache")}}/repo'
BAZEL_OUTPUT_ROOT = '{{env.BAZEL_OUTPUT_ROOT | default(value=config_root ~ "/.tmp/state/bazel")}}'
PYTHONDONTWRITEBYTECODE = "1"
PYTHONPYCACHEPREFIX = "{{env.REPO_CACHE_DIR}}/python"
PYTEST_ADDOPTS = "-o cache_dir={{env.REPO_CACHE_DIR}}/pytest"
UV_CACHE_DIR = "{{env.HOME}}/.cache/uv"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.tmp/venv"
npm_config_store_dir = "{{env.HOME}}/.local/share/pnpm/store"
RUMDL_CACHE_DIR = "{{env.REPO_CACHE_DIR}}/rumdl"
RUFF_CACHE_DIR = "{{env.REPO_CACHE_DIR}}/ruff"
TF_PLUGIN_CACHE_DIR = "{{env.REPO_CACHE_DIR}}/opentofu/plugins"
TFLINT_PLUGIN_DIR = "{{env.REPO_CACHE_DIR}}/tflint/plugins"
TF_CLI_CONFIG_FILE = "{{config_root}}/.tmp/state/opentofu.tfrc"
AWS_CONFIG_FILE = "{{config_root}}/.aws/config"
BUILDBUDDY_ORG = "openplex"
_.path = ["/bin", "/usr/bin", "/usr/sbin", "/sbin"]

[tasks.init]
description = "Install toolchains, git hooks, and initialize repository"
run = './src/bazel/tools/init.sh "$@"'

[tasks.fix]
description = "Auto-fix and format authored sources; defaults to affected, use --all for the entire codebase"
run = "bash -c 'targets=($(python3 src/bazel/tools/diff/cli.py fix \"$@\")); [ -n \"$targets\" ] && bazel --output_user_root={{env.BAZEL_OUTPUT_ROOT}} run //:fix -- \"${targets[@]}\"' bash \"$@\""

[tasks.build]
description = "Build targets; defaults to affected, use --all for the entire codebase"
run = "bash -c 'targets=($(python3 src/bazel/tools/diff/cli.py build \"$@\")); [ -n \"$targets\" ] && bazel --output_user_root={{env.BAZEL_OUTPUT_ROOT}} build \"${targets[@]}\"' bash \"$@\""

[tasks.test]
description = "Run tests; defaults to affected, use --all for the entire codebase"
run = "bash -c 'targets=($(python3 src/bazel/tools/diff/cli.py test \"$@\")); [ -n \"$targets\" ] && bazel --output_user_root={{env.BAZEL_OUTPUT_ROOT}} test \"${targets[@]}\"' bash \"$@\""

[tasks.review]
description = "Review changes in the repository using an AI agent (claude, codex, agy)"
run = 'bazel --output_user_root={{env.BAZEL_OUTPUT_ROOT}} run //:review -- --agent "${REVIEW_AGENT:-auto}" "$@"'
