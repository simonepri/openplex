# Defines the CloudNativePG PostgreSQL cluster resource backing stateful sessions for the Svelte web app.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: svelte-web-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: svelte-web-postgres
    app.kubernetes.io/part-of: svelte-web
    availability-class: ha
    cost-center: examples
    environment: production
    latency-class: ls
    team: examples
    velero.io/exclude-from-backup: "true"
spec:
  instances: 1
  inheritedMetadata:
    labels:
      availability-class: ha
      latency-class: ls
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:9446e83aa490df3f14ebf5bf2f6002a1347728690ff38f35dd7a85b925a62468
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  bootstrap:
    initdb:
      database: svelte_web
      owner: svelte_web
  enablePDB: false
  enableSuperuserAccess: false
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  stopDelay: 300
  storage:
    size: 2Gi
    storageClass: general-expandable
  walStorage:
    size: 1Gi
    storageClass: general-expandable
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  postgresql:
    parameters:
      password_encryption: scram-sha-256
  podSecurityContext:
    fsGroup: 26
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
