# Define semantic YAML lint rules enforcing document structure, key uniqueness, and anchor validity.

extends: default

rules:
  # keep-sorted start
  braces: disable
  brackets: disable
  colons: disable
  commas: disable
  comments-indentation: disable
  document-start: disable
  empty-lines: disable
  hyphens: disable
  indentation: disable
  line-length: disable
  new-line-at-end-of-file: disable
  trailing-spaces: disable
  # keep-sorted end
  comments:
    level: error
    min-spaces-from-content: 1
  empty-values:
    level: error
    forbid-in-block-mappings: true
  octal-values:
    level: error
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  truthy:
    level: error
    allowed-values: ["true", "false"]
    check-keys: true
