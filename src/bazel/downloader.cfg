# Configures Bazel downloader mirror rewrites and fallback endpoints for immutable Ubuntu APT package snapshots.

rewrite (snapshot\.ubuntu\.com/ubuntu/[0-9]{8}T[0-9]{6}Z/pool/.*/[^/]+_(amd64|all)\.deb) $1
rewrite snapshot\.ubuntu\.com/ubuntu/[0-9]{8}T[0-9]{6}Z/(pool/.*/[^/]+_(amd64|all)\.deb) archive.ubuntu.com/ubuntu/$1
rewrite (snapshot\.ubuntu\.com/ubuntu/[0-9]{8}T[0-9]{6}Z/pool/.*/[^/]+_arm64\.deb) $1
rewrite snapshot\.ubuntu\.com/ubuntu/[0-9]{8}T[0-9]{6}Z/(pool/.*/[^/]+_arm64\.deb) ports.ubuntu.com/ubuntu-ports/$1
