# Configures RequestsOnly sizing for OBI DaemonSet using Initial mode on pod startup without mid-flight sensor evictions.

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: obi
  namespace: obi-system
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: obi}
  updatePolicy: {updateMode: "Initial"}
  resourcePolicy:
    containerPolicies:
      - containerName: ebpf-instrument
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        # Start-up probe attachment spikes far above steady state; size requests for steady state only.
        maxAllowed: {memory: 256Mi}
