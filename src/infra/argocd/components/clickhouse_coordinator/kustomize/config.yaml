# ConfigMap supplying stateless ClickHouse coordinator server configuration and query cache tuning.

apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-coordinator
  namespace: signoz
  labels:
    app.kubernetes.io/name: clickhouse-coordinator
    app.kubernetes.io/instance: clickhouse-coordinator
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: signoz
    app.kubernetes.io/managed-by: argocd
data:
  coordinator.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>1</console>
      </logger>
      <listen_host>0.0.0.0</listen_host>
      <http_port>8123</http_port>
      <tcp_port>9000</tcp_port>
      <!-- Skip binary checksum verification to tolerate eBPF uprobe breakpoints from profilers -->
      <skip_binary_checksum_checks>true</skip_binary_checksum_checks>

      <!-- Query cache configuration -->
      <query_cache>
        <max_size_in_bytes>268435456</max_size_in_bytes>
        <max_entries>1024</max_entries>
      </query_cache>

      <!-- Background thread pool tuning -->
      <background_pool_size>16</background_pool_size>
      <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
      <background_fetches_pool_size>8</background_fetches_pool_size>
      <background_move_pool_size>8</background_move_pool_size>
      <background_schedule_pool_size>16</background_schedule_pool_size>
      <background_buffer_flush_schedule_pool_size>8</background_buffer_flush_schedule_pool_size>
      <background_distributed_schedule_pool_size>16</background_distributed_schedule_pool_size>
      <background_message_broker_schedule_pool_size>8</background_message_broker_schedule_pool_size>
      <background_common_pool_size>8</background_common_pool_size>

      <!-- Remote servers configuration routing to ClickHouse backend -->
      <remote_servers>
        <cluster>
          <shard>
            <internal_replication>true</internal_replication>
            <replica>
              <host>chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local</host>
              <port>9000</port>
            </replica>
          </shard>
        </cluster>
      </remote_servers>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <users>
        <admin>
          <password from_env="CLICKHOUSE_PASSWORD"></password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </admin>
        <default>
          <password from_env="CLICKHOUSE_PASSWORD"></password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
        </default>
      </users>
      <profiles>
        <default>
          <use_query_cache>1</use_query_cache>
        </default>
      </profiles>
    </clickhouse>
