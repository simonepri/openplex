# Exercises complete non-production team lane to lint namespace ownership, class LocalQueue aliases, and the split declarative/interactive Role surface.

mode: cell
devWorkspaces:
  enabled: false
team:
  slug: fixtureteam
  group: cluster:group:team:fixtureteam
  namespaceSuffix: workloads
  classes: [ha, wa]
resources:
  - {access: view, apiGroup: apps, kind: Deployment, project: true, resource: deployments}
  - {access: view, apiGroup: "", kind: Service, project: true, resource: services}
  - {access: edit, apiGroup: batch, kind: Job, project: true, resource: jobs}
  - {access: edit, apiGroup: "", kind: Pod, project: false, resource: pods}
  - {access: view, apiGroup: kueue.x-k8s.io, kind: LocalQueue, project: false, resource: localqueues}
  - {access: edit, apiGroup: ray.io, kind: RayCluster, project: true, resource: rayclusters}
  - {access: edit, apiGroup: ray.io, kind: RayJob, project: true, resource: rayjobs}
workloadImagePull:
  enabled: true
  region: us-west-2
  roleArn: arn:aws:iam::999988887777:role/fixtureteam-ecr-pull
workloadRepositories:
  src/examples/ray_data: registry.invalid/aws/src/examples/ray_data
  src/examples/svelte_web: registry.invalid/aws/src/examples/svelte_web
workspaceSubmissions:
  sourceNamespace: team-fixtureteam-workspaces
rayDashboard:
  enabled: true
devSecrets:
  names:
    # keep-sorted start
    - slack_bot_token
    - temporal_cloud_api_key
    # keep-sorted end
runtimeSecrets:
  adapter: aws
  auth:
    aws: {region: us-west-2}
storageProjection:
  enabled: true
  handoff:
    provider: aws
    recordName: infra/data/s3-gateway/cell-aws-usw2/team-fixtureteam
    storageContract:
      version: 1
      authorizationPrefixes:
        global: global/home/fixtureteam/
        global-meta: global/meta/
        global-scratch: global/scratch/fixtureteam/
        home: home/fixtureteam/
        meta: meta/
        scratch: scratch/fixtureteam/
      gateway: {endpoint: "http://s3-gateway.s3-system.svc"}
      mounts:
        global: {bucket: global, keyPrefix: home/fixtureteam/aws-usw2/, remote: global}
        global-meta: {bucket: global, keyPrefix: meta/, remote: global-meta}
        global-scratch: {bucket: global, keyPrefix: scratch/fixtureteam/, remote: global-scratch}
        home: {bucket: aws-usw2, keyPrefix: home/fixtureteam/, remote: home}
        meta: {bucket: aws-usw2, keyPrefix: meta/, remote: meta}
        scratch: {bucket: aws-usw2, keyPrefix: scratch/fixtureteam/, remote: scratch}
    secretStore:
      name: team-s3
      serviceAccount: team-s3
      auth:
        aws:
          region: us-west-2
          roleArn: arn:aws:iam::999988887777:role/fixtureteam-s3-record-reader
    externalSecret:
      name: team-s3
      targetSecretName: team-s3
      remoteProperties:
        accessKeyId: access_key_id
        secretAccessKey: secret_access_key
