# Exercises complete Floci source-record RBAC fixture using Kubernetes auth for every namespace selected by one team Application.

mode: storage-rbac
devWorkspaces:
  enabled: false
team:
  slug: examples
  group: cluster:group:team:examples
  namespaceSuffix: ""
  classes: [ha]
resources: []
workloadRepositories: {}
devSecrets:
  names: []
storageProjection:
  enabled: true
  handoff:
    provider: floci
    recordName: s3-team-examples
    secretStore:
      name: team-s3
      serviceAccount: team-s3
      auth:
        kubernetes: {remoteNamespace: secret-records}
    externalSecret:
      name: team-s3
      targetSecretName: team-s3
      remoteProperties:
        accessKeyId: access_key_id
        secretAccessKey: secret_access_key
  rbacNamespaceSuffixes: [workloads, workspaces]
