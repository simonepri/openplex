{{- /* Projects team-declared debug-tier credentials into one derived workspace namespace using the selected cell's native External Secrets provider. */ -}}

# LINT.IfChange(team-dev-secret-identifier-bounds)
{{ define "team-namespace.devSecretProviderIdentifierLimit" -}}
{{- print 127 -}}
{{- end -}}
# LINT.ThenChange(//src/infra/definitions/teams/team.schema.json,//src/bazel/checks/records/check_team_records.py:team-dev-secret-identifier-bounds,//src/infra/argocd/components/team_lane/helm/values.schema.json,//src/infra/argocd/components/team_namespace/helm/values.schema.json)

# LINT.IfChange(team-dev-secrets-physical-identifiers)
{{ define "team-namespace.devSecretPhysicalIdentifier" -}}
{{- $root := index . "root" -}}
{{- $name := index . "name" -}}
{{- $runtimeSecrets := include "team-namespace.runtimeSecrets" $root | fromJson -}}
{{- $adapter := $runtimeSecrets.adapter -}}
{{- $identifierLimit := include "team-namespace.devSecretProviderIdentifierLimit" $root | int -}}
{{- $identifier := "" -}}
{{- if eq $adapter "aws" -}}
{{- $identifier = printf "cluster/teams/%s/%s" $root.Values.team.slug $name -}}
{{- else if eq $adapter "gcp" -}}
{{- $identifier = printf "cluster-teams-%s-%s" $root.Values.team.slug ($name | replace "_" "-") -}}
{{- else if eq $adapter "kubernetes" -}}
{{- $identifier = printf "team-%s" $root.Values.team.slug -}}
{{- else -}}
{{- fail (printf "unsupported runtime secrets adapter %q" $adapter) -}}
{{- end -}}
{{- if gt (len $identifier) $identifierLimit -}}
{{- fail (printf "dev-secret physical identifier for adapter %q exceeds %d characters" $adapter $identifierLimit) -}}
{{- end -}}
{{- $identifier -}}
{{- end -}}
# LINT.ThenChange(//src/infra/argocd/components/kyverno/kustomize/dev-secrets-policy.yaml:team-dev-secrets-physical-identifiers)

# LINT.IfChange(team-dev-secrets-kubernetes-source)
{{ define "team-namespace.devSecretsKubernetesSourceNamespace" -}}
{{- print "dev-secrets" -}}
{{- end -}}
# LINT.ThenChange(//src/infra/argocd/components/external_secrets/kustomize/dev-secrets.namespace.yaml:team-dev-secrets-kubernetes-source)

{{ define "team-namespace.devSecretsName" -}}
{{- print "team-dev-secrets" -}}
{{- end -}}

{{- if and (eq .Values.mode "cell") .Values.devSecrets.names }}
{{- include "team-namespace.validate" . -}}
{{- $namespace := include "team-namespace.namespace" . -}}
{{- $name := include "team-namespace.devSecretsName" . -}}
{{- $runtimeSecrets := include "team-namespace.runtimeSecrets" . | fromJson -}}
{{- $adapter := $runtimeSecrets.adapter -}}
{{- if eq $adapter "kubernetes" }}
{{- $sourceNamespace := include "team-namespace.devSecretsKubernetesSourceNamespace" . -}}
{{- $readerName := printf "team-dev-secrets-%s" (sha256sum $namespace | trunc 12) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $readerName }}
  namespace: {{ $sourceNamespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - {{ include "team-namespace.devSecretPhysicalIdentifier" (dict "root" $ "name" (first .Values.devSecrets.names)) }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $readerName }}
  namespace: {{ $sourceNamespace }}
  annotations:
    ignore-check.kube-linter.io/access-to-secrets: >-
      The team dev secret reader requires get-only read access to the physical dev secret record to synchronize workspace secrets.
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $readerName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
# LINT.IfChange(team-dev-secrets-kubernetes-ssrr)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $readerName }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-self-subject-rules-reviewer
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
# LINT.ThenChange(//src/infra/argocd/components/external_secrets/kustomize/self-subject-rules-reviewer.cluster-role.yaml:team-dev-secrets-kubernetes-ssrr)
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
# LINT.IfChange(team-dev-secrets-store-provider)
spec:
  provider:
{{- if eq $adapter "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "runtimeSecrets.auth.aws.region is required for AWS secrets manager adapter" $runtimeSecrets.auth.aws.region | quote }}
{{- if $runtimeSecrets.auth.aws.endpoint }}
      endpoint: {{ $runtimeSecrets.auth.aws.endpoint | quote }}
{{- end }}
{{- else if eq $adapter "gcp" }}
    gcpsm:
      projectID: {{ $runtimeSecrets.auth.gcp.projectId | quote }}
{{- else if eq $adapter "kubernetes" }}
    kubernetes:
      remoteNamespace: {{ include "team-namespace.devSecretsKubernetesSourceNamespace" . }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $name }}
{{- end }}
# LINT.ThenChange(//src/infra/argocd/components/kyverno/kustomize/dev-secrets-policy.yaml:team-dev-secrets-store-provider)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range $secretName := .Values.devSecrets.names }}
    - secretKey: {{ $secretName | upper }}
      remoteRef:
        key: {{ include "team-namespace.devSecretPhysicalIdentifier" (dict "root" $ "name" $secretName) | quote }}
{{- if eq $adapter "kubernetes" }}
        property: {{ $secretName | quote }}
{{- end }}
{{- end }}
{{- end }}
