{{- /* Stamps the team security boundary including labeled namespace and RBAC roles. */ -}}

{{- if eq .Values.mode "cell" }}
{{- include "team-namespace.validate" . -}}
{{- $namespace := include "team-namespace.namespace" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
{{- if .Values.storageProjection.enabled }}
    app.kubernetes.io/component: storage-projection
{{- end }}
    cost-center: {{ .Values.team.slug | quote }}
    environment: production
    kueue.x-k8s.io/managed: "true"
{{- if .Values.rayDashboard.enabled }}
    ray-dashboard-routes: "true"
{{- end }}
    # LINT.IfChange(team-pod-security-profile)
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    # LINT.ThenChange(//src/infra/argocd/components/kyverno/kustomize/team-pod-security-policy.yaml:team-pod-security-profile)
    team: {{ .Values.team.slug | quote }}
{{- if eq (default "members" .Values.team.submitters) "all" }}
    teams.openplex.io/submitters: "all"
{{- end }}
{{- range $class := .Values.team.classes }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ $class }}
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" $ | nindent 4 }}
spec:
  clusterQueue: {{ printf "team-%s-%s" $.Values.team.slug $class }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-developer
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
{{- range $resource := .Values.resources }}
{{- if not (and (eq $resource.apiGroup "") (eq $resource.resource "secrets")) }}
  - apiGroups: [{{ $resource.apiGroup | quote }}]
    resources: [{{ $resource.resource | quote }}]
{{- if eq $resource.access "edit" }}
    verbs: [create, delete, get, list, patch, update, watch]
{{- else }}
    verbs: [get, list, watch]
{{- end }}
{{- end }}
{{- end }}
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-developer
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ .Values.team.group | quote }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ printf "%s:dev" .Values.team.group | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-operator
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims, pods]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [localqueues]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-operator
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ printf "%s:ops" .Values.team.group | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-operator
{{- if eq (default "members" .Values.team.submitters) "all" }}
---
# Grants open RayJob submission and cancellation to authenticated principals.
# Cluster admission policy restricts this open RBAC grant to authenticated humans
# and authorized controllers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-open-submitter
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-open-submitter
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-open-submitter
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-job-observer" $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ .Values.team.group | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: team-job-observer
{{- if .Values.rayDashboard.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-dashboard-generator
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-dashboard-generator
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - {kind: ServiceAccount, name: kyverno-background-controller, namespace: kyverno-system}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ray-dashboard-generator
{{- end }}
{{- if .Values.storageProjection.enabled }}
{{- $handoff := .Values.storageProjection.handoff }}
{{- $storageContract := $handoff.storageContract | default dict }}
{{- if eq $handoff.provider "aws" }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ printf "team-s3-%s" $namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces:
        - {{ $namespace }}
  provider:
    aws:
      service: SecretsManager
      region: {{ dig "secretStore" "auth" "aws" "region" (or $.Values.workloadImagePull.region "configured-by-applicationset.invalid") $handoff | quote }}
{{- else }}
{{- $storageAuthAdapter := include "team-namespace.storageAuthAdapter" $handoff -}}
{{- $storageKubernetesAuth := dict -}}
{{- if eq $storageAuthAdapter "kubernetes" -}}
{{- $storageKubernetesAuth = include "team-namespace.storageKubernetesAuth" $handoff | fromJson -}}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $handoff.secretStore.serviceAccount }}
  namespace: {{ $namespace }}
{{- if eq $storageAuthAdapter "gcp" }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $handoff.secretStore.auth.gcp.serviceAccountEmail | quote }}
{{- end }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $handoff.secretStore.name }}
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
spec:
  provider:
{{- if eq $storageAuthAdapter "aws" }}
    aws:
      service: SecretsManager
      region: {{ $handoff.secretStore.auth.aws.region | quote }}
{{- else if eq $storageAuthAdapter "gcp" }}
    gcpsm:
      projectID: {{ $handoff.secretStore.auth.gcp.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ $handoff.secretStore.auth.gcp.clusterLocation | quote }}
          clusterName: {{ $handoff.secretStore.auth.gcp.clusterName | quote }}
          serviceAccountRef:
            name: {{ $handoff.secretStore.serviceAccount }}
{{- else if eq $storageAuthAdapter "kubernetes" }}
    kubernetes:
      remoteNamespace: {{ $storageKubernetesAuth.remoteNamespace | quote }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $handoff.secretStore.serviceAccount }}
{{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $handoff.externalSecret.name }}
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
{{- if eq $handoff.provider "aws" }}
    kind: ClusterSecretStore
    name: {{ printf "team-s3-%s" $namespace }}
{{- else }}
    kind: SecretStore
    name: {{ $handoff.secretStore.name }}
{{- end }}
  target:
    name: {{ $handoff.externalSecret.targetSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        credentials: |-
          [team-s3]
          aws_access_key_id = {{`{{ .access_key_id }}`}}
          aws_secret_access_key = {{`{{ .secret_access_key }}`}}

          [global]
          aws_access_key_id = {{`{{ .global_access_key_id }}`}}
          aws_secret_access_key = {{`{{ .global_secret_access_key }}`}}
        global_endpoint: '{{`{{ .global_endpoint }}`}}'
        global_bucket: '{{`{{ .global_bucket }}`}}'
{{- if $storageContract }}
        configData: |-
          [gateway]
          type = s3
          provider = Other
          access_key_id = {{`{{ .access_key_id }}`}}
          secret_access_key = {{`{{ .secret_access_key }}`}}
          endpoint = {{ $storageContract.gateway.endpoint }}
          force_path_style = true
          no_check_bucket = true

{{- range $mountName := keys $storageContract.mounts | sortAlpha }}
{{- $mount := index $storageContract.mounts $mountName }}

          [{{ $mount.remote }}]
          type = alias
          remote = gateway:{{ $mount.bucket }}/{{ $mount.keyPrefix }}
{{- end }}
{{- end }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: {{ $handoff.recordName | quote }}
        property: {{ $handoff.externalSecret.remoteProperties.accessKeyId }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $handoff.recordName | quote }}
        property: {{ $handoff.externalSecret.remoteProperties.secretAccessKey }}
    - secretKey: global_access_key_id
      remoteRef:
        key: {{ $handoff.recordName | quote }}
        property: {{ dig "externalSecret" "remoteProperties" "globalAccessKeyId" "global_access_key_id" $handoff }}
    - secretKey: global_secret_access_key
      remoteRef:
        key: {{ $handoff.recordName | quote }}
        property: {{ dig "externalSecret" "remoteProperties" "globalSecretAccessKey" "global_secret_access_key" $handoff }}
    - secretKey: global_endpoint
      remoteRef:
        key: {{ $handoff.recordName | quote }}
        property: {{ dig "externalSecret" "remoteProperties" "globalEndpoint" "global_endpoint" $handoff }}
    - secretKey: global_bucket
      remoteRef:
        key: {{ $handoff.recordName | quote }}
        property: {{ dig "externalSecret" "remoteProperties" "globalBucket" "global_bucket" $handoff }}
{{- end }}
{{- end }}
