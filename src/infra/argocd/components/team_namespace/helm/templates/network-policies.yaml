    matchLabels:
      app.kubernetes.io/name: coder-workspace
      app.kubernetes.io/part-of: coder
      com.coder.resource: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: {{ .Values.devWorkspaces.localGitCIDR | quote }}}
      ports:
        - {port: 9418, protocol: TCP}
{{- end }}
{{- if and .Values.devWorkspaces.enabled .Values.devWorkspaces.originRegistryCIDR }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-workspace-origin-registry
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
      app.kubernetes.io/part-of: coder
      com.coder.resource: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: {{ .Values.devWorkspaces.originRegistryCIDR | quote }}}
