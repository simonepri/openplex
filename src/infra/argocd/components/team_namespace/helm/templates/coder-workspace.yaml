{{- /* Configures team dev workspace and binds submitter into eligible workload namespaces. */ -}}

{{- if and (eq .Values.mode "cell") .Values.devWorkspaces.enabled }}
{{- $namespace := include "team-namespace.namespace" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workspace
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-workspace
    app.kubernetes.io/part-of: coder
    team: {{ .Values.team.slug }}
{{- if .Values.workloadImagePull.enabled }}
imagePullSecrets:
  - name: ecr-pull
{{- end }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-provisioner
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-provisioner
  namespace: {{ $namespace }}
  annotations:
    ignore-check.kube-linter.io/access-to-secrets: >-
      Coder workspace provisioner requires workspace secret lifecycle access to provision user dev workspaces.
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - apiGroup: {{ .Values.devWorkspaces.provisionerSubject.apiGroup }}
    kind: {{ .Values.devWorkspaces.provisionerSubject.kind }}
    name: {{ .Values.devWorkspaces.provisionerSubject.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-provisioner
{{ end }}
{{- if and (eq .Values.mode "cell") .Values.workspaceSubmissions.sourceNamespace }}
{{- $namespace := include "team-namespace.namespace" . -}}
---
# LINT.IfChange(coder-workspace-submitted-workload-access)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-workspace-submitter
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [workload-repositories]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [localqueues]
    verbs: [get, list, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [delete, get, list, patch, watch]
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspace-submitter
  namespace: {{ $namespace }}
  labels:
{{ include "team-namespace.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: coder-workspace
    namespace: {{ .Values.workspaceSubmissions.sourceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-workspace-submitter
# LINT.ThenChange(//src/infra/definitions/workspaces/templates/dev/deployment.tf:coder-workspace-submitted-workload-access)
{{- end }}
