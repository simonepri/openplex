# Defines local CA bundle for team namespaces that host the user-submitted storage-sync runtime.

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: storage-sync-local-ca
  labels:
    app.kubernetes.io/name: storage-sync-local-ca
spec:
  sources:
    - secret: {name: cluster-local-ca, key: ca.crt}
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/managed-by: trust-manager
          app.kubernetes.io/name: storage-sync-local-ca
    namespaceSelector:
      matchLabels: {app.kubernetes.io/component: storage-projection}
