# Defines own-CA-only bundle for OpenTofu cross-cluster trust discovery.

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cluster-published-ca
  labels:
    app.kubernetes.io/name: cluster-published-ca
spec:
  sources:
    - secret:
        name: cluster-local-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/managed-by: trust-manager
          app.kubernetes.io/name: cluster-published-ca
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cert-manager-system
