# Common NVIDIA GPU Operator policy for GPU-bearing cells. Provider values own only the host driver and container-runtime boundary.

nfd:
  enabled: true
psa:
  enabled: true
cdi:
  enabled: true
  nriPluginEnabled: false
sandboxWorkloads:
  enabled: false

daemonsets:
  priorityClassName: system-node-critical
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

operator:
  repository: nvcr.io/nvidia
  image: gpu-operator
  version: v26.7.0@sha256:ddba086bb593713ad6f3b207fd0f9b16eb8910134bb656cb1a2e2ae1b5092400
  priorityClassName: system-node-critical

validator:
  repository: nvcr.io/nvidia
  image: gpu-operator
  version: v26.7.0@sha256:ddba086bb593713ad6f3b207fd0f9b16eb8910134bb656cb1a2e2ae1b5092400

driver:
  enabled: false

toolkit:
  enabled: true
  repository: nvcr.io/nvidia/k8s
  image: container-toolkit
  version: v1.20.0@sha256:f8c647d581f7c8b178efdb7e6c94f5fb6eb12ebc05e2157fa314d327560fcb7a

devicePlugin:
  enabled: true
  repository: nvcr.io/nvidia
  image: k8s-device-plugin
  version: v0.20.0@sha256:a61ba9fd8efb82f3a79f877f7580e02c1e8e7593f62473644bc9c79e315c3312
  env:
    - {name: FAIL_ON_INIT_ERROR, value: "true"}
  resources:
    requests: {cpu: 50m, memory: 64Mi}

dcgm:
  enabled: false
dcgmExporter:
  enabled: true
  repository: nvcr.io/nvidia/k8s
  image: dcgm-exporter
  version: 4.6.0-4.8.3-distroless@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
  enablePodLabels: false
  enablePodUID: false
  service:
    internalTrafficPolicy: Local
  serviceMonitor:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
  config:
    create: true
    name: dcgm-custom-metrics
    data: |-
      # Clocks and temperature
      DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency in MHz.
      DCGM_FI_DEV_MEM_CLOCK, gauge, memory clock frequency in MHz.
      DCGM_FI_DEV_MEMORY_TEMP, gauge, memory temperature in C.
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in C.

      # Power and energy
      DCGM_FI_DEV_POWER_USAGE, gauge, power draw in W.
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, total energy consumed in mJ.

      # PCIe and utilization
      DCGM_FI_DEV_PCIE_TX_THROUGHPUT, counter, PCIe transmit throughput in KiB per second.
      DCGM_FI_DEV_PCIE_RX_THROUGHPUT, counter, PCIe receive throughput in KiB per second.
      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, total PCIe retries.
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, memory utilization in percent.
      DCGM_FI_DEV_ENC_UTIL, gauge, encoder utilization in percent.
      DCGM_FI_DEV_DEC_UTIL, gauge, decoder utilization in percent.

      # Health, errors, and throttling
      DCGM_FI_DEV_XID_ERRORS, gauge, last XID error encountered.
      DCGM_EXP_XID_ERRORS_COUNT, gauge, XID errors in the configured window.
      DCGM_EXP_XID_ERRORS_TOTAL, counter, XID errors since exporter start.
      DCGM_EXP_GPU_HEALTH_STATUS, gauge, current DCGM GPU health status.
      DCGM_FI_DEV_POWER_VIOLATION, counter, throttling duration from power constraints.
      DCGM_FI_DEV_THERMAL_VIOLATION, counter, throttling duration from thermal constraints.
      DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, throttling duration from reliability constraints.
      DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, gauge, active clock throttle reasons.

      # Framebuffer and ECC
      DCGM_FI_DEV_FB_FREE, gauge, framebuffer memory free in MiB.
      DCGM_FI_DEV_FB_USED, gauge, framebuffer memory used in MiB.
      DCGM_FI_DEV_FB_RESERVED, gauge, framebuffer memory reserved in MiB.
      DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, volatile single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, volatile double-bit ECC errors.
      DCGM_FI_DEV_RETIRED_SBE, counter, pages retired after single-bit errors.
      DCGM_FI_DEV_RETIRED_DBE, counter, pages retired after double-bit errors.
      DCGM_FI_DEV_RETIRED_PENDING, counter, pages pending retirement.

      # NVLink and row remapping
      DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, NVLink flow-control CRC errors.
      DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, NVLink data CRC errors.
      DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL, counter, NVLink retries.
      DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_COUNT_TOTAL, counter, NVLink recovery errors.
      DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, total NVLink bandwidth counters.
      DCGM_FI_DEV_GPU_NVLINK_ERRORS, gauge, current GPU NVLink error status.
      DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, uncorrectable remapped rows.
      DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, correctable remapped rows.
      DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, row remapping failure status.

      # Static label applied to device samples
      DCGM_FI_DRIVER_VERSION, label, NVIDIA driver version.

gfd:
  enabled: true
  repository: nvcr.io/nvidia
  image: k8s-device-plugin
  version: v0.20.0@sha256:a61ba9fd8efb82f3a79f877f7580e02c1e8e7593f62473644bc9c79e315c3312

migManager:
  enabled: true
  repository: nvcr.io/nvidia/cloud-native
  image: k8s-mig-manager
  version: v0.15.0@sha256:cab2cf9deafc9602da69d0832a82958a7687f22f4a2f19674099dc9a5c4ea8e2
  config:
    default: all-disabled

nodeStatusExporter:
  enabled: false
gds:
  enabled: false
gdrcopy:
  enabled: false
vgpuManager:
  enabled: false
vgpuDeviceManager:
  enabled: false
vfioManager:
  enabled: false
kataManager:
  enabled: false
sandboxDevicePlugin:
  enabled: false
kataSandboxDevicePlugin:
  enabled: false
ccManager:
  enabled: false

clusterPolicy:
  deployCR: true
gpuCluster:
  deployCR: false

node-feature-discovery:
  # Argo runs the component's equivalent cleanup before deleting its namespace.
  postDeleteCleanup: false
  image:
    # LINT.IfChange(nfd-cleanup-image)
    repository: registry.k8s.io/nfd/node-feature-discovery
    tag: v0.19.0@sha256:2fa1c99ad09bdf2c8ad97706a4ad2fd548c84d5ecd70ba32a6152c667b96c4d2
    # LINT.ThenChange(//src/infra/argocd/components/gpu_operator/kustomize/nfd-cleanup.yaml:nfd-cleanup-image)
  priorityClassName: system-node-critical
