# Allows each node-local OpenTelemetry collector to scrape DCGM metrics.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-collector-to-dcgm-exporter
  namespace: gpu-system
spec:
  podSelector:
    matchLabels:
      app: nvidia-dcgm-exporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: otel-collector
      ports:
        - {protocol: TCP, port: 9400}
