# Prune NFD-owned node labels before Argo deletes the operator namespace.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-operator-node-feature-discovery-prune
  namespace: gpu-system
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-operator-node-feature-discovery-prune
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/status]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-operator-node-feature-discovery-prune
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-operator-node-feature-discovery-prune
subjects:
  - kind: ServiceAccount
    name: gpu-operator-node-feature-discovery-prune
    namespace: gpu-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-operator-node-feature-discovery-prune
  namespace: gpu-system
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    ignore-check.kube-linter.io/no-liveness-probe: Cleanup runs to completion.
    ignore-check.kube-linter.io/no-readiness-probe: Cleanup runs to completion.
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node-feature-cleanup
        app.kubernetes.io/part-of: gpu-operator
    spec:
      serviceAccountName: gpu-operator-node-feature-discovery-prune
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nfd-master
          # LINT.IfChange(nfd-cleanup-image)
          image: registry.k8s.io/nfd/node-feature-discovery:v0.19.0@sha256:2fa1c99ad09bdf2c8ad97706a4ad2fd548c84d5ecd70ba32a6152c667b96c4d2
          # LINT.ThenChange(//src/infra/argocd/components/gpu_operator/helm/values.yaml:nfd-cleanup-image)
          command: [nfd-master]
          args: [-prune]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
