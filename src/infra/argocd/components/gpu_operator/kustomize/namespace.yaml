# Namespace for the NVIDIA GPU Operator and DCGM exporters, requiring privileged node and driver capabilities. Rendered by GPU-enabled cell Applications.

apiVersion: v1
kind: Namespace
metadata:
  name: gpu-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
