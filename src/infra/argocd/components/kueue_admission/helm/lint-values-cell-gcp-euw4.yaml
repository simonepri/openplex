# Derived from cell topology records and scheduling-teams.json for Helm linting.

clusterName: cell-gcp-euw4
compute:
  ceiling:
    cpu: '128'
    google.com/tpu: '8'
    memory: 512Gi
    nvidia.com/gpu: '16'
  cpu_capabilities:
  - avx2
  fixed_pools:
    tpu:
      class: v5e-2x2
      nodes: 1
    tpu-spot:
      class: v5e-2x2
      nodes: 1
  floors:
    be:
      cpu: '0'
      google.com/tpu: '0'
      memory: '0'
      nvidia.com/gpu: '0'
    ha:
      cpu: '16'
      google.com/tpu: '0'
      memory: 64Gi
      nvidia.com/gpu: '2'
    ma:
      cpu: '32'
      google.com/tpu: '4'
      memory: 128Gi
      nvidia.com/gpu: '4'
    wa:
      cpu: '16'
      google.com/tpu: '4'
      memory: 64Gi
      nvidia.com/gpu: '2'
  gpu_classes:
    a100-40gb:
      max_count: 1
    a100-80gb:
      max_count: 1
    l4:
      max_count: 1
    rtx-pro-server-6000:
      max_count: 1
  tpu_classes:
    v5e-2x2:
      max_count: 4
flavors:
- name: on-demand
  nodeLabels:
    karpenter.sh/capacity-type: on-demand
- name: spot
  nodeLabels:
    karpenter.sh/capacity-type: spot
provider: gcp
role: cell
teams:
- quota:
    classes:
      be:
        cpu: '0'
        memory: '0'
      ha:
        accelerators:
          l4: '2'
        cpu: '16'
        memory: 64Gi
      ma:
        accelerators:
          l4: '4'
          v5e-2x2: '1'
        cpu: '32'
        memory: 128Gi
      wa:
        accelerators:
          l4: '2'
          v5e-2x2: '1'
        cpu: '16'
        memory: 64Gi
  slug: examples
topologies:
- levels:
  - topology.kubernetes.io/zone
  - kubernetes.io/hostname
  name: cell-topology
