# Default Kueue admission values configuring cluster queue cohorts, compute limits, team flavors, and the shared dev queue.

role: disabled
clusterName: ""
cohortRootName: cluster-pool
provider: ""
compute:
  cpu_capabilities: []
  gpu_classes: {}
  tpu_classes: {}
  floors:
    ha: {cpu: "0", memory: "0"}
    ma: {cpu: "0", memory: "0"}
    wa: {cpu: "0", memory: "0"}
    be: {cpu: "0", memory: "0"}
  ceiling: {cpu: "0", memory: "0"}

flavors: []
topologies: []
teams: []

# Standalone ClusterQueue `workspaces-ha` admits Coder workspace pods in the `workspaces` namespace.
# Without a cohort, Kueue cannot share a single quota across flavors, so the nominal quota applies
# per flavor in `flavors` (for example, on-demand and spot each receive this nominalQuota).
devQueue:
  enabled: true
  quota: {cpu: "16", memory: 64Gi}
