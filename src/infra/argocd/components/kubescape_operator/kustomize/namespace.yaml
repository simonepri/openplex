# Namespace for the Kubescape Operator security-posture scanner, enforcing the restricted Pod Security Standard. Rendered by every

# <cluster>-kubescape-operator Application.

apiVersion: v1
kind: Namespace
metadata:
  name: kubescape-system
  labels:
    app.kubernetes.io/component: security-posture-scanner
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
