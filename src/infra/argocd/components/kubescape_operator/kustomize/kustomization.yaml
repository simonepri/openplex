# Kustomize base for Kubescape Operator: creates the namespace and a container-default LimitRange. Rendered by every

# <cluster>-kubescape-operator Application alongside the upstream Helm chart.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - namespace.yaml
  - network-policy.yaml
  - pod-policy.yaml
  - probe-policy.yaml
  - resource-limits.yaml
  - scanner-rbac.yaml
  # keep-sorted end
