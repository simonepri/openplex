# Allows the Kubernetes API server to reach Kubescape's aggregated report API; the Kubescape Application renders this path before the fleet ingress baseline selects the namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescape-storage-api
  namespace: kubescape-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kubescape-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: storage
      app.kubernetes.io/instance: kubescape-operator
      app.kubernetes.io/name: kubescape-operator
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8443}
---
# Ingress network policy for Kubescape Prometheus exporter metrics collection
# from the observability namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubescape-prometheus-exporter
  namespace: kubescape-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kubescape-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus-exporter
      app.kubernetes.io/name: kubescape-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: signoz
      ports:
        - {protocol: TCP, port: 8080}
