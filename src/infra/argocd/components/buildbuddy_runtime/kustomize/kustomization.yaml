# Kustomize base assembling BuildBuddy namespace, executor queues, secrets, policies, PDB, and executor ServiceAccount.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - external-secrets.yaml
  - kueue.yaml
  - namespace.yaml
  - network-policy.yaml
  - pdb.yaml
  - serviceaccount.yaml
  # keep-sorted end
