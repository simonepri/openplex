# ExternalSecret projecting BuildBuddy API key for remote executor pool registration.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-executor-secret
  namespace: buildbuddy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: buildbuddy-executor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: buildbuddy-executor-secret
  data:
    - secretKey: api_key
      remoteRef:
        key: buildbuddy-cloud
        property: api_key
