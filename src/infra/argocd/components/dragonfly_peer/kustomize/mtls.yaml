# Issues one shared-CA Dragonfly v2 Scheduler server and client identity for a worker cell.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly-grpc-mtls
  namespace: dragonfly-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  dnsNames:
    # keep-sorted start
    - dragonfly-scheduler
    - dragonfly-scheduler.dragonfly-system
    - dragonfly-scheduler.dragonfly-system.svc
    - dragonfly-scheduler.dragonfly-system.svc.cluster.local
    # keep-sorted end
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-local-ca
  secretName: dragonfly-grpc-mtls
  usages: [client auth, server auth]
