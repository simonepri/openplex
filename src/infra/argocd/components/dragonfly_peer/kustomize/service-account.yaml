# Dragonfly's cell workloads do not call the Kubernetes API. Disabling the namespace default credential also keeps its reviewed node client profile free of admission-injected volumes.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: dragonfly-system
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
