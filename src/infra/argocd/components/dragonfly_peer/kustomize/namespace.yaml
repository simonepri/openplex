# Namespace for the Dragonfly peer daemonsets and schedulers on worker cells. Requires the privileged Pod Security Standard for hostNetwork peer proxy binding.

apiVersion: v1
kind: Namespace
metadata:
  name: dragonfly-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dragonfly-system
    app.kubernetes.io/part-of: dragonfly
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
