# ExternalSecrets materialize the narrow Dragonfly runtime contract for peer scheduler.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-runtime
  namespace: dragonfly-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: runtime-configuration
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/part-of: dragonfly
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: dragonfly-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: runtime-configuration
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
      data:
        scheduler.yaml: |-
          server:
            advertisePort: 8002
            cacheDir: ""
            dataDir: ""
            listenIP: 0.0.0.0
            logDir: ""
            logLevel: info
            pluginDir: ""
            # TODO(simonepri): Restore server.tls and the client scheduler TLS settings once a dragonflyoss/client release supports scheduler.serverName (dragonflyoss/client#2089).
            port: 8002
            requestRateLimit: 4000
            workHome: ""
          scheduler:
            algorithm: default
            backToSourceCount: 200
            gc:
              hostGCInterval: 5m
              hostTTL: 1h
              peerGCInterval: 5m
              peerTTL: 720h
              pieceDownloadTimeout: 30m
              taskGCInterval: 30m
            retryBackToSourceLimit: 3
            retryInterval: 1s
            retryLimit: 5
          dynconfig: {refreshInterval: 1m}
          host: {idc: "", location: ""}
          manager:
            addr: '{{ .dragonflyManagerAddress }}'
            keepAlive: {interval: 5s}
            schedulerClusterID: {{ .dragonflySchedulerClusterID }}
            tls: {caCert: /etc/dragonfly-trust/ca.crt, cert: /etc/dragonfly-mtls/tls.crt, key: /etc/dragonfly-mtls/tls.key}
          job: {enable: false}
          network: {enableIPv6: false}
          metrics: {addr: ":8000", enable: true, enableHost: false}
          console: true
          pprofPort: -1
          tracing: {protocol: ""}
  dataFrom:
    - extract:
        key: application-oidc
