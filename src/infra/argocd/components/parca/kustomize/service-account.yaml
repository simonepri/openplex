# Defines ServiceAccount for the Parca server Deployment, rendered by every `<cluster>-parca` control registration; disables API token automount since Parca does not call the Kubernetes API.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: parca
  namespace: parca
  labels:
    app.kubernetes.io/name: parca
    app.kubernetes.io/instance: parca-server
    app.kubernetes.io/component: profile-store
    app.kubernetes.io/managed-by: argocd
automountServiceAccountToken: false
