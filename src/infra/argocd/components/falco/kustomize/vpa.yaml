# Publishes RequestsOnly sizing for Falco using Initial mode on pod startup without allowing VPA to evict a runtime-security sensor mid-flight.

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  targetRef: {apiVersion: apps/v1, kind: DaemonSet, name: falco}
  updatePolicy: {updateMode: "Initial"}
  resourcePolicy:
    containerPolicies:
      - containerName: falco
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
