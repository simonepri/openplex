# Service account for the Falco runtime sensor, which reads kernel and CRI state directly while the Kubernetes metadata collector remains disabled.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/component: runtime-security
    app.kubernetes.io/instance: falco
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: falco
automountServiceAccountToken: false
