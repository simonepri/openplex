# Configures base Helm values for upstream Falco runtime threat detection across control and cell clusters.

image:
  registry: docker.io
  repository: falcosecurity/falco
  tag: 0.45.0@sha256:788f1129c542171813083d4afc61b16730a47dde8c23d9c39370acef996349b6
falcoctl:
  image:
    registry: docker.io
    repository: falcosecurity/falcoctl
    tag: 0.14.2@sha256:90ba9627886e8f26b746fa52465d755b28ee49b76eb1d047a0fefd8cadb21907
  artifact:
    install:
      enabled: true
    follow:
      enabled: false
  config:
    artifact:
      install:
        # Keep the signed upstream rules artifact deterministic across restarts.
        refs:
          # keep-sorted start
          - falco-rules:5.1.0
          - k8saudit-rules:0.18.0
          - k8saudit:0.18.0
          # keep-sorted end
driver:
  enabled: true
  kind: modern_ebpf
  sysfsMountPath: /sys/kernel
  modernEbpf:
    leastPrivileged: true
    sysfsMount: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    add:
      # keep-sorted start
      - BPF
      - PERFMON
      - SYS_PTRACE
      - SYS_RESOURCE
      # keep-sorted end
    drop: [ALL]
  readOnlyRootFilesystem: true
collectors:
  kubernetes:
    enabled: false
  containerEngine:
    engines:
      bpm: {enabled: false}
      containerd: {enabled: false}
      cri:
        enabled: true
        sockets: [/run/containerd/containerd.sock]
      docker: {enabled: false}
      libvirt_lxc: {enabled: false}
      lxc: {enabled: false}
      podman: {enabled: false}
falco:
  json_output: true
  load_plugins:
    # keep-sorted start
    - json
    - k8saudit
    # keep-sorted end
  log_syslog: false
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config: ""
      open_params: "http://:9765/k8s-audit"
    - name: json
      library_path: libjson.so
      init_config: ""
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/k8s_audit_rules.yaml
    - /etc/falco/rules.d
  stdout_output:
    enabled: true
  syslog_output:
    enabled: false
# Narrow exceptions for fleet components whose expected behaviour matches upstream rules; each is pinned to its
# namespace and image or executable so the rule still fires for anything else.
customRules:
  fleet-exceptions.yaml: |-
    - rule: Redirect STDOUT/STDIN to Network Connection in Container
      exceptions:
        - name: argocd_repo_server_git
          fields: [k8s.ns.name, container.image.repository, proc.name]
          comps: [=, =, in]
          values:
            - [argocd, quay.io/argoproj/argocd, [argocd-repo-ser, argocd-repo-server, git, ssh]]
        - name: clickhouse_keeper_liveness_probe
          fields: [k8s.ns.name, container.image.repository, fd.sip, fd.rport]
          values:
            - [signoz, docker.io/clickhouse/clickhouse-keeper, 127.0.0.1, "2181"]
        - name: coder_workspace_ssh
          fields: [k8s.ns.name, container.image.repository, proc.name]
          comps: [=, =, in]
          values:
            - [workspaces, 400920695547.dkr.ecr.us-west-2.amazonaws.com/src/infra/definitions/workspaces/templates/dev, [coder, coder-agent, sshd, sshd-session]]
        - name: kuberhealthy_network_conformance
          fields: [k8s.ns.name, container.image.repository, proc.name]
          comps: [in, =, =]
          values:
            - [[networking-denied, networking-e2e], docker.io/library/busybox, httpd]
      override:
        exceptions: append

    - rule: PTRACE anti-debug attempt
      exceptions:
        - name: clickhouse_server_self_trace
          fields: [k8s.ns.name, container.image.repository, proc.exepath]
          values:
            - [signoz, docker.io/clickhouse/clickhouse-server, /usr/bin/clickhouse]
      override:
        exceptions: append

    - rule: Contact K8S API Server From Container
      exceptions:
        - name: api_controllers
          fields: [k8s.ns.name, container.image.repository]
          comps: [=, in]
          values:
            # keep-sorted start
            - [argocd, [ghcr.io/dexidp/dex, quay.io/argoproj/argocd]]
            - [buildbuddy, [ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar, ghcr.io/cloudnative-pg/postgresql]]
            - [cert-manager-system, [quay.io/jetstack/cert-manager-controller, quay.io/jetstack/cert-manager-webhook, quay.io/jetstack/trust-manager]]
            - [clickhouse-system, [docker.io/altinity/clickhouse-operator, docker.io/altinity/metrics-exporter]]
            - [cnpg-system, [ghcr.io/cloudnative-pg/cloudnative-pg, ghcr.io/cloudnative-pg/plugin-barman-cloud]]
            - [coder, [ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar, ghcr.io/cloudnative-pg/postgresql]]
            - [descheduler-system, [registry.k8s.io/descheduler/descheduler]]
            - [dex, [ghcr.io/dexidp/dex]]
            - [dragonfly-system, [ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar, ghcr.io/cloudnative-pg/postgresql]]
            - [envoy-gateway-system, [docker.io/envoyproxy/gateway]]
            - [external-dns-system, [registry.k8s.io/external-dns/external-dns]]
            - [external-secrets-system, [ghcr.io/external-secrets/external-secrets]]
            - [k8s-cleaner-system, [docker.io/projectsveltos/k8s-cleaner]]
            - [kargo, [ghcr.io/akuity/kargo]]
            - [karpenter-system, [public.ecr.aws/karpenter/controller]]
            - [keda-system, [ghcr.io/kedacore/http-add-on-interceptor, ghcr.io/kedacore/http-add-on-operator, ghcr.io/kedacore/http-add-on-scaler, ghcr.io/kedacore/keda, ghcr.io/kedacore/keda-admission-webhooks, ghcr.io/kedacore/keda-metrics-apiserver]]
            - [kube-oidc-proxy-system, [ghcr.io/tremolosecurity/kube-oidc-proxy]]
            - [kuberay-system, [quay.io/kuberay/operator]]
            - [kuberhealthy, [docker.io/kuberhealthy/kuberhealthy, ghcr.io/kyverno/chainsaw]]
            - [kueue-system, [registry.k8s.io/kueue/kueue]]
            - [kyverno-system, [reg.kyverno.io/kyverno/background-controller, reg.kyverno.io/kyverno/cleanup-controller, reg.kyverno.io/kyverno/kyverno, reg.kyverno.io/kyverno/kyvernopre, reg.kyverno.io/kyverno/reports-controller]]
            - [node-problem-detector, [registry.k8s.io/node-problem-detector/node-problem-detector]]
            - [obi-system, [ghcr.io/open-telemetry/opentelemetry-ebpf-instrumentation/ebpf-instrument]]
            - [opencost, [ghcr.io/opencost/opencost]]
            - [otel-system, [ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib]]
            - [parca, [ghcr.io/parca-dev/parca-agent]]
            - [pvc-autoresizer-system, [ghcr.io/topolvm/pvc-autoresizer]]
            - [signoz, [ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar, ghcr.io/cloudnative-pg/postgresql, ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib, registry.k8s.io/kube-state-metrics/kube-state-metrics]]
            - [signoz-operator-system, [docker.io/signoz/signoz-operator]]
            - [tailscale-system, [docker.io/tailscale/k8s-operator, docker.io/tailscale/tailscale]]
            - [trivy-system, [docker.io/aquasec/trivy-operator, ghcr.io/aquasecurity/node-collector]]
            - [valkey-system, [ghcr.io/valkey-io/valkey-operator]]
            - [velero-system, [docker.io/otwld/velero-ui]]
            - [vpa-system, [registry.k8s.io/autoscaling/vpa-admission-controller, registry.k8s.io/autoscaling/vpa-recommender, registry.k8s.io/autoscaling/vpa-updater]]
            # keep-sorted end
      override:
        exceptions: append
falcosidekick:
  enabled: false
grafana:
  dashboards:
    enabled: false
serviceMonitor:
  create: false
podLabels:
  app.kubernetes.io/component: runtime-security
podPriorityClassName: node-agents
automountServiceAccountToken: false
serviceAccount:
  automountServiceAccountToken: false
  create: false
  name: falco
rbac:
  create: false
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            # Cloud providers do not expose their managed control planes as
            # workload nodes. Preserve that topology locally and keep the
            # control-plane cgroups available to Kubernetes itself.
            - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
tolerations:
  - operator: Exists
nodeSelector: {kubernetes.io/os: linux}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
services:
  - name: k8saudit-webhook
    ports:
      - port: 9765
        protocol: TCP
    type: ClusterIP
