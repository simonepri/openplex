# Schedules periodic in-cluster Prowler CSPM assessments against CIS benchmarks.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler
  namespace: prowler
  annotations:
    ignore-check.kube-linter.io/no-liveness-probe: >-
      Prowler security scanner CronJob runs to completion and exits.
    ignore-check.kube-linter.io/no-readiness-probe: >-
      Prowler security scanner CronJob runs to completion and exits.
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: prowler
spec:
  # Scans remain suspended by default in base manifests; production cells enable via Argo CD patches when cloud CSPM IAM roles are bound.
  suspend: true
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          annotations:
            automount-service-account-token: "true"
          labels:
            app.kubernetes.io/managed-by: argocd
            app.kubernetes.io/name: prowler
        spec:
          serviceAccountName: prowler
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: prowler
              image: docker.io/toniblyx/prowler:5.44.0@sha256:9dbcc3c9abd71ec6d37610e6a5a2c45279bc6488caf8aaa948a9e8e368622d30
              env:
                # Prowler 5 installs its CLI in a virtualenv that the image PATH omits.
                - name: PATH
                  value: /home/prowler/.venv/bin:/usr/local/bin:/usr/bin:/bin
              command:
                - /bin/sh
                - -c
                - |
                  prowler "$@"
                  rc=$?
                  if [ $rc -ne 0 ]; then
                    exit $rc
                  fi
                  python3 -c '
                  import json, os

                  output_dir = os.environ.get("PROWLER_OUTPUT_DIR", "/home/prowler/output")
                  for root, _, files in os.walk(output_dir):
                      for f in sorted(files):
                          if f.endswith(".ocsf.json"):
                              path = os.path.join(root, f)
                              with open(path, "r", encoding="utf-8") as fp:
                                  data = json.load(fp)
                              items = data if isinstance(data, list) else [data]
                              for item in items:
                                  print(json.dumps(item))
                  '
                - --
              args:
                - aws
                - --compliance
                - cis_3.0_aws
                - -M
                - json-ocsf
                - --ignore-exit-code-3
                - --mutelist-file
                - /etc/prowler/mutelist.yaml
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: output
                  mountPath: /home/prowler/output
                - name: mutelist
                  mountPath: /etc/prowler
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
            - name: output
              emptyDir: {sizeLimit: 256Mi}
            - name: mutelist
              configMap:
                name: prowler-mutelist
