# Runs the ctrl Manager's reconstructible metadata on an operator-managed, memory-only Valkey Cluster behind a stable Service name.

apiVersion: v1
kind: Service
metadata:
  name: dragonfly-valkey
  namespace: dragonfly-system
  annotations:
    ignore-check.kube-linter.io/dangling-service: The selected pods are generated from the ValkeyCluster by the Valkey operator after this Argo CD Application reconciles.
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dragonfly-valkey
    app.kubernetes.io/part-of: dragonfly
spec:
  selector:
    valkey.io/cluster: dragonfly-metadata
  ports:
    - {name: valkey, port: 6379, protocol: TCP, targetPort: client}
---
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: dragonfly-metadata
  namespace: dragonfly-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dragonfly-valkey
    app.kubernetes.io/part-of: dragonfly
    velero.io/exclude-from-backup: "true"
spec:
  shards: 1
  replicas: 0
  workloadType: Deployment
  image: docker.io/valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
  config: {appendonly: "no", save: '""'}
  exporter: {enabled: false}
  podDisruptionBudget: {mode: Disabled}
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 50m, memory: 128Mi}
  scheduling: {priorityClassName: cluster-operators}
  users:
    - name: default
      enabled: true
      passwordSecret: {name: dragonfly-runtime, keys: [valkey-password]}
      commands: {allow: ["@all"]}
      keys: {readWrite: ["*"]}
      channels: {patterns: ["*"]}
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 999
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: server
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-valkey
  namespace: dragonfly-system
  labels:
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/part-of: dragonfly
spec:
  podSelector:
    matchLabels: {valkey.io/cluster: dragonfly-metadata}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: dragonfly}
      ports:
        - {port: 6379, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {valkey.io/cluster: dragonfly-metadata}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 16379, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: valkey-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: valkey-operator}
      ports:
        - {port: 6379, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels: {valkey.io/cluster: dragonfly-metadata}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 16379, protocol: TCP}
