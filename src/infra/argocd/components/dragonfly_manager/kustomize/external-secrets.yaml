# ExternalSecrets materialize the narrow Dragonfly runtime contract. Manager and scheduler consume complete Secret-backed configs so no credentials enter the chart-generated ConfigMaps.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-postgres-bootstrap
  namespace: dragonfly-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: dragonfly-postgres
    app.kubernetes.io/part-of: dragonfly
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: dragonfly-postgres-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/component: database-bootstrap
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: dragonfly-postgres
          app.kubernetes.io/part-of: dragonfly
      data:
        password: '{{ .postgresPassword }}'
        username: dragonfly
  dataFrom:
    - extract:
        key: application-oidc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-runtime
  namespace: dragonfly-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: runtime-configuration
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/part-of: dragonfly
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: dragonfly-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: runtime-configuration
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
      data:
        jwt-key: '{{ .jwtKey }}'
        manager.yaml: |-
          server:
            rest: {addr: ":8080"}
            grpc:
              advertiseIP: '{{ .dragonflyAdvertiseIP }}'
              port: {end: 65003, start: 65003}
              requestRateLimit: 4000
              tls: {caCert: /etc/dragonfly-trust/ca.crt, cert: /etc/dragonfly-mtls/tls.crt, key: /etc/dragonfly-mtls/tls.key}
            cacheDir: ""
            logDir: ""
            logLevel: info
            pluginDir: ""
            workHome: ""
          auth:
            jwt:
              key: '{{ .jwtKey }}'
              maxRefresh: 48h
              realm: Dragonfly
              timeout: 48h
          database:
            type: postgres
            postgres:
              dbname: manager
              host: dragonfly-postgres-rw
              migrate: true
              password: '{{ .postgresPassword }}'
              port: 5432
              sslMode: require
              timezone: UTC
              user: dragonfly
            redis:
              addrs: [dragonfly-valkey:6379, valkey-dragonfly-metadata:6379, dragonfly-valkey:6379]
              backendDB: 0
              brokerDB: 0
              db: 0
              password: '{{ .valkeyPassword }}'
          cache:
            local: {size: 30000, ttl: 3m}
            redis: {ttl: 5m}
          job:
            gc: {interval: 3h, ttl: 6h}
            preheat:
              registryTimeout: 1m
              tls: {insecureSkipVerify: false}
            rateLimit: {capacity: 10, fillInterval: 1m, quantum: 10}
            syncPeers: {interval: 24h, timeout: 10m}
          network: {enableIPv6: false}
          metrics: {addr: ":8000", enable: true}
          console: true
          pprofPort: -1
          tracing: {protocol: ""}
        postgres-password: '{{ .postgresPassword }}'
        scheduler.yaml: |-
          server:
            advertiseIP: '{{ .dragonflyAdvertiseIP }}'
            advertisePort: 8002
            cacheDir: ""
            dataDir: ""
            listenIP: 0.0.0.0
            logDir: ""
            logLevel: info
            pluginDir: ""
            port: 8002
            requestRateLimit: 4000
            tls: {caCert: /etc/dragonfly-mtls/ca.crt, cert: /etc/dragonfly-mtls/tls.crt, key: /etc/dragonfly-mtls/tls.key}
            workHome: ""
          scheduler:
            algorithm: default
            backToSourceCount: 200
            gc:
              hostGCInterval: 5m
              hostTTL: 1h
              peerGCInterval: 5m
              peerTTL: 720h
              pieceDownloadTimeout: 30m
              taskGCInterval: 30m
            retryBackToSourceLimit: 3
            retryInterval: 1s
            retryLimit: 5
          dynconfig: {refreshInterval: 1m}
          host: {idc: "", location: ""}
          manager:
            addr: '{{ .dragonflyManagerAddress }}'
            keepAlive: {interval: 5s}
            schedulerClusterID: {{ .dragonflySchedulerClusterID }}
            tls: {caCert: /etc/dragonfly-mtls/ca.crt, cert: /etc/dragonfly-mtls/tls.crt, key: /etc/dragonfly-mtls/tls.key}
          job: {enable: false}
          network: {enableIPv6: false}
          metrics: {addr: ":8000", enable: true, enableHost: false}
          console: true
          pprofPort: -1
          tracing: {protocol: ""}
        valkey-password: '{{ .valkeyPassword }}'
  dataFrom:
    - extract:
        key: application-oidc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-oidc
  namespace: dragonfly-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: authentication
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/part-of: dragonfly
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: dragonfly-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: authentication
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
      data:
        client-id: '{{ .dragonfly_client_id }}'
        client-secret: '{{ .dragonfly_client_secret }}'
        cookie-secret: '{{ .dragonfly_cookie_secret }}'
        issuer-url: '{{ .issuer }}'
        operator-group: operators
  dataFrom:
    - extract:
        key: application-oidc
