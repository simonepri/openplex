# NetworkPolicy scoping BuildBuddy UI, BES gRPC, metrics, and PostgreSQL database access.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildbuddy
  namespace: buildbuddy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: buildbuddy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildbuddy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: private-access
              gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
      ports:
        - {port: 8080, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: private-access
              gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
      ports:
        - {port: 1985, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - {port: 9090, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: buildbuddy-postgres
      ports:
        - {port: 5432, protocol: TCP}
