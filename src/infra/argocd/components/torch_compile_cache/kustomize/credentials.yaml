# Generates namespace-local credentials and cluster seed URL consumed by the team's PyTorch compile-cache clients.

apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: torch-compile-cache
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: torch-compile-cache
spec:
  allowRepeat: true
  digits: 8
  length: 48
  noUpper: false
  symbols: 0
---
# LINT.IfChange(torch-compile-cache-secret-projection)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torch-compile-cache
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: torch-compile-cache
spec:
  refreshPolicy: CreatedOnce
  target:
    name: torch-compile-cache
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: runtime-secret
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: torch-compile-cache
      data:
        password: "{{ .torch }}"
        redis-url: "redis://torch:{{ .torch }}@torch-compile-cache:6379/0?socket_connect_timeout=2&socket_timeout=2&retry_on_timeout=1&health_check_interval=30"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: torch-compile-cache
      rewrite:
        - regexp:
            source: password
            target: torch
# LINT.ThenChange(//src/infra/argocd/components/kyverno/kustomize/dev-secrets-policy.yaml:torch-compile-cache-secret-projection)
