# Configures cloud provider billing export integration credentials for OpenCost.

apiVersion: v1
kind: Secret
metadata:
  name: opencost-cloud-integration
  namespace: opencost
  labels:
    app.kubernetes.io/component: cloud-pricing
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: opencost
stringData:
  cloud-integration.json: |
    {
      "aws": [
        {
          "athenaBucketName": "s3://configured-by-applicationset",
          "athenaRegion": "configured-by-applicationset",
          "athenaDatabase": "configured-by-applicationset",
          "athenaTable": "configured-by-applicationset",
          "athenaWorkgroup": "configured-by-applicationset"
        }
      ],
      "gcp": [
        {
          "projectID": "configured-by-applicationset",
          "billingDataDataset": "configured-by-applicationset"
        }
      ]
    }
