# Configures cloud provider billing export integration credentials for OpenCost.

apiVersion: v1
kind: Secret
metadata:
  name: opencost-cloud-integration
  namespace: opencost
  labels:
    app.kubernetes.io/component: cloud-pricing
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: opencost
stringData:
  # nosemgrep: repository.storage.canonical-virtual-s3-uri - Physical AWS S3 bucket for OpenCost billing report ingestion
  cloud-integration.json: |
    {
      "aws": [
        {
          "athenaBucketName": "s3://openplex-billing-reports",
          "athenaRegion": "us-west-2",
          "athenaDatabase": "openplex_cur",
          "athenaTable": "openplex_cur",
          "athenaWorkgroup": "opencost"
        }
      ],
      "gcp": [
        {
          "projectID": "openplex-production",
          "billingDataDataset": "openplex_billing_export"
        }
      ]
    }
