# Populates OpenCost GCP Cloud Billing API key from external secrets store.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencost-cloud-provider-api
  namespace: opencost
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: cloud-pricing
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: opencost
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: opencost-cloud-provider-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: cloud-pricing
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: opencost
  data:
    - secretKey: CLOUD_PROVIDER_API_KEY
      remoteRef:
        key: opencost-cloud-provider-api
        property: CLOUD_PROVIDER_API_KEY
---
# Projects Dex OIDC client credentials for the OpenCost browser auth proxy.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencost-oidc
  namespace: opencost
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: opencost-oidc
    app.kubernetes.io/part-of: opencost
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: opencost-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-id: '{{ .opencost_client_id }}'
        client-secret: '{{ .opencost_client_secret }}'
        cookie-secret: '{{ .opencost_cookie_secret }}'
        external-url: '{{ .opencost_external_url }}'
        oidc-issuer-url: '{{ .issuer }}'
        redirect-url: '{{ printf "%s/oauth2/callback" (trimSuffix "/" .opencost_external_url) }}'
  dataFrom:
    - extract:
        key: application-oidc
