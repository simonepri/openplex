# Allows the observability collector and Kubernetes service proxy to reach OpenCost's metrics/API port; every provider overlay renders it before the fleet ingress baseline selects the namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencost-metrics-api
  namespace: opencost
  labels:
    app.kubernetes.io/component: metrics-api
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: opencost
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: opencost
      app.kubernetes.io/name: opencost
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9003}
        # LINT.IfChange(opencost-api-port)
        - {protocol: TCP, port: 9090,}
        # LINT.ThenChange(//src/infra/argocd/components/opencost/helm/values.yaml:opencost-api-port)
