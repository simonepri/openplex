# Materializes the private-access OIDC proxy for the OpenCost UI. Validates Dex OIDC tokens before forwarding requests to the OpenCost server.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost-auth-proxy
  namespace: opencost
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: opencost-auth-proxy
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: opencost-auth-proxy
  namespace: opencost
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: opencost-auth-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opencost-auth-proxy
  ports:
    - name: http
      port: 4180
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost-auth-proxy
  namespace: opencost
  annotations:
    ignore-check.kube-linter.io/read-secret-from-env-var: >-
      OAuth2 proxy receives OIDC credentials via environment variables.
  labels:
    app.kubernetes.io/component: authentication
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: opencost-auth-proxy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost-auth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: authentication
        app.kubernetes.io/name: opencost-auth-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: opencost-auth-proxy
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      serviceAccountName: opencost-auth-proxy
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          args:
            - --allowed-group=operators
            - --auth-logging=true
            - --code-challenge-method=S256
            - --cookie-csrf-expire=1h
            - --cookie-csrf-per-request=true
            - --cookie-expire=8h
            - --cookie-httponly=true
            - --cookie-name=_opencost
            - --cookie-refresh=0s
            - --cookie-samesite=lax
            - --cookie-secure=true
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --insecure-oidc-skip-nonce=false
            - --oidc-groups-claim=groups
            - --pass-access-token=false
            - --pass-authorization-header=false
            - --pass-basic-auth=false
            - --pass-host-header=true
            - --pass-user-headers=true
            - --provider=oidc
            - --provider-display-name=Dex
            - --proxy-websockets=true
            - --request-logging=true
            - --reverse-proxy=true
            - --scope=openid profile email groups
            - --set-authorization-header=false
            - --set-xauthrequest=false
            - --show-debug-on-error=false
            - --silence-ping-logging=true
            - --skip-auth-strip-headers=true
            - --skip-provider-button=true
            - --standard-logging=true
            - --upstream=http://opencost:9090
            - --use-system-trust-store=true
            - --provider-ca-file=/etc/ssl/local-ca/ca.crt
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: opencost-oidc, key: client-id}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: opencost-oidc, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: opencost-oidc, key: cookie-secret}
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef: {name: opencost-oidc, key: oidc-issuer-url}
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                secretKeyRef: {name: opencost-oidc, key: redirect-url}
          ports:
            - {name: http, containerPort: 4180, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2000
          volumeMounts:
            - name: cluster-local-ca
              mountPath: /etc/ssl/local-ca
              readOnly: true
      volumes:
        - name: cluster-local-ca
          configMap:
            name: cluster-local-ca
            items:
              - key: ca.crt
                path: ca.crt
