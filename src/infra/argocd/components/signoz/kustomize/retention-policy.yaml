# Reconciles the logs retention contract through SigNoz's supported settings API after the Helm release is healthy.

apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-log-retention
  namespace: signoz
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    ignore-check.kube-linter.io/no-liveness-probe: >-
      SigNoz log retention PostSync Job runs to completion and exits.
    ignore-check.kube-linter.io/no-readiness-probe: >-
      SigNoz log retention PostSync Job runs to completion and exits.
  labels:
    app.kubernetes.io/component: retention-policy
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: signoz
    app.kubernetes.io/part-of: signoz
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: retention-policy
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/name: signoz
        app.kubernetes.io/part-of: signoz
    spec:
      automountServiceAccountToken: false
      priorityClassName: cluster-operators
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 102
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reconcile
          image: >-
            docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          env:
            - name: DEFAULT_TTL_DAYS
              value: "30"
          command: [/bin/sh, -ceu]
          args:
            - |-
              endpoint=http://signoz.signoz.svc.cluster.local:8080/api/v2/settings/ttl
              ttl="${DEFAULT_TTL_DAYS:-30}"
              current="$(curl --fail --silent --show-error --retry 24 --retry-all-errors --retry-delay 5 "${endpoint}")"
              if printf '%s' "${current}" | grep -Eq "\"default_ttl_days\"[[:space:]]*:[[:space:]]*${ttl}([,}])"; then
                exit 0
              fi
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --data "{\"type\":\"logs\",\"defaultTTLDays\":${ttl},\"ttlConditions\":[]}" \
                "${endpoint}"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsGroup: 102
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile: {type: RuntimeDefault}
