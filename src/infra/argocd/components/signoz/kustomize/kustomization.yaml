# Composes SigNoz namespace, secrets, hardening policies, and VPA configurations.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - database.yaml
  - drain-policy.yaml
  - external-secrets.yaml
  - namespace.yaml
  - network-policies.yaml
  - pdb.yaml
  - provider-config.yaml
  - pvc-autoresize-policy.yaml
  - retention-policy.yaml
  - scaled-object.yaml
  - service-accounts.yaml
  - vpa.yaml
  # keep-sorted end
