# Defines namespace for the SigNoz telemetry stack (SigNoz, PostgreSQL). Rendered by kustomize/base for <ctrl-cluster>-signoz.

apiVersion: v1
kind: Namespace
metadata:
  name: signoz
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,ServerSideApply=true
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: signoz
    app.kubernetes.io/part-of: cluster-runtime
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
