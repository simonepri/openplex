# Materializes external secrets for signoz-bootstrap (root-email/root-password) from the application-oidc runtime secret, consumed by the SigNoz chart's initial admin bootstrap.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signoz-bootstrap
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: signoz
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: signoz-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: identity
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: signoz
      data:
        jwt-secret: '{{ .signoz_jwt_secret }}'
        root-email: '{{ .signoz_root_email }}'
        root-password: '{{ .signoz_root_password }}'
  dataFrom:
    - extract:
        key: application-oidc
