# Defines service accounts for SigNoZ processes that only use database and telemetry protocols, consumed by the upstream chart with API-token automount disabled.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: signoz
  namespace: signoz
  annotations:
    automount-service-account-token: "true"
  labels:
    app.kubernetes.io/component: signoz
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: signoz
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signoz-telemetrystore-migrator
  namespace: signoz
  annotations:
    automount-service-account-token: "true"
  labels:
    app.kubernetes.io/component: signoz-telemetrystore-migrator
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: signoz
automountServiceAccountToken: false
