# Defines namespace for Trivy Operator and Trivy Server vulnerability scanning. Enforces the privileged Pod Security
# level only because the operator always runs its node collector here; the trivy-pod-security Kyverno policy
# restores the restricted level for every other Pod.

apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    app.kubernetes.io/component: vulnerability-scanner
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
