# Configures default values for a managed team parent. Resource packs feed both AppProject admission and team-lane RBAC.

repository:
  revision: "0000000000000000000000000000000000000000"
  url: https://example.invalid/fleet-config.git
clusterRegistry:
  version: 1
  clusters:
    - name: cell-eaws-lh1
      cloud: eaws
      region: lh1
      server: https://cell-eaws-lh1.example.invalid
      role: cell
      provider: floci
      network: {apiServerCIDRs: [172.19.255.11/32]}
      delivery:
        deploymentRepositories: {src/examples/batch_cron: 'localhost:15100/000000000000/us-east-1/src/examples/batch_cron', src/examples/ray_data: 'localhost:15100/000000000000/us-east-1/src/examples/ray_data', src/examples/ray_serve: 'localhost:15100/000000000000/us-east-1/src/examples/ray_serve', src/examples/ray_train: 'localhost:15100/000000000000/us-east-1/src/examples/ray_train', src/examples/svelte_web: 'localhost:15100/000000000000/us-east-1/src/examples/svelte_web'}
      storage:
        gateway:
          config: {version: 1, cells: [{name: cell-eaws-lh1, provider: floci, virtualName: eaws-lh1, crossRegionServer: s3-gateway.s3-system.svc}], global: {writerCell: cell-eaws-lh1, replicaCells: [cell-eaws-lh1]}}
        teams:
          handoffs:
            examples: {provider: floci, recordName: s3-team-examples, storageContract: {version: 1, authorizationPrefixes: {global: global/home/examples/, global-meta: global/meta/, global-scratch: global/scratch/examples/, home: home/examples/, meta: meta/, scratch: scratch/examples/}, gateway: {endpoint: 'http://s3-gateway.s3-system.svc'}, mounts: {global: {bucket: global, keyPrefix: home/examples/eaws-lh1/, remote: global}, global-meta: {bucket: global, keyPrefix: meta/, remote: global-meta}, global-scratch: {bucket: global, keyPrefix: scratch/examples/, remote: global-scratch}, home: {bucket: eaws-lh1, keyPrefix: home/examples/, remote: home}, meta: {bucket: eaws-lh1, keyPrefix: meta/, remote: meta}, scratch: {bucket: eaws-lh1, keyPrefix: scratch/examples/, remote: scratch}}}, secretStore: {name: team-s3, serviceAccount: team-s3, auth: {kubernetes: {remoteNamespace: secret-records}}}, externalSecret: {name: team-s3, targetSecretName: team-s3, remoteProperties: {accessKeyId: access_key_id, secretAccessKey: secret_access_key}}}
      cellRecord: {workspaces: {enabled: true}}
    - name: cell-aws-usw2
      cloud: aws
      region: us-west-2
      server: https://cell-aws-usw2.example.invalid
      role: cell
      provider: aws
      coderProvisioner:
        schemaVersion: 1
        incarnation: aaaaaaaaaaaa
        kubeconfig: "apiVersion: v1\nkind: Config\ncurrent-context: cell-aws-usw2\n"
        kubeconfigFile: /var/run/coder/cell/kubeconfig
        control: {cluster: ctrl-aws-usw2, namespace: coder, serviceAccount: coder, subject: "system:serviceaccount:coder:coder"}
        identity:
          roleArn: arn:aws:iam::000000000000:role/cell-aws-usw2-coder-provisioner
          kubernetesSubject: {apiGroup: rbac.authorization.k8s.io, kind: Group, name: 'cluster:coder-provisioners'}
        federation: {expirationSeconds: 3600, tokenAudience: sts.amazonaws.com, tokenFile: /var/run/secrets/coder/aws-federation/cell-aws-usw2/token}
        authentication: {apiVersion: client.authentication.k8s.io/v1beta1, command: /opt/coder-provisioner-auth/argocd-k8s-auth, args: [aws, --cluster-name, cell-aws-usw2]}
      workloadImagePush:
        region: us-west-2
        network: {publicHTTPS: true, privateHttpsCIDRs: ["10.16.0.10/32", "10.16.64.10/32", "10.16.128.10/32"]}
        roles: {examples: 'arn:aws:iam::000000000000:role/cell-aws-usw2-examples-workspace-ecr'}
      network: {apiServerCIDRs: [172.17.0.1/32]}
      delivery:
        deploymentRepositories: {src/examples/batch_cron: registry.invalid/aws/src/examples/batch_cron, src/examples/ray_data: registry.invalid/aws/src/examples/ray_data, src/examples/ray_serve: registry.invalid/aws/src/examples/ray_serve, src/examples/ray_train: registry.invalid/aws/src/examples/ray_train, src/examples/svelte_web: registry.invalid/aws/src/examples/svelte_web}
      storage:
        gateway:
          config: {version: 1, cells: [{name: cell-aws-usw2, provider: aws, virtualName: aws-usw2, crossRegionServer: s3-gateway.cell-aws-usw2.example.invalid}], global: {writerCell: cell-aws-usw2, replicaCells: [cell-aws-usw2]}}
        teams:
          gatewayIdentities:
            examples: {roleArn: 'arn:aws:iam::000000000000:role/examples-gateway', serviceAccount: s3-gateway-examples}
          handoffs:
            examples: {provider: aws, recordName: s3-team-examples, storageContract: {version: 1, authorizationPrefixes: {global: global/home/examples/, global-meta: global/meta/, global-scratch: global/scratch/examples/, home: home/examples/, meta: meta/, scratch: scratch/examples/}, gateway: {endpoint: 'http://s3-gateway.s3-system.svc'}, mounts: {global: {bucket: global, keyPrefix: home/examples/aws-usw2/, remote: global}, global-meta: {bucket: global, keyPrefix: meta/, remote: global-meta}, global-scratch: {bucket: global, keyPrefix: scratch/examples/, remote: global-scratch}, home: {bucket: aws-usw2, keyPrefix: home/examples/, remote: home}, meta: {bucket: aws-usw2, keyPrefix: meta/, remote: meta}, scratch: {bucket: aws-usw2, keyPrefix: scratch/examples/, remote: scratch}}}, secretStore: {name: team-s3, serviceAccount: team-s3, auth: {aws: {region: us-west-2, roleArn: 'arn:aws:iam::000000000000:role/examples-record-reader'}}}, externalSecret: {name: team-s3, targetSecretName: team-s3, remoteProperties: {accessKeyId: access_key_id, secretAccessKey: secret_access_key}}}
      cellRecord: {workspaces: {enabled: true}}
    - name: cell-gcp-euw4
      cloud: gcp
      region: europe-west4
      server: https://cell-gcp-euw4.example.invalid
      role: cell
      provider: gcp
      coderProvisioner:
        schemaVersion: 1
        incarnation: cccccccccccc
        kubeconfig: "apiVersion: v1\nkind: Config\ncurrent-context: cell-gcp-euw4\n"
        kubeconfigFile: /var/run/coder/cell/kubeconfig
        control: {cluster: ctrl-gcp-euw4, namespace: coder, serviceAccount: coder, subject: "system:serviceaccount:coder:coder"}
        identity:
          serviceAccount: coder-provisioner@configured-by-applicationset.iam.gserviceaccount.com
          kubernetesSubject: {apiGroup: rbac.authorization.k8s.io, kind: User, name: coder-provisioner@configured-by-applicationset.iam.gserviceaccount.com}
        federation:
          expirationSeconds: 3600
          tokenAudience: //iam.googleapis.com/projects/000000000000/locations/global/workloadIdentityPools/coder-provisioner/providers/active-ctrl
          tokenFile: /var/run/secrets/coder/gcp-federation/cell-gcp-euw4/token
          credentialConfiguration: '{"type":"external_account"}'
          credentialFile: /var/run/secrets/coder/gcp-federation/cell-gcp-euw4/credential-configuration.json
        authentication: {apiVersion: client.authentication.k8s.io/v1beta1, command: /opt/coder-provisioner-auth/argocd-k8s-auth, args: [gcp]}
      workloadImagePull:
        region: us-west-2
        roles:
          examples: arn:aws:iam::000000000000:role/cell-gcp-euw4-examples-ecr-pull
      workloadImagePush:
        region: us-west-2
        network: {publicHTTPS: true, privateHttpsCIDRs: []}
        roles: {examples: 'arn:aws:iam::000000000000:role/cell-gcp-euw4-examples-workspace-ecr'}
      network: {apiServerCIDRs: [172.17.16.1/32]}
      delivery:
        deploymentRepositories: {src/examples/batch_cron: registry.invalid/gcp/src/examples/batch_cron, src/examples/ray_data: registry.invalid/gcp/src/examples/ray_data, src/examples/ray_serve: registry.invalid/gcp/src/examples/ray_serve, src/examples/ray_train: registry.invalid/gcp/src/examples/ray_train, src/examples/svelte_web: registry.invalid/gcp/src/examples/svelte_web}
      providerConfig:
        gcp: {projectID: configured-by-applicationset}
      storage:
        gateway:
          config: {version: 1, cells: [{name: cell-gcp-euw4, provider: gcp, virtualName: gcp-euw4, crossRegionServer: s3-gateway.cell-gcp-euw4.example.invalid}], global: {writerCell: cell-gcp-euw4, replicaCells: [cell-gcp-euw4]}}
        teams:
          gatewayIdentities:
            examples: {serviceAccount: s3-gateway-examples, serviceAccountEmail: examples-gateway@configured-by-applicationset.iam.gserviceaccount.com}
          handoffs:
            examples: {provider: gcp, recordName: s3-team-examples, storageContract: {version: 1, authorizationPrefixes: {global: global/home/examples/, global-meta: global/meta/, global-scratch: global/scratch/examples/, home: home/examples/, meta: meta/, scratch: scratch/examples/}, gateway: {endpoint: 'http://s3-gateway.s3-system.svc'}, mounts: {global: {bucket: global, keyPrefix: home/examples/gcp-euw4/, remote: global}, global-meta: {bucket: global, keyPrefix: meta/, remote: global-meta}, global-scratch: {bucket: global, keyPrefix: scratch/examples/, remote: global-scratch}, home: {bucket: gcp-euw4, keyPrefix: home/examples/, remote: home}, meta: {bucket: gcp-euw4, keyPrefix: meta/, remote: meta}, scratch: {bucket: gcp-euw4, keyPrefix: scratch/examples/, remote: scratch}}}, secretStore: {name: team-s3, serviceAccount: team-s3, auth: {gcp: {clusterLocation: europe-west4, clusterName: cell-gcp-euw4, projectId: configured-by-applicationset, serviceAccountEmail: examples-record-reader@configured-by-applicationset.iam.gserviceaccount.com}}}, externalSecret: {name: team-s3, targetSecretName: team-s3, remoteProperties: {accessKeyId: access_key_id, secretAccessKey: secret_access_key}}}
      cellRecord: {}
    - name: ctrl-eaws-lh1
      cloud: eaws
      region: lh1
      server: https://kubernetes.default.svc
      role: ctrl
      provider: floci
      network: {apiServerCIDRs: [172.18.0.1/32]}
      localRuntime:
        gatewayIPv4: 172.19.255.20
        originRegistry:
          ipv4: 172.19.255.22
          workloadRoot: origin-registry:5000/000000000000/us-east-1
          workspaceRepository: origin-registry:5000/000000000000/us-east-1/src/infra/definitions/workspaces/templates/dev
          workspaceSource: origin-registry:5000/000000000000/us-east-1/src/infra/definitions/workspaces/templates/dev
delivery:
  originRepositories:
    src/examples/batch_cron: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/batch_cron
    src/examples/ray_data: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/ray_data
    src/examples/ray_serve: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/ray_serve
    src/examples/ray_train: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/ray_train
    src/examples/svelte_web: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/svelte_web
  images:
    - manifestRepository: registry.invalid/workloads/batch-cron
      package: src/examples/batch_cron
      repository: src/examples/batch_cron
      sourceName: batch-cron
      target: //src/examples/batch_cron:image_push
    - manifestRepository: registry.invalid/workloads/ray-data
      package: src/examples/ray_data
      repository: src/examples/ray_data
      sourceName: ray-data
      target: //src/examples/ray_data:image_push
    - manifestRepository: registry.invalid/workloads/ray-serve
      package: src/examples/ray_serve
      repository: src/examples/ray_serve
      sourceName: ray-serve
      target: //src/examples/ray_serve:image_push
    - manifestRepository: registry.invalid/workloads/ray-train
      package: src/examples/ray_train
      repository: src/examples/ray_train
      sourceName: ray-train
      target: //src/examples/ray_train:image_push
    - manifestRepository: registry.invalid/workloads/svelte-web
      package: src/examples/svelte_web
      repository: src/examples/svelte_web
      sourceName: svelte-web
      target: //src/examples/svelte_web:image_push
projectIndex:
  version: 3
  projects:
    - delivery: promoted
      deployments:
        - path: src/examples/batch_cron/deployment
          promotion: automatic
          source: {kind: warehouse}
          stage: prod
      name: batch_cron
      path: src/examples/batch_cron
      team: examples
    - delivery: submitted
      deployments:
        - {path: src/examples/ray_data/deployment}
      name: ray_data
      path: src/examples/ray_data
      team: examples
    - delivery: promoted
      deployments:
        - path: src/examples/ray_serve/deployment
          promotion: automatic
          source: {kind: warehouse}
          stage: prod
      name: ray_serve
      path: src/examples/ray_serve
      team: examples
    - delivery: submitted
      deployments:
        - {path: src/examples/ray_train/deployment}
      name: ray_train
      path: src/examples/ray_train
      team: examples
    - delivery: promoted
      deployments:
        - path: src/examples/svelte_web/deployment
          promotion: automatic
          source: {kind: warehouse}
          stage: prod
      name: svelte_web
      path: src/examples/svelte_web
      team: examples
team:
  slug: examples
  cells:
    matchLabels:
      role: cell
  projects: [batch_cron, ray_data, ray_serve, ray_train, svelte_web]
  dev_secrets:
    # keep-sorted start
    - slack_bot_token
    - temporal_cloud_api_key
    # keep-sorted end
  quota:
    classes:
      ha: {cpu: "2", memory: 3Gi}
      ma: {cpu: "1", memory: 6Gi}
      wa: {cpu: "0", memory: "0"}
      be: {cpu: "0", memory: "0"}
  promotion: automatic
  workspaces: true
  archive: true
enabledPacks:
  # keep-sorted start
  - cloudnative-pg
  - keda
  - kuberay
  # keep-sorted end
resourcePacks:
  base:
    # keep-sorted start block=yes
    - {access: edit, apiGroup: "", kind: Pod, project: false, resource: pods}
    - {access: edit, apiGroup: batch, kind: Job, project: true, resource: jobs}
    - {access: edit, apiGroup: kueue.x-k8s.io, kind: Workload, project: true, resource: workloads}
    - {access: view, apiGroup: "", kind: ConfigMap, project: true, resource: configmaps}
    - {access: view, apiGroup: "", kind: PersistentVolumeClaim, project: true, resource: persistentvolumeclaims}
    - {access: view, apiGroup: "", kind: Secret, project: true, resource: secrets}
    - {access: view, apiGroup: "", kind: Service, project: true, resource: services}
    - {access: view, apiGroup: "", kind: ServiceAccount, project: true, resource: serviceaccounts}
    - {access: view, apiGroup: apps, kind: Deployment, project: true, resource: deployments}
    - {access: view, apiGroup: autoscaling, kind: HorizontalPodAutoscaler, project: true, resource: horizontalpodautoscalers}
    - {access: view, apiGroup: autoscaling.k8s.io, kind: VerticalPodAutoscaler, project: true, resource: verticalpodautoscalers}
    - {access: view, apiGroup: batch, kind: CronJob, project: true, resource: cronjobs}
    - {access: view, apiGroup: external-secrets.io, kind: ExternalSecret, project: true, resource: externalsecrets}
    - {access: view, apiGroup: external-secrets.io, kind: SecretStore, project: true, resource: secretstores}
    - {access: view, apiGroup: generators.external-secrets.io, kind: Password, project: true, resource: passwords}
    - {access: view, apiGroup: kueue.x-k8s.io, kind: LocalQueue, project: false, resource: localqueues}
    - {access: view, apiGroup: networking.k8s.io, kind: NetworkPolicy, project: true, resource: networkpolicies}
    - {access: view, apiGroup: policy, kind: PodDisruptionBudget, project: true, resource: poddisruptionbudgets}
    - {access: view, apiGroup: rbac.authorization.k8s.io, kind: Role, project: true, resource: roles}
    - {access: view, apiGroup: rbac.authorization.k8s.io, kind: RoleBinding, project: true, resource: rolebindings}
    - {access: view, apiGroup: valkey.io, kind: ValkeyCluster, project: true, resource: valkeyclusters,}
    # keep-sorted end
  cloudnative-pg:
    # keep-sorted start
    - {access: view, apiGroup: postgresql.cnpg.io, kind: Cluster, project: true, resource: clusters}
    - {access: view, apiGroup: postgresql.cnpg.io, kind: Pooler, project: true, resource: poolers}
    - {access: view, apiGroup: postgresql.cnpg.io, kind: ScheduledBackup, project: true, resource: scheduledbackups,}
    # keep-sorted end
  keda:
    # keep-sorted start
    - {access: view, apiGroup: http.keda.sh, kind: InterceptorRoute, project: true, resource: interceptorroutes}
    - {access: view, apiGroup: keda.sh, kind: ScaledObject, project: true, resource: scaledobjects}
    - {access: view, apiGroup: keda.sh, kind: TriggerAuthentication, project: true, resource: triggerauthentications,}
    # keep-sorted end
  kuberay:
    # keep-sorted start
    - {access: edit, apiGroup: ray.io, kind: RayCluster, project: true, resource: rayclusters}
    - {access: edit, apiGroup: ray.io, kind: RayJob, project: true, resource: rayjobs}
    - {access: view, apiGroup: ray.io, kind: RayService, project: true, resource: rayservices,}
    # keep-sorted end
