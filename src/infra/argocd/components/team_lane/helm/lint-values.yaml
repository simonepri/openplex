# Exercises complete examples-team fixture to lint exact cell selection, the project trust boundary, cluster foundations, and the singular-source workload app.

accessAliasDomain: c.example.invalid
registeredClusters:
  - name: cell-eaws-lh1
    server: https://cell-eaws-lh1.example.invalid
    labels:
      cloud: eaws
      provider: floci
      region: lh1
      role: cell
    annotations:
      aws-account-id: "999988887777"
      bucket-suffix: "999988887777"
      global-storage-bucket-prefix: ctrl-example-global
      global-storage-bucket-suffix: "999988887777"
      global-storage-endpoint: https://example-account.r2.cloudflarestorage.com
      global-storage-provider: Cloudflare
      kubernetes-api-cidrs: 172.19.255.11/32
      registered-cells: cell-eaws-lh1,cell-aws-usw2,cell-gcp-euw4
      s3-endpoint: http://172.19.0.2:4566
      storage-endpoint: http://172.19.0.2:4566
  - name: cell-aws-usw2
    server: https://cell-aws-usw2.example.invalid
    labels:
      cloud: aws
      provider: aws
      region: us-west-2
      role: cell
    annotations:
      global-storage-bucket-prefix: ctrl-example-global
      global-storage-bucket-suffix: "999988887777"
      global-storage-endpoint: https://example-account.r2.cloudflarestorage.com
      global-storage-provider: Cloudflare
      aws-account-id: "999988887777"
      aws-region: us-west-2
      bucket-suffix: "999988887777"
      ecr-registry: registry.invalid/aws
      kubernetes-api-cidrs: 172.17.0.1/32
      registered-cells: cell-eaws-lh1,cell-aws-usw2,cell-gcp-euw4
      storage-endpoint: s3.us-west-2.amazonaws.com
  - name: cell-gcp-euw4
    server: https://cell-gcp-euw4.example.invalid
    labels:
      cloud: gcp
      provider: gcp
      region: europe-west4
      role: cell
    annotations:
      global-storage-bucket-prefix: ctrl-example-global
      global-storage-bucket-suffix: "999988887777"
      global-storage-endpoint: https://example-account.r2.cloudflarestorage.com
      global-storage-provider: Cloudflare
      aws-account-id: "999988887777"
      bucket-suffix: "999988887777"
      ecr-registry: registry.invalid/gcp
      gcp-project-id: acme-production
      kubernetes-api-cidrs: 172.17.16.1/32
      registered-cells: cell-eaws-lh1,cell-aws-usw2,cell-gcp-euw4
      storage-endpoint: storage.googleapis.com
  - name: ctrl-eaws-lh1
    server: https://kubernetes.default.svc
    labels:
      cloud: eaws
      provider: floci
      region: lh1
      role: ctrl
    annotations:
      bucket-suffix: "999988887777"
      global-storage-bucket-prefix: ctrl-example-global
      global-storage-bucket-suffix: "999988887777"
      global-storage-endpoint: https://example-account.r2.cloudflarestorage.com
      global-storage-provider: Cloudflare
      kubernetes-api-cidrs: 172.18.0.1/32
      origin-registry-workload-root: origin-registry:5000/000000000000/us-east-1
      registered-cells: cell-eaws-lh1,cell-aws-usw2,cell-gcp-euw4
repository:
  revision: "0000000000000000000000000000000000000000"
  url: git://172.19.255.21:9418/fixture-config.git
delivery:
  originRepositories:
    src/examples/batch_cron: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/batch_cron
    src/examples/ray_data: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/ray_data
    src/examples/ray_serve: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/ray_serve
    src/examples/ray_train: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/ray_train
    src/examples/svelte_web: 000000000000.dkr.ecr.us-west-2.amazonaws.com/src/examples/svelte_web
  images:
    - manifestRepository: registry.invalid/workloads/batch-cron
      package: src/examples/batch_cron
      repository: src/examples/batch_cron
      sourceName: batch-cron
      target: //src/examples/batch_cron:image_push
    - manifestRepository: registry.invalid/workloads/ray-data
      package: src/examples/ray_data
      repository: src/examples/ray_data
      sourceName: ray-data
      target: //src/examples/ray_data:image_push
    - manifestRepository: registry.invalid/workloads/ray-serve
      package: src/examples/ray_serve
      repository: src/examples/ray_serve
      sourceName: ray-serve
      target: //src/examples/ray_serve:image_push
    - manifestRepository: registry.invalid/workloads/ray-train
      package: src/examples/ray_train
      repository: src/examples/ray_train
      sourceName: ray-train
      target: //src/examples/ray_train:image_push
    - manifestRepository: registry.invalid/workloads/svelte-web
      package: src/examples/svelte_web
      repository: src/examples/svelte_web
      sourceName: svelte-web
      target: //src/examples/svelte_web:image_push
projectIndex:
  version: 3
  projects:
    - delivery: promoted
      deployments:
        - path: src/examples/batch_cron/deployment
          promotion: automatic
          source: {kind: warehouse}
          stage: prod
      name: batch_cron
      path: src/examples/batch_cron
      team: examples
    - delivery: submitted
      deployments:
        - {path: src/examples/ray_data/deployment}
      name: ray_data
      path: src/examples/ray_data
      team: examples
    - delivery: promoted
      deployments:
        - path: src/examples/ray_serve/deployment
          promotion: automatic
          source: {kind: warehouse}
          stage: prod
      name: ray_serve
      path: src/examples/ray_serve
      team: examples
    - delivery: submitted
      deployments:
        - {path: src/examples/ray_train/deployment}
      name: ray_train
      path: src/examples/ray_train
      team: examples
    - delivery: promoted
      deployments:
        - path: src/examples/svelte_web/deployment
          promotion: automatic
          source: {kind: warehouse}
          stage: prod
      name: svelte_web
      path: src/examples/svelte_web
      team: examples
team:
  slug: examples
  readers: all
  submitters: members
  members:
    - id: "user-2"
      email: user2@example.com
      roles: [dev]
    - id: "user-1"
      email: user1@example.com
      roles: [dev, ops]
  cells:
    matchLabels:
      role: cell
    matchExpressions:
      - key: provider
        operator: In
        values: [aws, floci, gcp]
  projects: [batch_cron, ray_data, ray_serve, ray_train, svelte_web]
  dev_secrets:
    # keep-sorted start
    - slack_bot_token
    - temporal_cloud_api_key
    # keep-sorted end
  quota:
    classes:
      ha: {cpu: "2", memory: 6Gi}
      wa: {cpu: "0", memory: "0"}
    cells:
      cell-aws-usw2:
        classes:
          ha: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "2"}
          wa: {cpu: "0", memory: "0"}
  promotion: automatic
  archive: true
