        teams:
          gatewayIdentities:
            examples: {serviceAccount: s3-gateway-examples, serviceAccountEmail: examples-gateway@acme-production.iam.gserviceaccount.com}
          handoffs:
            examples: {provider: gcp, recordName: s3-team-examples, storageContract: {version: 1, authorizationPrefixes: {global: global/home/examples/, global-meta: global/meta/, global-scratch: global/scratch/examples/, home: home/examples/, meta: meta/, scratch: scratch/examples/}, gateway: {endpoint: 'http://s3-gateway.s3-system.svc'}, mounts: {global: {bucket: global, keyPrefix: home/examples/gcp-euw4/, remote: global}, global-meta: {bucket: global, keyPrefix: meta/, remote: global-meta}, global-scratch: {bucket: global, keyPrefix: scratch/examples/, remote: global-scratch}, home: {bucket: gcp-euw4, keyPrefix: home/examples/, remote: home}, meta: {bucket: gcp-euw4, keyPrefix: meta/, remote: meta}, scratch: {bucket: gcp-euw4, keyPrefix: scratch/examples/, remote: scratch}}}, secretStore: {name: team-s3, serviceAccount: team-s3, auth: {gcp: {clusterLocation: europe-west4, clusterName: cell-gcp-euw4, projectId: acme-production, serviceAccountEmail: examples-record-reader@acme-production.iam.gserviceaccount.com}}}, externalSecret: {name: team-s3, targetSecretName: team-s3, remoteProperties: {accessKeyId: access_key_id, secretAccessKey: secret_access_key}}}
