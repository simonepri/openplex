{{- /* Projects the runtime secret adapter and its identity coordinates into each derived cell namespace. The team-lane chart owns the projection objects. */ -}}

# LINT.IfChange(team-dev-secrets-store-provider)
{{ define "fleet-team.devSecretsValues" -}}
{{- $root := index . "root" -}}
{{- $cell := index . "cell" -}}
{{- $storageAuthAdapter := index . "storageAuthAdapter" -}}
devSecrets:
  names: {{ $root.Values.team.dev_secrets | toJson }}
runtimeSecrets:
  adapter: {{ $storageAuthAdapter | quote }}
  auth:
  {{- if eq $storageAuthAdapter "aws" }}
    aws:
      region: {{ required (printf "cell %q requires region for AWS dev secrets" $cell.name) $cell.region | quote }}
    {{- if $cell.secretsManagerEndpoint }}
      endpoint: {{ $cell.secretsManagerEndpoint | quote }}
    {{- end }}
  {{- else if eq $storageAuthAdapter "gcp" }}
    gcp:
      projectId: {{ required (printf "cell %q requires providerConfig.gcp.projectID for GCP dev secrets" $cell.name) $cell.providerConfig.gcp.projectID | quote }}
  {{- else if eq $storageAuthAdapter "kubernetes" }}
    kubernetes: {}
  {{- else }}
    {{- fail (printf "unsupported runtime secrets adapter %q" $storageAuthAdapter) }}
  {{- end }}
{{- end -}}
# LINT.ThenChange(//src/infra/argocd/components/kyverno/kustomize/dev-secrets-policy.yaml:team-dev-secrets-store-provider,//src/infra/argocd/components/team_namespace/helm/templates/dev_secrets.yaml:team-dev-secrets-store-provider)
