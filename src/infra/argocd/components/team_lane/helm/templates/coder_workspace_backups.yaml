{{- /* Generates the managed exact-namespace workspace-backup store before the team foundation projects that credential. Only opted-in namespaces get one. */ -}}

{{- include "fleet-team.validate" . -}}
{{- $cells := include "fleet-team.selectedCells" (dict "root" .) | fromJsonArray -}}
{{- range $suffix := include "fleet-team.namespaceSuffixes" . | fromJsonArray }}
{{- $enabled := eq (include "fleet-team.devWorkspacesEnabled" (dict "root" $ "suffix" $suffix)) "true" -}}
{{- if $enabled }}
{{- $namespace := printf "team-%s-%s" $.Values.team.slug ($suffix | replace "_" "-") -}}
{{- $storeName := include "fleet-team.workspaceBackupStoreName" (dict "namespace" $namespace) -}}
{{- $releaseName := include "fleet-team.workspaceBackupReleaseName" (dict "team" $.Values.team.slug "suffix" $suffix) -}}
{{- range $cell := $cells }}
{{- $provider := required (printf "cell %q requires provider" $cell.name) $cell.provider -}}
{{- $handoff := include "fleet-team.storageHandoff" (dict "root" $ "cell" $cell) | fromJson -}}
{{- $storageAuthAdapter := include "fleet-team.storageAuthAdapter" $handoff -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-workspace-backup-store-%s-%s" $cell.name $.Values.team.slug ($suffix | replace "_" "-") }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # keep-sorted start
    cluster: {{ $cell.name | quote }}
    role: cell
    team: {{ $.Values.team.slug | quote }}
    # keep-sorted end
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-cell
  destination:
    name: {{ $cell.name | quote }}
    namespace: external-secrets-system
  source:
    repoURL: {{ $.Values.repository.url | quote }}
    targetRevision: {{ $.Values.repository.revision | quote }}
    path: src/infra/argocd/components/coder_workspace_secret_store/helm
    helm:
      releaseName: {{ $releaseName | quote }}
      valuesObject:
        enabled: true
        namespace: {{ $namespace | quote }}
        provider: {{ $provider | quote }}
        authAdapter: {{ $storageAuthAdapter | quote }}
        storeName: {{ $storeName | quote }}
        auth:
{{- if eq $storageAuthAdapter "aws" }}
          aws:
            region: {{ required (printf "cell %q requires region for workspace backups" $cell.name) $cell.region | quote }}
{{- else if eq $storageAuthAdapter "gcp" }}
          gcp:
            clusterLocation: {{ required (printf "cell %q requires region for workspace backups" $cell.name) $cell.region | quote }}
            clusterName: {{ $cell.name | quote }}
            projectId: {{ required (printf "cell %q requires providerConfig.gcp.projectID for workspace backups" $cell.name) $cell.providerConfig.gcp.projectID | quote }}
{{- else if eq $storageAuthAdapter "kubernetes" }}
          kubernetes: {}
{{- else }}
{{- fail (printf "unsupported workspace-backup auth adapter %q" $storageAuthAdapter) }}
{{- end }}
  syncPolicy:
{{ include "fleet-team.applicationSyncPolicy" $ | nindent 4 }}
{{ end }}
{{ end }}
{{ end }}
