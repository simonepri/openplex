{{- /* Generates Kubernetes-auth source-record RBAC Applications for Floci cells to provide local team secret access. */ -}}

{{- include "fleet-team.validate" . -}}
{{- $group := include "fleet-team.group" . -}}
{{- $namespaceSuffixes := include "fleet-team.namespaceSuffixes" . | fromJsonArray -}}
{{- $flociCells := include "fleet-team.selectedCells" (dict
      "root" .
      "extraExpressions" (list
        (dict "key" "provider" "operator" "In" "values" (list "floci")))) | fromJsonArray -}}
{{- range $cell := $flociCells }}
{{- if and (hasKey $cell "storage") $cell.storage (hasKey $cell.storage "teams") }}
{{- $handoff := include "fleet-team.storageHandoff" (dict "root" $ "cell" $cell) | fromJson -}}
{{- $rbacHandoff := deepCopy $handoff -}}
{{- $_ := set $rbacHandoff.secretStore "auth" (dict "kubernetes" (dict "remoteNamespace" "secret-records")) -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-team-%s-storage-record-rbac" $cell.name $.Values.team.slug }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # keep-sorted start
    cluster: {{ $cell.name | quote }}
    role: cell
    team: {{ $.Values.team.slug | quote }}
    # keep-sorted end
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-cell
  destination:
    name: {{ $cell.name | quote }}
    namespace: secret-records
  source:
    repoURL: {{ $.Values.repository.url | quote }}
    targetRevision: {{ $.Values.repository.revision | quote }}
    path: src/infra/argocd/components/team_namespace/helm
    helm:
      releaseName: {{ printf "team-%s-storage-rbac" $.Values.team.slug | quote }}
      valuesObject:
        mode: storage-rbac
        team: {{ dict "slug" $.Values.team.slug "group" $group "namespaceSuffix" "" "classes" (keys $.Values.team.quota.classes | sortAlpha) | toJson }}
        resources: []
        storageProjection:
          enabled: true
          handoff: {{ $rbacHandoff | toJson }}
          rbacNamespaceSuffixes: {{ $namespaceSuffixes | toJson }}
  syncPolicy:
{{ include "fleet-team.applicationSyncPolicy" $ | nindent 4 }}
{{ end }}
{{ end }}
