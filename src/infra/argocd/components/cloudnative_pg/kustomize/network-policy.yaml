# NetworkPolicy allowing Kubernetes API server ingress to CloudNativePG admission webhook.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudnative-pg-webhook
  namespace: cnpg-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: cloudnative-pg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cloudnative-pg
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9443}
