# ExternalSecret projecting storage-stats SigV4 credentials into the ClickHouse namespace.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signoz-clickhouse-storage-stats-gateway-auth
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: storage-stats
    app.kubernetes.io/component: storage-stats-rollup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: signoz-clickhouse-storage-stats-gateway-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: application-oidc
        property: storage_stats_access_key_id
    - secretKey: secret-access-key
      remoteRef:
        key: application-oidc
        property: storage_stats_secret_access_key
