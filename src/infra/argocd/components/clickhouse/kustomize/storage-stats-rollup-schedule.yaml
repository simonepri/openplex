# CronJob rebuilding the ClickHouse storage_stats cache from durable cell stats manifests.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: signoz-clickhouse-storage-stats-rollup
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/no-liveness-probe: >-
      ClickHouse storage stats rollup CronJob runs to completion and exits.
    ignore-check.kube-linter.io/no-readiness-probe: >-
      ClickHouse storage stats rollup CronJob runs to completion and exits.
    ignore-check.kube-linter.io/read-secret-from-env-var: >-
      ClickHouse storage stats rollup requires ClickHouse credentials via environment.
  labels:
    app.kubernetes.io/name: storage-stats
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/component: storage-stats-rollup
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  schedule: "37 3 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: storage-stats
            app.kubernetes.io/instance: signoz
            app.kubernetes.io/component: storage-stats-rollup
            app.kubernetes.io/part-of: signoz
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: rollup
              image: docker.io/clickhouse/clickhouse-server:26.9.10@sha256:b01d1d45df540e487396838dd1397550215a07a8998aa6ac3b50b39802d62701
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: signoz-clickhouse-storage-stats-common
                - configMapRef:
                    name: signoz-clickhouse-storage-stats-provider
              env:
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: signoz-clickhouse
                      key: password
              command: [/bin/bash, /scripts/storage-stats-rollup.sh]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
                runAsGroup: 101
                runAsNonRoot: true
                runAsUser: 101
                seccompProfile: {type: RuntimeDefault}
              volumeMounts:
                - {name: programs, mountPath: /scripts, readOnly: true}
                - {name: schema, mountPath: /etc/storage-stats, readOnly: true}
                - {name: temporary, mountPath: /tmp}
                - {name: storage-stats-gateway-auth, mountPath: /var/run/secrets/storage-stats-gateway, readOnly: true}
          volumes:
            - name: programs
              configMap:
                name: signoz-clickhouse-storage-stats-rollup-program
                defaultMode: 365
            - name: schema
              configMap:
                name: signoz-clickhouse-storage-stats-schema
            - {name: temporary, emptyDir: {sizeLimit: 128Mi}}
            - name: storage-stats-gateway-auth
              secret:
                secretName: signoz-clickhouse-storage-stats-gateway-auth
