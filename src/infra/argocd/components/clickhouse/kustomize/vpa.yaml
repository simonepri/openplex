# VerticalPodAutoscaler managing in-place resource sizing for ClickHouse shards and Keeper pods.

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: signoz-clickhouse-shard-0-replica-0
  namespace: signoz
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: chi-signoz-clickhouse-cluster-0-0
  updatePolicy: {updateMode: "InPlace"}
  resourcePolicy:
    containerPolicies:
      - containerName: clickhouse
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
