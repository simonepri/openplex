# ExternalSecret generating and managing administrative credentials for SigNoz ClickHouse.

apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: signoz-clickhouse
  namespace: signoz
  annotations:
    # Password generators are passive External Secrets inputs and expose no
    # status conditions for Argo CD to wait on between sync waves.
    argocd.argoproj.io/ignore-healthcheck: "true"
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: signoz
spec:
  allowRepeat: true
  digits: 8
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signoz-clickhouse
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: signoz
spec:
  refreshPolicy: CreatedOnce
  target:
    name: signoz-clickhouse
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: runtime-secret
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: clickhouse
          app.kubernetes.io/part-of: signoz
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: signoz-clickhouse
