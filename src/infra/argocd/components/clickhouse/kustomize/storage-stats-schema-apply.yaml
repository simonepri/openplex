# Argo CD sync-hook Job applying the storage_stats rollup schema upon cluster synchronization.

apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-clickhouse-storage-stats-schema-apply
  namespace: signoz
  annotations:
    # Schema application re-runs idempotently on each sync and never joins
    # the desired state, so a completed Job cannot trip a self-heal loop.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    ignore-check.kube-linter.io/no-liveness-probe: >-
      Storage stats schema apply Job runs to completion and exits.
    ignore-check.kube-linter.io/no-readiness-probe: >-
      Storage stats schema apply Job runs to completion and exits.
    ignore-check.kube-linter.io/read-secret-from-env-var: >-
      Storage stats schema apply Job requires ClickHouse password via environment variable.
  labels:
    app.kubernetes.io/name: storage-stats
    app.kubernetes.io/instance: signoz
    app.kubernetes.io/component: storage-stats-schema
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-stats
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/component: storage-stats-schema
        app.kubernetes.io/part-of: signoz
    spec:
      priorityClassName: cluster-operators
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: schema-apply
          # yamllint disable-line rule:line-length
          image: docker.io/clickhouse/clickhouse-server:26.9.12@sha256:5d6b622bbb109f40d12333187e44ae80864cf72aa71ae9a4704a53496615e941
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: signoz-clickhouse-storage-stats-common
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signoz-clickhouse
                  key: password
          command: [/bin/bash, /scripts/storage-stats-schema-apply.sh]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: programs, mountPath: /scripts, readOnly: true}
            - {name: schema, mountPath: /etc/storage-stats, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: programs
          configMap:
            name: signoz-clickhouse-schema-apply-programs
            defaultMode: 365
        - name: schema
          configMap:
            name: signoz-clickhouse-storage-stats-schema
        - {name: temporary, emptyDir: {sizeLimit: 128Mi}}
