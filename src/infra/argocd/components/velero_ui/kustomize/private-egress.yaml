# Allows the local Velero UI authentication proxy to reach its private identity endpoints.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-ui-auth-private-egress
  namespace: velero-system
  labels:
    app.kubernetes.io/component: authentication
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: velero-ui
    app.kubernetes.io/part-of: velero
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: authentication
      app.kubernetes.io/part-of: velero-ui
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: tailscale-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: tailscale-subnet-router}
      ports:
        - {protocol: TCP, port: 8443}
