# Projects scoped trust bundle for the Dex issuer in the control cluster. Cell ApplicationSets replace the source with their imported control-cluster CA.

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: velero-ui-control-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: authentication
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: velero-ui-control-ca
    app.kubernetes.io/part-of: velero
spec:
  sources:
    - secret: {name: cluster-local-ca, key: ca.crt}
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/managed-by: trust-manager
          app.kubernetes.io/name: velero-ui-control-ca
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
