# Tokenless ServiceAccount for Coder control plane pods, requiring no Kubernetes API access.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder
automountServiceAccountToken: false
