# CloudNativePG PostgreSQL cluster storing Coder users, workspaces, and audit state.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-postgres
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-postgres
    app.kubernetes.io/part-of: coder
    velero.io/exclude-from-backup: "true"
spec:
  # A standby takes over when a node drains, so Coder keeps its database.
  instances: 2
  affinity:
    podAntiAffinityType: required
  inheritedMetadata:
    annotations:
      signoz.io/path: /metrics
      signoz.io/port: "9187"
      signoz.io/scrape: "true"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:94aa172fc7ce295d482f5fe8bcf8d1e3423f30c15ba40c7d34114b68dc152b0a
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  bootstrap:
    initdb:
      database: coder
      owner: coder
  enablePDB: true
  enableSuperuserAccess: false
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  stopDelay: 300
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: coder-postgres-backups
        serverName: coder-postgres
  storage:
    size: 10Gi
    storageClass: general-expandable
  walStorage:
    size: 10Gi
    storageClass: general-expandable
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  postgresql:
    parameters:
      log_temp_files: "1024"
      password_encryption: scram-sha-256
      temp_file_limit: "2GB"
      work_mem: "16MB"
  podSecurityContext:
    fsGroup: 26
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: coder-postgres-daily
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-postgres-backup
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: coder-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-postgres-backup-s3
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-postgres-backup
type: Opaque
stringData:
  access-key-id: configured-by-applicationset
  secret-access-key: configured-by-applicationset
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: coder-postgres-backups
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-postgres-backups
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: "s3://configured-by-applicationset/backups"
    s3Credentials:
      accessKeyId:
        name: coder-postgres-backup-s3
        key: access-key-id
      secretAccessKey:
        name: coder-postgres-backup-s3
        key: secret-access-key
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2
