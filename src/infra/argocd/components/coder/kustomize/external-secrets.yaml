# ExternalSecret assembling Coder OIDC credentials from shared identity records.

# Helm release's CODER_OIDC_* environment variables.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: coder-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: identity
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: coder
      data:
        CODER_ACCESS_URL: '{{ .coder_external_url }}'
        # LINT.IfChange(coder-wildcard-hostname-label)
        CODER_WILDCARD_ACCESS_URL: '{{ .coder_wildcard_access_url }}'
        # LINT.ThenChange(//src/infra/argocd/components/routing_registry/helm/routes.yaml:coder-wildcard-hostname-label)
        CODER_OIDC_CLIENT_ID: '{{ .coder_client_id }}'
        CODER_OIDC_CLIENT_SECRET: '{{ .coder_client_secret }}'
        CODER_OIDC_GROUP_FIELD: '{{ .groups_claim }}'
        CODER_OIDC_ISSUER_URL: '{{ .issuer }}'
        CODER_OIDC_SCOPES: '{{ printf "%s,offline_access" .scopes }}'
        CODER_OIDC_USERNAME_FIELD: '{{ .username_claim }}'
        CODER_BOOTSTRAP_OIDC_USERNAME: '{{ index . "coder_bootstrap_oidc_username" | default "" }}'
        CODER_BOOTSTRAP_OIDC_PASSWORD: '{{ index . "coder_bootstrap_oidc_password" | default "" }}'
  dataFrom:
    - extract:
        key: application-oidc
---
# Projects operator-provisioned, read-only Git and scoped Coder publisher
# credentials for managed template publication.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-template-publication
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: coder
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: runtime-secrets}
  target:
    name: coder-template-publication
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: git-token
      remoteRef: {key: coder-template-publication, property: git_token}
    - secretKey: git-username
      remoteRef: {key: coder-template-publication, property: git_username}
    - secretKey: publisher-token
      remoteRef: {key: coder-template-publication, property: publisher_token}
    - secretKey: ssh-key
      remoteRef: {key: coder-template-publication, property: ssh_key}
---
# Projects the OpenTofu-authored cell kubeconfig used by the Kubernetes provisioner, written to kube-system to avoid racing this namespace's own creation.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-cell-kubeconfig
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: provisioner
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: coder
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: coder-cell-kubeconfig}
  target:
    name: coder-cell-kubeconfig
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: kubeconfig
      remoteRef: {key: coder-cell-kubeconfig, property: kubeconfig}
---
# Pre-minted automation token for workspace healer and template publication.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-automation-token
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: automation
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: coder-automation-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: coder-automation-token
        property: token
