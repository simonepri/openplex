# NetworkPolicy restricting Coder server ingress to Envoy Gateway and metrics collectors.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-server
  namespace: coder
  labels:
    app.kubernetes.io/component: coder-server
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: coder
      app.kubernetes.io/name: coder
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - {protocol: TCP, port: 2112}
    - from:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
        - ipBlock: {cidr: 100.64.0.0/10}
      ports:
        - {protocol: UDP, port: 1024, endPort: 65535}
  egress:
    # AWS Pod Identity agent endpoint
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # GCP Workload Identity metadata server endpoint
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    # STUN server UDP egress
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - {protocol: UDP, port: 19302}
    # Peer-to-peer UDP between coder server and workspaces / clients
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
        - ipBlock: {cidr: 100.64.0.0/10}
      ports:
        - {protocol: UDP, port: 1024, endPort: 65535}
