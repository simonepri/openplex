# NetworkPolicy restricting Coder server ingress to Envoy Gateway and metrics collectors.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-server
  namespace: coder
  labels:
    app.kubernetes.io/component: coder-server
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: coder
      app.kubernetes.io/name: coder
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - {protocol: TCP, port: 2112}
  egress:
    # AWS Pod Identity agent endpoint
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # GCP Workload Identity metadata server endpoint
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
