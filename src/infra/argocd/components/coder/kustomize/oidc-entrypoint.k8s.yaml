# Service and Deployment routing Coder public root requests through OIDC authentication.

apiVersion: v1
kind: Service
metadata:
  name: coder-oidc-entrypoint
  namespace: coder
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-oidc-entrypoint
    app.kubernetes.io/part-of: coder
spec:
  selector: {app.kubernetes.io/name: coder-oidc-entrypoint}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: coder-oidc-entrypoint, namespace: coder}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: coder-oidc-entrypoint}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-oidc-entrypoint
  namespace: coder
  annotations:
    vpa.autoscaling.k8s.io/enabled: "custom"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-oidc-entrypoint
    app.kubernetes.io/part-of: coder
    vpa: custom
spec:
  replicas: 1
  strategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: coder-oidc-entrypoint}
  template:
    metadata:
      labels: {app.kubernetes.io/name: coder-oidc-entrypoint, app.kubernetes.io/part-of: coder}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redirector
          image: docker.io/library/python:3.14.7-alpine3.24@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df
          command: [python, /app/oidc_entrypoint.py]
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 5}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: program, mountPath: /app, readOnly: true}]
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: program
          configMap: {name: coder-oidc-entrypoint}
