# ExternalSecret projecting Cloudflare API credentials for the cert-manager ACME DNS-01 solver.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager-system
  labels:
    app.kubernetes.io/component: dns01-credentials
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: cloudflare-dns01
    app.kubernetes.io/part-of: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: configured-by-applicationset
