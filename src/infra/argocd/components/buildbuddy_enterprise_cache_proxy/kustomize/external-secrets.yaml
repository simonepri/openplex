# ExternalSecret projecting BuildBuddy Cloud API key for Enterprise Cache Proxy synchronization.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-proxy-secret
  namespace: buildbuddy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: buildbuddy-enterprise-cache-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: buildbuddy-proxy-secret
  data:
    - secretKey: api_key
      remoteRef:
        key: buildbuddy-cloud
        property: api_key
