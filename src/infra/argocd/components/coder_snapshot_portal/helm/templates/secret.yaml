{{- /* ExternalSecret materializing OAuth2 client credentials for Coder portal authentication. */ -}}

{{- $name := "coder-snapshot-portal" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secrets
  namespace: coder-workspace-backup-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  labels:
    {{- include "coder-snapshot-portal.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: runtime-secrets}
  target:
    name: {{ $name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          {{- include "coder-snapshot-portal.labels" . | nindent 10 }}
      data:
        CODER_OAUTH_CLIENT_ID: "{{ `{{ .client_id }}` }}"
        CODER_OAUTH_CLIENT_SECRET: "{{ `{{ .client_secret }}` }}"
        SESSION_SECRET: "{{ `{{ .session_secret }}` }}"
  dataFrom:
    - extract: {key: coder-snapshot-oauth}
