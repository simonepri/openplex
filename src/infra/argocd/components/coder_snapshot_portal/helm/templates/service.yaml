{{- /* Service exposing snapshot portal web UI and HTTP API within the cluster. */ -}}

{{- $name := "coder-snapshot-portal" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: coder-workspace-backup-system
  labels:
    {{- include "coder-snapshot-portal.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $name }}
