{{- /* Deployment and ServiceAccount running the Coder workspace snapshot portal server. */ -}}

{{- $name := "coder-snapshot-portal" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: coder-workspace-backup-system
  labels:
    {{- include "coder-snapshot-portal.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: coder-workspace-backup-system
  labels:
    {{- include "coder-snapshot-portal.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      annotations:
        ignore-check.kube-linter.io/read-secret-from-env-var: >-
          Coder snapshot portal loads OAuth, session, and S3 credentials via environment variables.
      labels:
        {{- include "coder-snapshot-portal.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else if .Values.image.tag }}:{{ .Values.image.tag }}{{ else }}:inventory{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CODER_URL
              value: {{ .Values.coder.url | quote }}
            - name: CODER_TEMPLATE_NAME
              value: {{ .Values.coder.template | quote }}
            - name: CODER_OAUTH_REDIRECT_URL
              value: {{ printf "https://%s/oauth/callback" (ternary (printf "coder-snapshots.%s" .Values.access.accessDomain) .Values.access.hostname (ne .Values.access.accessDomain "")) | quote }}
            - name: S3_BUCKETS
              value: {{ join "," .Values.s3.buckets | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            {{- if or (and .Values.localCA .Values.localCA.enabled) (eq .Values.certificate.issuerName "cluster-local-ca") }}
            - name: SSL_CERT_DIR
              value: /etc/local-ca
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $name }}-secrets
          {{- if or (and .Values.localCA .Values.localCA.enabled) (eq .Values.certificate.issuerName "cluster-local-ca") }}
          volumeMounts:
            - name: cluster-local-ca
              mountPath: /etc/local-ca
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or (and .Values.localCA .Values.localCA.enabled) (eq .Values.certificate.issuerName "cluster-local-ca") }}
      volumes:
        - name: cluster-local-ca
          configMap:
            name: {{ default "cluster-local-ca" (and .Values.localCA .Values.localCA.configMapName) }}
      {{- end }}
