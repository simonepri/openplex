# Helm values for Coder workspace snapshot portal, configuring access controls and S3 endpoints.

cell: cell-example
access:
  hostname: coder-snapshots.cell-example.example.invalid
  gatewayIPv4: 172.31.0.11
  privateEgress:
    namespace: tailscale-system
    podLabels: {app.kubernetes.io/name: tailscale-subnet-router}
    port: 8443
coder:
  template: dev
  url: https://coder.example.invalid
s3:
  bucket: workspace-snapshots
  endpoint: http://s3-gateway.s3-system.svc:8080
  region: ""
certificate:
  issuerName: cluster-local-ca
localCA:
  enabled: true
  configMapName: cluster-local-ca
image:
  repository: docker.io/cluster/coder-snapshot-portal
  # LINT.IfChange(snapshot-portal-image)
  digest: sha256:156d1b3edb4b5bb8bcc013d2fa500b4e3b3b9bccf92cd1ae03f8d7bc439ac089
  # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:snapshot-portal-image)
  pullPolicy: IfNotPresent
resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 100m, memory: 64Mi}
secrets:
  externalSecretEnabled: true
