# Defines NetworkPolicy and VerticalPodAutoscaler (Off mode) for the parca-agent DaemonSet, rendered by `kustomize/base` for every `<cluster>-parca-agent` cell registration.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: parca-agent
  namespace: parca
  labels:
    app.kubernetes.io/name: parca-agent
    app.kubernetes.io/instance: parca-agent
    app.kubernetes.io/component: profiler
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: parca-agent
      app.kubernetes.io/instance: parca-agent
      app.kubernetes.io/component: profiler
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - {port: 7071, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: [kube-dns, node-local-dns]
      ports:
        - {port: 53, protocol: TCP}
        - {port: 53, protocol: UDP}
    - to:
        - ipBlock: {cidr: 169.254.20.10/32}
      ports:
        - {port: 53, protocol: TCP}
        - {port: 53, protocol: UDP}
    # Kubernetes metadata discovery and the public ingest door both use TLS.
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: parca-agent
  namespace: parca
  labels:
    app.kubernetes.io/name: parca-agent
    app.kubernetes.io/instance: parca-agent
    app.kubernetes.io/component: profiler
    app.kubernetes.io/managed-by: argocd
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: parca-agent
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: parca-agent
        controlledResources: [cpu, memory]
        minAllowed: {cpu: 50m, memory: 96Mi}
        maxAllowed: {cpu: "2", memory: 2Gi}
