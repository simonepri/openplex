# Materializes only the cell's Parca bearer token for the profiling exporter. Fleet supplies the exact cell record and provider-native ClusterSecretStore.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: observability-door-parca, namespace: parca}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: runtime-secrets}
  target:
    name: observability-door-parca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef: {key: application-oidc, property: parca_token}
