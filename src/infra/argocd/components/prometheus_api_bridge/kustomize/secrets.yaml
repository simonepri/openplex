# Projects dedicated SigNoz query credentials into the bridge namespace. Control bridges use it directly against SigNoz; cell bridges present it to the authenticated control-cluster query door.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-api-bridge-signoz
  namespace: signoz
  labels:
    app.kubernetes.io/component: query-bridge
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: runtime-secrets}
  target:
    name: prometheus-api-bridge-signoz-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef: {key: application-oidc, property: prometheus_query_token}
