# Mutates admission requests for the Prometheus API bridge collector probes.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prometheus-api-bridge-collector-probe-tolerance
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  admission: true
  background: false
  emitWarning: false
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 5
  rules:
    - name: tolerate-collector-startup-pressure
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Deployment]
              names: [prometheus-api-bridge-collector]
              namespaces: [signoz]
              operations: [CREATE, UPDATE]
      mutate:
        foreach:
          - list: request.object.spec.template.spec.containers
            preconditions:
              all:
                - key: '{{ element.name }}'
                  operator: Equals
                  value: collector
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - name: '{{ element.name }}'
                        startupProbe:
                          httpGet: {path: /, port: health}
                          failureThreshold: 60
                          periodSeconds: 10
                          timeoutSeconds: 10
                        livenessProbe:
                          failureThreshold: 12
                          periodSeconds: 30
                          timeoutSeconds: 10
                        readinessProbe:
                          failureThreshold: 6
                          periodSeconds: 10
                          timeoutSeconds: 5
