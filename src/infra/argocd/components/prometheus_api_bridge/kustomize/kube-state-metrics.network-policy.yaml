# Enforces kube-state-metrics ingress and API egress contract for the Prometheus API bridge collector, rendered by every bridge registration.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-api-bridge-kube-state-metrics
  namespace: signoz
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: prometheus-api-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: prometheus-api-bridge
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: collector
              app.kubernetes.io/instance: prometheus-api-bridge
              app.kubernetes.io/name: prometheus-api-bridge
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
