# Exercises the canonical Coder application wildcard certificate and dedicated listeners alongside the active-control alias used by exact routes.

gateway:
  enabled: true
  canonicalScheme: https
  aliasDomain: corp.openplex.io
  baseDomain: ctrl-cloud.c.corp.openplex.io
  listeners:
    atlantisWebhookHttps:
      enabled: true
      hostname: hooks.openplex.io
      certificateSecret: cluster-tls-atlantis-webhook
    coderApps:
      enabled: true
      hostname: "*.coder.ctrl-cloud.c.corp.openplex.io"
      certificateSecret: cluster-tls-coder-apps
    http:
      enabled: true
      redirectToHTTPS: true
    s3Https:
      enabled: true
      hostname: s3-gateway.cell-cloud.cluster.c.corp.openplex.io
      certificateSecret: cluster-tls-s3
    https:
      enabled: true
      certificateSecret: cluster-tls
      aliasCertificateSecret: cluster-tls-alias
certificate:
  enabled: true
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: public-acme
