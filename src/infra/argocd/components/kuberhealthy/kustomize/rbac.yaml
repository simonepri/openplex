# ServiceAccount and RBAC roles granting Kuberhealthy Chainsaw synthetic smoke and behavioral checks permissions to inspect cluster resources.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: chainsaw-smoke-check
  namespace: kuberhealthy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: chainsaw-smoke-check
  annotations:
    automount-service-account-token: "true"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chainsaw-smoke-check
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: chainsaw-smoke-check
rules:
  - apiGroups: [""]
    resources:
      # keep-sorted start
      - configmaps
      - namespaces
      - nodes
      - pods
      - services
      # keep-sorted end
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources:
      # keep-sorted start
      - apiservices
      # keep-sorted end
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      # keep-sorted start
      - daemonsets
      - deployments
      - statefulsets
      # keep-sorted end
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources:
      # keep-sorted start
      - nodes
      - pods
      # keep-sorted end
    verbs: [get, list]
  - nonResourceURLs:
      # keep-sorted start
      - /healthz
      - /livez
      - /readyz
      - /version
      # keep-sorted end
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chainsaw-smoke-check
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: chainsaw-smoke-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chainsaw-smoke-check
subjects:
  - kind: ServiceAccount
    name: chainsaw-smoke-check
    namespace: kuberhealthy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chainsaw-smoke-check
  namespace: kuberhealthy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: chainsaw-smoke-check
rules:
  - apiGroups: [""]
    resources:
      # keep-sorted start
      - configmaps
      - pods
      - services
      # keep-sorted end
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources:
      # keep-sorted start
      - deployments
      # keep-sorted end
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chainsaw-smoke-check
  namespace: kuberhealthy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: chainsaw-smoke-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chainsaw-smoke-check
subjects:
  - kind: ServiceAccount
    name: chainsaw-smoke-check
    namespace: kuberhealthy
---
