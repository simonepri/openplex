# Ingress NetworkPolicy for Kuberhealthy: allows traffic from Envoy Gateway and in-namespace check pods.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuberhealthy
  namespace: kuberhealthy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kuberhealthy
spec:
  podSelector:
    matchLabels:
      app: kuberhealthy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: private-access
              gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
