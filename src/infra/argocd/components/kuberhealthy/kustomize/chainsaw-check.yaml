# KuberhealthyCheck manifests running recurring Chainsaw synthetic smoke and behavioral tests to continuously verify cluster health.

apiVersion: comcast.github.io/v1
kind: KuberhealthyCheck
metadata:
  name: chainsaw-smoke-cli
  namespace: kuberhealthy
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: chainsaw-smoke-cli
spec:
  runInterval: 15m
  timeout: 5m
  extraAnnotations:
    automount-service-account-token: "true"
  extraLabels:
    app.kubernetes.io/name: chainsaw-smoke-cli
    kuberhealthy-check-name: chainsaw-smoke-cli
  podSpec:
    serviceAccountName: chainsaw-smoke-check
    restartPolicy: Never
    automountServiceAccountToken: true
    securityContext:
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: chainsaw-smoke-cli
        image: ghcr.io/kyverno/chainsaw:v0.2.15@sha256:527f3be2b9ec0580cb0bc84540a0fee99406b011c24ae3a30953e525af60809d
        imagePullPolicy: IfNotPresent
        command:
          - /scripts/run-chainsaw-smoke-cli.sh
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: scripts
            mountPath: /scripts
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: scripts
        configMap:
          name: chainsaw-smoke-check-scripts
          defaultMode: 493
---
