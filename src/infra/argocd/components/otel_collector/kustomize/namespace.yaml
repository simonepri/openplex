# Defines otel-system namespace owned by each OpenTelemetry Collector Application with privileged admission for host metrics and node instrumentation.

apiVersion: v1
kind: Namespace
metadata:
  name: otel-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: otel-system
    app.kubernetes.io/part-of: cluster-runtime
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
