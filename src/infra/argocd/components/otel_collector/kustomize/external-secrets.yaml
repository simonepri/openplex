# Materializes the cell's OTLP and Prometheus-query credentials for the shared collector and bridge door clients. Fleet supplies the provider record/store.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-door-cell
  namespace: otel-system
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: runtime-secrets}
  target:
    name: observability-door-cell
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        authorization: 'Bearer {{ .token }}'
        endpoint: '{{ .signozCallback | trimSuffix "/oauth2/callback" | replace "https://signoz." "https://observability." }}'
        prometheus-api-key: '{{ .prometheusQueryToken }}'
        token: '{{ .token }}'
  data:
    - secretKey: signozCallback
      remoteRef: {key: application-oidc, property: signoz_callback_uri}
    - secretKey: token
      remoteRef: {key: application-oidc, property: otlp_token}
    - secretKey: prometheusQueryToken
      remoteRef: {key: application-oidc, property: prometheus_query_token}
