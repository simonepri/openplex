# Defines the namespace for node-problem-detector daemons, requiring privileged
# pod security admission to read host /dev/kmsg, systemd units, and filesystem mounts.

apiVersion: v1
kind: Namespace
metadata:
  name: node-problem-detector
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
    cost-center: shared-infrastructure
    environment: production
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
