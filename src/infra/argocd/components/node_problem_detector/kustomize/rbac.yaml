# Configures RBAC and ServiceAccount for node-problem-detector to update node conditions and report problem events.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-problem-detector
  namespace: node-problem-detector
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/instance: node-problem-detector
    app.kubernetes.io/component: health-monitor
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-problem-detector
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/instance: node-problem-detector
    app.kubernetes.io/component: health-monitor
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-problem-detector
  labels:
    app.kubernetes.io/name: node-problem-detector
    app.kubernetes.io/instance: node-problem-detector
    app.kubernetes.io/component: health-monitor
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-problem-detector
subjects:
  - kind: ServiceAccount
    name: node-problem-detector
    namespace: node-problem-detector
