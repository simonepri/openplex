                value: (has(object.spec.rayClusterConfig.headGroupSpec.template.spec.tolerations) ?
                  object.spec.rayClusterConfig.headGroupSpec.template.spec.tolerations : []) +
                  [variables.tpuToleration]
              }] : []) +
            object.spec.rayClusterConfig.workerGroupSpecs.filter(group,
              has(group.template.spec.nodeSelector) &&
              variables.tpuClassKey in group.template.spec.nodeSelector &&
              (!has(group.template.spec.tolerations) ||
               !group.template.spec.tolerations.exists(toleration,
                 toleration.key == 'google.com/tpu' &&
                 toleration.operator == 'Equal' &&
                 toleration.value == 'present' &&
                 toleration.effect == 'NoSchedule'))).map(group,
                JSONPatch{
                  op: 'add',
                  path: '/spec/rayClusterConfig/workerGroupSpecs/' +
                    string(object.spec.rayClusterConfig.workerGroupSpecs.indexOf(group)) +
                    '/template/spec/tolerations',
                  value: (has(group.template.spec.tolerations) ?
                    group.template.spec.tolerations : []) + [variables.tpuToleration]
                }) : []
