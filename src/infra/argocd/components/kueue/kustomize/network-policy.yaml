# Allows the Kubernetes API server to reach Kueue's admission webhook and aggregated visibility API; the Kueue Application renders these paths before the fleet ingress baseline selects the namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kueue-api-server
  namespace: kueue-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kueue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kueue
      app.kubernetes.io/name: kueue
  policyTypes: [Ingress]
  ingress:
    - ports:
        # keep-sorted start
        - {protocol: TCP, port: 8082}
        - {protocol: TCP, port: 9443,}
        # keep-sorted end
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - {protocol: TCP, port: 8443}
