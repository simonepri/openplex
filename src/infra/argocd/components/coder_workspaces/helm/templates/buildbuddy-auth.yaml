{{- /* Projects the cell-scoped BuildBuddy cache and BES credential pair into the workspaces namespace. */ -}}

{{- if ne .Values.buildbuddy.mode "cloud" }}
{{- $namespace := include "coder-workspaces.namespace" . -}}
{{- $name := "workspace-buildbuddy-auth" -}}
{{- $recordName := printf "%s-workspaces-buildbuddy-auth" .Values.cell -}}
# floci-divergence: Floci reads the buildbuddy record from in-cluster secret-records with a dedicated reader ServiceAccount.
{{ if eq .Values.provider "floci" }}
{{- $readerName := printf "%s-%s" $name (sha256sum $namespace | trunc 12) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
{{ include "coder-workspaces.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $readerName }}
  namespace: secret-records
  labels:
{{ include "coder-workspaces.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $recordName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $readerName }}
  namespace: secret-records
  annotations:
    ignore-check.kube-linter.io/access-to-secrets: >-
      The buildbuddy auth reader requires get-only read access to the buildbuddy auth secret record to project bazelrc credentials.
  labels:
{{ include "coder-workspaces.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $readerName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $readerName }}
  labels:
{{ include "coder-workspaces.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-self-subject-rules-reviewer
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
{{- end }}
# LINT.IfChange(workspace-buildbuddy-auth-secret-projection)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
{{ include "coder-workspaces.labels" . | nindent 4 }}
spec:
  provider:
{{- if eq .Values.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
{{- else if eq .Values.provider "gcp" }}
    gcpsm:
      projectID: {{ .Values.gcpProjectId | quote }}
    # floci-divergence: Floci projects credentials from in-cluster Kubernetes secret-records rather than cloud secret managers.
{{- else if eq .Values.provider "floci" }}
    kubernetes:
      remoteNamespace: secret-records
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $name }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
{{ include "coder-workspaces.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        credentials.bazelrc: |-
          build --remote_header=x-buildbuddy-api-key={{`{{ .cache_api_key }}`}}
          build --remote_cache_header=x-buildbuddy-api-key={{`{{ .cache_api_key }}`}}
          build --bes_header=x-buildbuddy-api-key={{`{{ .bes_api_key }}`}}
  data:
    - secretKey: cache_api_key
      remoteRef:
        key: {{ $recordName | quote }}
        property: cache_api_key
    - secretKey: bes_api_key
      remoteRef:
        key: {{ $recordName | quote }}
        property: bes_api_key
# LINT.ThenChange(//src/infra/argocd/components/kyverno/kustomize/dev-secrets-policy.yaml:workspace-buildbuddy-auth-secret-projection)
{{- end }}
