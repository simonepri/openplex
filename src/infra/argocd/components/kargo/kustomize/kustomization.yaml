# Kustomize base for Kargo's provider-neutral network contract. The Helm availability profile owns controller disruption budgets.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - cluster-config.yaml
  - garbage-collector-deadline-policy.yaml
  - namespace.yaml
  - network-policy.yaml
  - origin-registry.proxy.yaml
  - origin-registry.service.yaml
  # keep-sorted end
