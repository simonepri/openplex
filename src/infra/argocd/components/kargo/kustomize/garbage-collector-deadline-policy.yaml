# Bounds each Kargo garbage-collector Job so a stuck run cannot span the next hourly schedule. The upstream chart exposes no Job active-deadline value.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kargo-garbage-collector-deadline
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kargo-garbage-collector-deadline
spec:
  admission: true
  background: false
  emitWarning: false
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 5
  rules:
    - name: set-garbage-collector-deadline
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Job]
              namespaces: [kargo]
              operations: [CREATE, UPDATE]
              selector:
                matchLabels:
                  app.kubernetes.io/component: garbage-collector
                  app.kubernetes.io/instance: kargo
      preconditions:
        any:
          - key: '{{ request.object.spec.activeDeadlineSeconds || `0` }}'
            operator: Equals
            value: 0
          - key: '{{ request.object.spec.activeDeadlineSeconds || `0` }}'
            operator: GreaterThan
            value: 3300
      mutate:
        patchStrategicMerge:
          spec:
            activeDeadlineSeconds: 3300
