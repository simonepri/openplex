# Grants cluster operators administrative access to Kargo resources.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kargo-operators
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: kargo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: operators
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: cluster:group:operators
