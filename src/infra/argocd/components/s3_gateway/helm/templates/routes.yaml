{{- /* Routes SigV4 object-storage requests through the shared Envoy Gateway data plane. */ -}}

{{- include "s3-gateway.validate" . -}}
{{- $topology := include "s3-gateway.activeTopology" . | fromJson -}}
{{- $target := dict -}}
{{- range $cell := $topology.cells -}}
  {{- if eq $cell.name $.Values.targetCell -}}{{- $target = $cell -}}{{- end -}}
{{- end -}}
{{- $virtual := $target.virtualName -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata: {name: s3-gateway-forbidden, namespace: s3-system}
spec:
  directResponse: {statusCode: 403}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata: {name: s3-gateway-not-found, namespace: s3-system}
spec:
  directResponse: {statusCode: 404}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-gateway-local
  namespace: s3-system
  labels: {app.kubernetes.io/component: storage-gateway-router}
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: private-access, namespace: envoy-gateway-system, sectionName: s3-http}
  hostnames: [s3-gateway.s3-system.svc]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /resolve}
      backendRefs: [{group: "", kind: Service, name: s3-resolver, port: 8080, weight: 1}]
      timeouts: {request: 0s, backendRequest: 0s}
    - matches:
        - path: {type: PathPrefix, value: /}
          headers:
            - {name: Authorization, type: RegularExpression, value: {{ include "s3-gateway.credentialRegex" $target.callers.orgWorkspaceBackups.accessKeyId | quote }}}
      backendRefs: [{group: "", kind: Service, name: s3-gateway-org-workspace-backups-local, port: 8080, weight: 1}]
      timeouts: {request: 0s, backendRequest: 0s}
    - matches:
        - path: {type: PathPrefix, value: /}
          headers:
            - {name: Authorization, type: RegularExpression, value: {{ include "s3-gateway.credentialRegex" $target.callers.legacyResearchData.accessKeyId | quote }}}
      backendRefs: [{group: "", kind: Service, name: s3-gateway-legacy-research-data-local, port: 8080, weight: 1}]
      timeouts: {request: 0s, backendRequest: 0s}
    - matches: [{path: {type: PathPrefix, value: /}}]
      filters:
        - type: ExtensionRef
          extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: s3-gateway-forbidden}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-gateway-cross-region
  namespace: s3-system
  labels:
    app.kubernetes.io/component: external-dns-source
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    external-dns.kubernetes.io/hostname: {{ $target.crossRegionServer | quote }}
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: private-access, namespace: envoy-gateway-system, sectionName: {{ .Values.crossRegionListener }} }
  hostnames: [{{ $target.crossRegionServer | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
          method: GET
          headers: [{name: Authorization, type: RegularExpression, value: {{ include "s3-gateway.credentialRegex" $target.callers.orgWorkspaceBackups.accessKeyId | quote }}}]
        - path: {type: PathPrefix, value: /}
          method: HEAD
          headers: [{name: Authorization, type: RegularExpression, value: {{ include "s3-gateway.credentialRegex" $target.callers.orgWorkspaceBackups.accessKeyId | quote }}}]
      backendRefs: [{group: "", kind: Service, name: s3-gateway-org-workspace-backups-local, port: 8080, weight: 1}]
      timeouts: {request: 0s, backendRequest: 0s}
    - matches:
        - path: {type: PathPrefix, value: /}
          headers: [{name: Authorization, type: RegularExpression, value: {{ include "s3-gateway.credentialRegex" $target.callers.storageStats.accessKeyId | quote }}}]
      backendRefs: [{group: "", kind: Service, name: s3-gateway-storage-stats-cross-region-configured, port: 8080, weight: 1}]
      timeouts: {request: 0s, backendRequest: 0s}
    - matches: [{path: {type: PathPrefix, value: /}}]
      filters:
        - type: ExtensionRef
          extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: s3-gateway-forbidden}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: {name: s3-gateway, namespace: envoy-gateway-system}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: private-access, sectionName: {{ .Values.crossRegionListener }}}
    - {group: gateway.networking.k8s.io, kind: Gateway, name: private-access, sectionName: s3-http}
  path:
    disableMergeSlashes: true
    escapedSlashesAction: KeepUnchanged
  timeout:
    http: {streamIdleTimeout: 0s}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: {name: s3-gateway, namespace: s3-system}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: s3-gateway-local}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: s3-gateway-cross-region}
  circuitBreaker:
    maxConnections: 4096
    maxParallelRequests: 2048
    maxPendingRequests: 1024
  connection:
    bufferLimit: 32768
