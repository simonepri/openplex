{{- /* Renders every non-secret rclone mapping consumed by one cell gateway. */ -}}

{{- include "s3-gateway.validate" . -}}
{{- $topology := include "s3-gateway.activeTopology" . | fromJson -}}
{{- $target := dict -}}
{{- range $cell := $topology.cells -}}
  {{- if eq $cell.name $.Values.targetCell -}}{{- $target = $cell -}}{{- end -}}
{{- end -}}
{{- $remoteCells := list -}}
{{- range $cell := $topology.cells -}}
  {{- if ne $cell.name $.Values.targetCell -}}{{- $remoteCells = append $remoteCells $cell -}}{{- end -}}
{{- end -}}
{{- $globalStorage := required "globalStorage is required" .Values.globalStorage -}}
{{- $bucketPrefix := required "globalStorage.bucketPrefix is required" $globalStorage.bucketPrefix -}}
{{- $bucketSuffix := required "globalStorage.bucketSuffix is required" $globalStorage.bucketSuffix -}}
{{- $provider := required "globalStorage.provider is required" $globalStorage.provider -}}
{{- $endpoint := required "globalStorage.endpoint is required" $globalStorage.endpoint -}}
{{- $teams := $globalStorage.teams | default list -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-gateway-rclone-config
  namespace: s3-system
  labels:
    app.kubernetes.io/component: runtime-configuration
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
data:
  legacy-research-data-rclone.conf: |
{{- if .Values.legacyStorage }}
{{ include "s3-gateway.legacyResearchStorage" . | nindent 4 }}
{{- $legacyTopology := include "s3-gateway.legacyTopology" . | fromJson }}
    [legacy-cell]
    type = combine
    upstreams = legacy=workspaces-legacy-{{ $legacyTopology.targetSlug }}:
{{ range $rem := $legacyTopology.remoteLegacies }}
    [legacy-{{ $rem.slug }}]
    type = combine
    upstreams = legacy=workspaces-legacy-{{ $rem.slug }}:
{{ end }}
    [legacy-research-data]
    type = combine
    upstreams = {{ $target.virtualName }}=legacy-cell:{{ range $rem := $legacyTopology.remoteLegacies }} {{ $rem.upstream }}=legacy-{{ $rem.slug }}:{{ end }}
{{- else }}
    [legacy-research-data]
    type = combine
    upstreams =
{{- end }}
  org-workspace-backups-rclone.conf: |
{{ include "s3-gateway.rcloneBackend" (dict "bucket" $target.buckets.backups "cell" $target "noHeadObject" true "remote" "local_backups_provider") | nindent 4 }}

{{ include "s3-gateway.rcloneAlias" (dict "bucket" $target.buckets.backups "providerRemote" "local_backups_provider" "remote" "local-users-dev" "suffix" "/backups/dev") | nindent 4 }}

    [local-users-backups]
    type = combine
    upstreams = dev=local-users-dev:

    [local-users]
    type = combine
    upstreams = backups=local-users-backups:

    [org-workspace-backups]
    type = combine
    upstreams = {{ $target.virtualName }}=local-users:{{ range $cell := $remoteCells }} {{ $cell.virtualName }}={{ $cell.virtualName }}:{{ end }}
{{- range $cell := $remoteCells }}

{{ include "s3-gateway.rcloneRemoteGateway" (dict "accessKeyId" $target.callers.orgWorkspaceBackups.accessKeyId "cell" $cell "target" $target) | nindent 4 }}
{{- end }}
  storage-stats-rclone.conf: |
{{ include "s3-gateway.rcloneBackend" (dict "bucket" $target.buckets.meta "cell" $target "noHeadObject" true "remote" "local_meta_provider") | nindent 4 }}

{{ include "s3-gateway.rcloneAlias" (dict "bucket" $target.buckets.meta "providerRemote" "local_meta_provider" "remote" "storage-stats" "suffix" "") | nindent 4 }}
