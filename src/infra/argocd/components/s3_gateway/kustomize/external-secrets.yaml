# Materializes external secrets for only gateway access-key identifiers and secret keys.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-gateway-credentials
  namespace: s3-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secret-records
  target:
    name: s3-gateway-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: runtime-secret
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: s3-gateway
          app.kubernetes.io/part-of: data-plane
  dataFrom:
    - extract:
        key: s3-gateway-config
---
# Floci exposes its host-local S3 service through static identities stored in
# the same record as its S3-compatible identity document. Project only
# the identities consumed by local workloads and gateway backends.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-local-object-credentials
  namespace: s3-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secret-records
  target:
    name: ray-data-local-object-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: runtime-secret
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: s3-gateway
          app.kubernetes.io/part-of: data-plane
      data:
        bootstrap-access-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "bootstrap" -}}{{ (index $identity.credentials 0).accessKey }}{{- end -}} {{- end -}}
        bootstrap-secret-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "bootstrap" -}}{{ (index $identity.credentials 0).secretKey }}{{- end -}} {{- end -}}
        org-workspace-backups-secret-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "org-workspace-backups" -}}{{ (index $identity.credentials 0).secretKey }}{{- end -}} {{- end -}}
        outsider-access-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "dataset-outsider" -}}{{ (index $identity.credentials 0).accessKey }}{{- end -}} {{- end -}}
        outsider-secret-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "dataset-outsider" -}}{{ (index $identity.credentials 0).secretKey }}{{- end -}} {{- end -}}
        reader-access-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "dataset-reader" -}}{{ (index $identity.credentials 0).accessKey }}{{- end -}} {{- end -}}
        reader-secret-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "dataset-reader" -}}{{ (index $identity.credentials 0).secretKey }}{{- end -}} {{- end -}}
        writer-access-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "dataset-writer" -}}{{ (index $identity.credentials 0).accessKey }}{{- end -}} {{- end -}}
        writer-secret-key: >-
          {{- range $identity := (.s3_gateway_config | fromJson).identities -}} {{- if eq $identity.name "dataset-writer" -}}{{ (index $identity.credentials 0).secretKey }}{{- end -}} {{- end -}}
  data:
    - secretKey: s3_gateway_config
      remoteRef:
        key: s3-gateway-config
        property: s3-gateway-config
