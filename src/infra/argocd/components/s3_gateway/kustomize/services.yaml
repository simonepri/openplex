# Preserves stable S3 endpoints through ClusterIP-only internal gateway services.

apiVersion: v1
kind: Service
metadata:
  name: s3-gateway
  namespace: s3-system
  labels:
    app.kubernetes.io/component: storage-gateway-router
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
spec:
  type: ExternalName
  externalName: private-access-gateway.envoy-gateway-system.svc.cluster.local
  ports:
    - {name: s3, port: 80, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: s3-gateway-legacy-research-data-local
  namespace: s3-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: legacy-research-gateway
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
spec:
  selector:
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/component: local-rclone
    app.kubernetes.io/instance: legacy-research-data
  ports:
    - {name: s3, port: 8080, protocol: TCP, targetPort: s3}
---
apiVersion: v1
kind: Service
metadata:
  name: s3-gateway-org-workspace-backups-local
  namespace: s3-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: workspace-backup-gateway
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
spec:
  selector:
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/component: local-rclone
    app.kubernetes.io/instance: org-workspace-backups
  ports:
    - {name: s3, port: 8080, protocol: TCP, targetPort: s3}
---
apiVersion: v1
kind: Service
metadata:
  name: s3-gateway-storage-stats-cross-region-configured
  namespace: s3-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: cross-region-storage-stats-gateway
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/part-of: data-plane
spec:
  selector:
    app.kubernetes.io/name: s3-gateway
    app.kubernetes.io/component: cross-region-stats-rclone
  ports:
    - {name: s3, port: 8080, protocol: TCP, targetPort: s3}
