# Helm values for Atlantis Terraform automation server, configuring repo policies and runtime.

allowDraftPRs: false
allowForkPRs: false
atlantisUrl: https://atlantis.invalid
defaultTFDistribution: opentofu
defaultTFVersion: 1.13.1
disableApplyAll: true
enableDiffMarkdownFormat: true
extraVolumes:
  - name: atlantis-aws-config
    configMap:
      name: atlantis-aws-config
extraVolumeMounts:
  - mountPath: /etc/atlantis-aws
    name: atlantis-aws-config
    readOnly: true
githubApp:
  id: "5138653"
  slug: openplex-atlantis
hidePrevPlanComments: true
image:
  repository: ghcr.io/runatlantis/atlantis
  tag: v0.48.1@sha256:42bde40e38ec7b89f02a2968b4b1b74b990121eb8768d0a7de7caad125344298
  pullPolicy: IfNotPresent
imagePullSecrets: []
ingress:
  enabled: false
loadEnvFromSecrets:
  - atlantis-plan-credentials
logLevel: info
orgAllowlist: github.com/invalid
vcsSecretName: atlantis-github-app
environment:
  ATLANTIS_AUTODISCOVER_MODE: disabled
  ATLANTIS_DISCARD_APPROVAL_ON_PLAN: "true"
  ATLANTIS_SILENCE_NO_PROJECTS: "true"
  AWS_CONFIG_FILE: /etc/atlantis-aws/config
repoConfig: |
  repos:
    - id: /.*/
      apply_requirements: [approved, mergeable, undiverged]
      allowed_overrides: [workflow, apply_requirements]
      repo_config_file: .github/atlantis.yaml
  workflows:
    fleet:
      plan:
        steps:
          - env:
              name: AWS_PROFILE
              value: atlantis-plan
          - init
          - plan
      apply:
        steps:
          - env:
              name: AWS_PROFILE
              value: atlantis-apply
          - apply
replicaCount: 1
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}
service:
  type: ClusterIP
serviceAccount:
  create: true
  mount: true
  name: atlantis-apply
statefulSet:
  annotations:
    ignore-check.kube-linter.io/read-secret-from-env-var: >-
      Atlantis requires GitHub webhook secret and runtime credentials via environment.
  priorityClassName: atlantis-control-plane
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 100
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
test:
  enabled: false
volumeClaim:
  enabled: true
  accessModes: [ReadWriteOnce]
  dataStorage: 10Gi
  storageClassName: general-expandable
