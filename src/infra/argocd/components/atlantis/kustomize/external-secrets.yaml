# ExternalSecret projecting GitHub App credentials and webhook secrets for Atlantis.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-github-app
  namespace: atlantis
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: atlantis-github-app
  data:
    - secretKey: key.pem
      remoteRef: {key: atlantis-github-app, property: private_key}
    - secretKey: github_secret
      remoteRef: {key: atlantis-github-app, property: webhook_secret}
---
# Projects Dex OIDC client credentials for the Atlantis browser auth proxy.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-oidc
  namespace: atlantis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/name: atlantis-oidc
    app.kubernetes.io/part-of: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: atlantis-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-id: '{{ .atlantis_client_id }}'
        client-secret: '{{ .atlantis_client_secret }}'
        cookie-secret: '{{ .atlantis_cookie_secret }}'
        external-url: '{{ .atlantis_external_url }}'
        oidc-issuer-url: '{{ .issuer }}'
        redirect-url: '{{ printf "%s/oauth2/callback" (trimSuffix "/" .atlantis_external_url) }}'
  dataFrom:
    - extract:
        key: application-oidc
---
# ExternalSecret projecting provider credentials for Atlantis OpenTofu planning.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-plan-credentials
  namespace: atlantis
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: atlantis-plan-credentials
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: cloudflare-terraform-token
        property: api_token
    - secretKey: TF_VAR_tailscale_oauth_client_id
      remoteRef:
        key: tailscale-terraform-oauth
        property: client_id
    - secretKey: TF_VAR_tailscale_oauth_client_secret
      remoteRef:
        key: tailscale-terraform-oauth
        property: client_secret
    - secretKey: TF_VAR_tailnet_auth_key
      remoteRef:
        key: mesh-router-tailscale-auth-key
