# VerticalPodAutoscaler sizing Atlantis StatefulSet requests at startup without mid-flight evictions.

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: atlantis
  namespace: atlantis
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: atlantis
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: atlantis
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: atlantis-auth-proxy
  namespace: atlantis
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: atlantis-auth-proxy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlantis-auth-proxy
  updatePolicy:
    updateMode: "InPlace"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 32Mi
