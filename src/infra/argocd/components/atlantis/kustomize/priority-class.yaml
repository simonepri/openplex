# PriorityClass ensuring critical scheduling priority for the Atlantis server.

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: atlantis-control-plane
  labels:
    app.kubernetes.io/managed-by: argocd
value: 850000
globalDefault: false
preemptionPolicy: Never
description: Schedules pull-request infrastructure planning ahead of team workloads without preemption.
