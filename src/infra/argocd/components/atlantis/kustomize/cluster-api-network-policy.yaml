# NetworkPolicy granting Atlantis egress to private Kubernetes API endpoints across the fleet.
# The placeholder 192.0.2.0/32 (TEST-NET-1) ipBlock is replaced per cluster via the network-cidrs annotation.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlantis-cluster-api
  namespace: atlantis
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: atlantis
spec:
  podSelector:
    matchLabels: {app: atlantis}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
      to:
        - ipBlock: {cidr: 192.0.2.0/32}
