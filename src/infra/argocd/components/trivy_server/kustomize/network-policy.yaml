# Exposes the Trivy server's cluster-local API to ephemeral scanner Jobs. The exact listener remains reachable while the network policy controller registers each new scanner Pod IP.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-server-api
  namespace: trivy-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: trivy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: trivy-server
      app.kubernetes.io/name: trivy
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 4954}
