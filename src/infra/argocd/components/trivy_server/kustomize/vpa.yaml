# Configures VerticalPodAutoscaler sizing (Initial mode) for Trivy server. Sizes database and vulnerability cache memory requests on pod creation without mid-flight evictions.

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: trivy-server
  namespace: trivy-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: trivy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: trivy-server
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
