# Deployment and Service running shared BuildBuddy REAPI remote cache with persistent storage.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildbuddy-cache-data
  namespace: buildbuddy
  annotations:
    resize.topolvm.io/enabled: "true"
    resize.topolvm.io/increase: "20%"
    resize.topolvm.io/storage_limit: 200Gi
    resize.topolvm.io/threshold: "20%"
  labels:
    app.kubernetes.io/component: remote-cache
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: buildbuddy-cache
    app.kubernetes.io/part-of: buildbuddy-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 3Gi}
  storageClassName: general-expandable
---
apiVersion: v1
kind: Service
metadata:
  name: buildbuddy-cache
  namespace: buildbuddy
  labels:
    app.kubernetes.io/component: remote-cache
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: buildbuddy-cache
    app.kubernetes.io/part-of: buildbuddy-cache
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: buildbuddy-cache}
  ports:
    - {name: grpc, appProtocol: kubernetes.io/h2c, port: 1985, protocol: TCP, targetPort: grpc}
    - {name: metrics, port: 9090, protocol: TCP, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildbuddy-cache
  namespace: buildbuddy
  annotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: >-
      BuildBuddy cache mounts a single ReadWriteOnce volume and requires Recreate to safely reattach storage.
    ignore-check.kube-linter.io/read-secret-from-env-var: >-
      BuildBuddy cache requires database connection URL via environment variable.
  labels:
    app.kubernetes.io/component: remote-cache
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: buildbuddy-cache
    app.kubernetes.io/part-of: buildbuddy-cache
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: buildbuddy-cache}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: remote-cache
        app.kubernetes.io/name: buildbuddy-cache
        app.kubernetes.io/part-of: buildbuddy-cache
      annotations:
        ignore-check.kube-linter.io/no-rolling-update-strategy: >-
          BuildBuddy cache mounts a single ReadWriteOnce volume and requires Recreate to safely reattach storage.
        ignore-check.kube-linter.io/read-secret-from-env-var: >-
          BuildBuddy cache requires database connection URL via environment variable.
        signoz.io/path: /metrics
        signoz.io/port: "9090"
        signoz.io/scrape: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: buildbuddy
          image: gcr.io/flame-public/buildbuddy-app-onprem:v2.313.0@sha256:4b90f658b19e8cc6b4e389f37c76ee93f72dd74ca880c67b88e5f8bd1982d920
          args: [--config_file=/etc/buildbuddy/config.yaml]
          env:
            - name: BUILDBUDDY_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: buildbuddy-cache-postgres-app, key: uri}
            - {name: BUILDBUDDY_PUBLIC_URL, value: 'http://buildbuddy-cache.buildbuddy.svc.cluster.local:8080'}
            - {name: TMPDIR, value: /tmp}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: grpc, containerPort: 1985, protocol: TCP}
            - {name: metrics, containerPort: 9090, protocol: TCP}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - {name: server-type, value: buildbuddy-server}
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - {name: server-type, value: buildbuddy-server}
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/buildbuddy, readOnly: true}
            - {name: data, mountPath: /var/lib/buildbuddy}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: buildbuddy-cache-config}
        - name: data
          persistentVolumeClaim: {claimName: buildbuddy-cache-data}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
