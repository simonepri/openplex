# Configures default values for the upstream k8s-cleaner controller chart.

fullnameOverride: k8s-cleaner

controller:
  image:
    registry: docker.io
    repository: projectsveltos/k8s-cleaner
    tag: "v0.24.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true

podSecurityContext:
  enabled: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
