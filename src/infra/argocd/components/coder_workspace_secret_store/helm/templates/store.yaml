{{- /* Creates exact-namespace ClusterSecretStore for workspace backup credentials. */ -}}

{{- if .Values.enabled }}
{{- $authAdapter := .Values.authAdapter -}}
{{- if eq $authAdapter "" -}}
{{- $authAdapter = .Values.provider -}}
{{- end -}}
# floci-divergence: Floci emulates secret stores via in-cluster Kubernetes secret-records or Floci AWS auth.
{{- if eq .Values.provider "floci" -}}
{{- if and (ne $authAdapter "kubernetes") (ne $authAdapter "aws") -}}
{{- fail (printf "workspace-backup provider %q requires Kubernetes or AWS auth" .Values.provider) -}}
{{- end -}}
{{- else if ne $authAdapter .Values.provider -}}
{{- fail (printf "workspace-backup provider %q requires matching auth, found %q" .Values.provider $authAdapter) -}}
{{- end -}}
# LINT.IfChange(dev-workspace-secret-projection)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  conditions:
    - namespaces:
        - {{ .Values.namespace }}
  provider:
{{- if eq $authAdapter "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.auth.aws.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: org-workspace-backups
{{- else if eq $authAdapter "gcp" }}
    gcpsm:
      projectID: {{ .Values.auth.gcp.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.auth.gcp.clusterLocation | quote }}
          clusterName: {{ .Values.auth.gcp.clusterName | quote }}
          serviceAccountRef:
            name: org-workspace-backups
            namespace: external-secrets-system
{{- else if eq $authAdapter "kubernetes" }}
    kubernetes:
      remoteNamespace: secret-records
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets-system
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-record-reader
          namespace: secret-records
{{- else }}
{{- fail (printf "unsupported workspace-backup auth adapter %q" $authAdapter) }}
{{- end }}
# LINT.ThenChange(//src/infra/argocd/components/team_namespace/helm/templates/lane.yaml:dev-workspace-secret-projection,//src/infra/definitions/workspaces/templates/dev/deployment.tf:dev-workspace-secret-projection)
{{- end }}
