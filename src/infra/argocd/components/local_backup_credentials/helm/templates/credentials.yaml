{{- /* Creates stable local-only SigV4 credentials without committing secret material. */ -}}

apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.secretName }}
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: {{ .Values.secretName }}
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  secretKeys: [access-key-id, secret-access-key]
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: runtime-secret
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: {{ .Values.secretName }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
        labels:
          app.kubernetes.io/component: runtime-secret
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/name: {{ .Values.secretName }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.secretName }}
