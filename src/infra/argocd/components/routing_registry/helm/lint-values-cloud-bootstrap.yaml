# Exercises the Coder route's cloud bootstrap ownership in the same Argo CD Application that reconciles Coder.

phase: bootstrap
exposure: private
capabilities: {buildbuddy: false}
atlantisEnabled: false
gatewayOIDC: {}
target:
  name: ctrl-cloud
  provider: aws
  role: ctrl
gateway:
  aliasDomain: ""
  baseDomain: ctrl-cloud.c.corp.local.internal
  canonicalScheme: https
  httpRedirect: true
  name: private-access
  namespace: envoy-gateway-system
