# Deployment and Service running the Homer static service catalog dashboard.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: homer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: homer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/name: homer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: homer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: homer
      app.kubernetes.io/name: homer
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homer
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: homer
    spec:
      automountServiceAccountToken: false
      serviceAccountName: homer
      priorityClassName: cluster-operators
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: render-config
          image: docker.io/b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            - |
              [ "$(echo "$CLUSTERS" | wc -w)" -eq 1 ] && export VELERO_URL="https://velero-ui.${CLUSTERS}.${ACCESS_DOMAIN}" || export VELERO_URL=""
              export QUICK_YAML=$(for c in $CLUSTERS; do printf '\n          - name: "%s"\n            url: "https://velero-ui.%s.%s"\n            target: "_blank"' "$c" "$c" "$ACCESS_DOMAIN"; done)
              [ -n "$QUICK_YAML" ] && export QUICK_YAML="        quick:${QUICK_YAML}"
              sed -e "s|https://coder.invalid|https://coder.${ACCESS_DOMAIN}|g;s|https://dragonfly.invalid|https://dragonfly.${ACCESS_DOMAIN}|g;s|https://kargo.invalid|https://kargo.${ACCESS_DOMAIN}|g;s|https://headlamp.invalid|https://headlamp.${ACCESS_DOMAIN}|g;s|https://opencost.invalid|https://opencost.${ACCESS_DOMAIN}|g" \
                  -e "s|https://argocd.invalid|https://argocd.${PUBLIC_DOMAIN}|g;s|https://atlantis.invalid|https://atlantis.${PUBLIC_DOMAIN}|g;s|https://signoz.invalid|https://signoz.${PUBLIC_DOMAIN}|g;s|https://parca.invalid|https://parca.${PUBLIC_DOMAIN}|g" \
                  /config-source/config.yml | awk '
                    /#VELERO_URL#/ { sub("#VELERO_URL#", ENVIRON["VELERO_URL"]) }
                    /# VELERO_QUICK_LINKS/ { if (ENVIRON["QUICK_YAML"] != "") print ENVIRON["QUICK_YAML"]; next }
                    { print }
                  ' > /config-rendered/config.yml
          env:
            - name: PUBLIC_DOMAIN
              value: invalid
            - name: ACCESS_DOMAIN
              value: invalid
            - name: CLUSTERS
              value: ""
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - name: config
              mountPath: /config-source
              readOnly: true
            - name: rendered-config
              mountPath: /config-rendered
      containers:
        - name: homer
          image: docker.io/b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
          imagePullPolicy: IfNotPresent
          env:
            - name: INIT_ASSETS
              value: "0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: rendered-config
              mountPath: /www/assets/config.yml
              subPath: config.yml
              readOnly: true
            - name: tools
              mountPath: /www/assets/tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: lighttpd-run
              mountPath: /var/run/lighttpd
            - name: lighttpd-log
              mountPath: /var/log/lighttpd
      volumes:
        - name: config
          configMap:
            name: homer-config
        - name: rendered-config
          emptyDir: {sizeLimit: 1Mi}
        - name: tools
          configMap:
            name: homer-tools
        - name: tmp
          emptyDir: {}
        - name: lighttpd-run
          emptyDir: {}
        - name: lighttpd-log
          emptyDir: {}
