# Deployment and Service running the Homer static service catalog dashboard.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: homer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: homer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/name: homer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: homer
  labels:
    app.kubernetes.io/instance: homer
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: homer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: homer
      app.kubernetes.io/name: homer
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homer
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: homer
    spec:
      automountServiceAccountToken: false
      serviceAccountName: homer
      priorityClassName: cluster-operators
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: render-config
          image: docker.io/b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /config-source/render-config.sh]
          env:
            - name: PUBLIC_DOMAIN
              value: invalid
            - name: BASE_DOMAIN
              value: invalid
            - name: ACCESS_DOMAIN
              value: invalid
            - name: CLUSTERS
              value: ""
            - name: AWS_REGION
              value: ""
            - name: PROVIDER
              value: ""
            - name: AWS_ACCOUNT_ID
              value: ""
            - name: SSO_DOMAIN
              value: configured-by-applicationset.invalid
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - name: config
              mountPath: /config-source
              readOnly: true
            - name: rendered-config
              mountPath: /config-rendered
      containers:
        - name: homer
          image: docker.io/b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
          imagePullPolicy: IfNotPresent
          env:
            - name: INIT_ASSETS
              value: "0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: rendered-config
              mountPath: /www/assets/config.yml
              subPath: config.yml
              readOnly: true
            - name: config
              mountPath: /www/assets/custom.css
              subPath: custom.css
              readOnly: true
            - name: icons
              mountPath: /www/assets/icons
              readOnly: true
            - name: icons
              mountPath: /www/favicon.ico
              subPath: favicon.ico
              readOnly: true
            - name: tools
              mountPath: /www/assets/tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: lighttpd-run
              mountPath: /var/run/lighttpd
            - name: lighttpd-log
              mountPath: /var/log/lighttpd
      volumes:
        - name: config
          configMap:
            defaultMode: 493
            name: homer-config
        - name: rendered-config
          emptyDir: {sizeLimit: 1Mi}
        - name: icons
          configMap:
            name: homer-icons
        - name: tools
          configMap:
            name: homer-tools
        - name: tmp
          emptyDir: {}
        - name: lighttpd-run
          emptyDir: {}
        - name: lighttpd-log
          emptyDir: {}
