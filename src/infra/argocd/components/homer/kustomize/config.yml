# Homer Dashboard Configuration https://github.com/bastienwirtz/homer

title: "Home"
subtitle: "OpenPlex"
documentTitle: "Openplex | Home"
logo: "assets/tools/openplex.svg"
icon: "fas fa-th"
header: true
footer: "<p>Services Directory</p>"
stylesheet:
  - "assets/custom.css"

columns: "auto"
connectivityCheck: false

theme: default
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#425b76"
    card-shadow: "rgba(0, 0, 0, 0.1)"
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    background: "#13141f"
    card-background: "#202336"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#a5b3c2"
    card-shadow: "rgba(0, 0, 0, 0.4)"
    link: "#3273dc"
    link-hover: "#ffdd57"

services:
  - name: "Development & Builds"
    icon: "fas fa-code"
    items:
      - name: "Coder"
        logo: "assets/tools/coder.svg"
        subtitle: "Remote developer workspaces"
        keywords: "ctrl workspace dev ide coder environment"
        url: "https://coder.invalid/workspaces"
        target: "_blank"

  - name: "Continuous Delivery & GitOps"
    icon: "fas fa-code-branch"
    items:
      - name: "Kargo"
        logo: "assets/tools/kargo.svg"
        subtitle: "Multi-stage release promotion"
        keywords: "ctrl promotion release staging pipeline kargo"
        url: "https://kargo.invalid"
        target: "_blank"
      - name: "Argo CD"
        logo: "assets/tools/argocd.svg"
        subtitle: "Continuous GitOps delivery"
        keywords: "ctrl gitops deployment sync argo fleet"
        url: "https://argocd.invalid"
        target: "_blank"
      - name: "Atlantis"
        logo: "assets/tools/atlantis.svg"
        subtitle: "Pull request Terraform automation"
        keywords: "ctrl terraform iac pull-request automation atlantis"
        url: "https://atlantis.invalid"
        target: "_blank"
      - name: "Registry"
        logo: "assets/tools/registry.svg"
        subtitle: "Container image registry"
        keywords: "ctrl cell oci ecr docker container image registry floci"
        url: "#REGISTRY_URL#"
        target: "_blank"

  - name: "Observability & Profiling"
    icon: "fas fa-chart-line"
    items:
      - name: "SigNoz"
        logo: "assets/tools/signoz.svg"
        subtitle: "Unified telemetry & APM"
        keywords: "ctrl metrics traces logs observability signoz"
        url: "https://signoz.invalid/"
        target: "_blank"
      - name: "Parca"
        logo: "assets/tools/parca.svg"
        subtitle: "Continuous profiling"
        keywords: "ctrl cpu pprof flamegraph profiling parca"
        url: "https://parca.invalid"
        target: "_blank"

  - name: "Cluster Operations"
    icon: "fas fa-cubes"
    items:
      - name: "Dragonfly"
        logo: "assets/tools/dragonfly.svg"
        subtitle: "P2P image distribution & preheat"
        keywords: "ctrl p2p distribution cache dragonfly oci"
        url: "https://dragonfly.invalid"
        target: "_blank"
      - name: "Headlamp"
        logo: "assets/tools/headlamp.svg"
        subtitle: "Multi-cluster Kubernetes console"
        keywords: "ctrl k8s cluster operator kubernetes dashboard"
        url: "https://headlamp.invalid"
        target: "_blank"
      - name: "OpenCost"
        logo: "assets/tools/opencost.svg"
        subtitle: "Cloud cost allocation & FinOps"
        keywords: "ctrl cost allocation finops opencost billing spend"
        url: "https://opencost.invalid"
        target: "_blank"
      - name: "Velero UI"
        logo: "assets/tools/velero.svg"
        subtitle: "Backup and disaster recovery"
        keywords: "fleet ctrl cell backup restore dr velero"
        url: "#VELERO_URL#"
        target: "_blank"
        # VELERO_QUICK_LINKS

