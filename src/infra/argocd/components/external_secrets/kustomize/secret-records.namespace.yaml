# Source namespace for platform secret records and auth tokens.

apiVersion: v1
kind: Namespace
metadata:
  name: secret-records
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,ServerSideApply=true
  labels:
    app.kubernetes.io/component: secret-records
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: external-secrets
