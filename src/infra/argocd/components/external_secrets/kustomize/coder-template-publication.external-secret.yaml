# ExternalSecret synchronizing coder-template-publication credentials from the cluster secret store.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-template-publication
  namespace: application-identity
  labels:
    app.kubernetes.io/component: application-identity
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secret-records
  target:
    name: coder-template-publication
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: ssh_key
      remoteRef:
        key: coder-template-publication
        property: ssh_key
