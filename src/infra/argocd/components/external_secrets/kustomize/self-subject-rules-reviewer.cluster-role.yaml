# Shared Local permission allowing Kubernetes-provider reader identities to prove their effective source-namespace access without granting any Secret access.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-self-subject-rules-reviewer
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: external-secrets
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
