# Configures the Kubernetes-backed runtime-record store and exact reader and token-request RBAC. The external-secrets local adapter applies it after the producer.

apiVersion: v1
kind: ServiceAccount
metadata: {name: secret-record-reader, namespace: secret-records}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: secret-record-reader, namespace: secret-records}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      # keep-sorted start
      - application-oidc
      - argocd-github-webhook
      - atlantis-github-app
      - atlantis-image-pull
      - atlantis-runtime-environment
      - buildbuddy-auth
      - cloudflare-dns01-token
      - coder-automation-token
      - coder-template-publication
      - headscale-preauth
      - org-workspace-backups
      - s3-gateway-config
      - s3-org-workspace-backups
      - workspace-snapshot-root
      # keep-sorted end
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-record-reader
  namespace: secret-records
  annotations:
    ignore-check.kube-linter.io/access-to-secrets: >-
      The external-secrets store adapter requires get-only read access to named runtime secrets to inject secrets into workload namespaces.
subjects:
  - {kind: ServiceAccount, name: secret-record-reader, namespace: secret-records}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-record-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: external-secrets-token-request, namespace: secret-records}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [secret-record-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: external-secrets-token-request, namespace: secret-records}
subjects:
  - {kind: ServiceAccount, name: external-secrets, namespace: external-secrets-system}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-token-request
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: local-secret-records}
spec:
  conditions:
    - namespaces:
        # keep-sorted start
        - application-identity
        - argocd
        - atlantis
        - cert-manager-system
        - coder-workspace-backup-system
        - envoy-gateway-system
        - headscale
        - s3-gateway-conformance
        - s3-system
        - tailscale-system
        # keep-sorted end
  provider:
    kubernetes:
      remoteNamespace: secret-records
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets-system
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-record-reader
          namespace: secret-records
