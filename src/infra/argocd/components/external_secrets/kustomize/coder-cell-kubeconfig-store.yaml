# Kube-system-backed store and RBAC for the OpenTofu-authored cell kubeconfig. OpenTofu applies before Argo CD creates the coder namespace, so it writes into kube-system (which always pre-exists) instead of racing the namespace it targets.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-cell-kubeconfig-reader
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-cell-kubeconfig-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [coder-cell-kubeconfig]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-cell-kubeconfig-reader
  namespace: kube-system
  annotations:
    ignore-check.kube-linter.io/access-to-secrets: >-
      The external-secrets store adapter requires get-only read access to the OpenTofu-authored coder-cell-kubeconfig Secret to project it into the coder namespace.
subjects:
  - kind: ServiceAccount
    name: coder-cell-kubeconfig-reader
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-cell-kubeconfig-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-token-request
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [coder-cell-kubeconfig-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-token-request
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-token-request
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: coder-cell-kubeconfig}
spec:
  conditions:
    - namespaces:
        - coder
  provider:
    kubernetes:
      remoteNamespace: kube-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets-system
          key: ca.crt
      auth:
        serviceAccount:
          name: coder-cell-kubeconfig-reader
          namespace: kube-system
