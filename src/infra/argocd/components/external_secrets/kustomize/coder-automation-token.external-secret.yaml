# ExternalSecret projecting the Coder automation token record into application-identity, where workloads read it through runtime-secrets. Cloud ApplicationSets point it at the cloud secret store.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-automation-token
  namespace: application-identity
  labels:
    app.kubernetes.io/component: application-identity
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secret-records
  target:
    name: coder-automation-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: coder-automation-token
        property: token
