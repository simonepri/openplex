apiVersion: v1
kind: Secret
metadata:
  name: s3-gateway-config
  namespace: secret-records
stringData:
  # keep-sorted start
  examples-access-key-id: "33333333333333333333"
  examples-secret-access-key: local-examples-secret-key
  global-replicator-access-key-id: "00000000000000000000"
  global-replicator-secret-access-key: local-global-replicator-secret-key
  org-workspace-backups-access-key-id: "11111111111111111111"
  org-workspace-backups-secret-access-key: local-org-workspace-backups-secret-key
  s3-gateway-config: |-
    {
      "identities": [
        {
          "name": "bootstrap",
          "credentials": [
            {
              "accessKey": "local-data-bootstrap",
              "secretKey": "local-data-bootstrap-secret"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "dataset-writer",
          "credentials": [
            {
              "accessKey": "local-dataset-writer",
              "secretKey": "local-dataset-writer-secret"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "dataset-reader",
          "credentials": [
            {
              "accessKey": "local-dataset-reader",
              "secretKey": "local-dataset-reader-secret"
            }
          ],
          "actions": [
            "Read:cloud-cell-home/home/examples/output/ray-data/*",
            "List:cloud-cell-home/home/examples/output/ray-data/*"
          ]
        },
        {
          "name": "dataset-outsider",
          "credentials": [
            {
              "accessKey": "local-dataset-outsider",
              "secretKey": "local-dataset-outsider-secret"
            }
          ],
          "actions": [
            "Read:cloud-cell-home/forbidden/*"
          ]
        },
        {
          "name": "storage-meta-normalizer",
          "credentials": [
            {
              "accessKey": "local-storage-meta-normalizer",
              "secretKey": "local-storage-meta-normalizer-secret"
            }
          ],
          "actions": [
            "Read:cloud-cell-meta/meta/raw/local/inventory/*",
            "Write:cloud-cell-meta/meta/inventory/*",
            "Write:cloud-cell-meta/meta/manifests/inventory/*",
            "Write:cloud-cell-meta/inventory/*"
          ]
        },
        {
          "name": "org-workspace-backups",
          "credentials": [
            {
              "accessKey": "11111111111111111111",
              "secretKey": "local-org-workspace-backups-secret-key"
            },
            {
              "accessKey": "local-org-workspace-backups",
              "secretKey": "local-org-workspace-backups-secret"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "examples",
          "credentials": [
            {
              "accessKey": "33333333333333333333",
              "secretKey": "local-examples-secret-key"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "global-replicator",
          "credentials": [
            {
              "accessKey": "00000000000000000000",
              "secretKey": "local-global-replicator-secret-key"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "storage-stats",
          "credentials": [
            {
              "accessKey": "22222222222222222222",
              "secretKey": "local-storage-stats-secret-key"
            },
            {
              "accessKey": "local-storage-stats",
              "secretKey": "local-storage-stats-secret"
            }
          ],
          "actions": [
            "List:cloud-cell-meta/inventory/*",
            "Read:cloud-cell-meta/inventory/*"
          ]
        },
        {
          "name": "buildbuddy-postgres-backup",
          "credentials": [{"accessKey": "local-buildbuddy-postgres-backup", "secretKey": "local-buildbuddy-postgres-backup-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "coder-postgres-backup",
          "credentials": [{"accessKey": "local-coder-postgres-backup", "secretKey": "local-coder-postgres-backup-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "dragonfly-postgres-backup",
          "credentials": [{"accessKey": "local-dragonfly-postgres-backup", "secretKey": "local-dragonfly-postgres-backup-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "headscale-postgres-backup",
          "credentials": [{"accessKey": "local-headscale-postgres-backup", "secretKey": "local-headscale-postgres-backup-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "signoz-postgres-backup",
          "credentials": [{"accessKey": "local-signoz-postgres-backup", "secretKey": "local-signoz-postgres-backup-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
  storage-stats-access-key-id: "22222222222222222222"
  storage-stats-secret-access-key: local-storage-stats-secret-key
  # keep-sorted end
