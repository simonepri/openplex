# Local ClusterSecretStore for External Secrets, backed by the in-cluster kubernetes provider reading application-identity Secrets via the application-oidc-reader ServiceAccount defined alongside it.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: runtime-secrets
spec:
  # The cluster store is never a team credential surface. Team stores must use
  # separate provider records and identities scoped to one team.
  conditions:
    - namespaces:
        # keep-sorted start
        - atlantis
        - cert-manager-system
        - coder
        - coder-workspace-backup-system
        - dex
        - dragonfly-system
        - envoy-gateway-system
        - headlamp
        - headscale
        - opencost
        - otel-system
        - parca
        - signoz
        - tailscale-system
        # keep-sorted end
  provider:
    kubernetes:
      remoteNamespace: application-identity
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets-system
          key: ca.crt
      auth:
        serviceAccount:
          name: application-oidc-reader
          namespace: application-identity
