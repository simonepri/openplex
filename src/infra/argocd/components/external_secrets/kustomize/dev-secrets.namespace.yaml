# Local source namespace for team-declared debug credentials. Argo adopts the namespace while local-up supplies values directly to its source Secrets.

apiVersion: v1
kind: Namespace
metadata:
  name: dev-secrets
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,ServerSideApply=true
  labels:
    app.kubernetes.io/component: dev-secrets
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: external-secrets
