# ExternalSecret synchronizing application-oidc credentials from the cluster secret store.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-oidc
  namespace: application-identity
  labels:
    app.kubernetes.io/component: application-identity
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secret-records
  target:
    name: application-oidc
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: application-oidc
