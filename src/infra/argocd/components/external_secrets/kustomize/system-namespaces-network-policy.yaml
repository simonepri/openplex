# Isolates auxiliary secret and identity namespaces (secret-records, dev-secrets, application-identity) by denying unsolicited ingress and egress.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-records-isolation
  namespace: secret-records
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-secrets-isolation
  namespace: dev-secrets
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-identity-isolation
  namespace: application-identity
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-runtime
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
