# Grants Kyverno controllers permission to generate and synchronize VerticalPodAutoscaler resources and their historical checkpoints.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:vpa-generator
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kyverno-vpa-generator
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - autoscaling.k8s.io
    resources:
      - verticalpodautoscalers
      - verticalpodautoscalercheckpoints
    verbs:
      - create
      - update
      - patch
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - create
      - update
      - patch
      - delete
      - get
      - list
      - watch
