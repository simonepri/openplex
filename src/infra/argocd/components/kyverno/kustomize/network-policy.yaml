# Allows the Kubernetes API server to reach Kyverno's admission and cleanup webhooks, and the OpenTelemetry collector to scrape Prometheus metrics.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-webhooks
  namespace: kyverno-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kyverno
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          # keep-sorted start
          - admission-controller
          - cleanup-controller
          # keep-sorted end
      - key: app.kubernetes.io/instance
        operator: In
        values: [kyverno]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 9443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-metrics
  namespace: kyverno-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - {protocol: TCP, port: 8000}
