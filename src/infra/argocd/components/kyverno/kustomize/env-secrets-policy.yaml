# Enforces that workload Pod specs project sensitive environment variables via Secret references rather than plaintext.

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ban-plaintext-env-secrets
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : []) +
          (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: sensitiveNamePattern
      expression: >-
        '(?i)^.*(_password|_secret|_token|_api_?key|_auth_?token|_credential|_private_?key|password|secret|token|api_?key|credential).*$'
    - name: safeNamePattern
      expression: >-
        '(?i)^.*(_file|_path|_dir|file|path|dir)$|(?i)^GOOGLE_APPLICATION_CREDENTIALS$'
    - name: safeUrlPattern
      expression: >-
        '(?i)^.*(_url|_uri)$'
    - name: credentialPatterns
      expression: >-
        [
          '^-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY-----',
          '\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b',
          '\\bgh[pousr]_[A-Za-z0-9_]{36,}\\b',
          '\\beyJ[A-Za-z0-9-_=]+\\.eyJ[A-Za-z0-9-_=]+\\.[A-Za-z0-9-_=]+\\b'
        ]
    - name: trivyScanner
      expression: >-
        object.metadata.namespace == 'trivy-system' &&
          has(object.spec.serviceAccountName) &&
          object.spec.serviceAccountName == 'trivy-operator' &&
          has(object.metadata.labels) &&
          'app.kubernetes.io/component' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/component'] == 'security-report-scanner' &&
          'app.kubernetes.io/managed-by' in object.metadata.labels &&
          object.metadata.labels['app.kubernetes.io/managed-by'] == 'trivy-operator'
  validations:
    - expression: >-
        variables.containers.all(c,
          !has(c.env) ||
          c.env.all(e,
            !e.name.matches(variables.sensitiveNamePattern) ||
            (!has(e.value) && !has(e.valueFrom)) ||
            (!has(e.value) && has(e.valueFrom) && has(e.valueFrom.secretKeyRef)) ||
            (variables.trivyScanner &&
              e.name == 'TRIVY_TOKEN_HEADER' &&
              !has(e.value) &&
              has(e.valueFrom) &&
              has(e.valueFrom.configMapKeyRef) &&
              e.valueFrom.configMapKeyRef.name == 'trivy-operator-trivy-config' &&
              e.valueFrom.configMapKeyRef.key == 'trivy.serverTokenHeader') ||
            (has(e.value) && (
              e.value in ['', 'true', 'false', '0', '1', 'none', 'null', 'disabled', 'enabled'] ||
              (e.name.matches(variables.safeNamePattern) && e.value.startsWith('/')) ||
              (!e.name.matches('(?i)^.*(password|secret|private_?key).*$') &&
                e.name.matches(variables.safeUrlPattern) &&
                (e.value.startsWith('http://') || e.value.startsWith('https://')))
            ))
          )
        )
      message: Sensitive environment variables must not declare plaintext values. Reference secrets via valueFrom.secretKeyRef.
    - expression: >-
        variables.containers.all(c,
          !has(c.env) ||
          c.env.all(e,
            !has(e.value) ||
            variables.credentialPatterns.all(pattern, !e.value.matches(pattern))
          )
        )
      message: Detected secret or token pattern in environment variable value. Store secrets in Kubernetes Secrets.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ban-plaintext-env-secrets
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  policyName: ban-plaintext-env-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            # keep-sorted start
            - argocd
            - external-secrets
            - kube-node-lease
            - kube-public
            - kube-system
            - kyverno-system
            - local-path-storage
            - tailscale-system
            # keep-sorted end
