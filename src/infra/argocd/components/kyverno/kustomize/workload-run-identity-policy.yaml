# Binds user-started workload names and labels to the requesting user identity; Kyverno enforces the canonical naming contract.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: coder-workload-run-identity
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-workload-run-identity
spec:
  admission: true
  background: false
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 5
  rules:
    - name: stamp-coder-workload-user
      match: &coderWorkload
        any:
          - resources:
              kinds: [Job, RayCluster, RayJob]
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: team-lane
              operations: [CREATE]
            subjects:
              - kind: User
                name: 'cluster:user:*'
      context: &workloadUserContext
        - name: requestUser
          variable:
            jmesPath: >-
              (request.userInfo.username || '') | regex_replace_all('^cluster:user:', @, '') | split(@, '@')[0] | regex_replace_all('[^a-z0-9]', @, '') | truncate(@, `15`)
            default: ''
      preconditions:
        all:
          - key: >-
              {{ regex_match('^[a-z0-9]{1,15}$', requestUser) }}
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              user: '{{ requestUser }}'
    - name: validate-coder-workload-run
      match: *coderWorkload
      context: *workloadUserContext
      validate:
        allowExistingViolations: false
        message: >-
          User-started workloads must use the submitting user identity and canonical <pipeline>-<user>-<run-id> name.
        deny:
          conditions:
            any:
              - key: >-
                  {{ regex_match('^[a-z0-9]{1,15}$', requestUser) }}
                operator: NotEquals
                value: true
              - key: >-
                  {{ request.object.metadata.labels.user || '' }}
                operator: NotEquals
                value: '{{ requestUser }}'
              - key: >-
                  {{ regex_match('^[a-z0-9]([a-z0-9-]{0,13}[a-z0-9])?$', request.object.metadata.labels.pipeline || '') }}
                operator: NotEquals
                value: true
              - key: >-
                  {{ regex_match('^[a-z0-9]([a-z0-9-]{0,13}[a-z0-9])?$', request.object.metadata.labels."run-id" || '') }}
                operator: NotEquals
                value: true
              - key: '{{ request.object.metadata.name }}'
                operator: NotEquals
                value: >-
                  {{ request.object.metadata.labels.pipeline }}-{{ requestUser }}-{{ request.object.metadata.labels."run-id" }}
