# Binds user-started workload names and labels to the exact Coder Pod whose pod-bound ServiceAccount token submitted them; Kyverno enforces the contract.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: coder-workload-run-identity
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: coder-workload-run-identity
spec:
  admission: true
  background: false
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 5
  rules:
    - name: stamp-coder-workload-user
      match: &coderWorkload
        any:
          - resources:
              kinds: [Job, RayCluster, RayJob]
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: team-lane
              operations: [CREATE]
            subjects:
              - kind: ServiceAccount
                name: coder-workspace
                namespace: '*'
      context: &callerPodContext
        - name: callerPodName
          variable:
            jmesPath: >-
              request.userInfo.extra."authentication.kubernetes.io/pod-name"[0] || ''
            default: ''
        - name: callerPodUID
          variable:
            jmesPath: >-
              request.userInfo.extra."authentication.kubernetes.io/pod-uid"[0] || ''
            default: ''
        - name: callerPodNamespace
          variable:
            jmesPath: >-
              split(request.userInfo.username, ':')[2] || ''
            default: ''
        - name: workloadNamespaceTeam
          apiCall:
            urlPath: /api/v1/namespaces/{{ request.namespace }}
            jmesPath: metadata.labels.team || ''
        - name: callerPod
          apiCall:
            urlPath: /api/v1/namespaces/{{ callerPodNamespace }}/pods/{{ callerPodName }}
            jmesPath: >-
              {namespace: metadata.namespace, uid: metadata.uid, serviceAccountName: spec.serviceAccountName, user: metadata.labels."com.coder.user.username" | regex_replace_all('[^a-z0-9]', @, '') | truncate(@, `15`)}
      preconditions:
        all:
          - key: '{{ callerPod.uid }}'
            operator: Equals
            value: '{{ callerPodUID }}'
          - key: '{{ callerPod.namespace }}'
            operator: Equals
            value: '{{ callerPodNamespace }}'
          - key: '{{ callerPodNamespace }}'
            operator: Equals
            value: 'team-{{ workloadNamespaceTeam }}-workspaces'
          - key: '{{ callerPod.serviceAccountName }}'
            operator: Equals
            value: coder-workspace
          - key: >-
              {{ regex_match('^[a-z0-9]{1,15}$', callerPod.user) }}
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              user: '{{ callerPod.user }}'
    - name: validate-coder-workload-run
      match: *coderWorkload
      context: *callerPodContext
      validate:
        allowExistingViolations: false
        message: >-
          User-started workloads must use the submitting Coder Pod identity and canonical <pipeline>-<user>-<run-id> name.
        deny:
          conditions:
            any:
              - key: '{{ callerPod.uid }}'
                operator: NotEquals
                value: '{{ callerPodUID }}'
              - key: '{{ callerPod.namespace }}'
                operator: NotEquals
                value: '{{ callerPodNamespace }}'
              - key: '{{ callerPodNamespace }}'
                operator: NotEquals
                value: 'team-{{ workloadNamespaceTeam }}-workspaces'
              - key: '{{ callerPod.serviceAccountName }}'
                operator: NotEquals
                value: coder-workspace
              - key: >-
                  {{ regex_match('^[a-z0-9]{1,15}$', callerPod.user) }}
                operator: NotEquals
                value: true
              - key: >-
                  {{ request.object.metadata.labels.user || '' }}
                operator: NotEquals
                value: '{{ callerPod.user }}'
              - key: >-
                  {{ regex_match('^[a-z0-9]([a-z0-9-]{0,13}[a-z0-9])?$', request.object.metadata.labels.pipeline || '') }}
                operator: NotEquals
                value: true
              - key: >-
                  {{ regex_match('^[a-z0-9]([a-z0-9-]{0,13}[a-z0-9])?$', request.object.metadata.labels."run-id" || '') }}
                operator: NotEquals
                value: true
              - key: '{{ request.object.metadata.name }}'
                operator: NotEquals
                value: >-
                  {{ request.object.metadata.labels.pipeline }}-{{ callerPod.user }}-{{ request.object.metadata.labels."run-id" }}
