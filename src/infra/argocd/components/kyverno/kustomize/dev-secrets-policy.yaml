# Constrains every ExternalSecret and SecretStore in team and workspace namespaces to the exact object-storage, workspace, or compile-cache projection rendered for that namespace.

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: team-dev-secrets
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets, secretstores]
  variables:
    - name: ns
      expression: >-
        (has(object.metadata.namespace) && object.metadata.namespace != '') ? object.metadata.namespace : (has(request.namespace) && request.namespace != '' ? request.namespace : namespaceObject.?metadata.name.orValue(''))
    - name: team
      expression: >-
        namespaceObject.?metadata.labels['team'].orValue('')
    # LINT.IfChange(workspace-buildbuddy-cell-label)
    - name: cell
      expression: >-
        namespaceObject.?metadata.labels['cell'].orValue('')
      # LINT.ThenChange(//src/infra/argocd/components/coder_workspaces/helm/templates/namespace.yaml:workspace-buildbuddy-cell-label)
    - name: part_of
      expression: >-
        namespaceObject.?metadata.labels['app.kubernetes.io/part-of'].orValue('')
  validations:
    - expression: >-
        (object.kind == 'ExternalSecret' &&
          (object.metadata.name in
            ['ecr-pull', 'team-s3', 'torch-compile-cache', 'workspace-backups',
              'workspace-buildbuddy-auth'] ||
           (variables.part_of == 'coder-workspaces' &&
             object.metadata.name.matches('^coder-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-s3$')))) ||
        (object.kind == 'SecretStore' &&
          object.metadata.name in
            ['team-s3', 'workspace-buildbuddy-auth'])
      message: >-
        Team secret projections must use a cluster-defined exact object name.
    - expression: >-
        object.kind != 'ExternalSecret' ||
          object.metadata.name in ['ecr-pull', 'torch-compile-cache'] ||
          !has(object.spec.dataFrom)
      message: >-
        Team ExternalSecrets must enumerate remote keys explicitly; dataFrom is not permitted.
    - expression: >-
        object.kind != 'ExternalSecret' || object.metadata.name != 'team-s3' ||
          (has(object.spec.data) && size(object.spec.data) == 6 &&
            has(object.spec.secretStoreRef) &&
            ((object.spec.secretStoreRef.kind == 'SecretStore' &&
              object.spec.secretStoreRef.name == 'team-s3') ||
             (object.spec.secretStoreRef.kind == 'ClusterSecretStore' &&
              object.spec.secretStoreRef.name == 'team-s3-' + variables.ns)) &&
            has(object.spec.target) &&
            object.spec.target.name == 'team-s3' &&
            object.spec.target.creationPolicy == 'Owner' &&
            object.spec.target.deletionPolicy == 'Retain' &&
            has(object.spec.target.template) &&
            object.spec.target.template.engineVersion == 'v2' &&
            object.spec.data.exists(entry,
              entry.secretKey == 'access_key_id' &&
              has(entry.remoteRef) && has(entry.remoteRef.property) &&
              entry.remoteRef.property == 'access_key_id') &&
            object.spec.data.exists(entry,
              entry.secretKey == 'secret_access_key' &&
              has(entry.remoteRef) && has(entry.remoteRef.property) &&
              entry.remoteRef.property == 'secret_access_key') &&
            object.spec.data.all(entry,
              has(entry.remoteRef) && has(entry.remoteRef.key) &&
              has(entry.remoteRef.property) &&
              ((entry.secretKey == 'access_key_id' &&
                  entry.remoteRef.property == 'access_key_id') ||
                (entry.secretKey == 'secret_access_key' &&
                  entry.remoteRef.property == 'secret_access_key') ||
                (entry.secretKey == 'global_access_key_id' &&
                  entry.remoteRef.property == 'global_access_key_id') ||
                (entry.secretKey == 'global_secret_access_key' &&
                  entry.remoteRef.property == 'global_secret_access_key') ||
                (entry.secretKey == 'global_endpoint' &&
                  entry.remoteRef.property == 'global_endpoint') ||
                (entry.secretKey == 'global_bucket' &&
                  entry.remoteRef.property == 'global_bucket')) &&
              (entry.remoteRef.key == 's3-team-' + variables.team ||
                entry.remoteRef.key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?-s3-team-' + variables.team + '$') ||
                (entry.remoteRef.key.startsWith('infra/data/s3-gateway/') &&
                  entry.remoteRef.key.endsWith('/team-' + variables.team)) ||
                (entry.remoteRef.key.startsWith('infra-data-s3-gateway-') &&
                  entry.remoteRef.key.endsWith('-team-' + variables.team)) ||
                (entry.remoteRef.key.startsWith('s3-gateway-') &&
                  entry.remoteRef.key.endsWith('-team-' + variables.team)))))
      message: >-
        Team object-storage ExternalSecrets must project only that team's exact gateway record.
    - expression: >-
        object.kind != 'ExternalSecret' ||
          !has(object.spec.secretStoreRef) ||
          object.spec.secretStoreRef.kind != 'ClusterSecretStore' ||
          object.spec.secretStoreRef.name != 'team-s3-' + variables.ns ||
          (object.metadata.name == 'team-s3' &&
            has(object.spec.data) &&
            object.spec.data.all(entry,
              has(entry.remoteRef) && has(entry.remoteRef.key) &&
              (entry.remoteRef.key == 's3-team-' + variables.team ||
                entry.remoteRef.key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?-s3-team-' + variables.team + '$'))))
      message: >-
        ExternalSecrets in team namespaces referencing team-s3 stores may only reference their own team S3 credentials.
    - expression: >-
        object.kind != 'SecretStore' || object.metadata.name != 'team-s3' ||
          (((has(object.spec.provider.aws) ? 1 : 0) +
              (has(object.spec.provider.gcpsm) ? 1 : 0) +
              (has(object.spec.provider.kubernetes) ? 1 : 0) == 1) &&
            ((has(object.spec.provider.aws) &&
                object.spec.provider.aws.service == 'SecretsManager' &&
                has(object.spec.provider.aws.region) &&
                has(object.spec.provider.aws.auth) &&
                has(object.spec.provider.aws.auth.jwt) &&
                has(object.spec.provider.aws.auth.jwt.serviceAccountRef) &&
                object.spec.provider.aws.auth.jwt.serviceAccountRef.name in
                  ['team-s3', 'workflow']) ||
              (has(object.spec.provider.gcpsm) &&
                has(object.spec.provider.gcpsm.projectID) &&
                has(object.spec.provider.gcpsm.auth) &&
                has(object.spec.provider.gcpsm.auth.workloadIdentity) &&
                has(object.spec.provider.gcpsm.auth.workloadIdentity.serviceAccountRef) &&
                object.spec.provider.gcpsm.auth.workloadIdentity.serviceAccountRef.name in
                  ['team-s3', 'workflow']) ||
              (has(object.spec.provider.kubernetes) &&
                object.spec.provider.kubernetes.remoteNamespace == 'secret-records' &&
                object.spec.provider.kubernetes.server.url == 'https://kubernetes.default.svc' &&
                has(object.spec.provider.kubernetes.auth) &&
                has(object.spec.provider.kubernetes.auth.serviceAccount) &&
                object.spec.provider.kubernetes.auth.serviceAccount.name in
                  ['team-s3', 'workflow'])))
      message: >-
        Team object-storage SecretStores must use exactly one approved provider configuration.
    # LINT.IfChange(workspace-buildbuddy-auth-secret-projection)
    - expression: >-
        object.kind != 'ExternalSecret' ||
          object.metadata.name != 'workspace-buildbuddy-auth' ||
          (variables.cell.matches('^cell-[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$') &&
            has(object.spec.refreshInterval) && object.spec.refreshInterval == '1h' &&
            has(object.spec.secretStoreRef) &&
            object.spec.secretStoreRef.kind == 'SecretStore' &&
            object.spec.secretStoreRef.name == 'workspace-buildbuddy-auth' &&
            has(object.spec.target) &&
            object.spec.target.name == 'workspace-buildbuddy-auth' &&
            object.spec.target.creationPolicy == 'Owner' &&
            object.spec.target.deletionPolicy == 'Retain' &&
            has(object.spec.target.template) &&
            object.spec.target.template.engineVersion == 'v2' &&
            object.spec.target.template.mergePolicy == 'Replace' &&
            object.spec.target.template.type == 'Opaque' &&
            has(object.spec.target.template.data) &&
            size(object.spec.target.template.data) == 1 &&
            object.spec.target.template.data['credentials.bazelrc'] ==
              'build --remote_header=x-buildbuddy-api-key={{ .cache_api_key }}\n' +
              'build --remote_cache_header=x-buildbuddy-api-key={{ .cache_api_key }}\n' +
              'build --bes_header=x-buildbuddy-api-key={{ .bes_api_key }}' &&
            has(object.spec.data) && size(object.spec.data) == 2 &&
            object.spec.data.exists(entry,
              entry.secretKey == 'cache_api_key' &&
              entry.remoteRef.key == variables.cell + '-workspaces-buildbuddy-auth' &&
              entry.remoteRef.property == 'cache_api_key') &&
            object.spec.data.exists(entry,
              entry.secretKey == 'bes_api_key' &&
              entry.remoteRef.key == variables.cell + '-workspaces-buildbuddy-auth' &&
              entry.remoteRef.property == 'bes_api_key') &&
            object.spec.data.all(entry,
              has(entry.remoteRef) && has(entry.remoteRef.key) &&
              has(entry.remoteRef.property) &&
              entry.remoteRef.key == variables.cell + '-workspaces-buildbuddy-auth' &&
              ((entry.secretKey == 'cache_api_key' &&
                  entry.remoteRef.property == 'cache_api_key') ||
                (entry.secretKey == 'bes_api_key' &&
                  entry.remoteRef.property == 'bes_api_key'))))
      message: >-
        Team BuildBuddy credentials must project only the current cell's purpose-separated keys.
    - expression: >-
        object.kind != 'SecretStore' ||
          object.metadata.name != 'workspace-buildbuddy-auth' ||
          (((has(object.spec.provider.aws) ? 1 : 0) +
              (has(object.spec.provider.gcpsm) ? 1 : 0) +
              (has(object.spec.provider.kubernetes) ? 1 : 0) == 1) &&
            ((has(object.spec.provider.aws) &&
                object.spec.provider.aws.service == 'SecretsManager' &&
                has(object.spec.provider.aws.region) &&
                !has(object.spec.provider.aws.auth)) ||
              (has(object.spec.provider.gcpsm) &&
                has(object.spec.provider.gcpsm.projectID) &&
                !has(object.spec.provider.gcpsm.auth)) ||
              (has(object.spec.provider.kubernetes) &&
                object.spec.provider.kubernetes.remoteNamespace == 'secret-records' &&
                object.spec.provider.kubernetes.server.url == 'https://kubernetes.default.svc' &&
                object.spec.provider.kubernetes.server.caProvider.type == 'ConfigMap' &&
                object.spec.provider.kubernetes.server.caProvider.name == 'kube-root-ca.crt' &&
                object.spec.provider.kubernetes.server.caProvider.key == 'ca.crt' &&
                object.spec.provider.kubernetes.auth.serviceAccount.name ==
                  'workspace-buildbuddy-auth')))
      message: >-
        Team BuildBuddy SecretStores must use exactly one approved provider configuration.
    # LINT.ThenChange(//src/infra/argocd/components/coder_workspaces/helm/templates/buildbuddy-auth.yaml:workspace-buildbuddy-auth-secret-projection)
    # LINT.IfChange(torch-compile-cache-secret-projection)
    - expression: >-
        object.kind != 'ExternalSecret' ||
          object.metadata.name != 'torch-compile-cache' ||
          (has(object.spec.refreshPolicy) &&
            object.spec.refreshPolicy == 'CreatedOnce' &&
            !has(object.spec.secretStoreRef) && !has(object.spec.data) &&
            has(object.spec.dataFrom) && size(object.spec.dataFrom) == 1 &&
            !has(object.spec.dataFrom[0].extract) &&
            !has(object.spec.dataFrom[0].find) &&
            has(object.spec.dataFrom[0].sourceRef) &&
            !has(object.spec.dataFrom[0].sourceRef.storeRef) &&
            has(object.spec.dataFrom[0].sourceRef.generatorRef) &&
            object.spec.dataFrom[0].sourceRef.generatorRef.apiVersion ==
              'generators.external-secrets.io/v1alpha1' &&
            object.spec.dataFrom[0].sourceRef.generatorRef.kind == 'Password' &&
            object.spec.dataFrom[0].sourceRef.generatorRef.name ==
              'torch-compile-cache' &&
            has(object.spec.dataFrom[0].rewrite) &&
            size(object.spec.dataFrom[0].rewrite) == 1 &&
            has(object.spec.dataFrom[0].rewrite[0].regexp) &&
            !has(object.spec.dataFrom[0].rewrite[0].merge) &&
            !has(object.spec.dataFrom[0].rewrite[0].transform) &&
            object.spec.dataFrom[0].rewrite[0].regexp.source == 'password' &&
            object.spec.dataFrom[0].rewrite[0].regexp.target == 'torch' &&
            has(object.spec.target) &&
            object.spec.target.name == 'torch-compile-cache' &&
            object.spec.target.creationPolicy == 'Owner' &&
            object.spec.target.deletionPolicy == 'Retain' &&
            has(object.spec.target.template) &&
            object.spec.target.template.engineVersion == 'v2' &&
            has(object.spec.target.template.metadata) &&
            has(object.spec.target.template.metadata.labels) &&
            object.spec.target.template.metadata.labels[
              'app.kubernetes.io/component'] == 'runtime-secret' &&
            object.spec.target.template.metadata.labels[
              'app.kubernetes.io/managed-by'] == 'external-secrets' &&
            object.spec.target.template.metadata.labels[
              'app.kubernetes.io/name'] == 'torch-compile-cache' &&
            has(object.spec.target.template.data) &&
            size(object.spec.target.template.data) == 2 &&
            object.spec.target.template.data['password'] == '{{ .torch }}' &&
            object.spec.target.template.data['redis-url'] ==
              'redis://torch:{{ .torch }}@torch-compile-cache:6379/0?socket_connect_timeout=2&socket_timeout=2&retry_on_timeout=1&health_check_interval=30')
      message: >-
        Team compile-cache ExternalSecrets must use the exact Password generator and target.
      # LINT.ThenChange(//src/infra/argocd/components/torch_compile_cache/kustomize/credentials.yaml:torch-compile-cache-secret-projection)
    # LINT.IfChange(dev-workspace-secret-projection)
    - expression: >-
        object.kind != 'ExternalSecret' ||
          object.metadata.name != 'workspace-backups' ||
          (has(object.spec.data) && size(object.spec.data) == 2 &&
            has(object.spec.secretStoreRef) &&
            object.spec.secretStoreRef.kind == 'ClusterSecretStore' &&
            object.spec.secretStoreRef.name == 'org-workspace-backups-workspaces' &&
            has(object.spec.target) &&
            object.spec.target.name == 'workspace-backups' &&
            object.spec.target.creationPolicy == 'Owner' &&
            object.spec.target.deletionPolicy == 'Retain' &&
            has(object.spec.target.template) &&
            object.spec.target.template.engineVersion == 'v2' &&
            has(object.spec.target.template.data) &&
            size(object.spec.target.template.data) == 2 &&
            object.spec.target.template.data['access_key_id'] == '{{ .access_key_id }}' &&
            object.spec.target.template.data['secret_access_key'] == '{{ .secret_access_key }}' &&
            object.spec.data.exists(entry, entry.secretKey == 'access_key_id') &&
            object.spec.data.exists(entry, entry.secretKey == 'secret_access_key') &&
            object.spec.data.all(entry,
              has(entry.remoteRef) && has(entry.remoteRef.key) &&
              has(entry.remoteRef.property) &&
              entry.secretKey in ['access_key_id', 'secret_access_key'] &&
              entry.remoteRef.property == entry.secretKey &&
              entry.remoteRef.key in
                ['s3-org-workspace-backups', variables.cell + '-s3-org-workspace-backups']))
      message: >-
        Workspace-backup ExternalSecrets must use the exact organization projection.
      # LINT.ThenChange(//src/infra/argocd/components/coder_workspaces/helm/templates/workspace-backups.yaml:dev-workspace-secret-projection,//src/infra/definitions/workspaces/templates/dev/deployment.tf:dev-workspace-secret-projection)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: team-dev-secrets
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  policyName: team-dev-secrets
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: app.kubernetes.io/part-of, operator: In, values: [coder-workspaces, team-lane]}
---
# Restricts S3 gateway configuration secrets to the s3-system namespace.

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s3-gateway-config-isolation
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  validations:
    - expression: >-
        (has(object.metadata.namespace) ? object.metadata.namespace : request.namespace) == 's3-system' || ((has(object.metadata.namespace) ? object.metadata.namespace : request.namespace) == 'signoz' &&
          object.metadata.name == 'signoz-clickhouse-storage-stats-gateway-auth' &&
          has(object.spec.secretStoreRef) &&
          object.spec.secretStoreRef.kind == 'ClusterSecretStore' &&
          object.spec.secretStoreRef.name == 'aws-secrets-manager' &&
          has(object.spec.target) &&
          object.spec.target.name == 'signoz-clickhouse-storage-stats-gateway-auth' &&
          has(object.spec.data) && size(object.spec.data) == 2 &&
          (!has(object.spec.dataFrom) || size(object.spec.dataFrom) == 0) &&
          object.spec.data.exists(entry, entry.secretKey == 'access-key-id' &&
            has(entry.remoteRef) && has(entry.remoteRef.key) && has(entry.remoteRef.property) &&
            entry.remoteRef.key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?-s3-gateway-config$') &&
            entry.remoteRef.property == 'storage-stats-access-key-id') &&
          object.spec.data.exists(entry, entry.secretKey == 'secret-access-key' &&
            has(entry.remoteRef) && has(entry.remoteRef.key) && has(entry.remoteRef.property) &&
            entry.remoteRef.key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?-s3-gateway-config$') &&
            entry.remoteRef.property == 'storage-stats-secret-access-key') &&
          object.spec.data.all(entry,
            has(entry.remoteRef) && has(entry.remoteRef.property) &&
            ((entry.secretKey == 'access-key-id' && entry.remoteRef.property == 'storage-stats-access-key-id') ||
             (entry.secretKey == 'secret-access-key' && entry.remoteRef.property == 'storage-stats-secret-access-key'))
          )) || ((!has(object.spec.data) || object.spec.data.all(entry,
          !has(entry.remoteRef) || !has(entry.remoteRef.key) ||
          (!entry.remoteRef.key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?-s3-gateway-config$') &&
           entry.remoteRef.key != 's3-gateway-config')
        )) && (!has(object.spec.dataFrom) || object.spec.dataFrom.all(source,
          !has(source.extract) || !has(source.extract.key) ||
          (!source.extract.key.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?-s3-gateway-config$') &&
           source.extract.key != 's3-gateway-config')
        )))
      message: >-
        Only s3-system may read S3 gateway configuration secrets, except for the exact Signoz storage stats projection.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s3-gateway-config-isolation
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  policyName: s3-gateway-config-isolation
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - s3-system
