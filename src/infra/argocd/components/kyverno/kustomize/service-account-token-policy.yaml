# Requires newly admitted workload pods in non-system namespaces to declare their service account token mount explicitly, on the Pod or its ServiceAccount, so no pod inherits the implicit default mount.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: service-account-token-hardening
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  admission: true
  background: false
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 5
  rules:
    - name: require-automount-service-account-token-false
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
      exclude:
        any:
          - resources:
              namespaces:
                # keep-sorted start
                - argocd
                - cnpg-system
                - csi-rclone
                - dragonfly-system
                - envoy-gateway-system
                - gpu-system
                - karpenter-system
                - keda-system
                - kube-node-lease
                - kube-public
                - kube-system
                - kuberay-system
                - kueue-system
                - kyverno-system
                - local-path-storage
                - tailscale-system
                - vpa
                - vpa-system
                # keep-sorted end
          - resources:
              selector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
      preconditions:
        all:
          - key: "{{ to_string(request.object.spec.automountServiceAccountToken) }}"
            operator: NotEquals
            value: "false"
          - key: "{{ to_string(request.object.spec.automountServiceAccountToken) }}"
            operator: NotEquals
            value: "true"
          - key: '{{ request.object.metadata.annotations."automount-service-account-token" || `""` }}'
            operator: NotEquals
            value: "true"
      context:
        - name: targetServiceAccountName
          variable:
            jmesPath: request.object.spec.serviceAccountName || 'default'
        - name: serviceAccount
          apiCall:
            method: GET
            urlPath: /api/v1/namespaces/{{ request.namespace }}/serviceaccounts/{{ targetServiceAccountName }}
            jmesPath: '@'
            default: {}
      validate:
        message: >-
          Newly admitted workload Pods in non-system namespaces must set automountServiceAccountToken explicitly on the Pod or its ServiceAccount, or opt in with the automount-service-account-token annotation.
        deny:
          conditions:
            all:
              - key: "{{ to_string(serviceAccount.automountServiceAccountToken) }}"
                operator: NotEquals
                value: "false"
              - key: "{{ to_string(serviceAccount.automountServiceAccountToken) }}"
                operator: NotEquals
                value: "true"
              - key: '{{ serviceAccount.metadata.annotations."automount-service-account-token" || `""` }}'
                operator: NotEquals
                value: "true"
