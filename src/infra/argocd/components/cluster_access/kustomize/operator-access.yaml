# ClusterRole and binding granting operators cluster observation and approved management actions.

# the subject group name is paired with argo-bootstrap Terraform via LINT.IfChange.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-operator
  labels:
    app.kubernetes.io/component: human-access
    app.kubernetes.io/managed-by: argocd
rules:
  # LINT.IfChange(headlamp-cluster-operator-actions)
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - resourcequotas
      - services
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ['prometheus-api-bridge:9090']
    verbs: [get]
  # Eviction preserves PodDisruptionBudget and graceful-termination semantics;
  # operators never receive raw Pod deletion.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources:
      - csidrivers
      - csinodes
      - storageclasses
      - volumeattachments
      - volumeattributesclasses
    verbs: [get, list, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses, volumesnapshotcontents, volumesnapshots]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews, selfsubjectrulesreviews]
    verbs: [create]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, grpcroutes, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources:
      - clusterqueues
      - cohorts
      - localqueues
      - resourceflavors
      - topologies
      - workloads
      - workloadpriorityclasses
    verbs: [get, list, watch]
  - apiGroups: [ray.io]
    resources: [rayclusters, rayjobs, rayservices]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates, clusterissuers, issuers]
    verbs: [get, list, watch]
  - apiGroups: [acme.cert-manager.io]
    resources: [challenges, orders]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.sh]
    resources: [nodeclaims, nodeclasses, nodepools]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.k8s.aws]
    resources: [ec2nodeclasses]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.k8s.gcp]
    resources: [gcenodeclasses]
    verbs: [get, list, watch]
  - apiGroups: [keda.sh]
    resources: [clustertriggerauthentications, scaledjobs, scaledobjects, triggerauthentications]
    verbs: [get, list, watch]
  - apiGroups: [kyverno.io]
    resources:
      - admissionreports
      - backgroundscanreports
      - cleanuppolicies
      - clusteradmissionreports
      - clusterbackgroundscanreports
      - clustercleanuppolicies
      - clusterpolicies
      - policies
      - policyexceptions
    verbs: [get, list, watch]
  - apiGroups: [policies.kyverno.io]
    resources: [deletingpolicies, generatingpolicies, imagevalidatingpolicies, mutatingpolicies, validatingpolicies]
    verbs: [get, list, watch]
  - apiGroups: [reports.kyverno.io]
    resources: [clusterephemeralreports, ephemeralreports]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io]
    resources: [clusterpolicyreports, policyreports]
    verbs: [get, list, watch]
  - apiGroups: [aquasecurity.github.io]
    resources:
      - clustercompliancereports
      - clusterconfigauditreports
      - clusterinfraassessmentreports
      - clusterrbacassessmentreports
      - clustersbomreports
      - clustervulnerabilityreports
      - configauditreports
      - exposedsecretreports
      - infraassessmentreports
      - rbacassessmentreports
      - sbomreports
      - vulnerabilityreports
    verbs: [get, list, watch]
  - apiGroups: [spdx.softwarecomposition.kubescape.io]
    resources:
      - applicationprofiles
      - configurationscansummaries
      - generatednetworkpolicies
      - knownservers
      - networkneighborhoods
      - openvulnerabilityexchangecontainers
      - sbomsyftfiltereds
      - sbomsyfts
      - vulnerabilitymanifests
      - vulnerabilitymanifestsummaries
      - vulnerabilitysummaries
      - workloadconfigurationscans
      - workloadconfigurationscansummaries
    verbs: [get, list, watch]
  - apiGroups: [kubescape.io]
    resources: [clustersecurityexceptions, rules, runtimerulealertbindings, securityexceptions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ['opencost:http-ui']
    verbs: [get]
    # LINT.ThenChange(//src/infra/argocd/components/kube_oidc_proxy/kustomize/rbac.yaml:headlamp-constrained-actions)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-operators
  labels:
    app.kubernetes.io/component: human-access
    app.kubernetes.io/managed-by: argocd
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: cluster:group:operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-operator
