# Configures base Helm values for the Vertical Pod Autoscaler, applied on selected ctrl and cell registrations; the recommender persists history in Kubernetes checkpoints.

fullnameOverride: vpa
commonLabels: {}
rbac:
  create: true
  extraRules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch"]
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  readOnlyRootFilesystem: true
  seccompProfile: {type: RuntimeDefault}
admissionController:
  extraArgs:
    - --feature-gates=InPlace=true
  image:
    repository: registry.k8s.io/autoscaling/vpa-admission-controller
    tag: 1.8.0@sha256:3d94f53e4c5a6891b8b32af545dda975e45842486432b69475afaf8df278d23d
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: admission-controller
            topologyKey: kubernetes.io/hostname
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  replicas: 2
  certGen:
    image:
      repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
      tag: v20231011-8b53cabe0@sha256:a7943503b45d552785aa3b5e457f169a5661fb94d82b8a3373bcd9ebaf9aac80
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "8944"
    signoz.io/path: /metrics
  priorityClassName: system-cluster-critical
  resources: &vpaResources
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 512Mi}
  tolerations: &controlPlaneTolerations
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
recommender:
  image:
    repository: registry.k8s.io/autoscaling/vpa-recommender
    tag: 1.8.0@sha256:e743e3a7e58a614f850063dba5df88eec5a19cf4cc43edb2050248df2d7dd8d3
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: recommender
            topologyKey: kubernetes.io/hostname
  leaderElection: {enabled: true}
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  replicas: 2
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "8942"
    signoz.io/path: /metrics
  priorityClassName: system-cluster-critical
  resources: *vpaResources
  tolerations: *controlPlaneTolerations
  # Native checkpoints preserve recommendations across telemetry backend outages.
  # LINT.IfChange(vpa_recommender_history)
  # Minimal-profile 10m CPU and 32Mi memory floors retain these history settings; its recommender runs every 5m.
  extraArgs:
    - --storage=checkpoint
    - --cpu-histogram-decay-half-life=8h
    - --memory-histogram-decay-half-life=8h
    - --memory-aggregation-interval=8h
    - --recommender-interval=1m
    - --checkpoints-timeout=45s
    - --v=2
    # LINT.ThenChange(//src/infra/argocd/apps/profiles.yaml:vpa_recommender_history)
updater:
  image:
    repository: registry.k8s.io/autoscaling/vpa-updater
    tag: 1.8.0@sha256:1d0229e52f90f645f1ee2e86ddfac8f451d166777c2aab066b9c5ab5e8bc5d5c
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: updater
            topologyKey: kubernetes.io/hostname
  leaderElection: {enabled: true}
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  replicas: 2
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "8943"
    signoz.io/path: /metrics
  priorityClassName: system-cluster-critical
  resources: *vpaResources
  tolerations: *controlPlaneTolerations
  # Minimal-profile InPlace updates use a shorter startup settling period.
  # LINT.IfChange(vpa_updater_timing)
  extraArgs:
    - --feature-gates=InPlace=true
    - --in-place-skip-disruption-budget=true
    - --min-replicas=1
    - --in-recommendation-bounds-eviction-lifetime-threshold=1h
    - --pod-update-threshold=0.15
    - --updater-interval=1m
    - --v=2
  # LINT.ThenChange(//src/infra/argocd/apps/profiles.yaml:vpa_updater_timing)
