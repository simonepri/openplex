# Routes the cell-qualified OIDC SNI through the shared Floci Gateway without terminating the proxy's component-owned serving certificate.

apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: external-dns-source
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kube-oidc-proxy
    app.kubernetes.io/part-of: headlamp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private-access
      namespace: envoy-gateway-system
      sectionName: kube-oidc-tls
  hostnames:
    - kube-oidc-proxy.invalid
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kube-oidc-proxy
          port: 443
          weight: 1
