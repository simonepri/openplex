# Scoped trust bundle for the Dex issuer in the control cluster. Cell ApplicationSets replace the source with their imported control-cluster CA.

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: kube-oidc-proxy-control-ca
  labels:
    app.kubernetes.io/component: oidc-authenticator
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kube-oidc-proxy-control-ca
    app.kubernetes.io/part-of: headlamp
spec:
  sources:
    - secret: {name: cluster-local-ca, key: ca.crt}
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/managed-by: trust-manager
          app.kubernetes.io/name: kube-oidc-proxy-control-ca
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-oidc-proxy-system}
