# VerticalPodAutoscaler sizing (Initial mode) for kube-oidc-proxy. Sizes proxy request memory and CPU upon pod creation without disrupting running connections.

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kube-oidc-proxy
  namespace: kube-oidc-proxy-system
  labels:
    app.kubernetes.io/component: oidc-authenticator
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: kube-oidc-proxy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kube-oidc-proxy
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: kube-oidc-proxy
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: "1"
          memory: 512Mi
