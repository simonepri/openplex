# AWS Karpenter EC2NodeClass dynamic-gpu for GPU workloads with RAID0 instance storage using AL2023 and eStargz snapshotter.

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: dynamic-gpu
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceProfile: configured-by-applicationset
  # Cells run the VPC CNI with prefix delegation, so pod density is set here rather than by the ENI address count.
  kubelet:
    maxPods: 110
  amiSelectorTerms: [{alias: al2023@v20260520}]
  # BEGIN GENERATED AWS ESTARGZ
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: text/cloud-config; charset="us-ascii"

    #cloud-config
    write_files:
      - path: /etc/containerd-stargz-grpc/config.toml
        owner: root:root
        permissions: '0644'
        content: |
          # Configures node-local eStargz snapshotter to reuse kubelet registry credentials during AL2023 bootstrap.

          [cri_keychain]
          enable_keychain = true
          image_service_path = "/run/containerd/containerd.sock"

          [[resolver.host."000000000000.dkr.ecr.region.amazonaws.com".mirrors]]
          host = "127.0.0.1:4001"
          insecure = true
      - path: /etc/systemd/system/stargz-snapshotter.service
        owner: root:root
        permissions: '0644'
        content: |
          # Defines systemd service unit to start AWS eStargz snapshotter before containerd during node bootstrap.

          [Unit]
          Description=Containerd eStargz snapshotter
          Wants=network-online.target
          After=network-online.target
          Before=containerd.service

          [Service]
          Type=notify
          Environment=HOME=/root
          ExecStart=/usr/local/bin/containerd-stargz-grpc --config=/etc/containerd-stargz-grpc/config.toml
          Restart=always
          RestartSec=1
          RuntimeDirectory=containerd-stargz-grpc
          StateDirectory=containerd-stargz-grpc

          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/containerd.service.d/10-stargz.conf
        owner: root:root
        permissions: '0644'
        content: |
          # Configures containerd systemd drop-in to depend on AWS eStargz snapshotter during AL2023 bootstrap.

          [Unit]
          Wants=stargz-snapshotter.service
          After=stargz-snapshotter.service
      - path: /etc/systemd/system/dragonfly-prepull.service
        owner: root:root
        permissions: '0644'
        content: |
          # Pre-pulls Dragonfly container images to warm node cache before model image downloads.

          [Unit]
          Description=Pre-pull Dragonfly images so dfdaemon is up before the first model pull
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          TimeoutStartSec=600
          ExecStart=/usr/bin/bash -c 'until ctr version >/dev/null 2>&1; do sleep 1; done; REGISTRY="000000000000.dkr.ecr.region.amazonaws.com"; REGION="$$(echo "$$REGISTRY" | cut -d. -f4)"; TOKEN="$$(aws ecr get-login-password --region "$$REGION")"; for img in "$$REGISTRY/mirror/busybox:1.38.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0" "$$REGISTRY/src/third_party/dragonflyoss/client:upstream-3904607@sha256:ecb877a7e658c7d76b1318b4266ecb1f2e264f8c5bcb44ffa7045b87a887a856"; do ctr -n k8s.io image pull --snapshotter stargz --user "AWS:$$TOKEN" "$$img"; done'

          [Install]
          WantedBy=multi-user.target
    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/usr/bin/env bash
    # Installs and verifies pinned AWS eStargz snapshotter before nodeadm starts containerd and kubelet.

    set -euo pipefail

    readonly stargz_version="v0.18.2"
    readonly stargz_sha256="515a3c3af0012f192ace31fb79e910597977c77227e976680aeaaef6e9ae50a9"
    readonly stargz_url="https://github.com/containerd/stargz-snapshotter/releases/download/${stargz_version}/stargz-snapshotter-${stargz_version}-linux-amd64.tar.gz"
    readonly install_dir="${INSTALL_DIR:-/usr/local/bin}"
    readonly tmp_dir="${TMP_DIR:-/tmp}"
    readonly stargz_tarball="${tmp_dir}/stargz.tgz"
    readonly stargz_socket="${STARGZ_SOCKET:-/run/containerd-stargz-grpc/containerd-stargz-grpc.sock}"
    readonly stargz_root="${STARGZ_ROOT:-/var/lib/containerd-stargz-grpc}"

    # shellcheck disable=SC2329 # Invoked by the EXIT trap.
    cleanup() {
      rm -f "${stargz_tarball}"
    }
    trap cleanup EXIT

    if [[ ! -x "${install_dir}/containerd-stargz-grpc" || ! -x "${install_dir}/ctr-remote" ]]; then
      curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused -o "${stargz_tarball}" "${stargz_url}"
      echo "${stargz_sha256}  ${stargz_tarball}" | sha256sum -c -
      tar -C "${install_dir}" -xzf "${stargz_tarball}" containerd-stargz-grpc ctr-remote
      chmod +x "${install_dir}/containerd-stargz-grpc" "${install_dir}/ctr-remote"
    fi

    mkdir -p "${stargz_root}"

    systemctl daemon-reload
    systemctl enable --now stargz-snapshotter.service
    for _ in {1..60}; do
      if systemctl is-active --quiet stargz-snapshotter.service && [[ -S ${stargz_socket} ]]; then
        exit 0
      fi
      sleep 1
    done

    systemctl status --no-pager stargz-snapshotter.service >&2 || true
    exit 1
    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/usr/bin/env bash
    # shellcheck shell=bash
    #
    # Brings up the Dragonfly prepull unit, embedded into the userData shellscript MIME part.
    # The prepull warms the dfdaemon image the moment containerd is up, so dfdaemon serves
    # 127.0.0.1:4001 before the model image's first lazy resolve instead of losing that race and
    # forcing a fallback pull.

    set -euo pipefail

    # The prepull unit mints ECR creds via the aws CLI; fail loud now if it is absent rather than
    # silently losing the dfdaemon-before-first-resolve race on every boot.
    command -v aws >/dev/null || {
      echo "dragonfly-prepull: aws CLI not found on PATH; required to mint ECR pull creds" >&2
      exit 1
    }

    # Pick up the write_files-placed unit before enabling it.
    systemctl daemon-reload
    # --no-block: the unit waits for containerd, which starts only after cloud-init finishes — a
    # blocking start here would deadlock node boot.
    systemctl enable dragonfly-prepull.service
    systemctl start --no-block dragonfly-prepull.service
    --//
    Content-Type: application/node.eks.aws

    # Selects the eStargz CRI path for AL2023 Karpenter nodes. nodeadm merges this fragment with the cluster bootstrap NodeConfig generated by Karpenter.

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      containerd:
        config: |
          [plugins."io.containerd.cri.v1.images"]
            snapshotter = "stargz"
            disable_snapshot_annotations = false
            use_local_image_pull = true

          [[plugins."io.containerd.transfer.v1.local".unpack_config]]
            platform = "linux/amd64"
            snapshotter = "stargz"

          [[plugins."io.containerd.transfer.v1.local".unpack_config]]
            platform = "linux/amd64"
            snapshotter = "overlayfs"

          [proxy_plugins.stargz]
            type = "snapshot"
            address = "/run/containerd-stargz-grpc/containerd-stargz-grpc.sock"
            [proxy_plugins.stargz.exports]
              root = "/var/lib/containerd-stargz-grpc"
      kubelet:
        config:
          failSwapOn: false
          memorySwap:
            swapBehavior: LimitedSwap
        flags:
          - --image-service-endpoint=unix:///run/containerd-stargz-grpc/containerd-stargz-grpc.sock
    --//--
  # END GENERATED AWS ESTARGZ
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: configured-by-applicationset}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: configured-by-applicationset}}]
  instanceStorePolicy: RAID0
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 200Gi
        volumeType: gp3
  tags:
    cluster: configured-by-applicationset
    component: kubernetes-worker
    cost-center: shared-infrastructure
    environment: production
    karpenter.sh/discovery: configured-by-applicationset
