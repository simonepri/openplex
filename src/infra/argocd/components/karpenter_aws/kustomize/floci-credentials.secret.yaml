# Local Floci dummy AWS credentials for Karpenter controller connectivity.

apiVersion: v1
kind: Secret
metadata:
  name: karpenter-aws-floci-credentials
  namespace: karpenter-system
  labels:
    app.kubernetes.io/component: karpenter
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: local-access-key
  AWS_SECRET_ACCESS_KEY: local-secret-key
