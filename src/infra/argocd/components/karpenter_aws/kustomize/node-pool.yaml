# Shared CPU and NVIDIA GPU EC2NodeClasses plus on-demand/spot NodePools for AWS cells. GPU pools require local NVMe and consolidate only after empty.

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: dynamic-cpu
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceProfile: configured-by-applicationset
  amiSelectorTerms: [{alias: al2023@v20260520}]
  # BEGIN GENERATED AWS ESTARGZ
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: text/cloud-config; charset="us-ascii"

    #cloud-config
    write_files:
      - path: /etc/containerd-stargz-grpc/config.toml
        owner: root:root
        permissions: '0644'
        content: |
          # Configures the AWS node-local eStargz snapshotter to reuse kubelet registry
          # credentials. AL2023 cloud-init writes this file before nodeadm starts kubelet.

          [cri_keychain]
          enable_keychain = true
          image_service_path = "/run/containerd/containerd.sock"
      - path: /etc/systemd/system/stargz-snapshotter.service
        owner: root:root
        permissions: '0644'
        content: |
          # Starts the AWS eStargz snapshotter before containerd. AL2023 systemd consumes
          # this unit after cloud-init writes it from EC2NodeClass user data.

          [Unit]
          Description=Containerd eStargz snapshotter
          Wants=network-online.target
          After=network-online.target
          Before=containerd.service

          [Service]
          Type=notify
          Environment=HOME=/root
          ExecStart=/usr/local/bin/containerd-stargz-grpc --config=/etc/containerd-stargz-grpc/config.toml
          Restart=always
          RestartSec=1
          RuntimeDirectory=containerd-stargz-grpc
          StateDirectory=containerd-stargz-grpc

          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/containerd.service.d/10-stargz.conf
        owner: root:root
        permissions: '0644'
        content: |
          # Makes containerd depend on the AWS eStargz snapshotter. AL2023 cloud-init
          # installs this systemd drop-in before nodeadm starts the runtime.

          [Unit]
          Requires=stargz-snapshotter.service
          After=stargz-snapshotter.service
    --//
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/usr/bin/env bash
    # Installs and verifies the pinned AWS eStargz snapshotter before nodeadm starts
    # containerd and kubelet. EC2NodeClass multipart user data executes this script.

    set -euo pipefail

    readonly stargz_image="ghcr.io/containerd/stargz-snapshotter:0.18.2-kind@sha256:74cd59bda98d35bcd2e0067ccb8304e7d4ae25c9a1c8906c8d5322a3d806e441"
    readonly stargz_socket=/run/containerd-stargz-grpc/containerd-stargz-grpc.sock
    mount_dir="$(mktemp -d /tmp/stargz-mount.XXXXXX)"
    readonly mount_dir

    # shellcheck disable=SC2329 # Invoked by the EXIT trap.
    cleanup() {
      ctr images unmount "${mount_dir}" 2>/dev/null || true
      rm -rf "${mount_dir}"
    }
    trap cleanup EXIT

    # Pull and extract the snapshotter binary directly from the official OCI image
    ctr images pull "${stargz_image}"
    ctr images mount "${stargz_image}" "${mount_dir}"
    "${mount_dir}/usr/local/bin/containerd-stargz-grpc" --version
    install -m 0755 "${mount_dir}/usr/local/bin/containerd-stargz-grpc" /usr/local/bin/containerd-stargz-grpc
    ctr images unmount "${mount_dir}"
    rm -rf "${mount_dir}"

    systemctl daemon-reload
    systemctl enable --now stargz-snapshotter.service
    for _ in {1..60}; do
      if systemctl is-active --quiet stargz-snapshotter.service && [[ -S ${stargz_socket} ]]; then
        exit 0
      fi
      sleep 1
    done

    systemctl status --no-pager stargz-snapshotter.service >&2 || true
    exit 1
    --//
    Content-Type: application/node.eks.aws

    ---
    # Selects the eStargz CRI path for AL2023 Karpenter nodes. nodeadm merges this
    # fragment with the cluster bootstrap NodeConfig generated by Karpenter.

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      containerd:
        config: |
          [plugins."io.containerd.cri.v1.images"]
            snapshotter = "stargz"
            disable_snapshot_annotations = false
            use_local_image_pull = true

          [[plugins."io.containerd.transfer.v1.local".unpack_config]]
            platform = "linux/amd64"
            snapshotter = "stargz"

          [[plugins."io.containerd.transfer.v1.local".unpack_config]]
            platform = "linux/amd64"
            snapshotter = "overlayfs"

          [proxy_plugins.stargz]
            type = "snapshot"
            address = "/run/containerd-stargz-grpc/containerd-stargz-grpc.sock"
            [proxy_plugins.stargz.exports]
              root = "/var/lib/containerd-stargz-grpc"
      kubelet:
        config:
          failSwapOn: false
          memorySwap:
            swapBehavior: LimitedSwap
        flags:
          - --image-service-endpoint=unix:///run/containerd-stargz-grpc/containerd-stargz-grpc.sock
    --//--
  # END GENERATED AWS ESTARGZ
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: configured-by-applicationset}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: configured-by-applicationset}}]
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 200Gi
        volumeType: gp3
  tags:
    cluster: configured-by-applicationset
    component: kubernetes-worker
    cost-center: shared-infrastructure
    environment: production
    karpenter.sh/discovery: configured-by-applicationset
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-on-demand
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  weight: 20
  template:
    metadata:
      labels:
        cpu-capability.avx2: "true"
    spec:
      expireAfter: 720h
      terminationGracePeriod: 30m
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: dynamic-cpu}
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: kubernetes.io/os, operator: In, values: [linux]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: karpenter.k8s.aws/instance-family, operator: In, values: [c6i, c7i, m6i, m7i, r6i, r7i]}
  limits: {cpu: "2000", memory: 8Ti}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: 10%
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-spot
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  weight: 10
  template:
    metadata:
      labels:
        cpu-capability.avx2: "true"
    spec:
      expireAfter: 720h
      terminationGracePeriod: 30m
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: dynamic-cpu}
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: kubernetes.io/os, operator: In, values: [linux]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot]}
        - {key: karpenter.k8s.aws/instance-family, operator: In, values: [c6i, c7i, m6i, m7i, r6i, r7i]}
  limits: {cpu: "2000", memory: 8Ti}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: 10%
---
