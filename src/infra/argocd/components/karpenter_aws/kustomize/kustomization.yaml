# Kustomize base for AWS Karpenter: wires ordinary CPU and NVIDIA GPU node classes and pools. Rendered by AWS cell Karpenter Applications.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - floci-credentials.secret.yaml
  - gpu-node-pool.yaml
  - namespace.yaml
  - network-policy.yaml
  - node-pool.yaml
  # keep-sorted end
