# NetworkPolicy scoping Rclone CSI node plugin egress to cluster DNS and cell S3 gateways.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rclone-csi-node-egress
  namespace: csi-rclone-system
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels: {app: rclone-csi-node}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
              gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
      ports: [{port: 10080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchExpressions:
              - {key: k8s-app, operator: In, values: [kube-dns, node-local-dns]}
      ports:
        - {port: 53, protocol: TCP}
        - {port: 53, protocol: UDP}
