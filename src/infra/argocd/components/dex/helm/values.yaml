# Configures local-identity Helm values for Dex on enabled clusters, providing example users and static clients.

fullnameOverride: dex
configSecret: {create: false, name: dex-config}
env:
  DEX_SESSIONS_ENABLED: 'true'
envFrom:
  - secretRef:
      name: google-workspace-oauth
      optional: true
  # Required: confidential clients resolve their secretEnv here, and a missing secret must stop Dex rather than
  # silently reject every login.
  - secretRef:
      name: dex-client-secrets
grpc: {enabled: false}
https: {enabled: false}
image:
  # LINT.IfChange(dex-kubernetes-storage-crds)
  repository: ghcr.io/dexidp/dex
  tag: master@sha256:0ae7ade1bdf1c83f7f7ccb1935912ac4c116e3e8ecc7e7503b30bab77e7c896c
  # LINT.ThenChange(//src/infra/argocd/components/dex/kustomize/storage-crds.yaml:dex-kubernetes-storage-crds)
rbac:
  createClusterScoped: false
podAnnotations:
  # LINT.IfChange(dex-config-rollout)
  checksum/dex-config: 47712a32f92c8c808806049a276bca083986479780c87d6729026e9d5f0bef04
  # LINT.ThenChange(//src/infra/argocd/components/dex/kustomize/dex-config.secret.yaml:local-dex-static-clients)
  automount-service-account-token: 'true'
  ignore-check.kube-linter.io/read-secret-from-env-var: >-
    Dex loads Google Workspace OAuth credentials from Secret via environment.
priorityClassName: cluster-operators
serviceAccount:
  annotations:
    automount-service-account-token: 'true'
service:
  type: ClusterIP
  ports:
    http: {port: 5556}
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 100m, memory: 256Mi}
volumeMounts:
  - {name: tmp, mountPath: /tmp}
volumes:
  - name: tmp
    emptyDir: {medium: Memory, sizeLimit: 16Mi}

