# Local-identity configuration Secret for Dex. Supplies local users, static clients, and issuer settings decoupled from the Helm chart.

apiVersion: v1
kind: Secret
metadata:
  name: dex-config
  namespace: dex
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dex
type: Opaque
stringData:
  config.yaml: |
    # LINT.IfChange(local-dex-static-clients)
    issuer: https://dex.configured-by-applicationset.invalid
    storage:
      type: kubernetes
      config: {inCluster: true, crdHandling: check}
    web:
      http: '0.0.0.0:5556'
      allowedOrigins: ['*']
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
      grantTypes: [authorization_code, refresh_token, password]
    expiry:
      refreshTokens:
        # Headlamp serves every kubeconfig context from one OIDC user. Concurrent
        # cell requests may redeem the same rotating token before the first
        # response reaches every context, so Dex must accept that bounded race.
        reuseInterval: 3s
    sessions:
      absoluteLifetime: 24h
      validIfNotUsedFor: 1h
      ssoSharedWithDefault: all
    staticClients:
      - id: argocd
        name: Argo CD
        redirectURIs:
          - https://argocd.configured-by-applicationset.invalid/auth/callback
        secret: local-only-argocd
      - id: atlantis
        name: Atlantis
        redirectURIs:
          - https://atlantis.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-atlantis
      - id: buildbuddy
        name: BuildBuddy
        redirectURIs:
          - https://buildbuddy.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-buildbuddy
      - id: coder
        name: Coder
        redirectURIs:
          - https://coder.configured-by-applicationset.invalid/api/v2/users/oidc/callback
        secret: local-only-coder
      - id: dragonfly
        name: Dragonfly
        redirectURIs:
          - https://dragonfly.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-dragonfly
      - id: headlamp
        name: Headlamp
        redirectURIs:
          - https://headlamp.configured-by-applicationset.invalid/oidc-callback
        secret: local-only-headlamp
      - id: headscale
        name: Headscale
        redirectURIs:
          - https://headscale.configured-by-applicationset.invalid/oidc/callback
        secret: local-only-headscale
      - id: kargo
        name: Kargo
        public: true
        redirectURIs:
          - https://kargo.configured-by-applicationset.invalid/login
          - http://localhost:8080/auth/callback
          - http://localhost/auth/callback
      - id: kargo-cli
        name: Kargo CLI
        public: true
        redirectURIs:
          - http://127.0.0.1:8080/auth/callback
          - http://localhost:8080/auth/callback
      - id: kuberhealthy
        name: Kuberhealthy
        redirectURIs:
          - https://kuberhealthy.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-kuberhealthy
      - id: opencost
        name: OpenCost
        redirectURIs:
          - https://opencost.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-opencost
      - id: parca
        name: Parca
        redirectURIs:
          - https://parca.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-parca
      - id: ray-dashboard
        name: Ray Dashboard
        redirectURIs:
          - https://ray.cell.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-ray-dashboard
      - id: signoz
        name: SigNoz
        redirectURIs:
          - https://signoz.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-signoz
      - id: velero-ui
        name: Velero UI
        redirectURIs:
          - https://velero-ui.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-velero-ui
      - id: workspace-snapshot-catalog
        name: Workspace Snapshot Catalog
        redirectURIs:
          - https://coder-snapshots.configured-by-applicationset.invalid/oauth2/callback
          - https://snapshots.configured-by-applicationset.invalid/oauth2/callback
        secret: local-only-workspace-snapshots
    enablePasswordDB: true
    staticPasswords:
      - email: ops@configured-by-applicationset.invalid
        hash: $2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W
