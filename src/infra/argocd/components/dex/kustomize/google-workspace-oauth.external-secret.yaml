# Materializes Google Workspace OAuth credentials for Dex SSO from the platform secret store.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-workspace-oauth
  namespace: dex
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: google-workspace-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        GOOGLE_CLIENT_ID: '{{ .client_id }}'
        GOOGLE_CLIENT_SECRET: '{{ .client_secret }}'
        service-account.json: '{{ index . "service_account_json" | default "" }}'
  dataFrom:
    - extract:
        key: google-workspace-oauth

