# Kustomize base for Dex: the identity-provider NetworkPolicy rendered after External Secrets creates the shared relying-party record.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - client-secrets.external-secret.yaml
  - dex-config.secret.yaml
  - google-workspace-oauth.external-secret.yaml
  - namespace.yaml
  - network-policy.yaml
  - storage-crds.yaml
  # keep-sorted end
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "-1"}
