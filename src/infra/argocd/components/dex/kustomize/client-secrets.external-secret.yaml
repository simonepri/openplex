# Projects each confidential Dex static client secret from the application-oidc record into the environment variables named by the client's secretEnv.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-client-secrets
  namespace: dex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: dex-client-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  # LINT.IfChange(dex-client-secret-env)
  data:
    - secretKey: ARGOCD_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: argocd_client_secret}
    - secretKey: ATLANTIS_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: atlantis_client_secret}
    - secretKey: BUILDBUDDY_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: buildbuddy_client_secret}
    - secretKey: CODER_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: coder_client_secret}
    - secretKey: DRAGONFLY_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: dragonfly_client_secret}
    - secretKey: HEADLAMP_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: headlamp_client_secret}
    - secretKey: HEADSCALE_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: headscale_client_secret}
    - secretKey: KUBERHEALTHY_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: kuberhealthy_client_secret}
    - secretKey: OPENCOST_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: opencost_client_secret}
    - secretKey: PARCA_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: parca_client_secret}
    - secretKey: RAY_DASHBOARD_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: ray_dashboard_client_secret}
    - secretKey: SIGNOZ_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: signoz_client_secret}
    - secretKey: VELERO_UI_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: velero_ui_client_secret}
    - secretKey: WORKSPACE_SNAPSHOT_CATALOG_CLIENT_SECRET
      remoteRef: {key: application-oidc, property: workspace_snapshots_client_secret}
  # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:dex-client-secret-env)
