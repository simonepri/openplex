# Distributes Headlamp's trusted cluster serving CAs. The local control dispatcher adds the imported cell CA for its remote API context.

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: headlamp-cluster-ca
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: headlamp-cluster-ca
spec:
  sources:
    - secret: {name: cluster-local-ca, key: ca.crt}
  target:
    configMap:
      key: ca.crt
      metadata:
        labels:
          app.kubernetes.io/managed-by: trust-manager
          app.kubernetes.io/name: headlamp-cluster-ca
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: headlamp}
