# Materializes Headlamp OIDC client configuration Secret from the platform application-oidc record.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
    app.kubernetes.io/part-of: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: runtime-secrets
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: identity
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: headlamp
      data:
        OIDC_CALLBACK_URL: '{{ printf "%s/oidc-callback" .headlamp_external_url }}'
        OIDC_CLIENT_ID: '{{ .headlamp_client_id }}'
        OIDC_CLIENT_SECRET: '{{ .headlamp_client_secret }}'
        OIDC_ISSUER_URL: '{{ .issuer }}'
        # Headlamp must retain a refresh token after Dex's ID token expires;
        # all generated cluster contexts share this OIDC user.
        OIDC_SCOPES: '{{ printf "%s,offline_access" .scopes }}'
        config: |
          apiVersion: v1
          kind: Config
          preferences: {}
          clusters: []
          contexts: []
          current-context: ""
          users:
            - name: dex
              user:
                auth-provider:
                  name: oidc
                  config:
                    client-id: '{{ .headlamp_client_id }}'
                    client-secret: '{{ .headlamp_client_secret }}'
                    idp-issuer-url: '{{ .issuer }}'
                    scope: '{{ printf "%s,offline_access" .scopes }}'
  dataFrom:
    - extract:
        key: application-oidc
