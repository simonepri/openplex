  template:
    metadata:
      name: '{{ .nameNormalized }}-{{ .component }}'
      namespace: argocd
      annotations:
        # keep-sorted start
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        # keep-sorted end
      labels:
        # keep-sorted start
        cluster: '{{ .nameNormalized }}'
        role: ctrl
        team: global
        tier: '{{ .tier }}'
        wave: '{{ .wave }}'
        # keep-sorted end
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-ctrl
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # LINT.IfChange(sync-retry)
        # Bounded so a persistently failing sync (including hooks) ends as Failed and alerts, while ~25 minutes of
        # backoff still covers bootstrap ordering across sync waves.
        retry:
          limit: 10
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        # LINT.ThenChange(//src/infra/argocd/apps/cells.yaml:sync-retry,//src/infra/argocd/apps/teams.yaml:sync-retry)
        syncOptions:
          # keep-sorted start
          - CreateNamespace=true
          - IncludeMutationWebhook=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          # keep-sorted end
  templatePatch: |
    {{- $provider := default "" (index .metadata.labels "provider") }}
    # floci-divergence: Local development clusters default to the minimal resource profile to fit host resources.
    {{- $profileName := default (ternary "minimal" "production" (eq $provider "floci")) (index .metadata.labels "profile") }}
    {{- if not (hasKey .profiles $profileName) }}
    {{- fail (printf "unknown availability profile %q" $profileName) }}
    {{- end }}
    {{- $profile := index .profiles $profileName }}
    {{- $componentProfile := default dict (index $profile.components .component) }}
    {{- $helmValues := mergeOverwrite (deepCopy (default dict $componentProfile.helmValues)) (default dict .helmValuesObject) }}
    {{- if and (eq .component "network-isolation") (or (eq $provider "aws") (eq $provider "gcp")) }}
    {{- $namespaces := default list (index $helmValues "namespaces") }}
    {{- $namespaces = append $namespaces "external-dns-system" }}
    {{- if eq $provider "aws" }}
    {{- if ne (default "" (index .metadata.labels "karpenter")) "disabled" }}
    {{- $namespaces = append $namespaces "karpenter-system" }}
    {{- end }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "namespaces" $namespaces) }}
    {{- end }}
    {{- $annotations := default dict .metadata.annotations }}
    # BEGIN GENERATED INFRASTRUCTURE IMAGES
    {{- $infrastructureImages := dict }}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/definitions/workspaces/templates/dev" "sha256:2d01b185cc2245b736e3e85ad233665adc9d116a729f722b8c3d68c734999818" }}{{- /* tag: ci-20261008T160320Z_6563fc9f30c8 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/coder_snapshot_portal" "sha256:f256f09c2640fcd5d6d8332e2ac97695b9a4b83bfcb8b17d87bf536ab3262834" }}{{- /* tag: ci-20261008T143318Z_5d91035e4368 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/dragonfly_sso" "sha256:17d15fb97ab5e3211baad8f98b721d397c627b1b32e4e00a464ffbb5473479ff" }}{{- /* tag: ci-20261004T182245Z_386650a7bac1 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/s3_resolver/server" "sha256:53164ef4fb959865a9e58f973a18839eb3a7b85c189e2863146afe0c730ed308" }}{{- /* tag: ci-20261004T182245Z_386650a7bac1 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/workspace_backup_proxy" "sha256:38218ea6a2bc4996349551eb4cd4d83d3e1900f53ed0bcd335dd917879bccd2d" }}{{- /* tag: ci-20261008T143318Z_5d91035e4368 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/workspace_healer" "sha256:533297a2175c3b19a82aa883cf8107ad302be690c5fc9c9ab686e51f970f4247" }}{{- /* tag: ci-20261008T163536Z_0490595844d9 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/third_party/dragonflyoss/client" "sha256:ecb877a7e658c7d76b1318b4266ecb1f2e264f8c5bcb44ffa7045b87a887a856" }}{{- /* tag: upstream-3904607 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/third_party/openebs/rawfile-localpv" "sha256:d7498ff0f5380f745f740164640e042c6b2f87174f2f7a6299d43c67c75f8ff4" }}{{- /* tag: ci-20261004T182245Z_386650a7bac1 */}}
    # END GENERATED INFRASTRUCTURE IMAGES
    {{- $clusterRegistry := "" }}
    # floci-divergence: Local development clusters pull in-house infrastructure images from the local origin registry; cloud clusters pull from ECR.
    {{- if eq $provider "floci" }}
    {{- $clusterRegistry = "localhost:15100/000000000000/us-east-1" }}
    {{- else if or (eq $provider "aws") (eq $provider "gcp") }}
    {{- $clusterRegistry = default "" (index $annotations "ecr-registry") }}
    {{- end }}
    {{- $kustomizeImages := list }}
    {{- if $clusterRegistry }}
    {{- range $repo := keys $infrastructureImages | sortAlpha }}
    {{- $digest := index $infrastructureImages $repo }}
    {{- $kustomizeImages = append $kustomizeImages (printf "placeholder.invalid/%s=%s/%s@%s" $repo $clusterRegistry $repo $digest) }}
    {{- end }}
    {{- end }}
    {{- if .injectClusterName }}
    {{- if eq .component "otel-collector" }}
    {{- $extraEnvs := default list (index (default dict .helmValuesObject) "extraEnvs") }}
    {{- $extraEnvs = concat (list (dict "name" "K8S_CLUSTER_NAME" "value" .nameNormalized)) $extraEnvs }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "extraEnvs" $extraEnvs) }}
    {{- else if eq .component "signoz" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "otelCollector" (dict "additionalEnvs" (dict "K8S_CLUSTER_NAME" .nameNormalized))) }}
    {{- else }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized) }}
    {{- end }}
    {{- end }}
    {{- $repoURL := index $annotations "git-repo-url" }}
    {{- $gitTransportURL := index $annotations "git-transport-url" | default $repoURL }}
    {{- $publicDomain := default "local.internal" (index $annotations "public-domain") }}
    {{- $intranetDomain := default (printf "corp.%s" $publicDomain) (or (index $annotations "intranet-domain") (index $annotations "domain")) }}
    {{- $clusterDomain := default (printf "c.%s" $intranetDomain) (or (index $annotations "cluster-domain") (index $annotations "access-domain")) }}
    {{- $accessDomain := $clusterDomain }}
    {{- $baseDomain := printf "%s.c.%s" .nameNormalized $intranetDomain }}
    {{- $registeredCells := list }}
    {{- with or (index $annotations "registered-cells") (index $annotations "registered-cell") }}
    {{- range $c := splitList "," . }}
    {{- $trimmed := trim $c }}
    {{- if ne $trimmed "" }}
    {{- $registeredCells = append $registeredCells $trimmed }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $operatorGroupEmail := coalesce (index $annotations "operator-group-email") (index $annotations "operator-group") (printf "operators@%s" $publicDomain) }}
    {{- $googleAdminEmail := coalesce (index $annotations "google-admin-email") (index $annotations "admin-email") (printf "admin@%s" $publicDomain) }}
    {{- $hostedDomains := default (list $publicDomain) }}
    {{- with index $annotations "hosted-domains" }}
    {{- $hostedDomains = splitList "," . }}
    {{- end }}
    {{- $operatorEmails := list }}
    {{- with or (index $annotations "operator-emails") (index $annotations "operator-email") }}
    {{- range $e := splitList "," . }}
    {{- $trimmed := trim $e }}
    {{- if ne $trimmed "" }}
    {{- $operatorEmails = append $operatorEmails $trimmed }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $operatorGroups := list "operators" }}
    # floci-divergence: Local clusters do not have Google Workspace directory groups.
    {{- if and (ne $provider "floci") (ne $provider "") }}
    {{- if not (has $operatorGroupEmail $operatorGroups) }}
    {{- $operatorGroups = append $operatorGroups $operatorGroupEmail }}
    {{- end }}
    {{- range $d := $hostedDomains }}
    {{- $domainGroup := printf "operators@%s" $d }}
    {{- if not (has $domainGroup $operatorGroups) }}
    {{- $operatorGroups = append $operatorGroups $domainGroup }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .injectClusterDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "publicDomain" $publicDomain "accessAliasDomain" $clusterDomain "internalDomain" $clusterDomain) }}
    {{- end }}
    {{- if eq .component "cloud-telemetry" }}
    {{- $internalSuffixes := list "localhost" "cluster.local" $intranetDomain $clusterDomain }}
    {{- /* Cloud API names and the names the resolver search path produces. */}}
    {{- if eq $provider "aws" }}
    {{- $internalSuffixes = concat $internalSuffixes (list "amazonaws.com" "compute.internal") }}
    {{- else if eq $provider "gcp" }}
    {{- $internalSuffixes = concat $internalSuffixes (list "googleapis.com" "internal") }}
    {{- end }}
    {{- range $d := $hostedDomains }}
    {{- $internalSuffixes = append $internalSuffixes (trim $d) }}
    {{- end }}
    {{- $suffixPattern := list }}
    {{- range $d := $internalSuffixes | uniq }}
    {{- /* The collector substitutes this into an OTTL string literal, so the regex escapes are doubled. */}}
    {{- $suffixPattern = append $suffixPattern (replace "." "\\\\." $d) }}
    {{- end }}
    {{- $telemetryEnvs := list (dict "name" "INTERNAL_DNS_SUFFIXES" "value" (join "|" $suffixPattern)) (dict "name" "K8S_CLUSTER_NAME" "value" .nameNormalized) }}
    {{- if eq $provider "aws" }}
    {{- $awsRegion := coalesce (index $annotations "aws-region") (index $annotations "region") }}
    {{- if not $awsRegion }}{{ fail (printf "cloud-telemetry on %s requires the aws-region annotation" .nameNormalized) }}{{- end }}
    {{- $groups := dict (printf "/aws/cloudtrail/%s" .nameNormalized) dict }}
    {{- $authenticatorGroups := dict }}
    {{- $networkPolicyGroups := dict }}
    {{- $self := .nameNormalized }}
    {{- range $c := prepend $registeredCells $self }}
    {{- if or (eq $c $self) (hasPrefix "cell-aws-" $c) }}
    {{- $_ := set $groups (printf "/aws/eks/%s/cluster" $c) (dict "prefixes" (list "kube-apiserver-audit")) }}
    {{- $_ := set $authenticatorGroups (printf "/aws/eks/%s/cluster" $c) (dict "prefixes" (list "authenticator")) }}
    {{- $_ := set $networkPolicyGroups (printf "/aws/eks/%s/cluster" $c) (dict "prefixes" (list "aws-network-policy-agent-audit")) }}
    {{- $_ := set $groups (printf "/aws/vpc/%s-vpc/flow-logs" $c) dict }}
    {{- $_ := set $groups (printf "/aws/route53/resolver-queries/%s-vpc" $c) dict }}
    {{- end }}
    {{- end }}
    {{- /* The receiver keeps one read position per log group, shared by all of its stream prefixes, so the busy audit streams would advance it past the quieter authenticator and network policy streams; each prefix of the EKS group gets its own receiver. */}}
