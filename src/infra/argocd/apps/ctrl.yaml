# ApplicationSet dispatching foundational control plane applications on the ctrl cluster.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ctrl-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values: [substrate]
          maxUpdate: 100%
        - matchExpressions:
            - key: tier
              operator: In
              values: [fleet]
          maxUpdate: 100%
  syncPolicy:
    applicationsSync: sync
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        role: ctrl
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                # Component waves follow the latest API or resource each one consumes,
                # never the kind of thing it is. Capacity provisioning and cluster DNS
                # run at wave 5 so every later wave can be scheduled onto Karpenter nodes.
                # Wave 10: Bootstrap contracts and admission
                - component: cert-manager
                  tier: substrate
                  path: src/infra/argocd/components/cert_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: cert-manager
                  chartRepo: https://charts.jetstack.io
                  chartVersion: v1.21.2
                  vpa:
                    targets:
                      - cert-manager
                      - cert-manager-cainjector
                      - cert-manager-webhook
                - component: external-secrets
                  tier: substrate
                  path: src/infra/argocd/components/external_secrets/kustomize
                  namespace: external-secrets-system
                  wave: "10"
                  chart: external-secrets
                  chartRepo: https://charts.external-secrets.io
                  chartVersion: 2.11.0
                  ignoreDifferences:
                    - group: ""
                      kind: Secret
                      namespace: application-identity
                      name: coder-snapshot-oauth
                      jsonPointers: [/data]
                  vpa:
                    targets:
                      - external-secrets
                      - external-secrets-cert-controller
                      - external-secrets-webhook
                - component: kyverno
                  tier: substrate
                  path: src/infra/argocd/components/kyverno/kustomize
                  namespace: kyverno-system
                  wave: "10"
                  chart: kyverno
                  chartRepo: https://kyverno.github.io/kyverno
                  # LINT.IfChange(kyverno-chart-version)
                  chartVersion: 3.9.1
                  # LINT.ThenChange(//src/infra/argocd/apps/cells.yaml:kyverno-chart-version,//src/bazel/module_deps/vendor_helm_charts.MODULE.bazel:kyverno-chart-version,//src/infra/argocd/components/kyverno/helm/values.yaml:kyverno-chart-version)
                  vpa:
                    targets:
                      - kyverno-admission-controller
                      - kyverno-background-controller
                      - kyverno-cleanup-controller
                      - kyverno-reports-controller
                  ignoreDifferences:
                    - group: apiextensions.k8s.io
                      kind: CustomResourceDefinition
                      jsonPointers:
                        - /metadata/labels
                      jqPathExpressions:
                        - .metadata.labels
                    - group: flowcontrol.apiserver.k8s.io
                      kind: FlowSchema
                      jqPathExpressions:
                        - .spec.rules[].resourceRules[].namespaces
                - component: scheduling-priorities
                  tier: substrate
                  path: src/infra/argocd/components/scheduling_priorities/kustomize
                  namespace: kube-system
                  wave: "10"
                  vpa: false
                - component: trust-manager
                  tier: substrate
                  path: src/infra/argocd/components/trust_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: trust-manager
                  chartRepo: quay.io/jetstack/charts
                  chartVersion: v0.25.0

                - component: vpa
                  tier: substrate
                  path: src/infra/argocd/components/vpa/kustomize
                  namespace: vpa-system
                  wave: "10"
                  chart: vertical-pod-autoscaler
                  chartRepo: https://kubernetes.github.io/autoscaler
                  chartVersion: 0.13.0
                  vpa:
                    targets:
                      - vpa-admission-controller
                      - vpa-recommender
                      - vpa-updater

                # Wave 20: Operators and foundational services
                - component: barman-cloud
                  tier: fleet
                  path: src/infra/argocd/components/barman_cloud/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: plugin-barman-cloud
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.8.0
                  vpa:
                    targets:
                      - barman-cloud-plugin-barman-cloud
                - component: clickhouse-operator
                  tier: fleet
                  path: src/infra/argocd/components/clickhouse_operator/kustomize
                  namespace: clickhouse-system
                  wave: "20"
                  chart: altinity-clickhouse-operator
                  chartRepo: https://helm.altinity.com
                  chartVersion: 0.27.4
                - component: cloudnative-pg
                  tier: fleet
                  path: src/infra/argocd/components/cloudnative_pg/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: cloudnative-pg
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.29.1
                - component: envoy-gateway
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway/helm
                  namespace: envoy-gateway-system
                  wave: "20"
                  chart: gateway-helm
                  chartRepo: registry-1.docker.io/envoyproxy
                  chartVersion: 1.9.2
                - component: keda
                  tier: fleet
                  path: src/infra/argocd/components/keda/kustomize
                  namespace: keda-system
                  wave: "20"
                  chart: keda
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 2.21.0
                  vpa:
                    targets:
                      - keda-operator
                      - keda-operator-metrics-apiserver
                      - keda-admission-webhooks
                - component: keda-http
                  tier: fleet
                  path: src/infra/argocd/components/keda_http/helm
                  namespace: keda-system
                  wave: "20"
                  chart: keda-add-ons-http
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 0.16.0
                  vpa:
                    targets:
                      - keda-add-ons-http-controller-manager
                      - keda-add-ons-http-external-scaler
                      - keda-add-ons-http-interceptor
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      jsonPointers:
                        - /spec/template/spec/containers/0/image
                      jqPathExpressions:
                        - .spec.template.spec.containers[0].image
                - component: k8s-cleaner
                  tier: fleet
                  path: src/infra/argocd/components/k8s_cleaner/kustomize
                  namespace: k8s-cleaner-system
                  wave: "20"
                  chart: k8s-cleaner
                  chartRepo: ghcr.io/gianlucam76/charts
                  chartVersion: 0.24.0
                  vpa: false
                - component: pvc-autoresizer
                  tier: fleet
                  path: src/infra/argocd/components/pvc_autoresizer/kustomize
                  namespace: pvc-autoresizer-system
                  wave: "20"
                  chart: pvc-autoresizer
                  chartRepo: https://topolvm.github.io/pvc-autoresizer
                  chartVersion: 0.20.0
                  vpa:
                    targets:
                      - pvc-autoresizer-controller
                - component: signoz-operator
                  tier: fleet
                  path: src/infra/argocd/components/signoz/helm
                  namespace: signoz-operator-system
                  wave: "20"
                  chart: signoz-operator
                  chartRepo: https://charts.signoz.io
                  chartVersion: 0.0.1
                  helmValues: src/infra/argocd/components/signoz/helm/operator-values.yaml
                - component: storage-classes
                  tier: substrate
                  path: src/infra/argocd/components/storage_classes/helm
                  namespace: kube-system
                  wave: "20"
                  helmValues: values.yaml
                  vpa: false
                - component: valkey-operator
                  tier: fleet
                  path: src/infra/argocd/components/valkey_operator/kustomize
                  namespace: valkey-system
                  wave: "20"
                  chart: valkey-operator
                  chartRepo: https://valkey.io/valkey-helm
                  chartVersion: 0.7.0
                # Wave 30: Stateful stores and ingress routing
                - component: clickhouse
                  tier: fleet
                  path: src/infra/argocd/components/clickhouse/kustomize
                  namespace: signoz
                  wave: "30"
                  vpa: custom
                - component: clickhouse-coordinator
                  tier: fleet
                  path: src/infra/argocd/components/clickhouse_coordinator/kustomize
                  namespace: signoz
                  wave: "30"
                - component: dragonfly-manager
                  tier: fleet
                  flociBridgeImage: localhost:15100/000000000000/us-east-1/src/infra/tools/dragonfly_sso@sha256:4232376de19a6b1b7288654478c0a30234bf0419409ed9c284dd856735e08a67
                  path: src/infra/argocd/components/dragonfly_manager/kustomize
                  namespace: dragonfly-system
                  wave: "30"
                  chart: dragonfly
                  chartRepo: https://dragonflyoss.github.io/helm-charts
                  chartVersion: 1.8.5
                  vpa:
                    targets:
                      - dragonfly-manager
                      - dragonfly-sso
                      - valkey-dragonfly-metadata-0-0
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: dragonfly-manager
                      jsonPointers:
                        - /metadata/generation
                        - /spec/template/spec/containers/0/livenessProbe
                        - /spec/template/spec/containers/0/readinessProbe
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.template.spec.containers[0].livenessProbe
                        - .spec.template.spec.containers[0].readinessProbe
                    - group: ""
                      kind: Service
                      jsonPointers:
                        - /spec/clusterIP
                        - /spec/clusterIPs
                      jqPathExpressions:
                        - .spec.clusterIP
                        - .spec.clusterIPs
                - component: envoy-gateway-instance
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway_instance/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa:
                    targets:
                      - private-access-gateway
                  helmValues: values.yaml
                  helmValuesObject:
                    foundation:
                      manageNamespace: true
                      namespaceLabels:
                        cost-center: shared-infrastructure
                        environment: production
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/audit-version: latest
                        pod-security.kubernetes.io/enforce: restricted
                        pod-security.kubernetes.io/enforce-version: latest
                        pod-security.kubernetes.io/warn: restricted
                        pod-security.kubernetes.io/warn-version: latest
                        ray-dashboard-routes: "true"
                    gateway:
                      enabled: true
                      canonicalScheme: https
                      name: private-access
                      namespace: envoy-gateway-system
                      className: envoy-gateway-private-access
                      aliasDomain: corp.local.internal
                      baseDomain: c.corp.local.internal
                      allowedNamespaces:
                        # keep-sorted start
                        - argo
                        - argocd
                        - atlantis
                        - buildbuddy
                        - coder
                        - dex
                        - dragonfly-system
                        - envoy-gateway-system
                        - headlamp
                        - homer
                        - kargo
                        - keda-system
                        - kube-oidc-proxy-system
                        - kube-system
                        - kuberhealthy
                        - opencost
                        - parca
                        - s3-system
                        - signoz
                        - velero-system
                        # keep-sorted end
                      listeners:
                        coderApps:
                          enabled: true
                          hostname: "*.coder.c.corp.local.internal"
                          certificateSecret: private-access-coder-apps-tls
                        dragonflyManagerTls:
                          enabled: true
                          hostname: dragonfly-manager.c.corp.local.internal
                        http: {enabled: true, redirectToHTTPS: true}
                        https:
                          enabled: true
                          hostname: "*.c.corp.local.internal"
                          certificateSecret: private-access-tls
                          aliasCertificateSecret: private-access-alias-tls
                    certificate:
                      enabled: true
                      issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-local-ca}
                      caIssuer: {enabled: false}
                    proxy:
                      autoscaling:
                        prometheus:
                          cluster: ctrl-eaws-lh1
                      deployment:
                        name: private-access-gateway
                      service:
                        name: private-access-gateway
                        type: ClusterIP
                        clusterIPv4: 172.31.0.11
                        loadBalancerClass: ""
                        annotations: {}
                        externalTrafficPolicy: Cluster
                        ipFamilyPolicy: SingleStack
                        ipFamilies: [IPv4]
                        loadBalancerSourceRanges: []
                        nodePorts: {http: 0, tls: 0}
                  acmeOverrides:
                    certificate:
                      issuerRef:
                        group: cert-manager.io
                        kind: ClusterIssuer
                        name: public-acme
                - component: kube-oidc-proxy
                  tier: fleet
                  path: src/infra/argocd/components/kube_oidc_proxy/kustomize
                  namespace: kube-oidc-proxy-system
                  wave: "30"
                  vpa: custom
                - component: routing-registry
                  tier: fleet
                  path: src/infra/argocd/components/routing_registry/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa: false
                  helmValues: values.yaml
                  helmValueFiles:
                    - routes.yaml
                  injectClusterProvider: true
                  helmValuesObject:
                    phase: all
                    exposure: private
                    capabilities:
                      buildbuddy: true
                    atlantisEnabled: true
                    gatewayOIDC:
                      version: 1
                      issuer: https://dex.c.corp.local.internal
                      jwksUri: https://dex.c.corp.local.internal/keys
                      scopes:
                        - openid
                        - profile
                        - email
                        - groups
                      groupsClaim: groups
                      clients:
                        buildbuddy:
                          clientId: buildbuddy
                          callbackUri: https://buildbuddy.c.corp.local.internal/oauth2/callback
                          aliasCallbackUri: https://buildbuddy.corp.local.internal/oauth2/callback
                        parca:
                          clientId: parca
                          callbackUri: https://parca.c.corp.local.internal/oauth2/callback
                          aliasCallbackUri: https://parca.corp.local.internal/oauth2/callback
                        signoz:
                          clientId: signoz
                          callbackUri: https://signoz.c.corp.local.internal/oauth2/callback
                          aliasCallbackUri: https://signoz.corp.local.internal/oauth2/callback
                    gateway:
                      aliasDomain: corp.local.internal
                      baseDomain: c.corp.local.internal
                      canonicalScheme: https
                      httpRedirect: true
                      name: private-access
                      namespace: envoy-gateway-system

                # Wave 40: Platform services and telemetry
                - component: atlantis
                  tier: fleet
                  path: src/infra/argocd/components/atlantis/kustomize
                  namespace: atlantis
                  wave: "40"
                  chart: atlantis
                  chartRepo: https://runatlantis.github.io/helm-charts
                  chartVersion: 6.16.0
                  vpa: custom
                - component: coder
                  tier: fleet
                  path: src/infra/argocd/components/coder/kustomize
                  namespace: coder
                  wave: "40"
                  chart: coder
                  chartRepo: https://helm.coder.com/v2
                  chartVersion: 2.37.2
                  vpa:
                    targets:
                      - coder-oidc-entrypoint
                - component: dex
                  tier: fleet
                  path: src/infra/argocd/components/dex/kustomize
                  namespace: dex
                  wave: "40"
                  chart: dex
                  chartRepo: https://charts.dexidp.io
                  chartVersion: 0.24.1
                - component: headlamp
                  tier: fleet
                  path: src/infra/argocd/components/headlamp/kustomize
                  namespace: headlamp
                  wave: "40"
                  chart: headlamp
                  chartRepo: https://kubernetes-sigs.github.io/headlamp
                  chartVersion: 0.45.0
                  vpa: custom
                - component: homer
                  tier: fleet
                  path: src/infra/argocd/components/homer/kustomize
                  namespace: homer
                  wave: "40"
                - component: kargo
                  tier: fleet
                  path: src/infra/argocd/components/kargo/kustomize
                  namespace: kargo
                  wave: "40"
                  chart: kargo
                  chartRepo: ghcr.io/akuity/kargo-charts
                  chartVersion: 1.11.5
                  vpa:
                    targets:
                      - kargo-api
                      - kargo-controller
                      - kargo-management-controller
                      - kargo-webhooks-server
                      - origin-registry-tls-proxy
                - component: kuberhealthy
                  tier: fleet
                  path: src/infra/argocd/components/kuberhealthy/kustomize
                  namespace: kuberhealthy
                  wave: "40"
                  chart: kuberhealthy
                  chartRepo: https://kuberhealthy.github.io/kuberhealthy/helm-repos
                  chartVersion: "100"
                  vpa: false
                - component: oauth2-proxy
                  tier: fleet
                  path: src/infra/argocd/components/oauth2_proxy/helm
                  namespace: oauth2-proxy-system
                  wave: "40"
                  vpa: false
                  helmValues: values.yaml
                - component: observability
                  tier: fleet
                  path: src/infra/definitions/observability
                  namespace: signoz
                  wave: "40"
                  vpa: false
                  ignoreDifferences:
                    - group: resources.signoz.io
                      kind: AlertRule
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                    - group: resources.signoz.io
                      kind: Dashboard
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                    - group: resources.signoz.io
                      kind: Rule
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                    - group: resources.signoz.io
                      kind: SavedView
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                - component: opencost
                  tier: fleet
                  path: src/infra/argocd/components/opencost/kustomize
                  namespace: opencost
                  wave: "40"
                  chart: opencost
                  chartRepo: https://opencost.github.io/opencost-helm-chart
                  chartVersion: 2.5.32
                  vpa:
                    targets:
                      - opencost
                      - opencost-auth-proxy
                - component: otel-collector
                  tier: fleet
                  path: src/infra/argocd/components/otel_collector/kustomize
                  namespace: otel-system
                  wave: "40"
                  chart: opentelemetry-collector
                  chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chartVersion: 0.173.1
                  injectClusterName: true
                  vpa: custom
                - component: parca
                  tier: fleet
                  path: src/infra/argocd/components/parca/kustomize
                  namespace: parca
                  wave: "40"
                  vpa: custom
                - component: prometheus-api-bridge
                  tier: fleet
                  path: src/infra/argocd/components/prometheus_api_bridge/kustomize
                  namespace: signoz
                  wave: "40"
                  chart: prometheus-api-bridge
                  chartRepo: ghcr.io/simonepri/charts
                  chartVersion: 0.3.0
                  injectClusterName: true
                  vpa:
                    targets:
                      - prometheus-api-bridge
                      - prometheus-api-bridge-collector
                      - prometheus-api-bridge-kube-state-metrics
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: prometheus-api-bridge
                      jsonPointers:
                        - /metadata/generation
                        - /spec/replicas
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.replicas
                - component: signoz
                  tier: fleet
                  path: src/infra/argocd/components/signoz/kustomize
                  namespace: signoz
                  wave: "40"
                  chart: signoz
                  chartRepo: https://charts.signoz.io
                  chartVersion: 0.143.0
                  injectClusterName: true
                  vpa: custom
                  ignoreDifferences:
                    - group: ""
                      kind: Namespace
                      name: signoz
                      jsonPointers:
                        - /metadata/annotations
                        - /metadata/labels
                      jqPathExpressions:
                        - .metadata.annotations
                        - .metadata.labels
                    - group: apps
                      kind: Deployment
                      name: signoz-otel-collector
                      jsonPointers:
                        - /metadata/generation
                        - /spec/replicas
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.replicas
                    - group: apps
                      kind: StatefulSet
                      jsonPointers:
                        - /spec/volumeClaimTemplates/0/status
                        - /spec/volumeClaimTemplates/0/apiVersion
                        - /spec/volumeClaimTemplates/0/kind
                        - /spec/volumeClaimTemplates/0/spec/volumeMode
                      jqPathExpressions:
                        - .spec.volumeClaimTemplates[0].status
                        - .spec.volumeClaimTemplates[0].apiVersion
                        - .spec.volumeClaimTemplates[0].kind
                        - .spec.volumeClaimTemplates[0].spec.volumeMode
                - component: tailscale-access
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_access/helm
                  namespace: tailscale-system
                  wave: "40"
                  vpa:
                    targets:
                      - subnet-router
                  helmValues: values.yaml
                  helmValuesObject:
                    mode: local-router
                    clusterName: ctrl-eaws-lh1
                    serviceCIDR: 172.31.0.0/20
                    internalDomain: c.corp.local.internal
                    resolverRoutes: []
                    egress:
                      enabled: true
                      gatewayIPv4: 172.31.16.11
                      kubernetesAPIs: {}
                    cloud:
                      secretStoreName: runtime-secrets
                      oauthRemoteKey: ""
                    local:
                      loginServer: https://headscale.c.corp.local.internal
                      authSecretName: headscale-preauth
                      recordName: headscale-preauth-ctrl-eaws-lh1
                      runtimeForwardTarget: ""
                      secretStoreName: local-secret-records
                - component: velero
                  tier: fleet
                  path: src/infra/argocd/components/velero/helm
                  helmValueOverridesByProvider:
                    floci: [src/infra/argocd/components/velero/helm/providers/floci.yaml]
                  namespace: velero-system
                  wave: "40"
                  chart: velero
                  chartRepo: https://vmware-tanzu.github.io/helm-charts
                  chartVersion: 12.2.0
                  vpa:
                    targets:
                      - name: velero
                        kind: Deployment
                      - name: node-agent
                        kind: DaemonSet
                        updateMode: Initial
                - component: velero-ui
                  tier: fleet
                  path: src/infra/argocd/components/velero_ui/kustomize
                  namespace: velero-system
                  wave: "40"
                  chart: velero-ui
                  chartRepo: https://helm.otwld.com
                  chartVersion: 0.16.0

                # Wave 41: Snapshot browsing
                - component: coder-snapshot-portal
                  tier: fleet
                  # LINT.IfChange(snapshot-portal-image)
                  flociPortalImage: localhost:15100/000000000000/us-east-1/src/infra/tools/coder_snapshot_portal@sha256:156d1b3edb4b5bb8bcc013d2fa500b4e3b3b9bccf92cd1ae03f8d7bc439ac089
                  # LINT.ThenChange(//src/infra/argocd/components/coder_snapshot_portal/helm/values.yaml:snapshot-portal-image)
                  path: src/infra/argocd/components/coder_snapshot_portal/helm
                  namespace: coder-workspace-backup-system
                  wave: "41"
                  helmValues: values.yaml
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      namespace: coder-workspace-backup-system
                      name: coder-snapshot-portal
                      jsonPointers: [/spec/template/metadata/annotations/coder.openplex.dev~1oauth-version]

                # Wave 50: Security, compliance, and network policies
                - component: cluster-access
                  tier: fleet
                  path: src/infra/argocd/components/cluster_access/kustomize
                  namespace: argocd
                  wave: "50"
                  vpa: false
                - component: falco
                  tier: fleet
                  path: src/infra/argocd/components/falco/kustomize
                  namespace: falco
                  wave: "50"
                  chart: falco
                  chartRepo: https://falcosecurity.github.io/charts
                  chartVersion: 9.2.0
                  vpa: custom
                - component: kubescape-operator
                  tier: fleet
                  path: src/infra/argocd/components/kubescape_operator/kustomize
                  namespace: kubescape-system
                  wave: "50"
                  chart: kubescape-operator
                  chartRepo: https://kubescape.github.io/helm-charts
                  chartVersion: 1.40.4
                  vpa:
                    targets:
                      - kubescape
                      - operator
                      - prometheus-exporter
                      - storage
                  helmValuesObject:
                    kubescapeScheduler:
                      scanSchedule: "7 1,9,17 * * *"
                - component: network-isolation
                  tier: fleet
                  path: src/infra/argocd/components/network_isolation/helm
                  namespace: kube-system
                  wave: "50"
                  vpa: false
                  helmValues: values.yaml
                  helmValuesObject:
                    namespaces:
                      # keep-sorted start
                      - argocd
                      - atlantis
                      - buildbuddy
                      - cert-manager-system
                      - clickhouse-system
