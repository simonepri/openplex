# ApplicationSet dispatching foundational control plane applications on the ctrl cluster.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ctrl-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values: [substrate]
          maxUpdate: 100%
        - matchExpressions:
            - key: tier
              operator: In
              values: [fleet]
          maxUpdate: 100%
  syncPolicy:
    applicationsSync: sync
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        role: ctrl
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                # Component waves follow the latest API or resource each one consumes,
                # never the kind of thing it is. Capacity provisioning and cluster DNS
                # run at wave 5 so every later wave can be scheduled onto Karpenter nodes.
                # Wave 10: Bootstrap contracts and admission
                - component: cert-manager
                  tier: substrate
                  path: src/infra/argocd/components/cert_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: cert-manager
                  chartRepo: https://charts.jetstack.io
                  chartVersion: v1.21.2
                  vpa:
                    targets:
                      - cert-manager
                      - cert-manager-cainjector
                      - cert-manager-webhook
                - component: external-secrets
                  tier: substrate
                  path: src/infra/argocd/components/external_secrets/kustomize
                  namespace: external-secrets-system
                  wave: "10"
                  chart: external-secrets
                  chartRepo: https://charts.external-secrets.io
                  chartVersion: 2.12.0
                  ignoreDifferences:
                    - group: ""
                      kind: Secret
                      namespace: application-identity
                      name: coder-snapshot-oauth
                      jsonPointers: [/data]
                    - group: ""
                      kind: Secret
                      namespace: application-identity
                      name: coder-template-publication
                      jsonPointers:
                        - /data
                        - /metadata/annotations
                        - /metadata/labels
                  vpa:
                    targets:
                      - external-secrets
                      - external-secrets-cert-controller
                      - external-secrets-webhook
                - component: kyverno
                  tier: substrate
                  path: src/infra/argocd/components/kyverno/kustomize
                  namespace: kyverno-system
                  wave: "10"
                  chart: kyverno
                  chartRepo: https://kyverno.github.io/kyverno
                  # LINT.IfChange(kyverno-chart-version)
                  chartVersion: 3.9.1
                  # LINT.ThenChange(//src/infra/argocd/apps/cells.yaml:kyverno-chart-version,//src/bazel/module_deps/vendor_helm_charts.MODULE.bazel:kyverno-chart-version,//src/infra/argocd/components/kyverno/helm/values.yaml:kyverno-chart-version)
                  vpa:
                    targets:
                      - kyverno-admission-controller
                      - kyverno-background-controller
                      - kyverno-cleanup-controller
                      - kyverno-reports-controller
                  ignoreDifferences:
                    - group: apiextensions.k8s.io
                      kind: CustomResourceDefinition
                      jsonPointers:
                        - /metadata/labels
                      jqPathExpressions:
                        - .metadata.labels
                    - group: flowcontrol.apiserver.k8s.io
                      kind: FlowSchema
                      jqPathExpressions:
                        - .spec.rules[].resourceRules[].namespaces
                    - group: kyverno.io
                      kind: ClusterPolicy
                      jsonPointers:
                        - /spec/admission
                        - /spec/background
                        - /spec/emitWarning
                        - /spec/validationFailureAction
                      jqPathExpressions:
                        - .spec.rules[].skipBackgroundRequests
                        - .spec.rules[].validate.allowExistingViolations
                        - .spec.rules[].validate.failureAction
                - component: scheduling-priorities
                  tier: substrate
                  path: src/infra/argocd/components/scheduling_priorities/kustomize
                  namespace: kube-system
                  wave: "10"
                - component: trust-manager
                  tier: substrate
                  path: src/infra/argocd/components/trust_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: trust-manager
                  chartRepo: quay.io/jetstack/charts
                  chartVersion: v0.25.0

                - component: vpa
                  tier: substrate
                  path: src/infra/argocd/components/vpa/kustomize
                  namespace: vpa-system
                  wave: "10"
                  chart: vertical-pod-autoscaler
                  chartRepo: https://kubernetes.github.io/autoscaler
                  chartVersion: 0.13.0
                  vpa:
                    targets:
                      - vpa-admission-controller
                      - vpa-recommender
                      - vpa-updater

                # Wave 20: Operators and foundational services
                - component: barman-cloud
                  tier: fleet
                  path: src/infra/argocd/components/barman_cloud/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: plugin-barman-cloud
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.8.1
                  vpa:
                    targets:
                      - barman-cloud-plugin-barman-cloud
                - component: clickhouse-operator
                  tier: fleet
                  path: src/infra/argocd/components/clickhouse_operator/kustomize
                  namespace: clickhouse-system
                  wave: "20"
                  chart: altinity-clickhouse-operator
                  chartRepo: https://helm.altinity.com
                  chartVersion: 0.27.4
                - component: cloudnative-pg
                  tier: fleet
                  path: src/infra/argocd/components/cloudnative_pg/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: cloudnative-pg
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.29.1
                - component: envoy-gateway
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway/helm
                  namespace: envoy-gateway-system
                  wave: "20"
                  chart: gateway-helm
                  chartRepo: registry-1.docker.io/envoyproxy
                  chartVersion: 1.9.2
                - component: keda
                  tier: fleet
                  path: src/infra/argocd/components/keda/kustomize
                  namespace: keda-system
                  wave: "20"
                  chart: keda
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 2.21.0
                  vpa:
                    targets:
                      - keda-operator
                      - keda-operator-metrics-apiserver
                      - keda-admission-webhooks
                - component: keda-http
                  tier: fleet
                  path: src/infra/argocd/components/keda_http/helm
                  namespace: keda-system
                  wave: "20"
                  chart: keda-add-ons-http
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 0.16.0
                  vpa:
                    targets:
                      - keda-add-ons-http-controller-manager
                      - keda-add-ons-http-external-scaler
                      - keda-add-ons-http-interceptor
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      jsonPointers:
                        - /spec/template/spec/containers/0/image
                      jqPathExpressions:
                        - .spec.template.spec.containers[0].image
                - component: k8s-cleaner
                  tier: fleet
                  path: src/infra/argocd/components/k8s_cleaner/kustomize
                  namespace: k8s-cleaner-system
                  wave: "20"
                  chart: k8s-cleaner
                  chartRepo: ghcr.io/gianlucam76/charts
                  chartVersion: 0.24.0
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: k8s-cleaner
                      jsonPointers:
                        - /spec/template/spec/containers/0/env/0/valueFrom/resourceFieldRef/divisor
                        - /spec/template/spec/containers/0/env/1/valueFrom/resourceFieldRef/divisor
                      jqPathExpressions:
                        - .spec.template.spec.containers[0].env[]?.valueFrom.resourceFieldRef.divisor
                - component: pvc-autoresizer
                  tier: fleet
                  path: src/infra/argocd/components/pvc_autoresizer/kustomize
                  namespace: pvc-autoresizer-system
                  wave: "20"
                  chart: pvc-autoresizer
                  chartRepo: https://topolvm.github.io/pvc-autoresizer
                  chartVersion: 0.20.1
                  vpa:
                    targets:
                      - pvc-autoresizer-controller
                - component: signoz-operator
                  tier: fleet
                  path: src/infra/argocd/components/signoz/helm
                  namespace: signoz-operator-system
                  wave: "20"
                  chart: signoz-operator
                  chartRepo: https://charts.signoz.io
                  chartVersion: 0.0.2
                  helmValues: src/infra/argocd/components/signoz/helm/operator-values.yaml
                - component: storage-classes
                  tier: substrate
                  path: src/infra/argocd/components/storage_classes/helm
                  namespace: kube-system
                  wave: "20"
                  helmValues: values.yaml
                - component: valkey-operator
                  tier: fleet
                  path: src/infra/argocd/components/valkey_operator/kustomize
                  namespace: valkey-system
                  wave: "20"
                  chart: valkey-operator
                  chartRepo: https://valkey.io/valkey-helm
                  chartVersion: 0.7.0
                # Wave 30: Stateful stores and ingress routing
                - component: clickhouse
                  tier: fleet
                  path: src/infra/argocd/components/clickhouse/kustomize
                  namespace: signoz
                  wave: "30"
                  vpa: custom
                - component: clickhouse-coordinator
                  tier: fleet
                  path: src/infra/argocd/components/clickhouse_coordinator/kustomize
                  namespace: signoz
                  wave: "30"
                - component: dragonfly-manager
                  tier: fleet
                  path: src/infra/argocd/components/dragonfly_manager/kustomize
                  namespace: dragonfly-system
                  wave: "30"
                  chart: dragonfly
                  chartRepo: https://dragonflyoss.github.io/helm-charts
                  chartVersion: 1.8.5
                  vpa:
                    targets:
                      - dragonfly-manager
                      - dragonfly-sso
                      - valkey-dragonfly-metadata-0-0
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: dragonfly-manager
                      jsonPointers:
                        - /metadata/generation
                        - /spec/template/spec/containers/0/livenessProbe
                        - /spec/template/spec/containers/0/readinessProbe
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.template.spec.containers[0].livenessProbe
                        - .spec.template.spec.containers[0].readinessProbe
                    - group: ""
                      kind: Service
                      jsonPointers:
                        - /spec/clusterIP
                        - /spec/clusterIPs
                      jqPathExpressions:
                        - .spec.clusterIP
                        - .spec.clusterIPs
                - component: envoy-gateway-instance
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway_instance/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa:
                    targets:
                      - private-access-gateway
                  helmValues: values.yaml
                  helmValuesObject:
                    foundation:
                      manageNamespace: true
                      namespaceLabels:
                        cost-center: shared-infrastructure
                        environment: production
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/audit-version: latest
                        pod-security.kubernetes.io/enforce: restricted
                        pod-security.kubernetes.io/enforce-version: latest
                        pod-security.kubernetes.io/warn: restricted
                        pod-security.kubernetes.io/warn-version: latest
                        ray-dashboard-routes: "true"
                    gateway:
                      enabled: true
                      canonicalScheme: https
                      name: private-access
                      namespace: envoy-gateway-system
                      className: envoy-gateway-private-access
                      aliasDomain: corp.local.internal
                      allowedNamespaces:
                        # keep-sorted start
                        - argo
                        - argocd
                        - atlantis
                        - buildbuddy
                        - coder
                        - dex
                        - dragonfly-system
                        - envoy-gateway-system
                        - headlamp
                        - homer
                        - kargo
                        - keda-system
                        - kube-oidc-proxy-system
                        - kube-system
                        - kuberhealthy
                        - opencost
                        - parca
                        - s3-system
                        - signoz
                        - velero-system
                        # keep-sorted end
                      listeners:
                        coderApps:
                          enabled: true
                          hostname: "*.coder.c.corp.local.internal"
                          certificateSecret: private-access-coder-apps-tls
                        dragonflyManagerTls:
                          enabled: true
                          hostname: dragonfly-manager.c.corp.local.internal
                        http: {enabled: true, redirectToHTTPS: true}
                        https:
                          enabled: true
                          hostname: "*.c.corp.local.internal"
                          certificateSecret: private-access-tls
                          aliasCertificateSecret: private-access-alias-tls
                        kubeOidcTls:
                          enabled: true
                          hostname: kube-oidc-proxy.ctrl-local.c.corp.local.internal
                    certificate:
                      enabled: true
                      issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-local-ca}
                      caIssuer: {enabled: false}
                    proxy:
                      autoscaling:
                        prometheus:
                          cluster: ""
                      deployment:
                        name: private-access-gateway
                      service:
                        name: private-access-gateway
                        type: ClusterIP
                        clusterIPv4: 172.31.0.11
                        loadBalancerClass: ""
                        annotations: {}
                        externalTrafficPolicy: Cluster
                        ipFamilyPolicy: SingleStack
                        ipFamilies: [IPv4]
                        loadBalancerSourceRanges: []
                        nodePorts: {http: 0, tls: 0}
                  acmeOverrides:
                    certificate:
                      issuerRef:
                        group: cert-manager.io
                        kind: ClusterIssuer
                        name: public-acme
                - component: envoy-gateway-instance-public-hooks
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway_instance/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa:
                    targets:
                      - public-hooks-gateway
                  helmValues: values.yaml
                  helmValuesObject:
                    foundation:
                      manageNamespace: false
                    gateway:
                      enabled: true
                      canonicalScheme: https
                      name: public-hooks
                      namespace: envoy-gateway-system
                      className: envoy-gateway-public-hooks
                      aliasDomain: ""
                      allowedNamespaces:
                        # keep-sorted start
                        - argocd
                        - atlantis
                        - envoy-gateway-system
                        # keep-sorted end
                      listeners:
                        atlantisWebhookHttps:
                          enabled: true
                          hostname: hooks.corp.local.internal
                          certificateSecret: public-hooks-atlantis-webhook-tls
                    certificate:
                      enabled: true
                      issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-local-ca}
                      caIssuer: {enabled: false}
                    proxy:
                      autoscaling:
                        prometheus:
                          cluster: ""
                      deployment:
                        name: public-hooks-gateway
                      service:
                        name: public-hooks-gateway
                        type: LoadBalancer
                        loadBalancerClass: service.k8s.aws/nlb
                        annotations:
                          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                          # IP targets otherwise present the NLB's private address, which the GitHub source allow-list denies.
                          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
                        externalTrafficPolicy: Local
                        ipFamilyPolicy: SingleStack
                        ipFamilies: [IPv4]
                        # LINT.IfChange(github-webhook-cidrs)
                        loadBalancerSourceRanges:
                          # keep-sorted start
                          - 140.82.112.0/20
                          - 143.55.64.0/20
                          - 185.199.108.0/22
                          - 192.30.252.0/22
                          # keep-sorted end
                        # LINT.ThenChange(//src/infra/argocd/components/routing_registry/helm/routes.yaml:github-webhook-cidrs)
                        nodePorts: {http: 0, tls: 0}
                  acmeOverrides:
                    certificate:
                      issuerRef:
                        group: cert-manager.io
                        kind: ClusterIssuer
                        name: public-acme
                - component: kube-oidc-proxy
                  tier: fleet
                  path: src/infra/argocd/components/kube_oidc_proxy/kustomize
                  namespace: kube-oidc-proxy-system
                  wave: "30"
                  vpa: custom
                - component: routing-registry
                  tier: fleet
                  path: src/infra/argocd/components/routing_registry/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  helmValues: values.yaml
                  helmValueFiles:
                    - routes.yaml
                  injectClusterProvider: true
                  helmValuesObject:
                    phase: all
                    exposure: private
                    capabilities:
                      buildbuddy: true
                    atlantisEnabled: true
                    gatewayOIDC:
                      version: 1
                      issuer: https://dex.corp.local.internal
                      jwksUri: https://dex.corp.local.internal/keys
                      scopes:
                        - openid
                        - profile
                        - email
                        - groups
                      groupsClaim: groups
                      clients:
                        buildbuddy:
                          clientId: buildbuddy
                          callbackUri: https://buildbuddy.corp.local.internal/oauth2/callback
                          aliasCallbackUri: https://buildbuddy.corp.local.internal/oauth2/callback
                        parca:
                          clientId: parca
                          callbackUri: https://parca.corp.local.internal/oauth2/callback
                          aliasCallbackUri: https://parca.corp.local.internal/oauth2/callback
                        signoz:
                          clientId: signoz
                          callbackUri: https://signoz.corp.local.internal/oauth2/callback
                          aliasCallbackUri: https://signoz.corp.local.internal/oauth2/callback
                    gateway:
                      aliasDomain: corp.local.internal
                      canonicalScheme: https
                      httpRedirect: true
                      name: private-access
                      namespace: envoy-gateway-system
                - component: routing-registry-public
                  tier: fleet
                  path: src/infra/argocd/components/routing_registry/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  helmValues: values.yaml
                  helmValueFiles:
                    - routes.yaml
                  injectClusterProvider: true
                  helmValuesObject:
                    phase: application
                    exposure: public
                    capabilities:
                      buildbuddy: false
                    atlantisEnabled: true
                    gatewayOIDC: {}
                    gateway:
                      aliasDomain: ""
                      baseDomain: ""
                      canonicalScheme: https
                      httpRedirect: false
                      name: public-hooks
                      namespace: envoy-gateway-system
                      routeSections:
                        atlantis-webhook: atlantis-webhook-https

                # Wave 40: Platform services and telemetry
                - component: atlantis
                  tier: fleet
                  path: src/infra/argocd/components/atlantis/kustomize
                  namespace: atlantis
                  wave: "40"
                  chart: atlantis
                  chartRepo: https://runatlantis.github.io/helm-charts
                  chartVersion: 6.16.1
                  vpa: custom
                - component: cloud-telemetry
                  tier: fleet
                  path: src/infra/argocd/components/cloud_telemetry/kustomize
                  namespace: otel-system
                  wave: "40"
                  chart: opentelemetry-collector
                  chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chartVersion: 0.175.1
                  vpa: custom
                  ignoreDifferences:
                    - group: ""
                      kind: PersistentVolumeClaim
                      name: cloud-telemetry-storage
                      jsonPointers:
                        - /spec/resources/requests/storage
                - component: coder
                  tier: fleet
                  path: src/infra/argocd/components/coder/kustomize
                  namespace: coder
                  wave: "40"
                  chart: coder
                  chartRepo: https://helm.coder.com/v2
                  chartVersion: 2.38.0
                  vpa:
                    targets:
                      - coder-oidc-entrypoint
                - component: dex
                  tier: fleet
                  path: src/infra/argocd/components/dex/kustomize
                  namespace: dex
                  wave: "40"
                  chart: dex
                  chartRepo: https://charts.dexidp.io
                  chartVersion: 0.26.0
                - component: headlamp
                  tier: fleet
                  path: src/infra/argocd/components/headlamp/kustomize
                  namespace: headlamp
                  wave: "40"
                  chart: headlamp
                  chartRepo: https://kubernetes-sigs.github.io/headlamp
                  chartVersion: 0.45.0
                  vpa: custom
                - component: homer
                  tier: fleet
                  path: src/infra/argocd/components/homer/kustomize
                  namespace: homer
                  wave: "40"
                - component: kargo
                  tier: fleet
                  path: src/infra/argocd/components/kargo/kustomize
                  namespace: kargo
                  wave: "40"
                  chart: kargo
                  chartRepo: ghcr.io/akuity/kargo-charts
                  chartVersion: 1.12.3
                  vpa:
                    targets:
                      - kargo-api
                      - kargo-controller
                      - kargo-management-controller
                      - kargo-webhooks-server
                      - origin-registry-tls-proxy
                - component: kuberhealthy
                  tier: fleet
                  path: src/infra/argocd/components/kuberhealthy/kustomize
                  namespace: kuberhealthy
                  wave: "40"
                  chart: kuberhealthy
                  chartRepo: https://raw.githubusercontent.com/kuberhealthy/kuberhealthy-helm/main
                  chartVersion: "1.1.0"
                  ignoreDifferences:
                    - group: apiextensions.k8s.io
                      kind: CustomResourceDefinition
                      jsonPointers:
                        - /spec/preserveUnknownFields
                - component: oauth2-proxy
                  tier: fleet
                  path: src/infra/argocd/components/oauth2_proxy/helm
                  namespace: oauth2-proxy-system
                  wave: "40"
                  helmValues: values.yaml
                - component: observability
                  tier: fleet
                  path: src/infra/definitions/observability
                  namespace: signoz
                  wave: "40"
                  ignoreDifferences:
                    - group: resources.signoz.io
                      kind: AlertRule
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                    - group: resources.signoz.io
                      kind: Dashboard
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                    - group: resources.signoz.io
                      kind: Rule
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                    - group: resources.signoz.io
                      kind: SavedView
                      jsonPointers:
                        - /metadata/annotations/resources.signoz.io~1create-attempt
                        - /status
                      jqPathExpressions:
                        - .metadata.annotations["resources.signoz.io/create-attempt"]
                        - .status
                - component: opencost
                  tier: fleet
                  path: src/infra/argocd/components/opencost/kustomize
                  namespace: opencost
                  wave: "40"
                  chart: opencost
                  chartRepo: https://opencost.github.io/opencost-helm-chart
                  chartVersion: 2.5.32
                  vpa:
                    targets:
                      - opencost
                      - opencost-auth-proxy
                - component: otel-collector
                  tier: fleet
                  path: src/infra/argocd/components/otel_collector/kustomize
                  namespace: otel-system
                  wave: "40"
                  chart: opentelemetry-collector
                  chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chartVersion: 0.175.1
                  injectClusterName: true
                  vpa: custom
                - component: parca
                  tier: fleet
                  path: src/infra/argocd/components/parca/kustomize
                  namespace: parca
                  wave: "40"
                  vpa: custom
                  ignoreDifferences:
                    - group: ""
                      kind: PersistentVolumeClaim
                      name: parca-data
                      jsonPointers:
                        - /spec/resources/requests/storage
                - component: parca-agent
                  tier: fleet
                  path: src/infra/argocd/components/parca_agent/kustomize
                  namespace: parca
                  wave: "40"
                  vpa:
                    targets:
                      - name: parca-agent
                        kind: DaemonSet
                        updateMode: Initial
                      - name: parca-agent-gpu
                        kind: DaemonSet
                        updateMode: Initial
                - component: node-problem-detector
                  tier: fleet
                  path: src/infra/argocd/components/node_problem_detector/kustomize
                  namespace: node-problem-detector
                  wave: "40"
                  vpa: custom
                - component: prometheus-api-bridge
                  tier: fleet
                  path: src/infra/argocd/components/prometheus_api_bridge/kustomize
                  namespace: signoz
                  wave: "40"
                  chart: prometheus-api-bridge
                  chartRepo: ghcr.io/simonepri/charts
                  chartVersion: 0.3.0
                  injectClusterName: true
                  vpa:
                    targets:
                      - prometheus-api-bridge
                      - prometheus-api-bridge-collector
                      - prometheus-api-bridge-kube-state-metrics
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: prometheus-api-bridge
                      jsonPointers:
                        - /metadata/generation
                        - /spec/replicas
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.replicas
                - component: signoz
                  tier: fleet
                  path: src/infra/argocd/components/signoz/kustomize
                  namespace: signoz
                  wave: "40"
                  chart: signoz
                  chartRepo: https://charts.signoz.io
                  chartVersion: 0.145.0
                  injectClusterName: true
                  vpa: custom
