                  namespace: buildbuddy
                  wave: "40"
                  domainUrlPatch:
                    target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: buildbuddy
                    path: /spec/template/spec/containers/0/env/1/value
                    prefix: https://buildbuddy.
  template:
    metadata:
      name: '{{ .nameNormalized }}-{{ .component }}'
      namespace: argocd
      annotations:
        # keep-sorted start
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        # keep-sorted end
      labels:
        # keep-sorted start
        cluster: '{{ .nameNormalized }}'
        role: ctrl
        team: global
        tier: '{{ .tier }}'
        wave: '{{ .wave }}'
        # keep-sorted end
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-ctrl
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # LINT.IfChange(sync-retry)
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        # LINT.ThenChange(//src/infra/argocd/apps/cells.yaml:sync-retry,//src/infra/argocd/apps/teams.yaml:sync-retry)
        syncOptions:
          # keep-sorted start
          - CreateNamespace=true
          - IncludeMutationWebhook=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          # keep-sorted end
  templatePatch: |
    {{- $provider := default "" (index .metadata.labels "provider") }}
    # floci-divergence: Local development clusters default to the minimal resource profile to fit host resources.
    {{- $profileName := default (ternary "minimal" "production" (eq $provider "floci")) (index .metadata.labels "profile") }}
    {{- if not (hasKey .profiles $profileName) }}
    {{- fail (printf "unknown availability profile %q" $profileName) }}
    {{- end }}
    {{- $profile := index .profiles $profileName }}
    {{- $componentProfile := default dict (index $profile.components .component) }}
    {{- $helmValues := mergeOverwrite (deepCopy (default dict $componentProfile.helmValues)) (default dict .helmValuesObject) }}
    {{- if and (eq .component "network-isolation") (or (eq $provider "aws") (eq $provider "gcp")) }}
    {{- $namespaces := default list (index $helmValues "namespaces") }}
    {{- $namespaces = append $namespaces "external-dns-system" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "namespaces" $namespaces) }}
    {{- end }}
    {{- if .injectClusterName }}
    {{- if eq .component "otel-collector" }}
    {{- $extraEnvs := default list (index (default dict .helmValuesObject) "extraEnvs") }}
    {{- $extraEnvs = concat (list (dict "name" "K8S_CLUSTER_NAME" "value" .nameNormalized)) $extraEnvs }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "extraEnvs" $extraEnvs) }}
    {{- else if eq .component "signoz" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "otelCollector" (dict "additionalEnvs" (dict "K8S_CLUSTER_NAME" .nameNormalized))) }}
    {{- else }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized) }}
    {{- end }}
    {{- end }}
    {{- $annotations := default dict .metadata.annotations }}
    {{- $repoURL := index $annotations "git-repo-url" }}
    {{- $gitTransportURL := index $annotations "git-transport-url" | default $repoURL }}
    # nosemgrep: repository.lint.forbidden-domain-patterns
    {{- $publicDomain := default "local.internal" (index $annotations "public-domain") }}
    {{- $intranetDomain := default (printf "corp.%s" $publicDomain) (or (index $annotations "intranet-domain") (index $annotations "domain")) }}
    {{- $clusterDomain := default (printf "c.%s" $intranetDomain) (or (index $annotations "cluster-domain") (index $annotations "access-domain")) }}
    {{- $accessDomain := $clusterDomain }}
    {{- if .injectClusterDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "publicDomain" $publicDomain "accessAliasDomain" $clusterDomain "internalDomain" $clusterDomain) }}
    {{- end }}
    {{- if eq .component "opencost" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "opencost" (dict "exporter" (dict "defaultClusterId" .nameNormalized))) }}
    {{- end }}
    {{- if eq .component "tailscale-access" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized) }}
    # floci-divergence: Floci clusters run with local router tailnet mode vs cloud connector.
    {{- if ne $provider "floci" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "mode" "cloud-connector") }}
    {{- end }}
    {{- with (index $annotations "tailscale-oauth-key") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "cloud" (dict "oauthRemoteKey" .)) }}
    {{- end }}
    {{- with (index $annotations "service-cidr") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "serviceCIDR" .) }}
    {{- end }}
    # floci-divergence: The local control router preserves its configured cell gateway destination.
    {{- if ne $provider "floci" }}
    {{- with (index $annotations "control-gateway-ipv4") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "egress" (dict "gatewayIPv4" .)) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if eq .component "coredns" }}
    # floci-divergence: Local cell API hostnames resolve through the in-cluster tailnet egress service.
    {{- if eq $provider "floci" }}
    {{- $rewrites := deepCopy (default dict (index $helmValues "rewrites")) }}
    {{- range $cell, $domain := (default dict (index $helmValues "cellDomains")) }}
    {{- $_ := set $rewrites (printf "kube-oidc-proxy.%s.%s" $cell $domain) "active-cell-private-access.tailscale-system.svc.cluster.local" }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "rewrites" $rewrites) }}
    {{- end }}
    # floci-divergence: Upstream Route 53 resolver rules resolve private domains identically on Floci; cloud clusters use Tailscale SaaS without a local Headscale endpoint.
    {{- if ne $provider "floci" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "headscaleIPv4" "")) }}
    {{- end }}
    {{- with (index $annotations "control-gateway-ipv4") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "gatewayIPv4" .)) }}
    {{- end }}
    {{- with (index $annotations "service-cidr") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "serviceCIDR" .) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "storage-classes" }}
    {{- $storageProvider := ternary "aws" (ternary "gcp" "local" (eq $provider "gcp")) (eq $provider "aws") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "provider" $storageProvider) }}
    {{- end }}
    {{- if eq .component "k8s-cleaner" }}
    # floci-divergence: Floci clusters run with 1-hour PV retention for fast local cleanup.
    {{- $isLocal := eq $provider "floci" }}
    {{- $reclaimerValues := dict "pvReclaimer" (dict "ttlSeconds" (ternary 3600 2592000 $isLocal) "schedule" (ternary "0 * * * *" "0 3 * * *" $isLocal)) }}
    {{- $helmValues = mergeOverwrite $helmValues $reclaimerValues }}
    {{- end }}
    {{- if eq .component "aws-load-balancer-controller" }}
    {{- $awsRegion := default "configured-by-applicationset" (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $awsVpcId := default "configured-by-applicationset" (coalesce (index $annotations "aws-vpc-id") (index $annotations "vpc-id")) }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized "region" $awsRegion "vpcId" $awsVpcId) }}
    {{- end }}
    {{- if eq .component "external-dns" }}
    {{- $dnsProvider := ternary "aws" (ternary "google" "floci" (eq $provider "gcp")) (eq $provider "aws") }}
    {{- $extDnsValues := dict "provider" $dnsProvider "txtOwnerId" .nameNormalized "domainFilters" (list $accessDomain $intranetDomain) }}
    {{- if eq $provider "gcp" }}
    {{- $gcpProject := default "configured-by-applicationset" (coalesce (index $annotations "gcp-project-id") (index $annotations "project-id") (index (default dict .metadata.labels) "project")) }}
    {{- $extDnsSa := printf "%s-external-dns@%s.iam.gserviceaccount.com" .nameNormalized $gcpProject }}
    {{- $extDnsValues = mergeOverwrite $extDnsValues (dict "serviceAccount" (dict "annotations" (dict "iam.gke.io/gcp-service-account" $extDnsSa))) }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues $extDnsValues }}
    {{- end }}
    {{- if eq .component "atlantis" }}
    {{- $atlantisUrl := printf "https://atlantis.%s" $accessDomain }}
    {{- $orgAllowlist := default "" (index $annotations "atlantis-org-allowlist") }}
    {{- if eq $orgAllowlist "" }}
    {{- if contains "github.com" $repoURL }}
    {{- $orgAllowlist = regexReplaceAll "^(?:https?://|git@|git://)?github\\.com[:/]([^/]+/[^/.]+)(?:\\.git)?$" $repoURL "github.com/${1}" }}
    {{- else }}
    {{- $orgAllowlist = "github.com/simonepri/openplex" }}
    {{- end }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "atlantisUrl" $atlantisUrl "orgAllowlist" $orgAllowlist) }}
    {{- end }}
    {{- if eq .component "kargo" }}
    {{- $kargoHost := printf "kargo.%s" $accessDomain }}
    {{- $kargoIssuer := printf "https://dex.%s" $accessDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "api" (dict "host" $kargoHost "oidc" (dict "issuerURL" $kargoIssuer))) }}
    {{- end }}
    {{- if eq .component "coder-snapshot-portal" }}
    {{- $accessHost := printf "coder-snapshots.%s" $accessDomain }}
    {{- $coderUrl := printf "https://coder.%s" $accessDomain }}
    {{- $resourcePrefix := default "corp" (coalesce (index $annotations "resource-prefix") (index $annotations "storage-prefix")) }}
    {{- $awsRegion := default "configured-by-applicationset" (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $backupBucket := coalesce (index $annotations "backups-bucket") (printf "%s-%s-backups" $resourcePrefix .nameNormalized) }}
    {{- $s3Bucket := $backupBucket }}
    {{- $s3Endpoint := default "" (index $annotations "s3-endpoint") }}
    # floci-divergence: Floci runs S3 locally in us-east-1 LocalStack zone.
    {{- $s3Region := ternary "us-east-1" $awsRegion (eq $provider "floci") }}
    {{- $controlGatewayIPv4 := default "172.31.0.11" (index $annotations "control-gateway-ipv4") }}
    {{- $portalValues := dict "cell" .nameNormalized "access" (dict "hostname" $accessHost "gatewayIPv4" $controlGatewayIPv4) "coder" (dict "url" $coderUrl) "s3" (dict "bucket" $s3Bucket "endpoint" $s3Endpoint "region" $s3Region) }}
    # floci-divergence: Floci pulls the portal image from its seeded origin registry.
    {{- if eq $provider "floci" }}
    {{- $portalImage := splitList "@" .flociPortalImage }}
    {{- $portalValues = mergeOverwrite $portalValues (dict "image" (dict "repository" (index $portalImage 0) "digest" (index $portalImage 1))) }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues $portalValues }}
    {{- end }}
    {{- if eq .component "envoy-gateway-instance" }}
    {{- $dragonflyManagerHost := printf "dragonfly-manager.%s" $accessDomain }}
    {{- $wildcardHost := printf "*.%s" $accessDomain }}
    {{- $coderAppsHost := printf "*.coder.%s" $accessDomain }}
    {{- $envoyValues := dict "gateway" (dict "aliasDomain" $intranetDomain "baseDomain" $accessDomain "listeners" (dict "dragonflyManagerTls" (dict "hostname" $dragonflyManagerHost) "coderApps" (dict "hostname" $coderAppsHost) "https" (dict "hostname" $wildcardHost))) "proxy" (dict "autoscaling" (dict "prometheus" (dict "cluster" .nameNormalized))) }}
    # floci-divergence: Cloud clusters dynamically allocate Envoy Gateway service IP from provider CIDRs.
    {{- if ne $provider "floci" }}
    {{- $envoyValues = mergeOverwrite $envoyValues (dict "service" (dict "clusterIPv4" "")) }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues $envoyValues }}
    {{- end }}
    {{- if eq .component "routing-registry" }}
    {{- $dexHost := printf "dex.%s" $accessDomain }}
    {{- $gatewayOIDC := dict "version" 1 "issuer" (printf "https://%s" $dexHost) "jwksUri" (printf "https://%s/keys" $dexHost) "scopes" (list "openid" "profile" "email" "groups") "groupsClaim" "groups" "clients" (dict "buildbuddy" (dict "clientId" "buildbuddy" "callbackUri" (printf "https://buildbuddy.%s/oauth2/callback" $accessDomain) "aliasCallbackUri" (printf "https://buildbuddy.%s/oauth2/callback" $intranetDomain)) "kuberhealthy" (dict "clientId" "kuberhealthy" "callbackUri" (printf "https://kuberhealthy.%s/oauth2/callback" $accessDomain) "aliasCallbackUri" (printf "https://kuberhealthy.%s/oauth2/callback" $intranetDomain)) "parca" (dict "clientId" "parca" "callbackUri" (printf "https://parca.%s/oauth2/callback" $accessDomain) "aliasCallbackUri" (printf "https://parca.%s/oauth2/callback" $intranetDomain)) "signoz" (dict "clientId" "signoz" "callbackUri" (printf "https://signoz.%s/oauth2/callback" $accessDomain) "aliasCallbackUri" (printf "https://signoz.%s/oauth2/callback" $intranetDomain))) }}
    {{- $routingValues := dict "gateway" (dict "aliasDomain" $intranetDomain "baseDomain" $accessDomain) "gatewayOIDC" $gatewayOIDC }}
    {{- $helmValues = mergeOverwrite $helmValues $routingValues }}
    {{- end }}
    {{- if eq .component "velero" }}
    {{- $resourcePrefix := default "corp" (coalesce (index $annotations "resource-prefix") (index $annotations "storage-prefix")) }}
    {{- $backupBucket := coalesce (index $annotations "backups-bucket") (printf "%s-%s-backups" $resourcePrefix .nameNormalized) }}
    {{- if eq $provider "aws" }}
    {{- $awsRegion := default "configured-by-applicationset" (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $veleroAwsValues := dict "credentials" (dict "useSecret" false) "configuration" (dict "backupStorageLocation" (list (dict "name" "default" "provider" "aws" "bucket" $backupBucket "config" (dict "region" $awsRegion)))) }}
    {{- $helmValues = mergeOverwrite $helmValues $veleroAwsValues }}
    {{- else if eq $provider "gcp" }}
    {{- $gcpProject := default "configured-by-applicationset" (coalesce (index $annotations "gcp-project-id") (index $annotations "project-id") (index (default dict .metadata.labels) "project")) }}
    {{- $veleroSa := printf "%s-velero@%s.iam.gserviceaccount.com" .nameNormalized $gcpProject }}
    {{- $veleroGcpValues := dict "credentials" (dict "useSecret" false) "serviceAccount" (dict "server" (dict "annotations" (dict "iam.gke.io/gcp-service-account" $veleroSa))) "configuration" (dict "backupStorageLocation" (list (dict "name" "default" "provider" "gcp" "bucket" $backupBucket))) }}
    {{- $helmValues = mergeOverwrite $helmValues $veleroGcpValues }}
    {{- else }}
    # LINT.IfChange(velero-floci-storage)
    # floci-divergence: Local backup storage uses the registered foundation bucket and endpoint.
    {{- $backupBucket := index $annotations "backups-bucket" }}
    {{- if not $backupBucket }}{{ fail "Floci Velero requires the backups-bucket cluster annotation" }}{{- end }}
    {{- $veleroFlociValues := dict "configuration" (dict "backupStorageLocation" (list (dict "name" "default" "provider" "aws" "bucket" $backupBucket "prefix" "backups/cluster" "config" (dict "region" "us-east-1" "s3ForcePathStyle" "true" "s3Url" (index $annotations "s3-endpoint"))))) }}
    {{- $helmValues = mergeOverwrite $helmValues $veleroFlociValues }}
    # LINT.ThenChange(//src/infra/argocd/apps/cells.yaml:velero-floci-storage)
    {{- end }}
    {{- end }}
    {{- $patches := concat (default list $profile.patches) (default list $componentProfile.patches) (default list .patches) }}
    {{- if eq .component "opencost" }}
    {{- if eq $provider "aws" }}
    {{- $athenaBucket := default (printf "%s-billing-reports" .nameNormalized) (index $annotations "athena-bucket") }}
