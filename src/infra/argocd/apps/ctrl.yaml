    {{- $patches = append $patches (dict "target" (dict "group" "kuberhealthy.github.io" "version" "v2" "kind" "HealthCheck" "name" "chainsaw-scheduling") "patch" "apiVersion: kuberhealthy.github.io/v2\nkind: HealthCheck\nmetadata:\n  name: chainsaw-scheduling\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "kuberhealthy.github.io" "version" "v2" "kind" "HealthCheck" "name" "chainsaw-storage") "patch" "apiVersion: kuberhealthy.github.io/v2\nkind: HealthCheck\nmetadata:\n  name: chainsaw-storage\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ServiceAccount" "name" "chainsaw-scheduling") "patch" "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: chainsaw-scheduling\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRole" "name" "chainsaw-scheduling") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: chainsaw-scheduling\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRoleBinding" "name" "chainsaw-scheduling") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: chainsaw-scheduling\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "Role" "name" "chainsaw-scheduling") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: chainsaw-scheduling\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "RoleBinding" "name" "chainsaw-scheduling") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: chainsaw-scheduling\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ServiceAccount" "name" "chainsaw-storage") "patch" "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: chainsaw-storage\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRole" "name" "chainsaw-storage") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: chainsaw-storage\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRoleBinding" "name" "chainsaw-storage") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: chainsaw-storage\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "Role" "name" "chainsaw-storage") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: chainsaw-storage\n$patch: delete") }}
    {{- $patches = append $patches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "RoleBinding" "name" "chainsaw-storage") "patch" "apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: chainsaw-storage\n$patch: delete") }}
    {{- end }}
    {{- with .domainUrlPatch }}
    {{- $patches = append $patches (dict "target" .target "patch" (printf "- op: replace\n  path: %s\n  value: %s%s" .path .prefix $accessDomain)) }}
    {{- end }}
    {{- $acmeEnabled := eq (default "" (index .metadata.labels "acme-dns01")) "enabled" }}
    # floci-divergence: Floci local clusters lack public DNS zones required for ACME DNS-01 challenges.
    {{- if and $acmeEnabled (ne $provider "floci") (ne $provider "") }}
    {{- with .acmeOverrides }}
    {{- $helmValues = mergeOverwrite $helmValues . }}
    {{- end }}
    {{- end }}
    {{- if eq .component "acme" }}
    # floci-divergence: Cloud clusters reference cluster-scoped Cloudflare credentials in AWS Secrets Manager.
    {{- if and (ne $provider "floci") (ne $provider "") }}
    {{- $cfRemoteKey := printf "%s-cloudflare-cert-manager-token" .nameNormalized }}
    {{- $cfPatchOps := list (dict "op" "replace" "path" "/spec/data/0/remoteRef/key" "value" $cfRemoteKey) (dict "op" "add" "path" "/spec/data/0/remoteRef/property" "value" "api_token") }}
    {{- $patches = append $patches (dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ExternalSecret" "namespace" "cert-manager-system" "name" "cloudflare-api-token") "patch" (toYaml $cfPatchOps)) }}
    {{- $acmeIssuerPatchOps := list (dict "op" "replace" "path" "/spec/acme/email" "value" $googleAdminEmail) (dict "op" "replace" "path" "/spec/acme/solvers/0/selector/dnsZones" "value" (list $intranetDomain)) (dict "op" "replace" "path" "/spec/acme/solvers/1/selector/dnsZones" "value" $hostedDomains) }}
    {{- $patches = append $patches (dict "target" (dict "group" "cert-manager.io" "version" "v1" "kind" "ClusterIssuer" "name" "public-acme") "patch" (toYaml $acmeIssuerPatchOps)) }}
    {{- end }}
    {{- end }}
    {{- if .injectClusterProvider }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "target" (dict "name" .nameNormalized "provider" (default "floci" $provider) "role" "ctrl")) }}
    {{- end }}
    {{- $valFiles := default list }}
    {{- if .helmValueFiles }}
    {{- $valFiles = .helmValueFiles }}
    {{- else if .helmValues }}
    {{- $valFiles = list .helmValues }}
    {{- else if .chart }}
    {{- $defaultVal := ternary (regexReplaceAll "/kustomize.*$" .path "/helm/values.yaml") (printf "%s/values.yaml" .path) (contains "/kustomize" .path) }}
    {{- $valFiles = list $defaultVal }}
    {{- end }}
    {{- with (index (default dict .helmValueOverridesByProvider) $provider) }}
    {{- $valFiles = concat $valFiles . }}
    {{- end }}
    {{- $vpaTargets := default list }}
    {{- $vpaUpdateMode := "InPlace" }}
    {{- $vpaControlledValues := "RequestsOnly" }}
    {{- if hasKey . "vpa" }}
      {{- if kindIs "bool" .vpa }}
        {{- if .vpa }}
          {{- $vpaTargets = list (dict "name" .component) }}
        {{- end }}
      {{- else if kindIs "slice" .vpa }}
        {{- $vpaTargets = .vpa }}
      {{- else if kindIs "map" .vpa }}
        {{- with .vpa.targets }}
          {{- $vpaTargets = . }}
        {{- end }}
        {{- with .vpa.updateMode }}
          {{- $vpaUpdateMode = . }}
        {{- end }}
        {{- with .vpa.controlledValues }}
          {{- $vpaControlledValues = . }}
        {{- end }}
      {{- else if kindIs "string" .vpa }}
        {{- if and (ne .vpa "custom") (ne .vpa "false") }}
          {{- $vpaTargets = list (dict "name" .vpa) }}
        {{- end }}
      {{- end }}
    {{- end }}
    spec:
    {{- with .ignoreDifferences }}
      ignoreDifferences: {{ . | toJson }}
    {{- end }}
      sources:
      {{- if .chart }}
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .releaseName | default .component }}'
            valueFiles:
            {{- range $valFiles }}
              - '$values/{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          ref: values
        {{- if not (hasSuffix "/helm" .path) }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if or $patches $kustomizeImages }}
          kustomize:
            {{- if $kustomizeImages }}
            images: {{ $kustomizeImages | toJson }}
            {{- end }}
            {{- if $patches }}
            patches: {{ $patches | toJson }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- else }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
        {{- if $valFiles }}
          helm:
            valueFiles:
            {{- range $valFiles }}
              - '{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        {{- else if or $patches $kustomizeImages }}
          kustomize:
            {{- if $kustomizeImages }}
            images: {{ $kustomizeImages | toJson }}
            {{- end }}
            {{- if $patches }}
            patches: {{ $patches | toJson }}
            {{- end }}
        {{- end }}
      {{- end }}
      {{- if $vpaTargets }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: src/infra/argocd/components/default_vpa/helm
          helm:
            valuesObject:
              enabled: true
              updateMode: '{{ $vpaUpdateMode }}'
              controlledValues: '{{ $vpaControlledValues }}'
              targets:
              {{- range $vpaTargets }}
                {{- if kindIs "map" . }}
                - name: '{{ .name }}'
                  {{- with .kind }}
                  kind: '{{ . }}'
                  {{- end }}
                  {{- with .apiVersion }}
                  apiVersion: '{{ . }}'
                  {{- end }}
                  {{- with .updateMode }}
                  updateMode: '{{ . }}'
                  {{- end }}
                  {{- with .minAllowed }}
                  minAllowed: {{ . | toJson }}
                  {{- end }}
                {{- else }}
                - name: '{{ . }}'
                {{- end }}
              {{- end }}
      {{- end }}
