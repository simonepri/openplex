    {{- $ecrRegistry = default "000000000000.dkr.ecr.us-west-2.amazonaws.com" $ecrRegistry }}
    {{- $instanceProfile := default (printf "KarpenterNodeInstanceProfile-%s" .nameNormalized) (coalesce (index $annotations "aws-instance-profile") (index $annotations "instance-profile")) }}
    {{- $nodeUserData := printf "MIME-Version: 1.0\nContent-Type: multipart/mixed; boundary=\"//\"\n\n--//\nContent-Type: text/cloud-config; charset=\"us-ascii\"\n\n#cloud-config\nwrite_files:\n  - path: /etc/containerd-stargz-grpc/config.toml\n    owner: root:root\n    permissions: '0644'\n    content: |\n      # Configures the AWS node-local eStargz snapshotter to reuse kubelet registry\n      # credentials. AL2023 cloud-init writes this file before nodeadm starts kubelet.\n\n      [cri_keychain]\n      enable_keychain = true\n      image_service_path = \"/run/containerd/containerd.sock\"\n\n      [[resolver.host.\"%s\".mirrors]]\n      host = \"127.0.0.1:4001\"\n      insecure = true\n  - path: /etc/systemd/system/stargz-snapshotter.service\n    owner: root:root\n    permissions: '0644'\n    content: |\n      # Starts the AWS eStargz snapshotter before containerd. AL2023 systemd consumes\n      # this unit after cloud-init writes it from EC2NodeClass user data.\n\n      [Unit]\n      Description=Containerd eStargz snapshotter\n      Wants=network-online.target\n      After=network-online.target\n      Before=containerd.service\n\n      [Service]\n      Type=notify\n      Environment=HOME=/root\n      ExecStart=/usr/local/bin/containerd-stargz-grpc --config=/etc/containerd-stargz-grpc/config.toml\n      Restart=always\n      RestartSec=1\n      RuntimeDirectory=containerd-stargz-grpc\n      StateDirectory=containerd-stargz-grpc\n\n      [Install]\n      WantedBy=multi-user.target\n  - path: /etc/systemd/system/containerd.service.d/10-stargz.conf\n    owner: root:root\n    permissions: '0644'\n    content: |\n      # Makes containerd depend on the AWS eStargz snapshotter. AL2023 cloud-init\n      # installs this systemd drop-in before nodeadm starts the runtime.\n\n      [Unit]\n      Wants=stargz-snapshotter.service\n      After=stargz-snapshotter.service\n  - path: /etc/systemd/system/dragonfly-prepull.service\n    owner: root:root\n    permissions: '0644'\n    content: |\n      [Unit]\n      Description=Pre-pull Dragonfly images so dfdaemon is up before the first model pull\n      After=network-online.target\n      Wants=network-online.target\n\n      [Service]\n      Type=oneshot\n      RemainAfterExit=yes\n      TimeoutStartSec=600\n      ExecStart=/usr/bin/bash -c 'until ctr version >/dev/null 2>&1; do sleep 1; done; TOKEN=\"$$(aws ecr get-login-password --region us-west-2)\"; for img in %s/mirror/busybox:1.37.0 %s/mirror/dragonflyoss/client:v1.5.7; do ctr -n k8s.io image pull --snapshotter stargz --user \"AWS:$$TOKEN\" \"$$img\"; done'\n\n      [Install]\n      WantedBy=multi-user.target\n--//\nContent-Type: text/x-shellscript; charset=\"us-ascii\"\n\n#!/usr/bin/env bash\n# Installs and verifies pinned AWS eStargz snapshotter before nodeadm starts containerd and kubelet.\n\nset -euo pipefail\n\nreadonly stargz_version=\"v0.18.2\"\nreadonly stargz_sha256=\"515a3c3af0012f192ace31fb79e910597977c77227e976680aeaaef6e9ae50a9\"\nreadonly stargz_url=\"https://github.com/containerd/stargz-snapshotter/releases/download/${stargz_version}/stargz-snapshotter-${stargz_version}-linux-amd64.tar.gz\"\nreadonly install_dir=\"${INSTALL_DIR:-/usr/local/bin}\"\nreadonly tmp_dir=\"${TMP_DIR:-/tmp}\"\nreadonly stargz_tarball=\"${tmp_dir}/stargz.tgz\"\nreadonly stargz_socket=\"${STARGZ_SOCKET:-/run/containerd-stargz-grpc/containerd-stargz-grpc.sock}\"\nreadonly stargz_root=\"${STARGZ_ROOT:-/var/lib/containerd-stargz-grpc}\"\n\n# shellcheck disable=SC2329 # Invoked by the EXIT trap.\ncleanup() {\n  rm -f \"${stargz_tarball}\"\n}\ntrap cleanup EXIT\n\nif [[ ! -x \"${install_dir}/containerd-stargz-grpc\" || ! -x \"${install_dir}/ctr-remote\" ]]; then\n  curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused -o \"${stargz_tarball}\" \"${stargz_url}\"\n  echo \"${stargz_sha256}  ${stargz_tarball}\" | sha256sum -c -\n  tar -C \"${install_dir}\" -xzf \"${stargz_tarball}\" containerd-stargz-grpc ctr-remote\n  chmod +x \"${install_dir}/containerd-stargz-grpc\" \"${install_dir}/ctr-remote\"\nfi\n\nmkdir -p \"${stargz_root}\"\n\nsystemctl daemon-reload\nsystemctl enable --now stargz-snapshotter.service\nfor _ in {1..60}; do\n  if systemctl is-active --quiet stargz-snapshotter.service && [[ -S ${stargz_socket} ]]; then\n    exit 0\n  fi\n  sleep 1\ndone\n\nsystemctl status --no-pager stargz-snapshotter.service >&2 || true\nexit 1\n--//\nContent-Type: text/x-shellscript; charset=\"us-ascii\"\n\n#!/usr/bin/env bash\n# shellcheck shell=bash\n#\n# Brings up the Dragonfly prepull unit, embedded into the userData shellscript MIME part.\n# The prepull warms the dfdaemon image the moment containerd is up, so dfdaemon serves\n# 127.0.0.1:4001 before the model image's first lazy resolve instead of losing that race and\n# forcing a fallback pull.\n\nset -euo pipefail\n\n# The prepull unit mints ECR creds via the aws CLI; fail loud now if it is absent rather than\n# silently losing the dfdaemon-before-first-resolve race on every boot.\ncommand -v aws >/dev/null || {\n  echo \"dragonfly-prepull: aws CLI not found on PATH; required to mint ECR pull creds\" >&2\n  exit 1\n}\n\n# Pick up the write_files-placed unit before enabling it.\nsystemctl daemon-reload\n# --no-block: the unit waits for containerd, which starts only after cloud-init finishes — a\n# blocking start here would deadlock node boot.\nsystemctl enable dragonfly-prepull.service\nsystemctl start --no-block dragonfly-prepull.service\n--//\nContent-Type: application/node.eks.aws\n\n---\n# Selects the eStargz CRI path for AL2023 Karpenter nodes. nodeadm merges this\n# fragment with the cluster bootstrap NodeConfig generated by Karpenter.\n\napiVersion: node.eks.aws/v1alpha1\nkind: NodeConfig\nspec:\n  containerd:\n    config: |\n      [plugins.\"io.containerd.cri.v1.images\"]\n        snapshotter = \"stargz\"\n        disable_snapshot_annotations = false\n        use_local_image_pull = true\n\n      [[plugins.\"io.containerd.transfer.v1.local\".unpack_config]]\n        platform = \"linux/amd64\"\n        snapshotter = \"stargz\"\n\n      [[plugins.\"io.containerd.transfer.v1.local\".unpack_config]]\n        platform = \"linux/amd64\"\n        snapshotter = \"overlayfs\"\n\n      [proxy_plugins.stargz]\n        type = \"snapshot\"\n        address = \"/run/containerd-stargz-grpc/containerd-stargz-grpc.sock\"\n        [proxy_plugins.stargz.exports]\n          root = \"/var/lib/containerd-stargz-grpc\"\n  kubelet:\n    config:\n      failSwapOn: false\n      memorySwap:\n        swapBehavior: LimitedSwap\n    flags:\n      - --image-service-endpoint=unix:///run/containerd-stargz-grpc/containerd-stargz-grpc.sock\n--//--\n" $ecrRegistry $ecrRegistry $ecrRegistry }}
    {{- $karpenterDiscoveryPatch := printf "- op: replace\n  path: /spec/instanceProfile\n  value: %s\n- op: replace\n  path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery\n  value: %s\n- op: replace\n  path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery\n  value: %s\n- op: replace\n  path: /spec/tags/cluster\n  value: %s\n- op: replace\n  path: /spec/tags/karpenter.sh~1discovery\n  value: %s\n- op: replace\n  path: /spec/userData\n  value: %q" $instanceProfile .nameNormalized .nameNormalized .nameNormalized .nameNormalized $nodeUserData }}
    # floci-divergence: Floci EC2 emulator requires AL2023 AMI family selector.
    {{- if eq $provider "floci" }}
    {{- $karpenterDiscoveryPatch = printf "%s\n- op: replace\n  path: /spec/amiSelectorTerms\n  value:\n    - name: \"*al2023*\"\n- op: add\n  path: /spec/amiFamily\n  value: AL2023" $karpenterDiscoveryPatch }}
    {{- end }}
