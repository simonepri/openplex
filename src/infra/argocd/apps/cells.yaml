# ApplicationSet dispatching infrastructure applications across all cell clusters.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cell-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  goTemplate: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values: [substrate]
          maxUpdate: 100%
        - matchExpressions:
            - key: tier
              operator: In
              values: [fleet]
          maxUpdate: 100%
  syncPolicy:
    applicationsSync: sync
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                # Component waves follow the latest API or resource each one consumes,
                # never the kind of thing it is. Capacity provisioning and cluster DNS
                # run at wave 5 so every later wave can be scheduled onto Karpenter nodes.
                # Wave 10: Bootstrap contracts and admission
                - component: cert-manager
                  tier: substrate
                  path: src/infra/argocd/components/cert_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: cert-manager
                  chartRepo: https://charts.jetstack.io
                  chartVersion: v1.21.2
                  vpa:
                    targets:
                      - cert-manager
                      - cert-manager-cainjector
                      - cert-manager-webhook
                - component: external-secrets
                  tier: substrate
                  path: src/infra/argocd/components/external_secrets/kustomize
                  namespace: external-secrets-system
                  wave: "10"
                  chart: external-secrets
                  chartRepo: https://charts.external-secrets.io
                  chartVersion: 2.11.0
                  vpa:
                    targets:
                      - external-secrets
                      - external-secrets-cert-controller
                      - external-secrets-webhook
                - component: kueue-admission
                  tier: fleet
                  path: src/infra/argocd/components/kueue_admission/helm
                  namespace: kueue-system
                  wave: "10"
                  helmValues: values.yaml
                - component: kyverno
                  tier: substrate
                  path: src/infra/argocd/components/kyverno/kustomize
                  namespace: kyverno-system
                  wave: "10"
                  chart: kyverno
                  chartRepo: https://kyverno.github.io/kyverno
                  # LINT.IfChange(kyverno-chart-version)
                  chartVersion: 3.9.1
                  # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:kyverno-chart-version,//src/bazel/module_deps/vendor_helm_charts.MODULE.bazel:kyverno-chart-version,//src/infra/argocd/components/kyverno/helm/values.yaml:kyverno-chart-version)
                  vpa:
                    targets:
                      - kyverno-admission-controller
                      - kyverno-background-controller
                      - kyverno-cleanup-controller
                      - kyverno-reports-controller
                  ignoreDifferences:
                    - group: apiextensions.k8s.io
                      kind: CustomResourceDefinition
                      jsonPointers:
                        - /metadata/labels
                      jqPathExpressions:
                        - .metadata.labels
                    - group: flowcontrol.apiserver.k8s.io
                      kind: FlowSchema
                      jqPathExpressions:
                        - .spec.rules[].resourceRules[].namespaces
                - component: scheduling-priorities
                  tier: substrate
                  path: src/infra/argocd/components/scheduling_priorities/kustomize
                  namespace: kube-system
                  wave: "10"
                - component: trust-manager
                  tier: substrate
                  path: src/infra/argocd/components/trust_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: trust-manager
                  chartRepo: quay.io/jetstack/charts
                  chartVersion: v0.25.0

                - component: vpa
                  tier: substrate
                  path: src/infra/argocd/components/vpa/kustomize
                  namespace: vpa-system
                  wave: "10"
                  chart: vertical-pod-autoscaler
                  chartRepo: https://kubernetes.github.io/autoscaler
                  chartVersion: 0.13.0
                  vpa:
                    targets:
                      - vpa-admission-controller
                      - vpa-recommender
                      - vpa-updater

                # Wave 20: Operators and foundational services
                - component: barman-cloud
                  tier: fleet
                  path: src/infra/argocd/components/barman_cloud/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: plugin-barman-cloud
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.8.1
                  vpa:
                    targets:
                      - barman-cloud-plugin-barman-cloud
                - component: cloudnative-pg
                  tier: fleet
                  path: src/infra/argocd/components/cloudnative_pg/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: cloudnative-pg
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.29.1
                - component: csi-rclone
                  tier: fleet
                  path: src/infra/argocd/components/csi_rclone/kustomize
                  namespace: csi-rclone-system
                  wave: "20"
                  chart: csi-driver-rclone
                  chartRepo: ghcr.io/veloxpack/charts
                  chartVersion: 0.5.0
                  releaseName: rclone-csi
                  vpa: custom
                - component: envoy-gateway
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway/helm
                  namespace: envoy-gateway-system
                  wave: "20"
                  chart: gateway-helm
                  chartRepo: registry-1.docker.io/envoyproxy
                  chartVersion: 1.9.2
                - component: keda
                  tier: fleet
                  path: src/infra/argocd/components/keda/kustomize
                  namespace: keda-system
                  wave: "20"
                  chart: keda
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 2.21.0
                  vpa:
                    targets:
                      - keda-operator
                      - keda-operator-metrics-apiserver
                      - keda-admission-webhooks
                - component: keda-http
                  tier: fleet
                  path: src/infra/argocd/components/keda_http/helm
                  namespace: keda-system
                  wave: "20"
                  chart: keda-add-ons-http
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 0.16.0
                  vpa:
                    targets:
                      - keda-add-ons-http-controller-manager
                      - keda-add-ons-http-external-scaler
                      - keda-add-ons-http-interceptor
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      jsonPointers:
                        - /spec/template/spec/containers/0/image
                      jqPathExpressions:
                        - .spec.template.spec.containers[0].image
                - component: kueue
                  tier: fleet
                  path: src/infra/argocd/components/kueue/kustomize
                  namespace: kueue-system
                  wave: "20"
                  chart: kueue
                  chartRepo: registry.k8s.io/kueue/charts
                  chartVersion: 0.20.0
                  vpa:
                    targets:
                      - kueue-controller-manager
                - component: k8s-cleaner
                  tier: fleet
                  path: src/infra/argocd/components/k8s_cleaner/kustomize
                  namespace: k8s-cleaner-system
                  wave: "20"
                  chart: k8s-cleaner
                  chartRepo: ghcr.io/gianlucam76/charts
                  chartVersion: 0.24.0
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: k8s-cleaner
                      jsonPointers:
                        - /spec/template/spec/containers/0/env/0/valueFrom/resourceFieldRef/divisor
                        - /spec/template/spec/containers/0/env/1/valueFrom/resourceFieldRef/divisor
                      jqPathExpressions:
                        - .spec.template.spec.containers[0].env[]?.valueFrom.resourceFieldRef.divisor
                - component: pvc-autoresizer
                  tier: fleet
                  path: src/infra/argocd/components/pvc_autoresizer/kustomize
                  namespace: pvc-autoresizer-system
                  wave: "20"
                  chart: pvc-autoresizer
                  chartRepo: https://topolvm.github.io/pvc-autoresizer
                  chartVersion: 0.20.0
                  vpa:
                    targets:
                      - pvc-autoresizer-controller
                - component: storage-classes
                  tier: substrate
                  path: src/infra/argocd/components/storage_classes/helm
                  namespace: kube-system
                  wave: "20"
                  helmValues: values.yaml
                - component: valkey-operator
                  tier: fleet
                  path: src/infra/argocd/components/valkey_operator/kustomize
                  namespace: valkey-system
                  wave: "20"
                  chart: valkey-operator
                  chartRepo: https://valkey.io/valkey-helm
                  chartVersion: 0.7.0
                # Wave 30: Cluster storage and ingress routing
                - component: dragonfly-peer
                  tier: fleet
                  path: src/infra/argocd/components/dragonfly_peer/kustomize
                  namespace: dragonfly-system
                  wave: "30"
                  chart: dragonfly
                  chartRepo: https://dragonflyoss.github.io/helm-charts
                  chartVersion: 1.8.5
                  releaseName: dragonfly
                  vpa:
                    targets:
                      - name: dragonfly-client
                        kind: DaemonSet
                        updateMode: Initial
                      - name: dragonfly-scheduler
                        kind: StatefulSet
                        updateMode: InPlace
                      - name: dragonfly-seed-client
                        kind: StatefulSet
                        updateMode: InPlace
                  helmValueOverridesByProvider:
                    floci:
                      - src/infra/argocd/components/dragonfly_peer/helm/client-image.yaml
                  ignoreDifferences:
                    - group: apps
                      kind: StatefulSet
                      jsonPointers:
                        - /spec/volumeClaimTemplates/0/status
                        - /spec/volumeClaimTemplates/0/apiVersion
                        - /spec/volumeClaimTemplates/0/kind
                        - /spec/volumeClaimTemplates/0/spec/volumeMode
                      jqPathExpressions:
                        - .spec.volumeClaimTemplates[0].status
                        - .spec.volumeClaimTemplates[0].apiVersion
                        - .spec.volumeClaimTemplates[0].kind
                        - .spec.volumeClaimTemplates[0].spec.volumeMode
                    - group: ""
                      kind: Service
                      jsonPointers:
                        - /spec/clusterIP
                        - /spec/clusterIPs
                      jqPathExpressions:
                        - .spec.clusterIP
                        - .spec.clusterIPs
                - component: envoy-gateway-instance
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway_instance/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa:
                    targets:
                      - private-access-gateway
                  helmValues: values.yaml
                  helmValuesObject:
                    foundation:
                      manageNamespace: true
                      namespaceLabels:
                        cost-center: shared-infrastructure
                        environment: production
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/audit-version: latest
                        pod-security.kubernetes.io/enforce: restricted
                        pod-security.kubernetes.io/enforce-version: latest
                        pod-security.kubernetes.io/warn: restricted
                        pod-security.kubernetes.io/warn-version: latest
                        ray-dashboard-routes: "true"
                    gateway:
                      enabled: true
                      canonicalScheme: https
                      name: private-access
                      namespace: envoy-gateway-system
                      className: envoy-gateway-private-access
                      aliasDomain: corp.local.internal
                      allowedNamespaces:
                        # keep-sorted start
                        - envoy-gateway-system
                        - keda-system
                        - kube-oidc-proxy-system
                        - kube-system
                        - s3-system
                        - velero-system
                        # keep-sorted end
                      listeners:
                        http: {enabled: true, redirectToHTTPS: true}
                        https:
                          enabled: true
                          certificateSecret: private-access-tls
                          aliasCertificateSecret: private-access-alias-tls
                        kubeOidcTls:
                          enabled: true
                        s3Http: {enabled: true}
                    certificate:
                      enabled: true
                      issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-local-ca}
                      caIssuer: {enabled: false}
                    proxy:
                      backendEgress:
                        - namespace: keda-system
                          podSelector:
                            app.kubernetes.io/component: interceptor
                            app.kubernetes.io/instance: keda-http
                            app.kubernetes.io/name: http-add-on
                          ports: [8080]
                        - namespace: s3-system
                          podSelector:
                            app.kubernetes.io/name: s3-gateway
                          ports: [8080]
                        - namespace: velero-system
                          podSelector:
                            app.kubernetes.io/name: velero-ui
                          ports: [3000]
                      deployment:
                        name: private-access-gateway
                      service:
                        name: private-access-gateway
                        type: ClusterIP
                        clusterIPv4: 172.31.16.11
                        loadBalancerClass: ""
                        annotations: {}
                        externalTrafficPolicy: Cluster
                        ipFamilyPolicy: SingleStack
                        ipFamilies: [IPv4]
                        loadBalancerSourceRanges: []
                        nodePorts: {http: 0, tls: 0}
                - component: kube-oidc-proxy
                  tier: fleet
                  path: src/infra/argocd/components/kube_oidc_proxy/kustomize
                  namespace: kube-oidc-proxy-system
                  wave: "30"
                  vpa: custom
                - component: kuberay
                  tier: fleet
                  path: src/infra/argocd/components/kuberay/kustomize
                  namespace: kuberay-system
                  wave: "30"
                  chart: kuberay-operator
                  chartRepo: https://ray-project.github.io/kuberay-helm
                  chartVersion: 1.7.1
                  vpa:
                    targets:
                      - kuberay
                - component: routing-registry
                  tier: fleet
                  path: src/infra/argocd/components/routing_registry/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  helmValues: values.yaml
                  helmValueFiles:
                    - routes.yaml
                  injectClusterProvider: true
                  helmValuesObject:
                    phase: all
                    exposure: private
                    gatewayOIDC: {}
                    gateway:
                      canonicalScheme: https
                      httpRedirect: true
                      name: private-access
                      namespace: envoy-gateway-system
                - component: s3-gateway
                  tier: fleet
                  path: src/infra/argocd/components/s3_gateway/kustomize
                  namespace: s3-system
                  wave: "30"
                  companionChart: src/infra/argocd/components/s3_gateway/helm
                  flociResolverImage: localhost:15100/000000000000/us-east-1/src/infra/tools/s3_resolver/server@sha256:0de8df5a4584f347e4545da6e3e78377d689117f8a007e07056b8b1a4bcd06a1
                  vpa: custom

                # Wave 40: Telemetry, scheduling and workload services
                - component: kuberhealthy
                  tier: fleet
                  path: src/infra/argocd/components/kuberhealthy/kustomize
                  namespace: kuberhealthy
                  wave: "40"
                  chart: kuberhealthy
                  chartRepo: https://kuberhealthy.github.io/kuberhealthy/helm-repos
                  chartVersion: "100"
                - component: oauth2-proxy
                  tier: fleet
                  path: src/infra/argocd/components/oauth2_proxy/helm
                  namespace: oauth2-proxy-system
                  wave: "40"
                  helmValues: values.yaml
                - component: opencost
                  tier: fleet
                  path: src/infra/argocd/components/opencost/kustomize
                  namespace: opencost
                  wave: "40"
                  chart: opencost
                  chartRepo: https://opencost.github.io/opencost-helm-chart
                  chartVersion: 2.5.32
                  vpa:
                    targets:
                      - opencost
                      - opencost-auth-proxy
                - component: otel-collector
                  tier: fleet
                  path: src/infra/argocd/components/otel_collector/kustomize
                  namespace: otel-system
                  wave: "40"
                  chart: opentelemetry-collector
                  chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chartVersion: 0.175.0
                  injectClusterName: true
                  vpa: custom
                  helmValuesObject:
                    extraEnvs:
                      - name: OTLP_ENDPOINT
                        valueFrom:
                          secretKeyRef: {name: observability-door-cell, key: endpoint}
                      - name: OTLP_AUTHORIZATION
                        valueFrom:
                          secretKeyRef: {name: observability-door-cell, key: authorization}
                    config:
                      exporters:
                        otlphttp/signoz:
                          endpoint: '${env:OTLP_ENDPOINT}'
                          headers:
                            Authorization: '${env:OTLP_AUTHORIZATION}'
                          tls:
                            ca_file: /etc/cluster-ca/ca.crt
                - component: parca-agent
                  tier: fleet
                  path: src/infra/argocd/components/parca_agent/kustomize
                  namespace: parca
                  wave: "40"
                  vpa:
                    targets:
                      - name: parca-agent
                        kind: DaemonSet
                        updateMode: Initial
                      - name: parca-agent-gpu
                        kind: DaemonSet
                        updateMode: Initial
                - component: node-problem-detector
                  tier: fleet
                  path: src/infra/argocd/components/node_problem_detector/kustomize
                  namespace: node-problem-detector
                  wave: "40"
                  vpa: custom
                - component: prometheus-api-bridge
                  tier: fleet
                  path: src/infra/argocd/components/prometheus_api_bridge/kustomize
                  namespace: signoz
                  wave: "40"
                  chart: prometheus-api-bridge
                  chartRepo: ghcr.io/simonepri/charts
                  chartVersion: 0.3.0
                  injectClusterName: true
                  vpa:
                    targets:
                      - prometheus-api-bridge
                      - prometheus-api-bridge-collector
                      - prometheus-api-bridge-kube-state-metrics
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: prometheus-api-bridge
                      jsonPointers:
                        - /metadata/generation
                        - /spec/replicas
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.replicas
                - component: tailscale-access
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_access/helm
                  namespace: tailscale-system
                  wave: "40"
                  helmValues: values.yaml
                  helmValuesObject:
                    mode: local-router
                    clusterName: ""
                    serviceCIDR: ""
                    internalDomain: ""
                    resolverRoutes: []
                    egress:
                      enabled: true
                      gatewayIPv4: ""
                      kubernetesAPIs: {}
                    cloud:
                      secretStoreName: runtime-secrets
                      oauthRemoteKey: ""
                    local:
                      loginServer: ""
                      authSecretName: headscale-preauth
                      recordName: ""
                      runtimeForwardTarget: ""
                      secretStoreName: local-secret-records
                - component: velero
                  tier: fleet
                  path: src/infra/argocd/components/velero/helm
                  helmValueOverridesByProvider:
                    floci: [src/infra/argocd/components/velero/helm/providers/floci.yaml]
                  namespace: velero-system
                  wave: "40"
                  chart: velero
                  chartRepo: https://vmware-tanzu.github.io/helm-charts
                  chartVersion: 12.2.0
                  vpa:
                    targets:
                      - name: velero
                        kind: Deployment
                      - name: node-agent
                        kind: DaemonSet
                        updateMode: Initial
                - component: velero-ui
                  tier: fleet
                  path: src/infra/argocd/components/velero_ui/kustomize
                  namespace: velero-system
                  wave: "40"
                  chart: velero-ui
                  chartRepo: https://helm.otwld.com
                  chartVersion: 0.16.0

                # Wave 50: Security, compliance, and network policies
                - component: cluster-access
                  tier: fleet
                  path: src/infra/argocd/components/cluster_access/kustomize
                  namespace: argocd
                  wave: "50"
                - component: falco
                  tier: fleet
                  path: src/infra/argocd/components/falco/kustomize
                  namespace: falco
                  wave: "50"
                  chart: falco
                  chartRepo: https://falcosecurity.github.io/charts
                  chartVersion: 9.2.0
                  vpa: custom
                - component: kubescape-operator
                  tier: fleet
                  path: src/infra/argocd/components/kubescape_operator/kustomize
                  namespace: kubescape-system
                  wave: "50"
                  chart: kubescape-operator
                  chartRepo: https://kubescape.github.io/helm-charts
                  chartVersion: 1.40.4
                  vpa:
                    targets:
                      - kubescape
                      - operator
                      - prometheus-exporter
                      - storage
                  helmValuesObject:
                    kubescapeScheduler:
                      scanSchedule: "22 1,9,17 * * *"
                - component: network-isolation
                  tier: fleet
                  path: src/infra/argocd/components/network_isolation/helm
                  namespace: kube-system
                  wave: "50"
                  helmValues: values.yaml
                  helmValuesObject:
                    namespaces:
                      # keep-sorted start
                      - argocd
                      - buildbuddy
                      - cert-manager-system
                      - cnpg-system
                      - csi-rclone-system
                      - dragonfly-system
                      - envoy-gateway-system
                      - external-secrets-system
                      - falco
                      - k8s-cleaner-system
                      - keda-system
                      - kuberay-system
                      - kubescape-system
                      - kueue-system
                      - kyverno-system
                      - node-problem-detector
                      - opencost
                      - otel-system
                      - parca
                      - pvc-autoresizer-system
                      - s3-system
                      - signoz
                      - tailscale-system
                      - trivy-system
                      - valkey-system
                      - velero-system
                      - vpa-system
                      # keep-sorted end
                - component: trivy-operator
                  tier: fleet
                  path: src/infra/argocd/components/trivy_operator/kustomize
                  namespace: trivy-system
                  wave: "50"
                  chart: trivy-operator
                  chartRepo: https://aquasecurity.github.io/helm-charts
                  chartVersion: 0.36.0
                - component: trivy-server
                  tier: fleet
                  path: src/infra/argocd/components/trivy_server/kustomize
                  namespace: trivy-system
                  wave: "50"
                  chart: trivy
                  chartRepo: https://aquasecurity.github.io/helm-charts
                  chartVersion: 0.27.0
                  vpa: custom
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: aws
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: aws-load-balancer-controller
                  tier: fleet
                  path: src/infra/argocd/components/aws_load_balancer_controller/helm
                  namespace: kube-system
                  wave: "20"
                  vpa: true
                  chart: aws-load-balancer-controller
                  chartRepo: https://aws.github.io/eks-charts
                  chartVersion: 3.5.0
                - component: external-dns
                  tier: fleet
                  path: src/infra/argocd/components/external_dns/kustomize
                  namespace: external-dns-system
                  wave: "30"
                  chart: external-dns
                  chartRepo: https://kubernetes-sigs.github.io/external-dns
                  chartVersion: 1.23.0
                - component: tailscale-operator
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_operator/helm
                  namespace: tailscale-system
                  wave: "20"
                  chart: tailscale-operator
                  chartRepo: https://pkgs.tailscale.com/helmcharts
                  chartVersion: 1.102.4
    # AWS Karpenter autoscaler (Wave 5): provider == aws AND karpenter != disabled.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: aws
                        role: cell
                      matchExpressions:
                        - key: karpenter
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: karpenter-aws
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_aws/kustomize/overlays/cells
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: public.ecr.aws/karpenter
                  chartVersion: 1.14.0
                  vpa:
                    targets:
                      - karpenter-aws

    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: gcp
                        role: cell
                      matchExpressions:
                        - key: karpenter
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: karpenter-gcp
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_gcp/kustomize
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: https://cloudpilot-ai.github.io/karpenter-provider-gcp
                  chartVersion: 0.6.1
                  vpa:
                    targets:
                      - karpenter-gcp
                - component: external-dns
                  tier: fleet
                  path: src/infra/argocd/components/external_dns/kustomize
                  namespace: external-dns-system
                  wave: "30"
                  chart: external-dns
                  chartRepo: https://kubernetes-sigs.github.io/external-dns
                  chartVersion: 1.23.0
                - component: tailscale-operator
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_operator/helm
                  namespace: tailscale-system
                  wave: "20"
                  chart: tailscale-operator
                  chartRepo: https://pkgs.tailscale.com/helmcharts
                  chartVersion: 1.102.4
    # AWS Karpenter autoscaler (Wave 5): provider == aws AND karpenter != disabled.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: aws
                        role: cell
                      matchExpressions:
                        - key: karpenter
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: karpenter-aws
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_aws/kustomize/overlays/cells
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: public.ecr.aws/karpenter
                  chartVersion: 1.14.0
                  vpa:
                    targets:
                      - karpenter-aws

    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: floci
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: coredns
                  tier: substrate
                  path: src/infra/argocd/components/coredns/helm
                  namespace: kube-system
                  wave: "5"
                  vpa: true
                  helmValues: values.yaml
                  injectClusterDomain: true
                  helmValuesObject:
                    provider: floci
                    cluster: {name: "", role: cell}
                    accessAliasDomain: ""
                    control:
                      name: ""
                      gatewayIPv4: ""
                      headscaleIPv4: ""
                      originRegistryIPv4: ""
                    internalDomain: ""
                    cellDomains: {}
                    cellIPv4s: {}
                    privateAccess:
                      baseDomain: ""
                      coderAppsWildcard: false
                      gatewayIPv4: ""
                      recordLabels: [coder-snapshots, kube-oidc-proxy, ray, s3-gateway, snapshots, svelte-web, velero-ui]
                    rewrites: {}
                - component: rawfile-localpv
                  tier: substrate
                  path: src/infra/argocd/components/rawfile_localpv/kustomize
                  namespace: kube-system
                  wave: "20"
                  chart: rawfile-localpv
                  chartRepo: https://openebs.github.io/rawfile-localpv
                  chartVersion: 0.15.3
                  helmValuesObject:
                    image:
                      registry: localhost:15100
                      repository: 000000000000/us-east-1/src/third_party/openebs/rawfile-localpv
                      tag: v0.15.3-r1@sha256:d7498ff0f5380f745f740164640e042c6b2f87174f2f7a6299d43c67c75f8ff4
                  vpa:
                    targets:
                      - name: rawfile-localpv-controller
                        kind: Deployment
                      - name: rawfile-localpv-node
                        kind: DaemonSet
                        updateMode: Initial
                - component: karpenter-aws
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_aws/kustomize/overlays/cells
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: public.ecr.aws/karpenter
                  chartVersion: 1.14.0
                  vpa:
                    targets:
                      - karpenter-aws
                - component: local-storage-inventory-producer
                  tier: fleet
                  path: src/infra/argocd/components/local_storage_inventory_producer/kustomize
                  namespace: s3-system
                  wave: "30"
    # BuildBuddy in-cluster cache is only dispatched when mode is not cloud.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/mode
                          operator: NotIn
                          values:
                            - cloud
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-cache
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_cache/kustomize
                  namespace: buildbuddy
                  wave: "40"
                  vpa: custom
                  ignoreDifferences:
                    - group: ""
                      kind: PersistentVolumeClaim
                      name: buildbuddy-cache-data
                      namespace: buildbuddy
                      jsonPointers:
                        - /metadata/annotations
                        - /spec/resources/requests/storage
                      jqPathExpressions:
                        - .metadata.annotations
                        - .spec.resources.requests.storage
    # BuildBuddy Enterprise Cache Proxy (Wave 30): mode == cloud AND enterprise-proxy == enabled.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/enterprise-proxy: enabled
                        buildbuddy.io/mode: cloud
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-enterprise-cache-proxy
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_enterprise_cache_proxy/kustomize
                  namespace: buildbuddy
                  wave: "30"
                  chart: buildbuddy-enterprise-cache-proxy
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.1.0
    # BuildBuddy Hosted / Self-Hosted CPU Executors (Wave 40): mode == cloud AND executors in [all, cpu].
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/mode: cloud
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/executors
                          operator: In
                          values:
                            - all
                            - cpu
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-executor
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_executor/kustomize
                  namespace: buildbuddy
                  wave: "40"
                  chart: buildbuddy-executor
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.1.0
    # BuildBuddy Hosted / Self-Hosted GPU Executors (Wave 40): mode == cloud AND executors in [all, gpu].
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/mode: cloud
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/executors
                          operator: In
                          values:
                            - all
                            - gpu
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-executor-gpu
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_executor/helm
                  namespace: buildbuddy
                  wave: "40"
                  chart: buildbuddy-executor
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.1.0
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        gpu: "true"
                        role: cell
                      matchExpressions:
                        - key: gpu-operator
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: gpu-operator
                  tier: fleet
                  path: src/infra/argocd/components/gpu_operator/kustomize
                  namespace: gpu-system
                  wave: "20"
                  chart: gpu-operator
                  chartRepo: https://helm.ngc.nvidia.com/nvidia
                  chartVersion: v26.7.1
                  vpa:
                    targets:
                      - name: gpu-operator
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-gc
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-master
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-worker
                        kind: DaemonSet
                        updateMode: Initial
  template:
    metadata:
      name: '{{ .nameNormalized }}-{{ .component }}'
      namespace: argocd
      annotations:
        # keep-sorted start
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        # keep-sorted end
      labels:
        # keep-sorted start
        cluster: '{{ .nameNormalized }}'
        role: cell
        team: global
        tier: '{{ .tier }}'
        wave: '{{ .wave }}'
        # keep-sorted end
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-cell
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # LINT.IfChange(sync-retry)
        # Bounded so a persistently failing sync (including hooks) ends as Failed and alerts, while ~25 minutes of
        # backoff still covers bootstrap ordering across sync waves.
        retry:
          limit: 10
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:sync-retry,//src/infra/argocd/apps/teams.yaml:sync-retry)
        syncOptions:
          # keep-sorted start
          - CreateNamespace=true
          - IncludeMutationWebhook=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          # keep-sorted end
  templatePatch: |
    {{- $provider := default "" (index .metadata.labels "provider") }}
    # floci-divergence: Local development clusters default to the minimal resource profile to fit host resources.
    {{- $profileName := default (ternary "minimal" "production" (eq $provider "floci")) (index .metadata.labels "profile") }}
    {{- if not (hasKey .profiles $profileName) }}
    {{- fail (printf "unknown availability profile %q" $profileName) }}
    {{- end }}
    {{- $profile := index .profiles $profileName }}
    {{- $componentProfile := default dict (index $profile.components .component) }}
    {{- $helmValues := mergeOverwrite (deepCopy (default dict $componentProfile.helmValues)) (default dict .helmValuesObject) }}
    {{- $annotations := default dict .metadata.annotations }}
    {{- if eq .component "s3-gateway" }}
    {{- $registered := index $annotations "registered-cells" }}
    {{- if not $registered }}{{ fail "S3 gateway requires the registered-cells annotation" }}{{- end }}
    {{- $regList := splitList "," $registered }}
    {{- $catalog := list }}
    {{- range $c := $regList }}
    {{- $vName := trimPrefix "cell-" $c }}
    # floci-divergence: Floci emulates secret stores via local-secret-records.
    {{- $secretStore := ternary "local-secret-records" "runtime-secrets" (eq $provider "floci") }}
    {{- $cProvider := ternary "floci" (ternary "aws" "gcp" (hasPrefix "cell-aws" $c)) (hasPrefix "cell-eaws" $c) }}
    {{- $cRegion := ternary "lh1" (ternary "us-west-2" "europe-west4" (hasPrefix "cell-aws" $c)) (hasPrefix "cell-eaws" $c) }}
    {{- $cEntry := dict "name" $c "virtualName" $vName "crossRegionService" (printf "s3-gateway-cross-region-%s" $c) "crossRegionServer" (printf "s3-gateway.%s.example.invalid" $c) "gatewayRecord" (printf "s3-gateway-config-%s" $c) "gatewaySecretStore" $secretStore "globalReplicatorIdentity" "global-replicator" "storageStatsIdentity" "storage-stats" "storageStatsService" "s3-gateway-storage-stats-cross-region-configured" "storageStatsServer" (printf "s3-gateway.%s.example.invalid" $c) "buckets" (dict "home" (dict "account" "" "name" (printf "cloud-%s-home" $c)) "meta" (dict "account" "" "name" (printf "cloud-%s-meta" $c)) "scratch" (dict "account" "" "name" (printf "cloud-%s-scratch" $c)) "backups" (dict "account" "" "name" (printf "cloud-%s-backups" $c)) "archive" (dict "account" "" "name" (printf "cloud-%s-archive" $c))) "callers" (dict "globalReplicator" (dict "accessKeyId" "00000000000000000000") "orgWorkspaceBackups" (dict "accessKeyId" "11111111111111111111") "storageStats" (dict "accessKeyId" "22222222222222222222") "teams" (dict "examples" (dict "accessKeyId" "33333333333333333333"))) "provider" $cProvider "region" $cRegion }}
    {{- $catalog = append $catalog $cEntry }}
    {{- end }}
    {{- $writerCell := coalesce (index $annotations "writer-cell") (index $annotations "writerCell") (first $regList) }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "targetCell" .nameNormalized "registeredCells" $regList "writerCell" $writerCell "cellCatalog" $catalog) }}
    # floci-divergence: Floci gateways use the registered emulator endpoint for S3 requests.
    {{- if eq $provider "floci" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "flociS3Endpoint" (index $annotations "s3-endpoint")) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "network-isolation" }}
    {{- $namespaces := default list (index $helmValues "namespaces") }}
    {{- if eq (default "false" (index .metadata.labels "gpu")) "true" }}
    {{- $namespaces = append $namespaces "gpu-system" }}
    {{- end }}
    {{- if or (eq $provider "aws") (eq $provider "gcp") }}
    {{- $namespaces = append $namespaces "external-dns-system" }}
    {{- if ne (default "" (index .metadata.labels "karpenter")) "disabled" }}
    {{- $namespaces = append $namespaces "karpenter-system" }}
    {{- end }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "namespaces" $namespaces) }}
    {{- end }}
    {{- $repoURL := index $annotations "git-repo-url" }}
    {{- $publicDomain := default "local.internal" (index $annotations "public-domain") }}
    {{- $intranetDomain := default (printf "corp.%s" $publicDomain) (or (index $annotations "intranet-domain") (index $annotations "domain")) }}
    {{- $clusterDomain := default (printf "c.%s" $intranetDomain) (or (index $annotations "cluster-domain") (index $annotations "access-domain")) }}
    {{- $accessDomain := $clusterDomain }}
    {{- $dexHost := printf "dex.%s" $intranetDomain }}
    {{- $operatorGroupEmail := coalesce (index $annotations "operator-group-email") (index $annotations "operator-group") (printf "operators@%s" $publicDomain) }}
    {{- $hostedDomains := default (list $publicDomain) }}
    {{- with index $annotations "hosted-domains" }}
    {{- $hostedDomains = splitList "," . }}
    {{- end }}
    {{- $operatorEmails := list }}
    {{- with or (index $annotations "operator-emails") (index $annotations "operator-email") }}
    {{- range $e := splitList "," . }}
    {{- $trimmed := trim $e }}
    {{- if ne $trimmed "" }}
    {{- $operatorEmails = append $operatorEmails $trimmed }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $operatorGroups := list "operators" }}
    # floci-divergence: Local clusters do not have Google Workspace directory groups.
    {{- if and (ne $provider "floci") (ne $provider "") }}
    {{- if not (has $operatorGroupEmail $operatorGroups) }}
    {{- $operatorGroups = append $operatorGroups $operatorGroupEmail }}
    {{- end }}
    {{- range $d := $hostedDomains }}
    {{- $domainGroup := printf "operators@%s" $d }}
    {{- if not (has $domainGroup $operatorGroups) }}
    {{- $operatorGroups = append $operatorGroups $domainGroup }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if eq .component "tailscale-access" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized "internalDomain" $clusterDomain) }}
    # floci-divergence: Floci clusters use in-cluster Headscale CA configmap and local router credentials instead of cloud-connector mode.
    {{- if eq $provider "floci" }}
    {{- $controlClusterName := coalesce (index $annotations "control-cluster-name") (index $annotations "control-cluster") (regexReplaceAll "^cell-" .nameNormalized "ctrl-") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "internalDomain" $clusterDomain "local" (dict "caConfigMapName" "cluster-local-ca" "recordName" (printf "headscale-preauth-%s" $controlClusterName) "loginServer" (printf "https://headscale.%s" $clusterDomain))) }}
    {{- else }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "mode" "cloud-connector") }}
    {{- end }}
    {{- with (index $annotations "service-cidr") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "serviceCIDR" .) }}
    {{- end }}
    {{- $defaultTailscaleKey := printf "%s-tailscale-operator-oauth" .nameNormalized }}
    {{- $tailscaleKey := default $defaultTailscaleKey (index $annotations "tailscale-oauth-key") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "cloud" (dict "oauthRemoteKey" $tailscaleKey)) }}
    {{- with (index $annotations "control-gateway-ipv4") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "egress" (dict "gatewayIPv4" .)) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "coredns" }}
    # floci-divergence: Floci local clusters route to deterministic gateway IPs.
    {{- $cellGatewayIPv4 := default (ternary "172.31.16.11" "" (eq $provider "floci")) (coalesce (index $annotations "gateway-ipv4") (index $annotations "cell-gateway-ipv4")) }}
    # floci-divergence: Floci local clusters route to deterministic control gateway IP.
    {{- $controlGatewayIPv4 := default (ternary "172.31.0.11" "" (eq $provider "floci")) (index $annotations "control-gateway-ipv4") }}
    {{- $controlClusterName := coalesce (index $annotations "control-cluster-name") (index $annotations "control-cluster") (regexReplaceAll "^cell-" .nameNormalized "ctrl-") }}
    {{- $cellDomain := printf "%s.%s" .nameNormalized $clusterDomain }}
    {{- $cellDomains := dict .nameNormalized $clusterDomain }}
    {{- $cellIPv4s := dict .nameNormalized $cellGatewayIPv4 }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "provider" $provider "cluster" (dict "name" .nameNormalized "role" "cell") "accessAliasDomain" $clusterDomain "internalDomain" $clusterDomain "control" (dict "name" $controlClusterName "gatewayIPv4" $controlGatewayIPv4) "cellDomains" $cellDomains "cellIPv4s" $cellIPv4s "privateAccess" (dict "baseDomain" $cellDomain "coderAppsWildcard" false "gatewayIPv4" $cellGatewayIPv4 "recordLabels" (list "coder-snapshots" "kube-oidc-proxy" "ray" "s3-gateway" "snapshots" "svelte-web" "velero-ui"))) }}
    # floci-divergence: Floci local clusters inject local headscale, origin registry IPs, and private access rewrites.
    {{- if eq $provider "floci" }}
    {{- $rewrites := dict }}
    {{- range $s := list "buildbuddy-events" "buildbuddy" "coder" "dragonfly-manager" "observability" }}
    {{- $_ := set $rewrites (printf "%s.%s" $s $clusterDomain) "active-ctrl-private-access.tailscale-system.svc.cluster.local" }}
    {{- $_ := set $rewrites (printf "%s.%s.%s" $s $controlClusterName $clusterDomain) "active-ctrl-private-access.tailscale-system.svc.cluster.local" }}
    {{- end }}
    {{- $_ := set $rewrites (printf "observability.%s" $intranetDomain) "active-ctrl-private-access.tailscale-system.svc.cluster.local" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "headscaleIPv4" (default "172.19.255.23" (index $annotations "headscale-ipv4")) "originRegistryIPv4" (default "172.19.255.22" (index $annotations "origin-registry-ipv4"))) "rewrites" $rewrites) }}
    {{- else }}
    # floci-divergence: Upstream Route 53 resolver rules resolve private domains identically on Floci; cloud clusters use Tailscale SaaS without a local Headscale endpoint.
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "headscaleIPv4" "")) }}
    {{- end }}
    {{- with (index $annotations "control-gateway-ipv4") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "gatewayIPv4" .) "privateAccess" (dict "gatewayIPv4" .)) }}
    {{- end }}
    {{- with (index $annotations "service-cidr") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "serviceCIDR" .) }}
    {{- end }}
    {{- end }}
    {{- if .injectClusterName }}
    {{- if eq .component "otel-collector" }}
    {{- $extraEnvs := default list (index (default dict .helmValuesObject) "extraEnvs") }}
    {{- $extraEnvs = concat (list (dict "name" "K8S_CLUSTER_NAME" "value" .nameNormalized)) $extraEnvs }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "extraEnvs" $extraEnvs) }}
    {{- else }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "prometheus-api-bridge" }}
    {{- $queryHost := printf "observability.%s" $intranetDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "backend" (dict "signoz" (dict "url" (printf "https://%s" $queryHost)))) }}
    {{- end }}
    {{- if eq .component "s3-gateway" }}
    {{- $cellDomain := printf "%s.%s" .nameNormalized $clusterDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "internalDomain" $cellDomain) }}
    {{- end }}
    {{- if .injectClusterDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "publicDomain" $publicDomain "accessAliasDomain" $clusterDomain "internalDomain" $clusterDomain) }}
    {{- end }}
    {{- $patches := concat (default list $profile.patches) (default list $componentProfile.patches) (default list .patches) }}
    {{- if eq .component "opencost" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "opencost" (dict "exporter" (dict "defaultClusterId" .nameNormalized))) }}
    {{- if eq $provider "aws" }}
    {{- $athenaBucket := default (printf "%s-billing-reports" .nameNormalized) (index $annotations "athena-bucket") }}
    {{- $athenaDatabase := default (replace "-" "_" (printf "%s_cur" .nameNormalized)) (index $annotations "athena-database") }}
    {{- $athenaTable := default (replace "-" "_" (printf "%s_k8s" .nameNormalized)) (index $annotations "athena-table") }}
    {{- $athenaWorkgroup := default "primary" (index $annotations "athena-workgroup") }}
    {{- $awsRegion := default "configured-by-applicationset" (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $opencostCloudConfig := printf "{\n  \"aws\": [\n    {\n      \"athenaBucketName\": %q,\n      \"athenaDatabase\": %q,\n      \"athenaTable\": %q,\n      \"athenaWorkgroup\": %q,\n      \"athenaRegion\": %q,\n      \"athenaProjectID\": \"\"\n    }\n  ]\n}" $athenaBucket $athenaDatabase $athenaTable $athenaWorkgroup $awsRegion }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "Secret" "name" "opencost-cloud-integration") "patch" (printf "- op: replace\n  path: /stringData/cloud-integration.json\n  value: %q" $opencostCloudConfig)) }}
    {{- end }}
    {{- if eq $provider "gcp" }}
    {{- $gcpProject := default "configured-by-applicationset" (coalesce (index $annotations "gcp-project-id") (index $annotations "project-id") (index (default dict .metadata.labels) "project")) }}
    {{- $billingDataset := default (replace "-" "_" (printf "%s_billing_export" .nameNormalized)) (coalesce (index $annotations "gcp-billing-dataset") (index $annotations "billing-dataset")) }}
    {{- $opencostCloudConfig := printf "{\n  \"gcp\": [\n    {\n      \"projectID\": %q,\n      \"billingDataDataset\": %q\n    }\n  ]\n}" $gcpProject $billingDataset }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "Secret" "name" "opencost-cloud-integration") "patch" (printf "- op: replace\n  path: /stringData/cloud-integration.json\n  value: %q" $opencostCloudConfig)) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "kueue-admission" }}
