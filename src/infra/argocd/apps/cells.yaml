    {{- if ne $group "operators" }}
    {{- $clusterAccessPatches = append $clusterAccessPatches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRoleBinding" "name" "cluster-operators") "patch" (printf "- op: add\n  path: /subjects/-\n  value:\n    apiGroup: rbac.authorization.k8s.io\n    kind: Group\n    name: cluster:group:%s" $group)) }}
