    {{- $kubePatches := list (dict "target" (dict "group" "cert-manager.io" "version" "v1" "kind" "Certificate" "name" "kube-oidc-proxy-door") "patch" (printf "- op: replace\n  path: /spec/dnsNames/0\n  value: %s" $kubeHost)) (dict "target" (dict "group" "gateway.networking.k8s.io" "version" "v1" "kind" "TLSRoute" "name" "kube-oidc-proxy") "patch" (printf "- op: replace\n  path: /spec/hostnames/0\n  value: %s" $kubeHost)) (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "kube-oidc-proxy-config") "patch" $kubeConfigPatch) }}
    # floci-divergence: Floci cells trust control-cluster-ca secret for kube-oidc-proxy Dex OIDC.
    {{- if eq $provider "floci" }}
    {{- $kubeControlCaPatch := dict "target" (dict "group" "trust.cert-manager.io" "version" "v1alpha1" "kind" "Bundle" "name" "kube-oidc-proxy-control-ca") "patch" "- op: replace\n  path: /spec/sources/0/secret/name\n  value: control-cluster-ca" }}
    {{- $kubePatches = append $kubePatches $kubeControlCaPatch }}
    {{- end }}
    {{- $patches = concat $patches $kubePatches }}
    {{- end }}
    {{- if eq .component "kyverno" }}
    {{- $ecrRegistry := index $annotations "ecr-registry" }}
    {{- if $ecrRegistry }}
    {{- $kyvernoPatch := dict "target" (dict "group" "kyverno.io" "version" "v1" "kind" "ClusterPolicy" "name" "production-image-digest-pinning") "patch" (printf "- op: add\n  path: /spec/rules/1/validate/deny/conditions/any/0/value/-\n  value: %s" $ecrRegistry) }}
    {{- $patches = append $patches $kyvernoPatch }}
    {{- end }}
    {{- end }}
    {{- if eq .component "parca-agent" }}
    {{- $ctrlHost := printf "observability.%s:443" $intranetDomain }}
    {{- $parcaAgentPatches := list (dict "target" (dict "group" "apps" "version" "v1" "kind" "DaemonSet" "labelSelector" "app.kubernetes.io/name=parca-agent") "patch" (printf "- op: replace\n  path: /spec/template/spec/containers/0/env/1/value\n  value: %s\n- op: replace\n  path: /spec/template/spec/containers/0/args/14\n  value: --remote-store-address=%s\n- op: remove\n  path: /spec/template/spec/containers/0/args/15" .nameNormalized $ctrlHost)) }}
