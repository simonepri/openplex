                      matchExpressions:
                        - key: gpu-operator
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: gpu-operator
