    {{- $patches := concat (default list $profile.patches) (default list $componentProfile.patches) (default list .patches) }}
    {{- $backupDatabase := default "" (index (dict "buildbuddy-cache" "buildbuddy-cache-postgres") .component) }}
    # floci-divergence: Floci emulates AWS S3 database backups with Pod Identity.
    {{- if and (or (eq $provider "aws") (eq $provider "floci")) (ne $backupDatabase "") }}
    {{- $backupBucket := index $annotations "backups-bucket" }}
