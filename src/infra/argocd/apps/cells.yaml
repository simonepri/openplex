    {{- $hsSecretPatch := dict "target" (dict "version" "v1" "kind" "Secret" "name" "headscale-preauth") "patch" (printf "- op: replace\n  path: /metadata/name\n  value: headscale-preauth-%s" $controlClusterName) }}
    {{- $hsRolePatch := dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "Role" "name" "secret-record-reader" "namespace" "secret-records") "patch" (printf "- op: add\n  path: /rules/0/resourceNames/-\n  value: headscale-preauth-%s" $controlClusterName) }}
    {{- $bbSecretPatch := dict "target" (dict "version" "v1" "kind" "Secret" "name" "buildbuddy-auth") "patch" (printf "- op: replace\n  path: /metadata/name\n  value: %s-workspaces-buildbuddy-auth" .nameNormalized) }}
    {{- $patches = concat $patches (list $hsSecretPatch $hsRolePatch $bbSecretPatch) }}
    {{- end }}
    {{- $argocdWebhookDelete := dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ExternalSecret" "namespace" "argocd" "name" "argocd-webhook") "patch" "apiVersion: external-secrets.io/v1\nkind: ExternalSecret\nmetadata:\n  name: argocd-webhook\n$patch: delete" }}
    {{- $patches = append $patches $argocdWebhookDelete }}
    {{- end }}
    {{- if eq .component "kuberhealthy" }}
    # floci-divergence: Floci local clusters run S3 in us-east-1 LocalStack zone.
    {{- $khAwsRegion := default (ternary "us-east-1" "us-west-2" (eq $provider "floci")) (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $headlampClusters := .nameNormalized }}
    {{- $virtualCellName := trimPrefix "cell-" (trimPrefix "ctrl-" .nameNormalized) }}
    {{- $identityValues := printf "# Declares shared container image digests and test fixture parameters to defend Chainsaw test suites against unpinned dependencies and registry drift.\n\nclusterDomain: %s\nheadlampClusters: %s\nintranetDomain: %s\npublicDomain: %s\npythonImage: >-\n  docker.io/library/python:3.14.7-alpine3.24@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df\n" $clusterDomain $headlampClusters $intranetDomain $publicDomain }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "chainsaw-identity-tests") "patch" (printf "- op: replace\n  path: /data/values.yaml\n  value: %q" $identityValues)) }}
    {{- $observabilityValues := printf "# Declares shared container image digests and test fixture parameters to defend Chainsaw test suites against unpinned dependencies and registry drift.\n\nintranetDomain: %s\npythonImage: >-\n  docker.io/library/python:3.14.7-alpine3.24@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df\n" $intranetDomain }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "chainsaw-observability-tests") "patch" (printf "- op: replace\n  path: /data/values.yaml\n  value: %q" $observabilityValues)) }}
    {{- $storageValues := printf "# Declares shared container image digests and test fixture parameters to defend Chainsaw test suites against unpinned dependencies and registry drift.\n\nawsCliImage: >-\n  docker.io/amazon/aws-cli:2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780\nawsRegion: %s\ncellName: %s\n" $khAwsRegion $virtualCellName }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "chainsaw-storage-tests") "patch" (printf "- op: replace\n  path: /data/values.yaml\n  value: %q" $storageValues)) }}
    {{- end }}
    {{- $acmeEnabled := eq (default "" (index .metadata.labels "acme-dns01")) "enabled" }}
    # floci-divergence: Floci local clusters lack public DNS zones required for ACME DNS-01 challenges.
    {{- if and $acmeEnabled (ne $provider "floci") (ne $provider "") }}
    {{- with .acmeOverrides }}
    {{- $helmValues = mergeOverwrite $helmValues . }}
    {{- end }}
    {{- if eq .component "acme" }}
    {{- $cfRemoteKey := printf "%s-cloudflare-cert-manager-token" .nameNormalized }}
    {{- $cfPatchOps := list (dict "op" "replace" "path" "/spec/data/0/remoteRef/key" "value" $cfRemoteKey) (dict "op" "add" "path" "/spec/data/0/remoteRef/property" "value" "api_token") }}
    {{- $patches = append $patches (dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ExternalSecret" "namespace" "cert-manager-system" "name" "cloudflare-api-token") "patch" (toYaml $cfPatchOps)) }}
    {{- $acmeIssuerPatchOps := list (dict "op" "replace" "path" "/spec/acme/email" "value" $googleAdminEmail) (dict "op" "replace" "path" "/spec/acme/solvers/0/selector/dnsZones" "value" (list $intranetDomain)) (dict "op" "replace" "path" "/spec/acme/solvers/1/selector/dnsZones" "value" $hostedDomains) }}
    {{- $patches = append $patches (dict "target" (dict "group" "cert-manager.io" "version" "v1" "kind" "ClusterIssuer" "name" "public-acme") "patch" (toYaml $acmeIssuerPatchOps)) }}
    {{- end }}
    {{- end }}
    {{- if .injectClusterProvider }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "target" (dict "name" .nameNormalized "provider" (default "floci" $provider) "role" "cell")) }}
    {{- end }}
    {{- $valFiles := default list }}
    {{- if .helmValueFiles }}
    {{- $valFiles = .helmValueFiles }}
    {{- else if .helmValues }}
    {{- $valFiles = list .helmValues }}
    {{- else if .chart }}
    {{- $defaultVal := ternary (regexReplaceAll "/kustomize.*$" .path "/helm/values.yaml") (printf "%s/values.yaml" .path) (contains "/kustomize" .path) }}
    {{- $valFiles = list $defaultVal }}
    {{- end }}
    {{- with (index (default dict .helmValueOverridesByProvider) $provider) }}
    {{- $valFiles = concat $valFiles . }}
    {{- end }}
    {{- $vpaTargets := default list }}
    {{- $vpaUpdateMode := "InPlace" }}
    {{- $vpaControlledValues := "RequestsOnly" }}
    {{- if hasKey . "vpa" }}
      {{- if kindIs "bool" .vpa }}
        {{- if .vpa }}
          {{- $vpaTargets = list (dict "name" .component) }}
        {{- end }}
      {{- else if kindIs "slice" .vpa }}
        {{- $vpaTargets = .vpa }}
      {{- else if kindIs "map" .vpa }}
        {{- with .vpa.targets }}
          {{- $vpaTargets = . }}
        {{- end }}
        {{- with .vpa.updateMode }}
          {{- $vpaUpdateMode = . }}
        {{- end }}
        {{- with .vpa.controlledValues }}
          {{- $vpaControlledValues = . }}
        {{- end }}
      {{- else if kindIs "string" .vpa }}
        {{- if and (ne .vpa "custom") (ne .vpa "false") }}
          {{- $vpaTargets = list (dict "name" .vpa) }}
        {{- end }}
      {{- end }}
    {{- end }}
    spec:
    {{- with .ignoreDifferences }}
      ignoreDifferences: {{ . | toJson }}
    {{- end }}
      sources:
      {{- if .chart }}
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .releaseName | default .component }}'
            valueFiles:
            {{- range $valFiles }}
              - '$values/{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          ref: values
        {{- if not (hasSuffix "/helm" .path) }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if or $patches $kustomizeImages }}
          kustomize:
            {{- if $kustomizeImages }}
            images: {{ $kustomizeImages | toJson }}
            {{- end }}
            {{- if $patches }}
            patches: {{ $patches | toJson }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- else if .companionChart }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .companionChart }}'
          helm:
            valueFiles:
              - values.yaml
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if or $patches $kustomizeImages }}
          kustomize:
            {{- if $kustomizeImages }}
            images: {{ $kustomizeImages | toJson }}
            {{- end }}
            {{- if $patches }}
            patches: {{ $patches | toJson }}
            {{- end }}
          {{- end }}
      {{- else }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
        {{- if $valFiles }}
          helm:
            valueFiles:
            {{- range $valFiles }}
              - '{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        {{- else if or $patches $kustomizeImages }}
          kustomize:
            {{- if $kustomizeImages }}
            images: {{ $kustomizeImages | toJson }}
            {{- end }}
            {{- if $patches }}
            patches: {{ $patches | toJson }}
            {{- end }}
        {{- end }}
      {{- end }}
      {{- if $vpaTargets }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: src/infra/argocd/components/default_vpa/helm
          helm:
            valuesObject:
              enabled: true
              updateMode: '{{ $vpaUpdateMode }}'
              controlledValues: '{{ $vpaControlledValues }}'
              targets:
              {{- range $vpaTargets }}
                {{- if kindIs "map" . }}
                - name: '{{ .name }}'
                  {{- with .kind }}
                  kind: '{{ . }}'
                  {{- end }}
                  {{- with .apiVersion }}
                  apiVersion: '{{ . }}'
                  {{- end }}
                  {{- with .updateMode }}
                  updateMode: '{{ . }}'
                  {{- end }}
                  {{- with .minAllowed }}
                  minAllowed: {{ . | toJson }}
                  {{- end }}
                {{- else }}
                - name: '{{ . }}'
                {{- end }}
              {{- end }}
      {{- end }}
