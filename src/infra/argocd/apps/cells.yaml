    {{- end }}
    {{- $veleroPatches := list (dict "target" (dict "group" "gateway.networking.k8s.io" "version" "v1" "kind" "HTTPRoute" "name" "velero-ui") "patch" (printf "- op: replace\n  path: /spec/hostnames/0\n  value: %s" $veleroHost)) (dict "target" (dict "group" "gateway.envoyproxy.io" "version" "v1alpha1" "kind" "Backend" "name" "velero-ui-dex") "patch" (printf "- op: replace\n  path: /spec/endpoints/0/fqdn/hostname\n  value: %s" $dexHost)) (dict "target" (dict "group" "gateway.envoyproxy.io" "version" "v1alpha1" "kind" "SecurityPolicy" "name" "velero-ui-oidc") "patch" (toYaml $veleroSecOps)) }}
    {{- if and (eq .component "velero-ui") $controlClusterCa }}
    {{- $veleroControlCaPatch := dict "target" (dict "group" "trust.cert-manager.io" "version" "v1alpha1" "kind" "Bundle" "name" "velero-ui-control-ca") "patch" (toYaml (list (dict "op" "add" "path" "/spec/sources/-" "value" (dict "inLine" $controlClusterCa)))) }}
