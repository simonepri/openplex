    {{- if ne $group "operators" }}
    {{- $clusterAccessPatches = append $clusterAccessPatches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRoleBinding" "name" "cluster-operators") "patch" (printf "- op: add\n  path: /subjects/-\n  value:\n    apiGroup: rbac.authorization.k8s.io\n    kind: Group\n    name: cluster:group:%s" $group)) }}
    {{- end }}
    {{- end }}
    {{- range $email := $operatorEmails }}
    {{- $clusterAccessPatches = append $clusterAccessPatches (dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "ClusterRoleBinding" "name" "cluster-operators") "patch" (printf "- op: add\n  path: /subjects/-\n  value:\n    apiGroup: rbac.authorization.k8s.io\n    kind: User\n    name: cluster:user:%s" $email)) }}
    {{- end }}
    {{- $patches = concat $patches $clusterAccessPatches }}
    {{- end }}
    {{- end }}
    {{- if eq .component "external-secrets" }}
    {{- $oidcOps := list (dict "op" "replace" "path" "/stringData/issuer" "value" (printf "https://dex.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/jwks_uri" "value" (printf "https://dex.%s/keys" $intranetDomain)) (dict "op" "replace" "path" "/stringData/argocd_external_url" "value" (printf "https://argocd.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/atlantis_external_url" "value" (printf "https://atlantis.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/buildbuddy_callback_uri" "value" (printf "https://buildbuddy.%s/oauth2/callback" $intranetDomain)) (dict "op" "replace" "path" "/stringData/buildbuddy_alias_callback_uri" "value" (printf "https://buildbuddy.%s/oauth2/callback" $intranetDomain)) (dict "op" "replace" "path" "/stringData/coder_external_url" "value" (printf "https://coder.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/coder_wildcard_access_url" "value" (printf "*.coder.%s" $accessDomain)) (dict "op" "replace" "path" "/stringData/dragonflyManagerAddress" "value" (printf "dragonfly-manager.%s:443" $accessDomain)) (dict "op" "replace" "path" "/stringData/headlamp_external_url" "value" (printf "https://headlamp.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/headscale_external_url" "value" (printf "https://headscale.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/kargo_external_url" "value" (printf "https://kargo.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/opencost_external_url" "value" (printf "https://opencost.%s" $intranetDomain)) (dict "op" "replace" "path" "/stringData/parca_callback_uri" "value" (printf "https://parca.%s/oauth2/callback" $intranetDomain)) (dict "op" "replace" "path" "/stringData/parca_alias_callback_uri" "value" (printf "https://parca.%s/oauth2/callback" $intranetDomain)) (dict "op" "replace" "path" "/stringData/signoz_callback_uri" "value" (printf "https://signoz.%s/oauth2/callback" $intranetDomain)) (dict "op" "replace" "path" "/stringData/signoz_alias_callback_uri" "value" (printf "https://signoz.%s/oauth2/callback" $intranetDomain)) (dict "op" "replace" "path" "/stringData/signoz_root_email" "value" (printf "signoz@%s" $publicDomain)) }}
    {{- $oidcPatch := dict "target" (dict "version" "v1" "kind" "Secret" "name" "application-oidc") "patch" (toYaml $oidcOps) }}
    {{- $patches = append $patches $oidcPatch }}
    # floci-divergence: Cloud clusters sync production application-oidc secrets from the cloud secret store.
    {{- if and (ne $provider "floci") (ne $provider "") }}
    {{- $oidcSecretStore := default "aws-secrets-manager" (index $annotations "secret-store-cloud") }}
    {{- $oidcRemoteKey := default (printf "%s-application-oidc" .nameNormalized) (coalesce (index $annotations "application-oidc-key") (index $annotations "oidc-remote-key")) }}
    {{- $oidcEsPatchOps := list (dict "op" "replace" "path" "/spec/secretStoreRef/name" "value" $oidcSecretStore) (dict "op" "replace" "path" "/spec/dataFrom/0/extract/key" "value" $oidcRemoteKey) }}
    {{- $patches = append $patches (dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ExternalSecret" "name" "application-oidc") "patch" (toYaml $oidcEsPatchOps)) }}
    {{- end }}
    {{- if eq $provider "aws" }}
    {{- $awsRegion := default "us-west-2" (coalesce (index $annotations "aws-region") (index $annotations "region")) }}
    {{- $awsStorePatch := dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ClusterSecretStore" "name" "aws-secrets-manager") "patch" (printf "- op: replace\n  path: /spec/provider/aws/region\n  value: %s" $awsRegion) }}
    {{- $patches = append $patches $awsStorePatch }}
    {{- end }}
    # floci-divergence: Floci local clusters adapt headscale-preauth and buildbuddy-auth record names to cluster identities.
    {{- if eq $provider "floci" }}
    {{- $controlClusterName := coalesce (index $annotations "control-cluster-name") (index $annotations "control-cluster") (regexReplaceAll "^cell-" .nameNormalized "ctrl-") }}
    {{- $hsSecretPatch := dict "target" (dict "version" "v1" "kind" "Secret" "name" "headscale-preauth") "patch" (printf "- op: replace\n  path: /metadata/name\n  value: headscale-preauth-%s" $controlClusterName) }}
    {{- $hsRolePatch := dict "target" (dict "group" "rbac.authorization.k8s.io" "version" "v1" "kind" "Role" "name" "secret-record-reader" "namespace" "secret-records") "patch" (printf "- op: add\n  path: /rules/0/resourceNames/-\n  value: headscale-preauth-%s" $controlClusterName) }}
    {{- $bbSecretPatch := dict "target" (dict "version" "v1" "kind" "Secret" "name" "buildbuddy-auth") "patch" (printf "- op: replace\n  path: /metadata/name\n  value: buildbuddy-auth-%s" .nameNormalized) }}
    {{- $patches = concat $patches (list $hsSecretPatch $hsRolePatch $bbSecretPatch) }}
    {{- end }}
    {{- $argocdWebhookDelete := dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ExternalSecret" "namespace" "argocd" "name" "argocd-webhook") "patch" "apiVersion: external-secrets.io/v1\nkind: ExternalSecret\nmetadata:\n  name: argocd-webhook\n$patch: delete" }}
    {{- $patches = append $patches $argocdWebhookDelete }}
    {{- end }}
    {{- if eq .component "kuberhealthy" }}
    # floci-divergence: Floci local clusters run S3 in us-east-1 LocalStack zone.
    {{- $khAwsRegion := default (ternary "us-east-1" "us-west-2" (eq $provider "floci")) (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $headlampClusters := .nameNormalized }}
    {{- $virtualCellName := trimPrefix "cell-" (trimPrefix "ctrl-" .nameNormalized) }}
    {{- $identityValues := printf "# Declares shared container image digests and test fixture parameters to defend Chainsaw test suites against unpinned dependencies and registry drift.\n\nclusterDomain: %s\nheadlampClusters: %s\nintranetDomain: %s\npublicDomain: %s\npythonImage: >-\n  docker.io/library/python:3.14.7-alpine3.24@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df\n" $clusterDomain $headlampClusters $intranetDomain $publicDomain }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "chainsaw-identity-tests") "patch" (printf "- op: replace\n  path: /data/values.yaml\n  value: %q" $identityValues)) }}
    {{- $observabilityValues := printf "# Declares shared container image digests and test fixture parameters to defend Chainsaw test suites against unpinned dependencies and registry drift.\n\nclusterDomain: %s\npythonImage: >-\n  docker.io/library/python:3.14.7-alpine3.24@sha256:016508ba505da24f7139765bc4bb669df4e88eb2f12eeadd571bf2f88d7533df\n" $clusterDomain }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "chainsaw-observability-tests") "patch" (printf "- op: replace\n  path: /data/values.yaml\n  value: %q" $observabilityValues)) }}
    {{- $storageValues := printf "# Declares shared container image digests and test fixture parameters to defend Chainsaw test suites against unpinned dependencies and registry drift.\n\nawsCliImage: >-\n  docker.io/amazon/aws-cli:2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780\nawsRegion: %s\ncellName: %s\n" $khAwsRegion $virtualCellName }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "ConfigMap" "name" "chainsaw-storage-tests") "patch" (printf "- op: replace\n  path: /data/values.yaml\n  value: %q" $storageValues)) }}
    {{- end }}
    {{- $acmeEnabled := eq (default "" (index .metadata.labels "acme-dns01")) "enabled" }}
