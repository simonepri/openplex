    {{- $producerCronPatch := dict "target" (dict "group" "batch" "version" "v1" "kind" "CronJob" "name" "local-storage-inventory-producer") "patch" (printf "- op: replace\n  path: /spec/jobTemplate/spec/template/spec/containers/0/env/1/value\n  value: %s\n- op: replace\n  path: /spec/jobTemplate/spec/template/spec/containers/0/env/2/value\n  value: %s" $s3Endpoint .nameNormalized) }}
