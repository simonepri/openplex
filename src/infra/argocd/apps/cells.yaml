                    - src/infra/argocd/components/buildbuddy_executor/helm/pool-cpu.yaml
    # BuildBuddy Hosted / Self-Hosted GPU Executors (Wave 40): mode == cloud AND executors in [all, gpu].
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/mode: cloud
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/executors
                          operator: In
                          values:
                            - all
                            - gpu
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-executor-gpu
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_executor/helm
                  namespace: buildbuddy
                  wave: "40"
                  chart: buildbuddy-executor
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.0.477
                  helmValueFiles:
                    - src/infra/argocd/components/buildbuddy_executor/helm/values.yaml
                    - src/infra/argocd/components/buildbuddy_executor/helm/pool-gpu.yaml
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
