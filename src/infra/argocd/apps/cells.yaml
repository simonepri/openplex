        {{- $vpaTargets = .vpa }}
      {{- else if kindIs "map" .vpa }}
        {{- with .vpa.targets }}
          {{- $vpaTargets = . }}
        {{- end }}
        {{- with .vpa.updateMode }}
          {{- $vpaUpdateMode = . }}
        {{- end }}
        {{- with .vpa.controlledValues }}
          {{- $vpaControlledValues = . }}
        {{- end }}
      {{- else if kindIs "string" .vpa }}
        {{- if and (ne .vpa "custom") (ne .vpa "false") }}
          {{- $vpaTargets = list (dict "name" .vpa) }}
        {{- end }}
      {{- end }}
    {{- else }}
      {{- $vpaTargets = list (dict "name" .component) }}
    {{- end }}
    spec:
    {{- with .ignoreDifferences }}
      ignoreDifferences: {{ . | toJson }}
    {{- end }}
      sources:
      {{- if .chart }}
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .releaseName | default .component }}'
            valueFiles:
            {{- range $valFiles }}
              - '$values/{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          ref: values
        {{- if not (hasSuffix "/helm" .path) }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if $patches }}
          kustomize:
            patches: {{ $patches | toJson }}
          {{- end }}
        {{- end }}
      {{- else if .companionChart }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .companionChart }}'
          helm:
            valueFiles:
              - values.yaml
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if $patches }}
          kustomize:
            patches: {{ $patches | toJson }}
          {{- end }}
      {{- else }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
        {{- if $valFiles }}
          helm:
            valueFiles:
            {{- range $valFiles }}
              - '{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        {{- else if $patches }}
          kustomize:
            patches: {{ $patches | toJson }}
        {{- end }}
      {{- end }}
      {{- if $localDatabaseBackup }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: src/infra/argocd/components/local_backup_credentials/helm
          helm:
            valuesObject:
              secretName: '{{ $backupDatabase }}-backup-s3'
      {{- end }}
      {{- if $vpaTargets }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: src/infra/argocd/components/default_vpa/helm
          helm:
            valuesObject:
              enabled: true
              updateMode: '{{ $vpaUpdateMode }}'
              controlledValues: '{{ $vpaControlledValues }}'
              targets:
              {{- range $vpaTargets }}
                {{- if kindIs "map" . }}
                - name: '{{ .name }}'
                  {{- with .kind }}
                  kind: '{{ . }}'
                  {{- end }}
                  {{- with .apiVersion }}
                  apiVersion: '{{ . }}'
                  {{- end }}
                  {{- with .updateMode }}
                  updateMode: '{{ . }}'
                  {{- end }}
                  {{- with .minAllowed }}
                  minAllowed: {{ . | toJson }}
                  {{- end }}
                {{- else }}
                - name: '{{ . }}'
                {{- end }}
              {{- end }}
      {{- end }}
