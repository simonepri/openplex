  template:
    metadata:
      name: '{{ .nameNormalized }}-{{ .component }}'
      namespace: argocd
      annotations:
        # keep-sorted start
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        # keep-sorted end
      labels:
        # keep-sorted start
        cluster: '{{ .nameNormalized }}'
        role: cell
        team: global
        tier: '{{ .tier }}'
        wave: '{{ .wave }}'
        # keep-sorted end
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-cell
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # LINT.IfChange(sync-retry)
        # Bounded so a persistently failing sync (including hooks) ends as Failed and alerts, while ~25 minutes of
        # backoff still covers bootstrap ordering across sync waves.
        retry:
          limit: 10
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:sync-retry,//src/infra/argocd/apps/teams.yaml:sync-retry)
        syncOptions:
          # keep-sorted start
          - CreateNamespace=true
          - IncludeMutationWebhook=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          # keep-sorted end
  templatePatch: |
    {{- $provider := default "" (index .metadata.labels "provider") }}
    # floci-divergence: Local development clusters default to the minimal resource profile to fit host resources.
    {{- $profileName := default (ternary "minimal" "production" (eq $provider "floci")) (index .metadata.labels "profile") }}
    {{- if not (hasKey .profiles $profileName) }}
    {{- fail (printf "unknown availability profile %q" $profileName) }}
    {{- end }}
    {{- $profile := index .profiles $profileName }}
    {{- $componentProfile := default dict (index $profile.components .component) }}
    {{- $helmValues := mergeOverwrite (deepCopy (default dict $componentProfile.helmValues)) (default dict .helmValuesObject) }}
    {{- $annotations := default dict .metadata.annotations }}
    # BEGIN GENERATED INFRASTRUCTURE IMAGES
    {{- $infrastructureImages := dict }}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/definitions/workspaces/templates/dev" "sha256:2d01b185cc2245b736e3e85ad233665adc9d116a729f722b8c3d68c734999818" }}{{- /* tag: ci-20261008T160320Z_6563fc9f30c8 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/coder_snapshot_portal" "sha256:f256f09c2640fcd5d6d8332e2ac97695b9a4b83bfcb8b17d87bf536ab3262834" }}{{- /* tag: ci-20261008T143318Z_5d91035e4368 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/dragonfly_sso" "sha256:17d15fb97ab5e3211baad8f98b721d397c627b1b32e4e00a464ffbb5473479ff" }}{{- /* tag: ci-20261004T182245Z_386650a7bac1 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/s3_resolver/server" "sha256:53164ef4fb959865a9e58f973a18839eb3a7b85c189e2863146afe0c730ed308" }}{{- /* tag: ci-20261004T182245Z_386650a7bac1 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/workspace_backup_proxy" "sha256:38218ea6a2bc4996349551eb4cd4d83d3e1900f53ed0bcd335dd917879bccd2d" }}{{- /* tag: ci-20261008T143318Z_5d91035e4368 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/infra/tools/workspace_healer" "sha256:533297a2175c3b19a82aa883cf8107ad302be690c5fc9c9ab686e51f970f4247" }}{{- /* tag: ci-20261008T163536Z_0490595844d9 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/third_party/dragonflyoss/client" "sha256:ecb877a7e658c7d76b1318b4266ecb1f2e264f8c5bcb44ffa7045b87a887a856" }}{{- /* tag: upstream-3904607 */}}
    {{- $infrastructureImages = set $infrastructureImages "src/third_party/openebs/rawfile-localpv" "sha256:d7498ff0f5380f745f740164640e042c6b2f87174f2f7a6299d43c67c75f8ff4" }}{{- /* tag: ci-20261004T182245Z_386650a7bac1 */}}
    # END GENERATED INFRASTRUCTURE IMAGES
    {{- $clusterRegistry := "" }}
    # floci-divergence: Local development clusters pull in-house infrastructure images from the local origin registry; cloud clusters pull from ECR.
    {{- if eq $provider "floci" }}
    {{- $clusterRegistry = "localhost:15100/000000000000/us-east-1" }}
    {{- else if or (eq $provider "aws") (eq $provider "gcp") }}
    {{- $clusterRegistry = default "" (index $annotations "ecr-registry") }}
    {{- end }}
    {{- $kustomizeImages := list }}
    {{- if $clusterRegistry }}
    {{- range $repo := keys $infrastructureImages | sortAlpha }}
    {{- $digest := index $infrastructureImages $repo }}
    {{- $kustomizeImages = append $kustomizeImages (printf "placeholder.invalid/%s=%s/%s@%s" $repo $clusterRegistry $repo $digest) }}
    {{- end }}
    {{- end }}
    # NOTE(simonepri): Kyverno admits only listed client digests, so land a new digest in the allowlist and let it sync before switching the image.
    # LINT.IfChange(dragonfly-client-cloud-image)
    {{- $dragonflyClientRepository := "src/third_party/dragonflyoss/client" }}
    {{- $dragonflyClientTag := "upstream-3904607" }}
    {{- $dragonflyClientDigest := "sha256:ecb877a7e658c7d76b1318b4266ecb1f2e264f8c5bcb44ffa7045b87a887a856" }}
    # LINT.ThenChange(//src/infra/argocd/components/dragonfly_peer/helm/client-image.yaml:dragonfly-client-digest,//src/infra/argocd/components/karpenter_aws/bootstrap/dragonfly-prepull.service)
    # floci-divergence: Floci cells pull the seeded Dragonfly client from the local registry; AWS cells pull the same republished build from ECR.
    {{- if and (eq .component "dragonfly-peer") (eq $provider "aws") }}
    {{- $dragonflyRegistry := index $annotations "ecr-registry" }}
    {{- if not $dragonflyRegistry }}{{ fail (printf "%s requires the ecr-registry annotation on aws" .component) }}{{- end }}
    {{- $dragonflyImage := dict "registry" $dragonflyRegistry "repository" $dragonflyClientRepository "tag" $dragonflyClientTag "digest" $dragonflyClientDigest }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "client" (dict "image" $dragonflyImage) "seedClient" (dict "image" (deepCopy $dragonflyImage))) }}
    {{- end }}
    {{- if eq .component "s3-gateway" }}
    {{- $registered := index $annotations "registered-cells" }}
    {{- if not $registered }}{{ fail "S3 gateway requires the registered-cells annotation" }}{{- end }}
    {{- $regList := splitList "," $registered }}
    {{- $catalog := list }}
    {{- $publicDomain := default "local.internal" (index $annotations "public-domain") }}
    {{- $intranetDomain := default (printf "corp.%s" $publicDomain) (or (index $annotations "intranet-domain") (index $annotations "domain")) }}
    {{- $clusterDomain := default (printf "c.%s" $intranetDomain) (or (index $annotations "cluster-domain") (index $annotations "access-domain")) }}
    {{- range $c := $regList }}
    {{- $vName := trimPrefix "cell-" $c }}
    {{- $cProvider := ternary "floci" (ternary "aws" "gcp" (hasPrefix "cell-aws" $c)) (hasPrefix "cell-eaws" $c) }}
    {{- $cRegion := ternary "lh1" (ternary "us-west-2" "europe-west4" (hasPrefix "cell-aws" $c)) (hasPrefix "cell-eaws" $c) }}
    # floci-divergence: Floci emulates secret stores via local-secret-records.
    {{- $cSecretStore := ternary "local-secret-records" "aws-secrets-manager" (eq $cProvider "floci") }}
    # floci-divergence: Floci uses un-prefixed gateway record name.
    {{- $cRecord := ternary "s3-gateway-config" (printf "%s-s3-gateway-config" $c) (eq $cProvider "floci") }}
    {{- $cServer := printf "s3-gateway.%s.%s" $c $clusterDomain }}
    # floci-divergence: Floci emulates gateway credentials with static keys.
    {{- $cCallers := ternary (dict "legacyResearchData" (dict "accessKeyId" "55555555555555555555") "orgWorkspaceBackups" (dict "accessKeyId" "11111111111111111111") "storageStats" (dict "accessKeyId" "22222222222222222222") "teams" (dict "examples" (dict "accessKeyId" "33333333333333333333"))) (dict "legacyResearchData" (dict "accessKeyId" (printf "OPEN%s" (upper (trunc 16 (sha1sum "legacy-research-data"))))) "orgWorkspaceBackups" (dict "accessKeyId" (printf "OPEN%s" (upper (trunc 16 (sha1sum "org-workspace-backups"))))) "storageStats" (dict "accessKeyId" (printf "OPEN%s" (upper (trunc 16 (sha1sum "storage-stats")))))) (eq $cProvider "floci") }}
    {{- $cSuffix := coalesce (index $annotations (printf "%s-bucket-suffix" $c)) (index $annotations "bucket-suffix") }}
    {{- if not $cSuffix }}{{ fail (printf "%s requires the bucket-suffix annotation" $c) }}{{- end }}
    {{- $homeBucket := printf "%s-home-%s" $c $cSuffix }}
    {{- $metaBucket := printf "%s-meta-%s" $c $cSuffix }}
    {{- $scratchBucket := printf "%s-scratch-%s" $c $cSuffix }}
    {{- $backupsBucket := printf "%s-backups-%s" $c $cSuffix }}
    {{- $archiveBucket := printf "%s-archive-%s" $c $cSuffix }}
    {{- $cEntry := dict "name" $c "virtualName" $vName "crossRegionService" (printf "s3-gateway-cross-region-%s" $c) "crossRegionServer" $cServer "gatewayRecord" $cRecord "gatewaySecretStore" $cSecretStore "storageStatsIdentity" "storage-stats" "storageStatsService" "s3-gateway-storage-stats-cross-region-configured" "storageStatsServer" $cServer "buckets" (dict "home" (dict "account" "" "name" $homeBucket) "meta" (dict "account" "" "name" $metaBucket) "scratch" (dict "account" "" "name" $scratchBucket) "backups" (dict "account" "" "name" $backupsBucket) "archive" (dict "account" "" "name" $archiveBucket)) "callers" $cCallers "provider" $cProvider "region" $cRegion }}
    {{- $catalog = append $catalog $cEntry }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "targetCell" .nameNormalized "registeredCells" $regList "cellCatalog" $catalog) }}
    {{- $globalEndpoint := default "" (index $annotations "global-storage-endpoint") }}
    {{- $globalBucketPrefix := default "" (index $annotations "global-storage-bucket-prefix") }}
    {{- $globalBucketSuffix := default "" (index $annotations "global-storage-bucket-suffix") }}
    {{- $globalProvider := default "" (index $annotations "global-storage-provider") }}
    {{- $teamSlugs := splitList "," (default "examples" (index $annotations "global-storage-teams")) | compact }}
    {{- $globalStorage := dict "endpoint" $globalEndpoint "bucketPrefix" $globalBucketPrefix "bucketSuffix" $globalBucketSuffix "provider" $globalProvider "teams" $teamSlugs }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "globalStorage" $globalStorage) }}
    {{- $legacyBucketsRaw := index $annotations "legacy-research-buckets" }}
    {{- $legacyStorage := list }}
    {{- if $legacyBucketsRaw }}
    {{- range $b := (fromJson (printf "{\"buckets\":%s}" $legacyBucketsRaw)).buckets }}
    {{- $legacyStorage = append $legacyStorage (dict "name" (index $b "name") "region" (index $b "region") "path" (index $b "path") "provider" (default "AWS" (or (index $b "provider") "")) "providerRemote" (or (index $b "providerRemote") (index $b "provider_remote")) "roleArn" (default "" (or (index $b "roleArn") (index $b "role_arn"))) "roleExternalId" (default "" (or (index $b "roleExternalId") (index $b "role_external_id"))) "regionSlug" (or (index $b "regionSlug") (index $b "region_slug")) "upstream" (default "" (index $b "upstream")) "isTarget" (default false (or (index $b "isTarget") (index $b "is_target")))) }}
    {{- end }}
    {{- end }}
