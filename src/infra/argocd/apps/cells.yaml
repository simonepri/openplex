                  injectClusterDomain: true
                  helmValuesObject:
                    provider: floci
                    cluster: {name: cell-eaws-lh1, role: cell}
                    accessAliasDomain: c.corp.local.internal
                    control:
                      name: ctrl-eaws-lh1
                      gatewayIPv4: 172.31.0.11
                      headscaleIPv4: 172.19.255.23
                      originRegistryIPv4: 172.19.255.22
                    internalDomain: c.corp.local.internal
                    cellDomains:
                      cell-eaws-lh1: c.corp.local.internal
                    cellIPv4s:
                      cell-eaws-lh1: 172.31.16.11
                    privateAccess:
                      baseDomain: cell-eaws-lh1.c.corp.local.internal
                      coderAppsWildcard: false
                      gatewayIPv4: 172.31.16.11
                      recordLabels: [coder-snapshots, kube-oidc-proxy, ray, s3-gateway, snapshots, svelte-web, velero-ui]
                    rewrites:
                      buildbuddy-events.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      buildbuddy-events.ctrl-eaws-lh1.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      buildbuddy.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      coder.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      coder.ctrl-eaws-lh1.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      dragonfly-manager.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      dragonfly-manager.ctrl-eaws-lh1.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      observability.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                      observability.ctrl-eaws-lh1.c.corp.local.internal: active-ctrl-private-access.tailscale-system.svc.cluster.local
                - component: rawfile-localpv
                  tier: substrate
                  path: src/infra/argocd/components/rawfile_localpv/kustomize
                  namespace: kube-system
                  wave: "20"
                  chart: rawfile-localpv
                  chartRepo: https://openebs.github.io/rawfile-localpv
                  chartVersion: 0.15.3
                  helmValuesObject:
                    image:
                      registry: localhost:15100
                      repository: 000000000000/us-east-1/src/third_party/openebs/rawfile-localpv
                      tag: v0.15.3-r1@sha256:d7498ff0f5380f745f740164640e042c6b2f87174f2f7a6299d43c67c75f8ff4
                  vpa:
                    targets:
                      - name: rawfile-localpv-controller
                        kind: Deployment
                      - name: rawfile-localpv-node
                        kind: DaemonSet
                        updateMode: Initial
                - component: karpenter-aws
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_aws/kustomize
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: public.ecr.aws/karpenter
                  chartVersion: 1.14.0
                  vpa:
                    targets:
                      - karpenter-aws
                - component: local-storage-inventory-producer
                  tier: fleet
                  path: src/infra/argocd/components/local_storage_inventory_producer/kustomize
                  namespace: s3-system
                  wave: "30"
                  vpa: false
    # BuildBuddy in-cluster cache is only dispatched when mode is not cloud.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/mode
                          operator: NotIn
                          values:
                            - cloud
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-cache
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_cache/kustomize
                  namespace: buildbuddy
                  wave: "40"
                  vpa: custom
                  ignoreDifferences:
                    - group: ""
                      kind: PersistentVolumeClaim
                      name: buildbuddy-cache-data
                      namespace: buildbuddy
                      jsonPointers:
                        - /metadata/annotations
                        - /spec/resources/requests/storage
                      jqPathExpressions:
                        - .metadata.annotations
                        - .spec.resources.requests.storage
    # BuildBuddy Enterprise Cache Proxy (Wave 30): mode == cloud AND enterprise-proxy == enabled.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/enterprise-proxy: enabled
                        buildbuddy.io/mode: cloud
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-enterprise-cache-proxy
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_enterprise_cache_proxy/kustomize
                  namespace: buildbuddy
                  wave: "30"
                  chart: buildbuddy-enterprise-cache-proxy
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.1.0
    # BuildBuddy Hosted / Self-Hosted CPU Executors (Wave 40): mode == cloud AND executors in [all, cpu].
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/mode: cloud
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/executors
                          operator: In
                          values:
                            - all
                            - cpu
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-executor
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_executor/kustomize
                  namespace: buildbuddy
                  wave: "40"
                  chart: buildbuddy-executor
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.1.0
    # BuildBuddy Hosted / Self-Hosted GPU Executors (Wave 40): mode == cloud AND executors in [all, gpu].
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        buildbuddy.io/mode: cloud
                        role: cell
                      matchExpressions:
                        - key: buildbuddy.io/executors
                          operator: In
                          values:
                            - all
                            - gpu
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: buildbuddy-executor-gpu
                  tier: fleet
                  path: src/infra/argocd/components/buildbuddy_executor/helm
                  namespace: buildbuddy
                  wave: "40"
                  chart: buildbuddy-executor
                  chartRepo: https://helm.buildbuddy.io
                  chartVersion: 0.1.0
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        gpu: "true"
                        role: cell
                      matchExpressions:
                        - key: gpu-operator
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: gpu-operator
                  tier: fleet
                  path: src/infra/argocd/components/gpu_operator/kustomize
                  namespace: gpu-system
                  wave: "20"
                  chart: gpu-operator
                  chartRepo: https://helm.ngc.nvidia.com/nvidia
                  chartVersion: v26.7.1
                  vpa:
                    targets:
                      - name: gpu-operator
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-gc
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-master
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-worker
                        kind: DaemonSet
                        updateMode: Initial
  template:
    metadata:
      name: '{{ .nameNormalized }}-{{ .component }}'
      namespace: argocd
      annotations:
        # keep-sorted start
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        # keep-sorted end
      labels:
        # keep-sorted start
        cluster: '{{ .nameNormalized }}'
        role: cell
        team: global
        tier: '{{ .tier }}'
        wave: '{{ .wave }}'
        # keep-sorted end
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-cell
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # LINT.IfChange(sync-retry)
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:sync-retry,//src/infra/argocd/apps/teams.yaml:sync-retry)
        syncOptions:
          # keep-sorted start
          - CreateNamespace=true
          - IncludeMutationWebhook=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          # keep-sorted end
  templatePatch: |
    {{- $provider := default "" (index .metadata.labels "provider") }}
    # floci-divergence: Local development clusters default to the minimal resource profile to fit host resources.
    {{- $profileName := default (ternary "minimal" "production" (eq $provider "floci")) (index .metadata.labels "profile") }}
    {{- if not (hasKey .profiles $profileName) }}
    {{- fail (printf "unknown availability profile %q" $profileName) }}
    {{- end }}
    {{- $profile := index .profiles $profileName }}
    {{- $componentProfile := default dict (index $profile.components .component) }}
    {{- $helmValues := mergeOverwrite (deepCopy (default dict $componentProfile.helmValues)) (default dict .helmValuesObject) }}
    {{- $annotations := default dict .metadata.annotations }}
    {{- if eq .component "s3-gateway" }}
    {{- $registered := index $annotations "registered-cells" }}
    {{- if not $registered }}{{ fail "S3 gateway requires the registered-cells annotation" }}{{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "targetCell" .nameNormalized "registeredCells" (splitList "," $registered)) }}
    # floci-divergence: Floci gateways use the registered emulator endpoint for S3 requests.
    {{- if eq $provider "floci" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "flociS3Endpoint" (index $annotations "s3-endpoint")) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "network-isolation" }}
    {{- $namespaces := default list (index $helmValues "namespaces") }}
    {{- if eq (default "false" (index .metadata.labels "gpu")) "true" }}
    {{- $namespaces = append $namespaces "gpu-system" }}
    {{- end }}
    {{- if or (eq $provider "aws") (eq $provider "gcp") }}
    {{- $namespaces = append $namespaces "external-dns-system" }}
    {{- if ne (default "" (index .metadata.labels "karpenter")) "disabled" }}
    {{- $namespaces = append $namespaces "karpenter-system" }}
    {{- end }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "namespaces" $namespaces) }}
    {{- end }}
    {{- if eq .component "tailscale-access" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized) }}
    # floci-divergence: Floci clusters use in-cluster Headscale CA configmap instead of cloud-connector mode.
    {{- if eq $provider "floci" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "local" (dict "caConfigMapName" "cluster-local-ca")) }}
    {{- else }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "mode" "cloud-connector") }}
    {{- end }}
    {{- with (index $annotations "service-cidr") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "serviceCIDR" .) }}
    {{- end }}
    {{- with (index $annotations "tailscale-oauth-key") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "cloud" (dict "oauthRemoteKey" .)) }}
    {{- end }}
    {{- with (index $annotations "control-gateway-ipv4") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "egress" (dict "gatewayIPv4" .)) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "coredns" }}
    # floci-divergence: Upstream Route 53 resolver rules resolve private domains identically on Floci; cloud clusters use Tailscale SaaS without a local Headscale endpoint.
    {{- if ne $provider "floci" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "headscaleIPv4" "")) }}
    {{- end }}
    {{- with (index $annotations "control-gateway-ipv4") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "control" (dict "gatewayIPv4" .)) }}
    {{- end }}
    {{- with (index $annotations "service-cidr") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "serviceCIDR" .) }}
    {{- end }}
    {{- end }}
    {{- if .injectClusterName }}
    {{- if eq .component "otel-collector" }}
    {{- $extraEnvs := default list (index (default dict .helmValuesObject) "extraEnvs") }}
    {{- $extraEnvs = concat (list (dict "name" "K8S_CLUSTER_NAME" "value" .nameNormalized)) $extraEnvs }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "extraEnvs" $extraEnvs) }}
    {{- else }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized) }}
    {{- end }}
    {{- end }}
    {{- $repoURL := index $annotations "git-repo-url" }}
    # nosemgrep: repository.lint.forbidden-domain-patterns
    {{- $publicDomain := default "local.internal" (index $annotations "public-domain") }}
    {{- $intranetDomain := default (printf "corp.%s" $publicDomain) (or (index $annotations "intranet-domain") (index $annotations "domain")) }}
    {{- $clusterDomain := default (printf "c.%s" $intranetDomain) (or (index $annotations "cluster-domain") (index $annotations "access-domain")) }}
    {{- $accessDomain := $clusterDomain }}
    {{- $dexHost := printf "dex.%s" $accessDomain }}
    {{- if eq .component "prometheus-api-bridge" }}
    {{- $queryHost := printf "observability.%s" $accessDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "backend" (dict "signoz" (dict "url" (printf "https://%s" $queryHost)))) }}
    {{- end }}
    {{- if eq .component "s3-gateway" }}
    {{- $cellDomain := printf "%s.%s" .nameNormalized $clusterDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "internalDomain" $cellDomain) }}
    {{- end }}
    {{- if .injectClusterDomain }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "publicDomain" $publicDomain "accessAliasDomain" $clusterDomain "internalDomain" $clusterDomain) }}
    {{- end }}
    {{- $patches := concat (default list $profile.patches) (default list $componentProfile.patches) (default list .patches) }}
    {{- if eq .component "opencost" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "opencost" (dict "exporter" (dict "defaultClusterId" .nameNormalized))) }}
    {{- if eq $provider "aws" }}
    {{- $athenaBucket := default (printf "%s-billing-reports" .nameNormalized) (index $annotations "athena-bucket") }}
    {{- $athenaDatabase := default (replace "-" "_" (printf "%s_cur" .nameNormalized)) (index $annotations "athena-database") }}
    {{- $athenaTable := default (replace "-" "_" (printf "%s_k8s" .nameNormalized)) (index $annotations "athena-table") }}
    {{- $athenaWorkgroup := default "primary" (index $annotations "athena-workgroup") }}
    {{- $awsRegion := default "configured-by-applicationset" (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $opencostCloudConfig := printf "{\n  \"aws\": [\n    {\n      \"athenaBucketName\": %q,\n      \"athenaDatabase\": %q,\n      \"athenaTable\": %q,\n      \"athenaWorkgroup\": %q,\n      \"athenaRegion\": %q,\n      \"athenaProjectID\": \"\"\n    }\n  ]\n}" $athenaBucket $athenaDatabase $athenaTable $athenaWorkgroup $awsRegion }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "Secret" "name" "opencost-cloud-integration") "patch" (printf "- op: replace\n  path: /stringData/cloud-integration.json\n  value: %q" $opencostCloudConfig)) }}
    {{- end }}
    {{- if eq $provider "gcp" }}
    {{- $gcpProject := default "configured-by-applicationset" (coalesce (index $annotations "gcp-project-id") (index $annotations "project-id") (index (default dict .metadata.labels) "project")) }}
    {{- $billingDataset := default (replace "-" "_" (printf "%s_billing_export" .nameNormalized)) (coalesce (index $annotations "gcp-billing-dataset") (index $annotations "billing-dataset")) }}
    {{- $opencostCloudConfig := printf "{\n  \"gcp\": [\n    {\n      \"projectID\": %q,\n      \"billingDataDataset\": %q\n    }\n  ]\n}" $gcpProject $billingDataset }}
    {{- $patches = append $patches (dict "target" (dict "version" "v1" "kind" "Secret" "name" "opencost-cloud-integration") "patch" (printf "- op: replace\n  path: /stringData/cloud-integration.json\n  value: %q" $opencostCloudConfig)) }}
    {{- end }}
    {{- end }}
    {{- if eq .component "kueue-admission" }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "role" "cell" "clusterName" .nameNormalized "provider" (default "floci" $provider) "topologies" (list (dict "name" "cell-topology" "levels" (list "topology.kubernetes.io/zone" "kubernetes.io/hostname"))) "flavors" (list (dict "name" "on-demand" "nodeLabels" (dict "karpenter.sh/capacity-type" "on-demand")) (dict "name" "spot" "nodeLabels" (dict "karpenter.sh/capacity-type" "spot")))) }}
    {{- end }}
    {{- if eq .component "envoy-gateway-instance" }}
    {{- $cellDomain := printf "%s.%s" .nameNormalized $accessDomain }}
    {{- $wildcardHost := printf "*.%s" $cellDomain }}
    {{- $kubeOidcHost := printf "kube-oidc-proxy.%s" $cellDomain }}
    {{- $envoyValues := dict "gateway" (dict "baseDomain" $cellDomain "listeners" (dict "https" (dict "hostname" $wildcardHost) "kubeOidcTls" (dict "hostname" $kubeOidcHost))) "proxy" (dict "autoscaling" (dict "prometheus" (dict "cluster" .nameNormalized))) }}
    # floci-divergence: Floci assigns static ClusterIPs to Envoy Gateway for local deterministic port-forwarding.
    {{- if ne $provider "floci" }}
    {{- $envoyValues = mergeOverwrite $envoyValues (dict "service" (dict "clusterIPv4" "")) }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues $envoyValues }}
    {{- end }}
    {{- if eq .component "storage-classes" }}
    {{- $storageProvider := ternary "aws" (ternary "gcp" "local" (eq $provider "gcp")) (eq $provider "aws") }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "provider" $storageProvider) }}
    {{- end }}
    {{- if eq .component "k8s-cleaner" }}
    # floci-divergence: Floci clusters run with 1-hour PV retention for fast local cleanup.
    {{- $isLocal := eq $provider "floci" }}
    {{- $reclaimerValues := dict "pvReclaimer" (dict "ttlSeconds" (ternary 3600 2592000 $isLocal) "schedule" (ternary "0 * * * *" "0 3 * * *" $isLocal)) }}
    {{- $helmValues = mergeOverwrite $helmValues $reclaimerValues }}
    {{- end }}
    {{- if eq .component "routing-registry" }}
    {{- $cellDomain := printf "%s.%s" .nameNormalized $accessDomain }}
    {{- $gatewayOIDC := dict "version" 1 "issuer" (printf "https://%s" $dexHost) "jwksUri" (printf "https://%s/keys" $dexHost) "scopes" (list "email" "groups" "openid" "profile") "groupsClaim" "groups" "clients" dict }}
    {{- $routingValues := dict "gateway" (dict "baseDomain" $cellDomain) "gatewayOIDC" $gatewayOIDC }}
    {{- $helmValues = mergeOverwrite $helmValues $routingValues }}
    {{- end }}
    {{- if eq .component "karpenter-aws" }}
    {{- $interruptionQueue := printf "%s-karpenter" .nameNormalized }}
    {{- $karpenterAwsValues := dict "settings" (dict "clusterName" .nameNormalized "interruptionQueue" $interruptionQueue) }}
    # floci-divergence: Floci emulates AWS EC2/SQS via local Floci endpoint requiring static credentials.
    {{- if eq $provider "floci" }}
    {{- $karpenterAwsValues = mergeOverwrite $karpenterAwsValues (dict "controller" (dict "env" (list (dict "name" "AWS_REGION" "value" "us-east-1") (dict "name" "AWS_DEFAULT_REGION" "value" "us-east-1") (dict "name" "AWS_ENDPOINT_URL" "value" (index $annotations "s3-endpoint")) (dict "name" "AWS_ACCESS_KEY_ID" "valueFrom" (dict "secretKeyRef" (dict "name" "karpenter-aws-floci-credentials" "key" "AWS_ACCESS_KEY_ID"))) (dict "name" "AWS_SECRET_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" "karpenter-aws-floci-credentials" "key" "AWS_SECRET_ACCESS_KEY")))))) }}
    {{- end }}
    {{- $helmValues = mergeOverwrite $helmValues $karpenterAwsValues }}
    {{- end }}
    {{- if eq .component "karpenter-gcp" }}
    {{- $gcpProject := default "configured-by-applicationset" (coalesce (index $annotations "gcp-project-id") (index $annotations "project-id") (index (default dict .metadata.labels) "project")) }}
    {{- $gcpLocation := default "configured-by-applicationset" (coalesce (index $annotations "gcp-location") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $karpenterSa := printf "%s-karpenter@%s.iam.gserviceaccount.com" .nameNormalized $gcpProject }}
    {{- $nodeSa := printf "%s-node-pool@%s.iam.gserviceaccount.com" (trunc 18 .nameNormalized) $gcpProject }}
    {{- $karpenterGcpValues := dict "serviceAccount" (dict "annotations" (dict "iam.gke.io/gcp-service-account" $karpenterSa)) "controller" (dict "settings" (dict "projectID" $gcpProject "clusterLocation" $gcpLocation "clusterName" .nameNormalized "defaultNodepoolServiceAccount" $nodeSa)) }}
    {{- $helmValues = mergeOverwrite $helmValues $karpenterGcpValues }}
    {{- end }}
    {{- if eq .component "aws-load-balancer-controller" }}
    {{- $awsRegion := default "configured-by-applicationset" (coalesce (index $annotations "aws-region") (index $annotations "region") (index (default dict .metadata.labels) "region")) }}
    {{- $awsVpcId := default "configured-by-applicationset" (coalesce (index $annotations "aws-vpc-id") (index $annotations "vpc-id")) }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "clusterName" .nameNormalized "region" $awsRegion "vpcId" $awsVpcId) }}
    {{- end }}
