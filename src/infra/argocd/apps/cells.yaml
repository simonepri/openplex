    {{- if eq .component "kube-oidc-proxy" }}
    {{- $kubeHost := printf "kube-oidc-proxy.%s.%s" .nameNormalized $accessDomain }}
    {{- $kubeConfigPatch := printf "- op: replace\n  path: /data/oidc-issuer-url\n  value: https://%s" $dexHost }}
    # floci-divergence: Floci local users authenticate with preferred_username while cloud clusters authenticate via Google Workspace email.
    {{- if ne $provider "floci" }}
    {{- $kubeConfigPatch = printf "%s\n- op: replace\n  path: /data/oidc-username-claim\n  value: email" $kubeConfigPatch }}
