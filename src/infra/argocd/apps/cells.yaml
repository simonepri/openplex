y images so dfdaemon is up before the first model pull\n      After=network-online.target\n      Wants=network-online.target\n\n      [Service]\n      Type=oneshot\n      RemainAfterExit=yes\n      TimeoutStartSec=600\n      ExecStart=/usr/bin/bash -c 'until ctr version >/dev/null 2>&1; do sleep 1; done; REGISTRY=\"%s\"; REGION=\"$$(echo \"$$REGISTRY\" | cut -d. -f4)\"; TOKEN=\"$$(aws ecr get-login-password --region \"$$REGION\")\"; for img in \"$$REGISTRY/mirror/busybox:1.38.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0\" \"$$REGISTRY/src/third_party/dragonflyoss/client:upstream-3904607@sha256:ecb877a7e658c7d76b1318b4266ecb1f2e264f8c5bcb44ffa7045b87a887a856\"; do ctr -n k8s.io image pull --snapshotter stargz --user \"AWS:$$TOKEN\" \"$$img\"; done'\n\n      [Install]\n      WantedBy=multi-user.target\n--//\nContent-Type: text/x-shellscript; charset=\"us-ascii\"\n\n#!/usr/bin/env bash\n# Installs and verifies pinned AWS eStargz snapshotter before nodeadm starts containerd and kubelet.\n\nset -euo pipefail\n\nreadonly stargz_version=\"v0.18.2\"\nreadonly stargz_sha256=\"515a3c3af0012f192ace31fb79e910597977c77227e976680aeaaef6e9ae50a9\"\nreadonly stargz_url=\"https://github.com/containerd/stargz-snapshotter/releases/download/${stargz_version}/stargz-snapshotter-${stargz_version}-linux-amd64.tar.gz\"\nreadonly install_dir=\"${INSTALL_DIR:-/usr/local/bin}\"\nreadonly tmp_dir=\"${TMP_DIR:-/tmp}\"\nreadonly stargz_tarball=\"${tmp_dir}/stargz.tgz\"\nreadonly stargz_socket=\"${STARGZ_SOCKET:-/run/containerd-stargz-grpc/containerd-stargz-grpc.sock}\"\nreadonly stargz_root=\"${STARGZ_ROOT:-/var/lib/containerd-stargz-grpc}\"\n\n# shellcheck disable=SC2329 # Invoked by the EXIT trap.\ncleanup() {\n  rm -f \"${stargz_tarball}\"\n}\ntrap cleanup EXIT\n\nif [[ ! -x \"${install_dir}/containerd-stargz-grpc\" || ! -x \"${install_dir}/ctr-remote\" ]]; then\n  curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused -o \"${stargz_tarball}\" \"${stargz_url}\"\n  echo \"${stargz_sha256}  ${stargz_tarball}\" | sha256sum -c -\n  tar -C \"${install_dir}\" -xzf \"${stargz_tarball}\" containerd-stargz-grpc ctr-remote\n  chmod +x \"${install_dir}/containerd-stargz-grpc\" \"${install_dir}/ctr-remote\"\nfi\n\nmkdir -p \"${stargz_root}\"\n\nsystemctl daemon-reload\nsystemctl enable --now stargz-snapshotter.service\nfor _ in {1..60}; do\n  if systemctl is-active --quiet stargz-snapshotter.service && [[ -S ${stargz_socket} ]]; then\n    exit 0\n  fi\n  sleep 1\ndone\n\nsystemctl status --no-pager stargz-snapshotter.service >&2 || true\nexit 1\n--//\nContent-Type: text/x-shellscript; charset=\"us-ascii\"\n\n#!/usr/bin/env bash\n# shellcheck shell=bash\n#\n# Brings up the Dragonfly prepull unit, embedded into the userData shellscript MIME part.\n# The prepull warms the dfdaemon image the moment containerd is up, so dfdaemon serves\n# 127.0.0.1:4001 before the model image's first lazy resolve instead of losing that race and\n# forcing a fallback pull.\n\nset -euo pipefail\n\n# The prepull unit mints ECR creds via the aws CLI; fail loud now if it is absent rather than\n# silently losing the dfdaemon-before-first-resolve race on every boot.\ncommand -v aws >/dev/null || {\n  echo \"dragonfly-prepull: aws CLI not found on PATH; required to mint ECR pull creds\" >&2\n  exit 1\n}\n\n# Pick up the write_files-placed unit before enabling it.\nsystemctl daemon-reload\n# --no-block: the unit waits for containerd, which starts only after cloud-init finishes — a\n# blocking start here would deadlock node boot.\nsystemctl enable dragonfly-prepull.service\nsystemctl start --no-block dragonfly-prepull.service\n--//\nContent-Type: application/node.eks.aws\n\n# Selects the eStargz CRI path for AL2023 Karpenter nodes. nodeadm merges this fragment with the cluster bootstrap NodeConfig generated by Karpenter.\n\napiVersion: node.eks.aws/v1alpha1\nkind: NodeConfig\nspec:\n  containerd:\n    config: |\n      [plugins.\"io.containerd.cri.v1.images\"]\n        snapshotter = \"stargz\"\n        disable_snapshot_annotations = false\n        use_local_image_pull = true\n\n      [[plugins.\"io.containerd.transfer.v1.local\".unpack_config]]\n        platform = \"linux/amd64\"\n        snapshotter = \"stargz\"\n\n      [[plugins.\"io.containerd.transfer.v1.local\".unpack_config]]\n        platform = \"linux/amd64\"\n        snapshotter = \"overlayfs\"\n\n      [proxy_plugins.stargz]\n        type = \"snapshot\"\n        address = \"/run/containerd-stargz-grpc/containerd-stargz-grpc.sock\"\n        [proxy_plugins.stargz.exports]\n          root = \"/var/lib/containerd-stargz-grpc\"\n  kubelet:\n    config:\n      failSwapOn: false\n      memorySwap:\n        swapBehavior: LimitedSwap\n    flags:\n      - --image-service-endpoint=unix:///run/containerd-stargz-grpc/containerd-stargz-grpc.sock\n--//--\n" $ecrRegistry $ecrRegistry }}
