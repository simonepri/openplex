    {{- end }}
    {{- end }}
    {{- if .injectClusterProvider }}
    {{- $helmValues = mergeOverwrite $helmValues (dict "target" (dict "name" .nameNormalized "provider" (default "floci" $provider) "role" "cell")) }}
    {{- end }}
    {{- $valFiles := default list }}
    {{- if .helmValueFiles }}
    {{- $valFiles = .helmValueFiles }}
    {{- else if .helmValues }}
    {{- $valFiles = list .helmValues }}
    {{- else if .chart }}
    {{- $defaultVal := ternary (regexReplaceAll "/kustomize.*$" .path "/helm/values.yaml") (printf "%s/values.yaml" .path) (contains "/kustomize" .path) }}
    {{- $valFiles = list $defaultVal }}
    {{- end }}
    {{- with (index (default dict .helmValueOverridesByProvider) $provider) }}
    {{- $valFiles = concat $valFiles . }}
    {{- end }}
    {{- $vpaTargets := default list }}
    {{- $vpaUpdateMode := "InPlace" }}
    {{- $vpaControlledValues := "RequestsOnly" }}
    {{- if hasKey . "vpa" }}
      {{- if kindIs "bool" .vpa }}
        {{- if .vpa }}
          {{- $vpaTargets = list (dict "name" .component) }}
        {{- end }}
      {{- else if kindIs "slice" .vpa }}
        {{- $vpaTargets = .vpa }}
      {{- else if kindIs "map" .vpa }}
        {{- with .vpa.targets }}
          {{- $vpaTargets = . }}
        {{- end }}
        {{- with .vpa.updateMode }}
          {{- $vpaUpdateMode = . }}
        {{- end }}
        {{- with .vpa.controlledValues }}
          {{- $vpaControlledValues = . }}
        {{- end }}
      {{- else if kindIs "string" .vpa }}
        {{- if and (ne .vpa "custom") (ne .vpa "false") }}
          {{- $vpaTargets = list (dict "name" .vpa) }}
        {{- end }}
      {{- end }}
    {{- end }}
    spec:
    {{- with .ignoreDifferences }}
      ignoreDifferences: {{ . | toJson }}
    {{- end }}
      sources:
      {{- if .chart }}
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .releaseName | default .component }}'
            valueFiles:
            {{- range $valFiles }}
              - '$values/{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          ref: values
        {{- if not (hasSuffix "/helm" .path) }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if $patches }}
          kustomize:
            patches: {{ $patches | toJson }}
          {{- end }}
        {{- end }}
      {{- else if .companionChart }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .companionChart }}'
          helm:
            valueFiles:
              - values.yaml
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
          {{- if $patches }}
          kustomize:
            patches: {{ $patches | toJson }}
          {{- end }}
      {{- else }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: '{{ .path }}'
        {{- if $valFiles }}
          helm:
            valueFiles:
            {{- range $valFiles }}
              - '{{ . }}'
            {{- end }}
            {{- with $helmValues }}
            valuesObject: {{ . | toJson }}
            {{- end }}
        {{- else if $patches }}
          kustomize:
            patches: {{ $patches | toJson }}
        {{- end }}
      {{- end }}
      {{- if $vpaTargets }}
        - repoURL: '{{ $repoURL }}'
          targetRevision: HEAD
          path: src/infra/argocd/components/default_vpa/helm
          helm:
            valuesObject:
              enabled: true
              updateMode: '{{ $vpaUpdateMode }}'
              controlledValues: '{{ $vpaControlledValues }}'
              targets:
              {{- range $vpaTargets }}
                {{- if kindIs "map" . }}
                - name: '{{ .name }}'
