    {{- $patches = concat $patches $gcpNodeClassPatches }}
    {{- end }}
    {{- if eq .component "velero-ui" }}
    {{- $veleroHost := printf "velero-ui.%s.%s" .nameNormalized $accessDomain }}
    {{- $veleroSecOps := list (dict "op" "replace" "path" "/spec/oidc/provider/issuer" "value" (printf "https://%s" $dexHost)) (dict "op" "replace" "path" "/spec/oidc/provider/authorizationEndpoint" "value" (printf "https://%s/auth" $dexHost)) (dict "op" "replace" "path" "/spec/oidc/provider/tokenEndpoint" "value" (printf "https://%s/token" $dexHost)) (dict "op" "replace" "path" "/spec/oidc/provider/endSessionEndpoint" "value" (printf "https://%s/logout" $dexHost)) (dict "op" "replace" "path" "/spec/oidc/redirectURL" "value" (printf "https://%s/oauth2/callback" $veleroHost)) (dict "op" "replace" "path" "/spec/jwt/providers/0/issuer" "value" (printf "https://%s" $dexHost)) (dict "op" "replace" "path" "/spec/jwt/providers/0/remoteJWKS/uri" "value" (printf "https://%s/keys" $dexHost)) }}
    # floci-divergence: Local clusters do not have Google Workspace directory groups.
    {{- if and (ne $provider "floci") (ne $provider "") }}
    {{- $veleroSecOps = append $veleroSecOps (dict "op" "replace" "path" "/spec/authorization/rules/1/principal/jwt/claims/0/values" "value" $operatorGroups) }}
    {{- if gt (len $operatorEmails) 0 }}
    {{- $veleroEmailRule := dict "name" "operator-email" "action" "Allow" "principal" (dict "jwt" (dict "provider" "velero-ui" "claims" (list (dict "name" "email" "valueType" "String" "values" $operatorEmails)))) }}
    {{- $veleroSecOps = append $veleroSecOps (dict "op" "add" "path" "/spec/authorization/rules/-" "value" $veleroEmailRule) }}
    {{- end }}
    {{- end }}
    {{- $veleroPatches := list (dict "target" (dict "group" "gateway.networking.k8s.io" "version" "v1" "kind" "HTTPRoute" "name" "velero-ui") "patch" (printf "- op: replace\n  path: /spec/hostnames/0\n  value: %s" $veleroHost)) (dict "target" (dict "group" "gateway.envoyproxy.io" "version" "v1alpha1" "kind" "Backend" "name" "velero-ui-dex") "patch" (printf "- op: replace\n  path: /spec/endpoints/0/fqdn/hostname\n  value: %s" $dexHost)) (dict "target" (dict "group" "gateway.envoyproxy.io" "version" "v1alpha1" "kind" "SecurityPolicy" "name" "velero-ui-oidc") "patch" (toYaml $veleroSecOps)) }}
