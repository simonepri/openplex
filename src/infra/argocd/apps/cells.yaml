    {{- $backupStorePatch := dict "target" (dict "group" "barmancloud.cnpg.io" "version" "v1" "kind" "ObjectStore" "name" (printf "%s-backups" $backupDatabase)) "patch" (printf "- op: replace\n  path: /spec/configuration/destinationPath\n  value: gs://%s/backups/databases\n- op: add\n  path: /spec/configuration/googleCredentials\n  value:\n    gkeEnvironment: true\n- op: remove\n  path: /spec/configuration/s3Credentials" $backupBucket) }}
    {{- $backupSecretPatch := dict "target" (dict "version" "v1" "kind" "Secret" "name" (printf "%s-backup-s3" $backupDatabase)) "patch" (printf "apiVersion: v1\nkind: Secret\nmetadata:\n  name: %s-backup-s3\n$patch: delete" $backupDatabase) }}
