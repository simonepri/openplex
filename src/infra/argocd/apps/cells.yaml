# ApplicationSet dispatching infrastructure applications across all cell clusters.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cell-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  goTemplate: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values: [substrate]
          maxUpdate: 100%
        - matchExpressions:
            - key: tier
              operator: In
              values: [fleet]
          maxUpdate: 100%
  syncPolicy:
    applicationsSync: sync
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                # Component waves follow the latest API or resource each one consumes,
                # never the kind of thing it is. Capacity provisioning and cluster DNS
                # run at wave 5 so every later wave can be scheduled onto Karpenter nodes.
                # Wave 10: Bootstrap contracts and admission
                - component: cert-manager
                  tier: substrate
                  path: src/infra/argocd/components/cert_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: cert-manager
                  chartRepo: https://charts.jetstack.io
                  chartVersion: v1.21.2
                  vpa:
                    targets:
                      - cert-manager
                      - cert-manager-cainjector
                      - cert-manager-webhook
                - component: external-secrets
                  tier: substrate
                  path: src/infra/argocd/components/external_secrets/kustomize
                  namespace: external-secrets-system
                  wave: "10"
                  chart: external-secrets
                  chartRepo: https://charts.external-secrets.io
                  chartVersion: 2.11.0
                  vpa:
                    targets:
                      - external-secrets
                      - external-secrets-cert-controller
                      - external-secrets-webhook
                - component: kueue-admission
                  tier: fleet
                  path: src/infra/argocd/components/kueue_admission/helm
                  namespace: kueue-system
                  wave: "10"
                  vpa: false
                  helmValues: values.yaml
                - component: kyverno
                  tier: substrate
                  path: src/infra/argocd/components/kyverno/kustomize
                  namespace: kyverno-system
                  wave: "10"
                  chart: kyverno
                  chartRepo: https://kyverno.github.io/kyverno
                  # LINT.IfChange(kyverno-chart-version)
                  chartVersion: 3.9.1
                  # LINT.ThenChange(//src/infra/argocd/apps/ctrl.yaml:kyverno-chart-version,//src/bazel/module_deps/vendor_helm_charts.MODULE.bazel:kyverno-chart-version,//src/infra/argocd/components/kyverno/helm/values.yaml:kyverno-chart-version)
                  vpa:
                    targets:
                      - kyverno-admission-controller
                      - kyverno-background-controller
                      - kyverno-cleanup-controller
                      - kyverno-reports-controller
                  ignoreDifferences:
                    - group: apiextensions.k8s.io
                      kind: CustomResourceDefinition
                      jsonPointers:
                        - /metadata/labels
                      jqPathExpressions:
                        - .metadata.labels
                    - group: flowcontrol.apiserver.k8s.io
                      kind: FlowSchema
                      jqPathExpressions:
                        - .spec.rules[].resourceRules[].namespaces
                - component: scheduling-priorities
                  tier: substrate
                  path: src/infra/argocd/components/scheduling_priorities/kustomize
                  namespace: kube-system
                  wave: "10"
                  vpa: false
                - component: trust-manager
                  tier: substrate
                  path: src/infra/argocd/components/trust_manager/kustomize
                  namespace: cert-manager-system
                  wave: "10"
                  chart: trust-manager
                  chartRepo: quay.io/jetstack/charts
                  chartVersion: v0.25.0

                - component: vpa
                  tier: substrate
                  path: src/infra/argocd/components/vpa/kustomize
                  namespace: vpa-system
                  wave: "10"
                  chart: vertical-pod-autoscaler
                  chartRepo: https://kubernetes.github.io/autoscaler
                  chartVersion: 0.13.0
                  vpa:
                    targets:
                      - vpa-admission-controller
                      - vpa-recommender
                      - vpa-updater

                # Wave 20: Operators and foundational services
                - component: barman-cloud
                  tier: fleet
                  path: src/infra/argocd/components/barman_cloud/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: plugin-barman-cloud
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.8.0
                  vpa:
                    targets:
                      - barman-cloud-plugin-barman-cloud
                - component: cloudnative-pg
                  tier: fleet
                  path: src/infra/argocd/components/cloudnative_pg/kustomize
                  namespace: cnpg-system
                  wave: "20"
                  chart: cloudnative-pg
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chartVersion: 0.29.1
                - component: csi-rclone
                  tier: fleet
                  path: src/infra/argocd/components/csi_rclone/kustomize
                  namespace: csi-rclone-system
                  wave: "20"
                  chart: csi-driver-rclone
                  chartRepo: ghcr.io/veloxpack/charts
                  chartVersion: 0.5.0
                  releaseName: rclone-csi
                  vpa: custom
                - component: envoy-gateway
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway/helm
                  namespace: envoy-gateway-system
                  wave: "20"
                  chart: gateway-helm
                  chartRepo: registry-1.docker.io/envoyproxy
                  chartVersion: 1.9.2
                - component: keda
                  tier: fleet
                  path: src/infra/argocd/components/keda/kustomize
                  namespace: keda-system
                  wave: "20"
                  chart: keda
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 2.21.0
                  vpa:
                    targets:
                      - keda-operator
                      - keda-operator-metrics-apiserver
                      - keda-admission-webhooks
                - component: keda-http
                  tier: fleet
                  path: src/infra/argocd/components/keda_http/helm
                  namespace: keda-system
                  wave: "20"
                  chart: keda-add-ons-http
                  chartRepo: https://kedacore.github.io/charts
                  chartVersion: 0.16.0
                  vpa:
                    targets:
                      - keda-add-ons-http-controller-manager
                      - keda-add-ons-http-external-scaler
                      - keda-add-ons-http-interceptor
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      jsonPointers:
                        - /spec/template/spec/containers/0/image
                      jqPathExpressions:
                        - .spec.template.spec.containers[0].image
                - component: kueue
                  tier: fleet
                  path: src/infra/argocd/components/kueue/kustomize
                  namespace: kueue-system
                  wave: "20"
                  chart: kueue
                  chartRepo: registry.k8s.io/kueue/charts
                  chartVersion: 0.19.6
                  vpa:
                    targets:
                      - kueue-controller-manager
                - component: k8s-cleaner
                  tier: fleet
                  path: src/infra/argocd/components/k8s_cleaner/kustomize
                  namespace: k8s-cleaner-system
                  wave: "20"
                  chart: k8s-cleaner
                  chartRepo: ghcr.io/gianlucam76/charts
                  chartVersion: 0.24.0
                  vpa: false
                - component: pvc-autoresizer
                  tier: fleet
                  path: src/infra/argocd/components/pvc_autoresizer/kustomize
                  namespace: pvc-autoresizer-system
                  wave: "20"
                  chart: pvc-autoresizer
                  chartRepo: https://topolvm.github.io/pvc-autoresizer
                  chartVersion: 0.20.0
                  vpa:
                    targets:
                      - pvc-autoresizer-controller
                - component: storage-classes
                  tier: substrate
                  path: src/infra/argocd/components/storage_classes/helm
                  namespace: kube-system
                  wave: "20"
                  helmValues: values.yaml
                  vpa: false
                - component: valkey-operator
                  tier: fleet
                  path: src/infra/argocd/components/valkey_operator/kustomize
                  namespace: valkey-system
                  wave: "20"
                  chart: valkey-operator
                  chartRepo: https://valkey.io/valkey-helm
                  chartVersion: 0.7.0
                # Wave 30: Cluster storage and ingress routing
                - component: dragonfly-peer
                  tier: fleet
                  path: src/infra/argocd/components/dragonfly_peer/kustomize
                  namespace: dragonfly-system
                  wave: "30"
                  chart: dragonfly
                  chartRepo: https://dragonflyoss.github.io/helm-charts
                  chartVersion: 1.8.5
                  releaseName: dragonfly
                  vpa:
                    targets:
                      - name: dragonfly-client
                        kind: DaemonSet
                        updateMode: Initial
                      - name: dragonfly-scheduler
                        kind: StatefulSet
                        updateMode: InPlace
                      - name: dragonfly-seed-client
                        kind: StatefulSet
                        updateMode: InPlace
                  helmValueOverridesByProvider:
                    floci:
                      - src/infra/argocd/components/dragonfly_peer/helm/client-image.yaml
                  ignoreDifferences:
                    - group: apps
                      kind: StatefulSet
                      jsonPointers:
                        - /spec/volumeClaimTemplates/0/status
                        - /spec/volumeClaimTemplates/0/apiVersion
                        - /spec/volumeClaimTemplates/0/kind
                        - /spec/volumeClaimTemplates/0/spec/volumeMode
                      jqPathExpressions:
                        - .spec.volumeClaimTemplates[0].status
                        - .spec.volumeClaimTemplates[0].apiVersion
                        - .spec.volumeClaimTemplates[0].kind
                        - .spec.volumeClaimTemplates[0].spec.volumeMode
                    - group: ""
                      kind: Service
                      jsonPointers:
                        - /spec/clusterIP
                        - /spec/clusterIPs
                      jqPathExpressions:
                        - .spec.clusterIP
                        - .spec.clusterIPs
                - component: envoy-gateway-instance
                  tier: fleet
                  path: src/infra/argocd/components/envoy_gateway_instance/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa:
                    targets:
                      - private-access-gateway
                  helmValues: values.yaml
                  helmValuesObject:
                    foundation:
                      manageNamespace: true
                      namespaceLabels:
                        cost-center: shared-infrastructure
                        environment: production
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/audit-version: latest
                        pod-security.kubernetes.io/enforce: restricted
                        pod-security.kubernetes.io/enforce-version: latest
                        pod-security.kubernetes.io/warn: restricted
                        pod-security.kubernetes.io/warn-version: latest
                        ray-dashboard-routes: "true"
                    gateway:
                      enabled: true
                      canonicalScheme: https
                      name: private-access
                      namespace: envoy-gateway-system
                      className: envoy-gateway-private-access
                      aliasDomain: corp.local.internal
                      allowedNamespaces:
                        # keep-sorted start
                        - envoy-gateway-system
                        - keda-system
                        - kube-oidc-proxy-system
                        - kube-system
                        - s3-system
                        - velero-system
                        # keep-sorted end
                      listeners:
                        http: {enabled: true, redirectToHTTPS: true}
                        https:
                          enabled: true
                          certificateSecret: private-access-tls
                          aliasCertificateSecret: private-access-alias-tls
                        kubeOidcTls:
                          enabled: true
                        s3Http: {enabled: true}
                    certificate:
                      enabled: true
                      issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-local-ca}
                      caIssuer: {enabled: false}
                    proxy:
                      backendEgress:
                        - namespace: keda-system
                          podSelector:
                            app.kubernetes.io/component: interceptor
                            app.kubernetes.io/instance: keda-http
                            app.kubernetes.io/name: http-add-on
                          ports: [8080]
                        - namespace: s3-system
                          podSelector:
                            app.kubernetes.io/name: s3-gateway
                          ports: [8080]
                        - namespace: velero-system
                          podSelector:
                            app.kubernetes.io/name: velero-ui
                          ports: [3000]
                      deployment:
                        name: private-access-gateway
                      service:
                        name: private-access-gateway
                        type: ClusterIP
                        clusterIPv4: 172.31.16.11
                        loadBalancerClass: ""
                        annotations: {}
                        externalTrafficPolicy: Cluster
                        ipFamilyPolicy: SingleStack
                        ipFamilies: [IPv4]
                        loadBalancerSourceRanges: []
                        nodePorts: {http: 0, tls: 0}
                - component: kube-oidc-proxy
                  tier: fleet
                  path: src/infra/argocd/components/kube_oidc_proxy/kustomize
                  namespace: kube-oidc-proxy-system
                  wave: "30"
                  vpa: custom
                - component: kuberay
                  tier: fleet
                  path: src/infra/argocd/components/kuberay/kustomize
                  namespace: kuberay-system
                  wave: "30"
                  chart: kuberay-operator
                  chartRepo: https://ray-project.github.io/kuberay-helm
                  chartVersion: 1.7.1
                  vpa:
                    targets:
                      - kuberay
                - component: routing-registry
                  tier: fleet
                  path: src/infra/argocd/components/routing_registry/helm
                  namespace: envoy-gateway-system
                  wave: "30"
                  vpa: false
                  helmValues: values.yaml
                  helmValueFiles:
                    - routes.yaml
                  injectClusterProvider: true
                  helmValuesObject:
                    phase: all
                    exposure: private
                    gatewayOIDC: {}
                    gateway:
                      canonicalScheme: https
                      httpRedirect: true
                      name: private-access
                      namespace: envoy-gateway-system
                - component: s3-gateway
                  tier: fleet
                  path: src/infra/argocd/components/s3_gateway/kustomize
                  namespace: s3-system
                  wave: "30"
                  companionChart: src/infra/argocd/components/s3_gateway/helm
                  flociResolverImage: localhost:15100/000000000000/us-east-1/src/infra/tools/s3_resolver/server@sha256:0de8df5a4584f347e4545da6e3e78377d689117f8a007e07056b8b1a4bcd06a1
                  vpa: custom

                # Wave 40: Telemetry, scheduling and workload services
                - component: kuberhealthy
                  tier: fleet
                  path: src/infra/argocd/components/kuberhealthy/kustomize
                  namespace: kuberhealthy
                  wave: "40"
                  chart: kuberhealthy
                  chartRepo: https://kuberhealthy.github.io/kuberhealthy/helm-repos
                  chartVersion: "100"
                  vpa: false
                - component: oauth2-proxy
                  tier: fleet
                  path: src/infra/argocd/components/oauth2_proxy/helm
                  namespace: oauth2-proxy-system
                  wave: "40"
                  vpa: false
                  helmValues: values.yaml
                - component: opencost
                  tier: fleet
                  path: src/infra/argocd/components/opencost/kustomize
                  namespace: opencost
                  wave: "40"
                  chart: opencost
                  chartRepo: https://opencost.github.io/opencost-helm-chart
                  chartVersion: 2.5.32
                  vpa:
                    targets:
                      - opencost
                      - opencost-auth-proxy
                - component: otel-collector
                  tier: fleet
                  path: src/infra/argocd/components/otel_collector/kustomize
                  namespace: otel-system
                  wave: "40"
                  chart: opentelemetry-collector
                  chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chartVersion: 0.173.1
                  injectClusterName: true
                  vpa: custom
                  helmValuesObject:
                    extraEnvs:
                      - name: OTLP_ENDPOINT
                        valueFrom:
                          secretKeyRef: {name: observability-door-cell, key: endpoint}
                      - name: OTLP_AUTHORIZATION
                        valueFrom:
                          secretKeyRef: {name: observability-door-cell, key: authorization}
                    config:
                      exporters:
                        otlphttp/signoz:
                          endpoint: '${env:OTLP_ENDPOINT}'
                          headers:
                            Authorization: '${env:OTLP_AUTHORIZATION}'
                          tls:
                            ca_file: /etc/cluster-ca/ca.crt
                - component: parca-agent
                  tier: fleet
                  path: src/infra/argocd/components/parca_agent/kustomize
                  namespace: parca
                  wave: "40"
                  vpa:
                    targets:
                      - name: parca-agent
                        kind: DaemonSet
                        updateMode: Initial
                - component: prometheus-api-bridge
                  tier: fleet
                  path: src/infra/argocd/components/prometheus_api_bridge/kustomize
                  namespace: signoz
                  wave: "40"
                  chart: prometheus-api-bridge
                  chartRepo: ghcr.io/simonepri/charts
                  chartVersion: 0.3.0
                  injectClusterName: true
                  vpa:
                    targets:
                      - prometheus-api-bridge
                      - prometheus-api-bridge-collector
                      - prometheus-api-bridge-kube-state-metrics
                  ignoreDifferences:
                    - group: apps
                      kind: Deployment
                      name: prometheus-api-bridge
                      jsonPointers:
                        - /metadata/generation
                        - /spec/replicas
                      jqPathExpressions:
                        - .metadata.generation
                        - .spec.replicas
                - component: tailscale-access
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_access/helm
                  namespace: tailscale-system
                  wave: "40"
                  vpa:
                    targets:
                      - subnet-router
                  helmValues: values.yaml
                  helmValuesObject:
                    mode: local-router
                    clusterName: cell-eaws-lh1
                    serviceCIDR: 172.31.16.0/20
                    internalDomain: cell-eaws-lh1.c.corp.local.internal
                    resolverRoutes: []
                    egress:
                      enabled: true
                      gatewayIPv4: 172.31.0.11
                      kubernetesAPIs: {}
                    cloud:
                      secretStoreName: runtime-secrets
                      oauthRemoteKey: ""
                    local:
                      loginServer: https://headscale.c.corp.local.internal
                      authSecretName: headscale-preauth
                      recordName: headscale-preauth-ctrl-eaws-lh1
                      runtimeForwardTarget: ""
                      secretStoreName: local-secret-records
                - component: velero
                  tier: fleet
                  path: src/infra/argocd/components/velero/helm
                  helmValueOverridesByProvider:
                    floci: [src/infra/argocd/components/velero/helm/providers/floci.yaml]
                  namespace: velero-system
                  wave: "40"
                  chart: velero
                  chartRepo: https://vmware-tanzu.github.io/helm-charts
                  chartVersion: 12.2.0
                  vpa:
                    targets:
                      - name: velero
                        kind: Deployment
                      - name: node-agent
                        kind: DaemonSet
                        updateMode: Initial
                - component: velero-ui
                  tier: fleet
                  path: src/infra/argocd/components/velero_ui/kustomize
                  namespace: velero-system
                  wave: "40"
                  chart: velero-ui
                  chartRepo: https://helm.otwld.com
                  chartVersion: 0.16.0

                # Wave 50: Security, compliance, and network policies
                - component: cluster-access
                  tier: fleet
                  path: src/infra/argocd/components/cluster_access/kustomize
                  namespace: argocd
                  wave: "50"
                  vpa: false
                - component: falco
                  tier: fleet
                  path: src/infra/argocd/components/falco/kustomize
                  namespace: falco
                  wave: "50"
                  chart: falco
                  chartRepo: https://falcosecurity.github.io/charts
                  chartVersion: 9.2.0
                  vpa: custom
                - component: kubescape-operator
                  tier: fleet
                  path: src/infra/argocd/components/kubescape_operator/kustomize
                  namespace: kubescape-system
                  wave: "50"
                  chart: kubescape-operator
                  chartRepo: https://kubescape.github.io/helm-charts
                  chartVersion: 1.40.4
                  vpa:
                    targets:
                      - kubescape
                      - operator
                      - prometheus-exporter
                      - storage
                  helmValuesObject:
                    kubescapeScheduler:
                      scanSchedule: "22 1,9,17 * * *"
                - component: network-isolation
                  tier: fleet
                  path: src/infra/argocd/components/network_isolation/helm
                  namespace: kube-system
                  wave: "50"
                  vpa: false
                  helmValues: values.yaml
                  helmValuesObject:
                    namespaces:
                      # keep-sorted start
                      - argocd
                      - buildbuddy
                      - cert-manager-system
                      - cnpg-system
                      - csi-rclone-system
                      - dragonfly-system
                      - envoy-gateway-system
                      - external-secrets-system
                      - falco
                      - k8s-cleaner-system
                      - keda-system
                      - kuberay-system
                      - kubescape-system
                      - kueue-system
                      - kyverno-system
                      - opencost
                      - otel-system
                      - parca
                      - pvc-autoresizer-system
                      - s3-system
                      - signoz
                      - tailscale-system
                      - trivy-system
                      - valkey-system
                      - velero-system
                      - vpa-system
                      # keep-sorted end
                - component: trivy-operator
                  tier: fleet
                  path: src/infra/argocd/components/trivy_operator/kustomize
                  namespace: trivy-system
                  wave: "50"
                  chart: trivy-operator
                  chartRepo: https://aquasecurity.github.io/helm-charts
                  chartVersion: 0.36.0
                - component: trivy-server
                  tier: fleet
                  path: src/infra/argocd/components/trivy_server/kustomize
                  namespace: trivy-system
                  wave: "50"
                  chart: trivy
                  chartRepo: https://aquasecurity.github.io/helm-charts
                  chartVersion: 0.26.0
                  vpa: custom
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: aws
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: aws-load-balancer-controller
                  tier: fleet
                  path: src/infra/argocd/components/aws_load_balancer_controller/helm
                  namespace: kube-system
                  wave: "20"
                  chart: aws-load-balancer-controller
                  chartRepo: https://aws.github.io/eks-charts
                  chartVersion: 3.5.0
                - component: external-dns
                  tier: fleet
                  path: src/infra/argocd/components/external_dns/kustomize
                  namespace: external-dns-system
                  wave: "30"
                  chart: external-dns
                  chartRepo: https://kubernetes-sigs.github.io/external-dns
                  chartVersion: 1.22.0
                - component: tailscale-operator
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_operator/helm
                  namespace: tailscale-system
                  wave: "20"
                  chart: tailscale-operator
                  chartRepo: https://pkgs.tailscale.com/helmcharts
                  chartVersion: 1.102.4
    # AWS Karpenter autoscaler (Wave 5): provider == aws AND karpenter != disabled.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: aws
                        role: cell
                      matchExpressions:
                        - key: karpenter
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: karpenter-aws
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_aws/kustomize
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: public.ecr.aws/karpenter
                  chartVersion: 1.14.0
                  vpa:
                    targets:
                      - karpenter-aws

    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: gcp
                        role: cell
                      matchExpressions:
                        - key: karpenter
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: karpenter-gcp
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_gcp/kustomize
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: https://cloudpilot-ai.github.io/karpenter-provider-gcp
                  chartVersion: 0.6.1
                  vpa:
                    targets:
                      - karpenter-gcp
                - component: external-dns
                  tier: fleet
                  path: src/infra/argocd/components/external_dns/kustomize
                  namespace: external-dns-system
                  wave: "30"
                  chart: external-dns
                  chartRepo: https://kubernetes-sigs.github.io/external-dns
                  chartVersion: 1.22.0
                - component: tailscale-operator
                  tier: fleet
                  path: src/infra/argocd/components/tailscale_operator/helm
                  namespace: tailscale-system
                  wave: "20"
                  chart: tailscale-operator
                  chartRepo: https://pkgs.tailscale.com/helmcharts
                  chartVersion: 1.102.4
    # AWS Karpenter autoscaler (Wave 5): provider == aws AND karpenter != disabled.
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: aws
                        role: cell
                      matchExpressions:
                        - key: karpenter
                          operator: NotIn
                          values:
                            - disabled
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: karpenter-aws
                  tier: substrate
                  path: src/infra/argocd/components/karpenter_aws/kustomize
                  namespace: karpenter-system
                  wave: "5"
                  chart: karpenter
                  chartRepo: public.ecr.aws/karpenter
                  chartVersion: 1.14.0
                  vpa:
                    targets:
                      - karpenter-aws

    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        provider: floci
                        role: cell
                - git:
                    repoURL: '{{ index .metadata.annotations "git-repo-url" }}'
                    revision: HEAD
                    pathParamPrefix: profileSource
                    files:
                      - path: src/infra/argocd/apps/profiles.yaml
          - list:
              elements:
                - component: coredns
                  tier: substrate
                  path: src/infra/argocd/components/coredns/helm
                  namespace: kube-system
                  wave: "5"
