    {{- $awsStorePatch := dict "target" (dict "group" "external-secrets.io" "version" "v1" "kind" "ClusterSecretStore" "name" "aws-secrets-manager") "patch" (printf "- op: replace\n  path: /spec/provider/aws/region\n  value: %s" $awsRegion) }}
    {{- $patches = append $patches $awsStorePatch }}
