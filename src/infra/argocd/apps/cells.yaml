                      - name: gpu-operator-node-feature-discovery-gc
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-master
                        kind: Deployment
                      - name: gpu-operator-node-feature-discovery-worker
                        kind: DaemonSet
                        updateMode: Initial
    # Public ACME is opt-in. The cluster registration contract must carry this
    # label only after the deployment has real ACME and DNS credentials.
    - matrix:
