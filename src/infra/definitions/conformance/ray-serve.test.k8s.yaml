# Proves Ray Serve test stages answer inference queries and reject invalid input payloads without altering reconciled production services.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ray-serve-inference
  labels:
    cadence: daily
    capability: compute
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    exec: 15m
  steps:
    - try:
        - command:
            entrypoint: sh
            args: [scripts/check_ray_serve_inference.sh]
