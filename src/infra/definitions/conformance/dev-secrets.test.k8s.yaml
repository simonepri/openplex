# Proves the shared Coder workspaces namespace receives no team dev secrets or team object-storage credentials, and verifies admission isolation of team S3 credentials and gateway secrets.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: shared-workspaces-hold-no-team-secrets
  labels:
    cadence: commit
    capability: secrets
    mutates: none
spec:
  namespace: workspaces
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    exec: 2m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                kubectl get namespace/workspaces --output=json |
                  jq --exit-status '
                    .metadata.labels["app.kubernetes.io/part-of"] == "coder-workspaces"
                  ' >/dev/null
                for kind in externalsecrets.external-secrets.io secretstores.external-secrets.io secrets; do
                  found="$(kubectl get "${kind}" --namespace=workspaces --output=json |
                    jq --raw-output '
                      .items[].metadata.name |
                      select(. == "team-dev-secrets" or . == "team-s3")
                    ')"
                  if test -n "${found}"; then
                    printf 'workspaces namespace holds team %s: %s\n' "${kind}" "${found}" >&2
                    exit 1
                  fi
                done
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: team-s3-secrets-isolation
  labels:
    cadence: commit
    capability: secrets
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    assert: 30s
    cleanup: 30s
    exec: 30s
  steps:
    - try:
        # 1. ExternalSecret in team namespace referencing own team S3 secret: admitted
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=team-examples-workloads --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: team-s3
                  namespace: team-examples-workloads
                  labels:
                    app.kubernetes.io/managed-by: argocd
                    app.kubernetes.io/part-of: team-lane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: team-s3-team-examples-workloads
                  target:
                    name: team-s3
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      data:
                        credentials: |-
                          [team-s3]
                          aws_access_key_id = {{ .access_key_id }}
                          aws_secret_access_key = {{ .secret_access_key }}
                  data:
                    - secretKey: access_key_id
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-examples
                        property: access_key_id
                    - secretKey: secret_access_key
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-examples
                        property: secret_access_key
                EOF
            check:
              ($error == null): true
        # 2. ExternalSecret in team namespace referencing another team's S3 secret: denied
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=team-examples-workloads --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: team-s3
                  namespace: team-examples-workloads
                  labels:
                    app.kubernetes.io/managed-by: argocd
                    app.kubernetes.io/part-of: team-lane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: team-s3-team-examples-workloads
                  target:
                    name: team-s3
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      data:
                        credentials: |-
                          [team-s3]
                          aws_access_key_id = {{ .access_key_id }}
                          aws_secret_access_key = {{ .secret_access_key }}
                  data:
                    - secretKey: access_key_id
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-other
                        property: access_key_id
                    - secretKey: secret_access_key
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-other
                        property: secret_access_key
                EOF
            check:
              ($error != null): true
              (contains($stderr, 'Team object-storage ExternalSecrets must project only that team')): true
        # 3. ExternalSecret in team namespace referencing s3-gateway-config: denied
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=team-examples-workloads --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: team-s3
                  namespace: team-examples-workloads
                  labels:
                    app.kubernetes.io/managed-by: argocd
                    app.kubernetes.io/part-of: team-lane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: team-s3-team-examples-workloads
                  target:
                    name: team-s3
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      data:
                        credentials: |-
                          [team-s3]
                          aws_access_key_id = {{ .access_key_id }}
                          aws_secret_access_key = {{ .secret_access_key }}
                  data:
                    - secretKey: access_key_id
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-gateway-config
                        property: access_key_id
                    - secretKey: secret_access_key
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-gateway-config
                        property: secret_access_key
                EOF
            check:
              ($error != null): true
              (contains($stderr, 'Only s3-system may read S3 gateway configuration secrets')): true
        # 4. ExternalSecret in team namespace referencing foreign ClusterSecretStore: denied
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=team-examples-workloads --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: team-s3
                  namespace: team-examples-workloads
                  labels:
                    app.kubernetes.io/managed-by: argocd
                    app.kubernetes.io/part-of: team-lane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: team-s3-team-other-workloads
                  target:
                    name: team-s3
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      data:
                        credentials: |-
                          [team-s3]
                          aws_access_key_id = {{ .access_key_id }}
                          aws_secret_access_key = {{ .secret_access_key }}
                  data:
                    - secretKey: access_key_id
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-examples
                        property: access_key_id
                    - secretKey: secret_access_key
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-examples
                        property: secret_access_key
                EOF
            check:
              ($error != null): true
              (contains($stderr, 'Team object-storage ExternalSecrets must project only that team')): true
        # 5. ExternalSecret in team namespace referencing shared aws-secrets-manager: denied
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=team-examples-workloads --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: team-s3
                  namespace: team-examples-workloads
                  labels:
                    app.kubernetes.io/managed-by: argocd
                    app.kubernetes.io/part-of: team-lane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: aws-secrets-manager
                  target:
                    name: team-s3
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      data:
                        credentials: |-
                          [team-s3]
                          aws_access_key_id = {{ .access_key_id }}
                          aws_secret_access_key = {{ .secret_access_key }}
                  data:
                    - secretKey: access_key_id
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-examples
                        property: access_key_id
                    - secretKey: secret_access_key
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-team-examples
                        property: secret_access_key
                EOF
            check:
              ($error != null): true
              (contains($stderr, 'Team object-storage ExternalSecrets must project only that team')): true
        # 6. ExternalSecret in non-s3 namespace referencing s3-gateway-config: denied
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=conformance-workloads --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: rogue-gateway-config
                  namespace: conformance-workloads
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: aws-secrets-manager
                  target:
                    name: rogue-gateway-config
                  data:
                    - secretKey: config
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-gateway-config
                        property: config
                EOF
            check:
              ($error != null): true
              (contains($stderr, 'Only s3-system may read S3 gateway configuration secrets')): true
        # 7. ExternalSecret in s3-system referencing s3-gateway-config: admitted
        - command:
            entrypoint: sh
            env:
              - name: CLUSTER_NAME
                value: ($values.clusterName || $values.cellName || 'cell-conformance')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=s3-system --filename=- <<EOF
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: s3-gateway-credentials
                  namespace: s3-system
                  labels:
                    app.kubernetes.io/component: runtime-secret
                    app.kubernetes.io/managed-by: external-secrets
                    app.kubernetes.io/name: s3-gateway
                    app.kubernetes.io/part-of: data-plane
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    kind: ClusterSecretStore
                    name: aws-secrets-manager
                  target:
                    name: s3-gateway-credentials
                    creationPolicy: Owner
                    deletionPolicy: Retain
                  data:
                    - secretKey: examples-access-key-id
                      remoteRef:
                        key: ${CLUSTER_NAME}-s3-gateway-config
                        property: examples-access-key-id
                EOF
            check:
              ($error == null): true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: service-account-token-hardening
  labels:
    cadence: commit
    capability: security
    mutates: scratch
spec:
  namespace: conformance-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    assert: 30s
    cleanup: 30s
    exec: 30s
  steps:
    - try:
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                kubectl apply --filename=- <<'EOF'
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: token-conformance-sa-false
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                automountServiceAccountToken: false
                ---
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: token-conformance-sa-unset
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                ---
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: token-conformance-sa-true
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                automountServiceAccountToken: true
                EOF
            check:
              ($error == null): true
        # 1. ServiceAccount automountServiceAccountToken: false, Pod unset: admitted
        - command:
            entrypoint: sh
            env:
              - name: PAUSE_IMAGE
                value: ($values.pauseImage || 'registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=conformance-workloads --filename=- <<EOF
                apiVersion: v1
                kind: Pod
                metadata:
                  name: token-probe-sa-false-pod-unset
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                spec:
                  serviceAccountName: token-conformance-sa-false
                  restartPolicy: Never
                  containers:
                    - name: probe
                      image: "${PAUSE_IMAGE}"
                EOF
            check:
              ($error == null): true
        # 2. ServiceAccount unset, Pod unset: denied
        - command:
            entrypoint: sh
            env:
              - name: PAUSE_IMAGE
                value: ($values.pauseImage || 'registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=conformance-workloads --filename=- <<EOF
                apiVersion: v1
                kind: Pod
                metadata:
                  name: token-probe-sa-unset-pod-unset
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                spec:
                  serviceAccountName: token-conformance-sa-unset
                  restartPolicy: Never
                  containers:
                    - name: probe
                      image: "${PAUSE_IMAGE}"
                EOF
            check:
              ($error != null): true
              (contains($stderr, 'service-account-token-hardening')): true
              (contains($stderr, 'require-automount-service-account-token-false')): true
        # 3. ServiceAccount automountServiceAccountToken: true, Pod unset: admitted
        - command:
            entrypoint: sh
            env:
              - name: PAUSE_IMAGE
                value: ($values.pauseImage || 'registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=conformance-workloads --filename=- <<EOF
                apiVersion: v1
                kind: Pod
                metadata:
                  name: token-probe-sa-true-pod-unset
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                spec:
                  serviceAccountName: token-conformance-sa-true
                  restartPolicy: Never
                  containers:
                    - name: probe
                      image: "${PAUSE_IMAGE}"
                EOF
            check:
              ($error == null): true
        # 4. Pod automountServiceAccountToken: false: admitted
        - command:
            entrypoint: sh
            env:
              - name: PAUSE_IMAGE
                value: ($values.pauseImage || 'registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=conformance-workloads --filename=- <<EOF
                apiVersion: v1
                kind: Pod
                metadata:
                  name: token-probe-pod-false
                  namespace: conformance-workloads
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                spec:
                  serviceAccountName: token-conformance-sa-unset
                  automountServiceAccountToken: false
                  restartPolicy: Never
                  containers:
                    - name: probe
                      image: "${PAUSE_IMAGE}"
                EOF
            check:
              ($error == null): true
        # 5. Pod with opt-in annotation (automount-service-account-token: "true"): admitted
        - command:
            entrypoint: sh
            env:
              - name: PAUSE_IMAGE
                value: ($values.pauseImage || 'registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4')
            args:
              - -ceu
              - |-
                kubectl apply --dry-run=server --namespace=conformance-workloads --filename=- <<EOF
                apiVersion: v1
                kind: Pod
                metadata:
                  name: token-probe-pod-opt-in-annotation
                  namespace: conformance-workloads
                  annotations:
                    automount-service-account-token: "true"
                  labels:
                    app.kubernetes.io/managed-by: chainsaw
                spec:
                  serviceAccountName: token-conformance-sa-unset
                  restartPolicy: Never
                  containers:
                    - name: probe
                      image: "${PAUSE_IMAGE}"
                EOF
            check:
              ($error == null): true
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - serviceaccount
              - token-conformance-sa-false
              - token-conformance-sa-unset
              - token-conformance-sa-true
              - --namespace=conformance-workloads
              - --ignore-not-found=true
              - --wait=false
        - command:
            entrypoint: kubectl
            args:
              - delete
              - pod
              - token-probe-sa-false-pod-unset
              - token-probe-sa-unset-pod-unset
              - token-probe-sa-true-pod-unset
              - token-probe-pod-false
              - token-probe-pod-opt-in-annotation
              - --namespace=conformance-workloads
              - --ignore-not-found=true
              - --wait=false
