# Proves team debug-tier secrets project into authorized workspaces while team admission rejects cross-team secret provider references to defend boundary isolation.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: examples-workspace-receives-team-dev-secret
  labels:
    cadence: commit
    capability: secrets
    mutates: scratch
spec:
  namespace: team-examples-workspaces
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    cleanup: 2m
    exec: 2m
  steps:
    - try:
        - command: &cleanup-workspace-probe
            entrypoint: kubectl
            args:
              - delete
              - pod/dev-secrets-workspace-probe
              - --namespace=team-examples-workspaces
              - --ignore-not-found=true
              - --wait=true
        - command:
            entrypoint: kubectl
            args:
              - wait
              - externalsecret/team-dev-secrets
              - --namespace=team-examples-workspaces
              - --for=condition=Ready
              - --timeout=180s
        - apply:
            file: fixtures/coder/dev-secrets-workspace-probe.test.k8s.yaml
        - command:
            entrypoint: kubectl
            args:
              - wait
              - pod/dev-secrets-workspace-probe
              - --namespace=team-examples-workspaces
              - --for=jsonpath={.status.phase}=Succeeded
              - --timeout=120s
        - command: *cleanup-workspace-probe
      finally:
        - command: *cleanup-workspace-probe
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: examples-team-cannot-reference-another-teams-dev-secret
  labels:
    cadence: commit
    capability: secrets
    mutates: scratch
spec:
  namespace: team-examples-workspaces
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    cleanup: 2m
    exec: 2m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                proxy_log="$(mktemp)"
                request="$(mktemp)"
                response="$(mktemp)"
                cleanup() {
                  kill "${proxy_pid:-}" 2>/dev/null || true
                  rm -f "${proxy_log}" "${request}" "${response}"
                }
                trap cleanup EXIT

                kubectl proxy --port=18088 >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null http://127.0.0.1:18088/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                kubectl get externalsecret/team-dev-secrets \
                  --namespace=team-examples-workspaces --output=json |
                  jq --compact-output '
                    del(
                      .metadata.creationTimestamp,
                      .metadata.generation,
                      .metadata.managedFields,
                      .metadata.uid,
                      .status
                    ) |
                    .spec.data[0].remoteRef.key = "team-other"
                  ' >"${request}"

                code="$(curl --silent --show-error --noproxy '*' \
                  --request PUT --header 'Content-Type: application/json' \
                  --data-binary "@${request}" --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18088/apis/external-secrets.io/v1/namespaces/team-examples-workspaces/externalsecrets/team-dev-secrets?dryRun=All')"
                test "${code}" = 422
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .reason == "Invalid" and
                  .code == 422 and
                  .details.name == "team-dev-secrets" and
                  (.details.group // "") == "external-secrets.io" and
                  .details.kind == "externalsecrets"
                ' "${response}" >/dev/null

                kubectl get externalsecret/team-dev-secrets \
                  --namespace=team-examples-workspaces --output=json |
                  jq --compact-output '
                    del(
                      .metadata.creationTimestamp,
                      .metadata.generation,
                      .metadata.managedFields,
                      .metadata.resourceVersion,
                      .metadata.uid,
                      .status
                    ) |
                    .metadata.name = "chainsaw-alternate-dev-secrets" |
                    .spec.target.name = "chainsaw-alternate-dev-secrets" |
                    .spec.data[0].remoteRef.key = "team-other"
                  ' >"${request}"

                code="$(curl --silent --show-error --noproxy '*' \
                  --request POST --header 'Content-Type: application/json' \
                  --data-binary "@${request}" --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18088/apis/external-secrets.io/v1/namespaces/team-examples-workspaces/externalsecrets?dryRun=All')"
                test "${code}" = 422
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .reason == "Invalid" and
                  .code == 422 and
                  .details.name == "chainsaw-alternate-dev-secrets" and
                  (.details.group // "") == "external-secrets.io" and
                  .details.kind == "externalsecrets"
                ' "${response}" >/dev/null
