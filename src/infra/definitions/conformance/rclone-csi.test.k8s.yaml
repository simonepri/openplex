# Proves Rclone CSI volumes support POSIX filesystem actions and survive driver restarts, and that team lanes reject unauthorized aliases, to defend workload storage integrity.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rclone-csi-workload-data-contract
  labels:
    cadence: commit
    capability: storage
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 2m
    assert: 2m
    delete: 2m
    exec: 5m
  steps:
    - try:
        - command:
            entrypoint: sh
            args: [scripts/check_rclone_csi_security_profile.sh]
        - command:
            entrypoint: kubectl
            args: [delete, pod/rclone-csi-probe, --namespace=team-examples-workloads, --ignore-not-found=true, --wait=true]
        - apply: {file: fixtures/storage/rclone-csi-probe.test.k8s.yaml}
        - command:
            entrypoint: kubectl
            args: [wait, --for=condition=Ready, pod/rclone-csi-probe, --namespace=team-examples-workloads, --timeout=300s]
        - command:
            entrypoint: kubectl
            args: [apply, --dry-run=server, --filename=fixtures/storage/rclone-csi-foreign-alias-probe.test.k8s.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'team-rclone-csi-volume-contract')): true
        - command:
            entrypoint: kubectl
            args: [apply, --dry-run=server, --filename=fixtures/storage/rclone-csi-wrong-mount-path-probe.test.k8s.yaml]
            check:
              ($error != null): true
              (contains($stderr, 'team-rclone-csi-volume-contract')): true
        - command:
            entrypoint: kubectl
            args: [cp, fixtures/storage/rclone-csi-filesystem-probe.sh, team-examples-workloads/rclone-csi-probe:/tmp/rclone-csi-filesystem-probe.sh]
        - command:
            entrypoint: kubectl
            args: [exec, --namespace=team-examples-workloads, pod/rclone-csi-probe, --, sh, /tmp/rclone-csi-filesystem-probe.sh]
        - command:
            entrypoint: kubectl
            args: [delete, pod, --namespace=csi-rclone, --selector=app=rclone-csi-node, --wait=true]
        - command:
            entrypoint: kubectl
            args: [rollout, status, daemonset/rclone-csi-node, --namespace=csi-rclone, --timeout=300s]
        - command:
            entrypoint: kubectl
            args: [exec, --namespace=team-examples-workloads, pod/rclone-csi-probe, --, test, -f, /s3/eaws-lh1/home/chainsaw-restart]
        - command:
            entrypoint: kubectl
            args: [exec, --namespace=team-examples-workloads, pod/rclone-csi-probe, --, test, -f, /s3/global/home/chainsaw-global]
      finally:
        - command:
            entrypoint: kubectl
            args: [exec, --namespace=team-examples-workloads, pod/rclone-csi-probe, --, rm, -f, /s3/eaws-lh1/home/chainsaw-restart, /s3/eaws-lh1/scratch/chainsaw-scratch, /s3/global/home/chainsaw-global]
        - command:
            entrypoint: kubectl
            args: [delete, pod/rclone-csi-probe, --namespace=team-examples-workloads, --ignore-not-found=true, --wait=true]
