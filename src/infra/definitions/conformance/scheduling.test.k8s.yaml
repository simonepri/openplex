apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: team-cannot-use-ungranted-queue
  labels:
    cadence: commit
    capability: scheduling
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    cleanup: 2m
    exec: 3m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            env:
              - name: BUSYBOX_IMAGE
                value: ($values.busyboxImage)
            args:
              - -ceu
              - |-
                namespace=team-examples-workloads
                job=ungranted-class-conformance
                fixture=fixtures/scheduling/workload-class-agreement.test.k8s.yaml
                job_uid=
                cleanup() {
                  kubectl delete job/${job} --namespace=${namespace} \
                    --ignore-not-found=true --wait=true --timeout=120s
                  if test -n "${job_uid}"; then
                    kubectl delete workloads --namespace=${namespace} \
                      --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                      --ignore-not-found=true --wait=true --timeout=120s
                  fi
                }
                trap cleanup EXIT
                cleanup

                sed \
                  -e "s|image: (\$values.busyboxImage)|image: ${BUSYBOX_IMAGE}|" \
                  "${fixture}" | kubectl create --dry-run=client \
                    --filename=- --output=json | jq \
                      --arg name "${job}" '
                        .metadata.name = $name |
                        .metadata.labels["app.kubernetes.io/component"] = $name |
                        .metadata.labels["availability-class"] = "ma" |
                        .metadata.labels["latency-class"] = "ls" |
                        .spec.template.metadata.labels["app.kubernetes.io/component"] = $name |
                        del(.metadata.labels["kueue.x-k8s.io/queue-name"]) |
                        del(.spec.template.spec.priorityClassName)
                      ' | kubectl create --as=conformance-user \
                        --as-group=cluster:group:team:examples --filename=- --output=json | \
                  jq --exit-status \
                    --arg name "${job}" '
                      .apiVersion == "batch/v1" and
                      .kind == "Job" and
                      .metadata.name == $name and
                      .metadata.labels["kueue.x-k8s.io/queue-name"] == "ma"
                    ' >/dev/null

                job_uid="$(kubectl get job/${job} --namespace=${namespace} \
                  --output=jsonpath='{.metadata.uid}')"
                kubectl wait workloads --namespace=${namespace} \
                  --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                  --for=create --timeout=120s >/dev/null
                kubectl wait workloads --namespace=${namespace} \
                  --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                  --for=jsonpath='{.status.conditions[?(@.type=="QuotaReserved")].status}'=False \
                  --timeout=120s >/dev/null

                kubectl get job/${job} --namespace=${namespace} --output=json | \
                  jq --exit-status '
                    .spec.suspend == true and
                    .metadata.labels["kueue.x-k8s.io/queue-name"] == "ma"
                  ' >/dev/null
                kubectl get workloads --namespace=${namespace} \
                  --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                  --output=json | jq --exit-status '
                    (.items | length) == 1 and
                    .items[0].spec.queueName == "ma" and
                    .items[0].status.admission == null and
                    any(.items[0].status.conditions[];
                      .type == "QuotaReserved" and .status == "False")
                  ' >/dev/null
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - job/ungranted-class-conformance
              - --namespace=team-examples-workloads
              - --ignore-not-found=true
              - --wait=true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: availability-class-borrow-and-reclaim
  labels:
    cadence: daily
    capability: scheduling
    mutates: scratch
spec:
  namespace: availability-classes-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 1m
    cleanup: 3m
    delete: 2m
    exec: 5m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            env:
              - name: BUSYBOX_IMAGE
                value: ($values.busyboxImage)
            args:
              - -ceu
              - |-
                namespace=availability-classes-e2e
                fixture=fixtures/scheduling/class-workload.test.k8s.yaml

                kubectl label namespace/${namespace} \
                  kueue.x-k8s.io/managed=true team=examples --overwrite
                kubectl apply \
                  --filename=fixtures/scheduling/class-queues.test.k8s.yaml

                submit() {
                  name="${1}"
                  availability="${2}"
                  latency="${3}"
                  cpu="${4}"
                  sed \
                    -e "s|__NAME__|${name}|g" \
                    -e "s|__AVAILABILITY__|${availability}|g" \
                    -e "s|__LATENCY__|${latency}|g" \
                    -e "s|__CPU__|${cpu}|g" \
                    -e "s|__IMAGE__|${BUSYBOX_IMAGE}|g" \
                    "${fixture}" | kubectl apply --filename=-
                }

                workload_name() {
                  job_uid="$(kubectl get "job/${1}" --namespace=${namespace} \
                    --output=jsonpath='{.metadata.uid}')"
                  kubectl wait workloads --namespace=${namespace} \
                    --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                    --for=create --timeout=120s >/dev/null
                  kubectl get workloads --namespace=${namespace} \
                    --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                    --output=jsonpath='{.items[0].metadata.name}'
                }

                borrowed_cpu() {
                  kubectl get "clusterqueue/${1}" --output=json | jq --raw-output '
                    [
                      .status.flavorsReservation[]? |
                      select(.name == "linux") |
                      .resources[]? |
                      select(.name == "cpu") |
                      .borrowed
                    ][0] // "0"
                  '
                }

                be_borrowed_before="$(borrowed_cpu team-examples-be)"
                submit class-wa wa ls 2
                submit class-be be ls 1

                wa_workload="$(workload_name class-wa)"
                be_workload="$(workload_name class-be)"
                for workload in "${wa_workload}" "${be_workload}"; do
                  kubectl wait "workload/${workload}" --namespace=${namespace} \
                    --for=condition=Admitted --timeout=180s >/dev/null
                done

                test "$(borrowed_cpu team-examples-be)" != "${be_borrowed_before}"

                submit class-ha ha ls 3
                ha_workload="$(workload_name class-ha)"
                kubectl wait "workload/${ha_workload}" --namespace=${namespace} \
                  --for=condition=Admitted --timeout=180s >/dev/null
                for workload in "${wa_workload}" "${be_workload}"; do
                  kubectl wait "workload/${workload}" --namespace=${namespace} \
                    --for=jsonpath='{.status.conditions[?(@.type=="Evicted")].status}'=True \
                    --timeout=180s >/dev/null
                  kubectl get "workload/${workload}" --namespace=${namespace} \
                    --output=json | jq --exit-status '
                      any(.status.conditions[];
                        .type == "Evicted" and
                        .status == "True" and
                        .reason == "Preempted")
                    ' >/dev/null
                done
                kubectl get "workload/${ha_workload}" --namespace=${namespace} \
                  --output=json | jq --exit-status '
                    any(.status.conditions[];
                      .type == "Admitted" and .status == "True") and
                    all(.status.conditions[];
                      .type != "Evicted" or .status != "True")
                  ' >/dev/null

                kubectl delete jobs --namespace=${namespace} \
                  --selector=app.kubernetes.io/component=availability-class-conformance \
                  --wait=true --timeout=120s
                kubectl delete workloads --all --namespace=${namespace} \
                  --ignore-not-found=true --wait=true --timeout=120s

                submit class-ha-over-floor ha ls 3100m
                over_floor_workload="$(workload_name class-ha-over-floor)"
                kubectl wait "workload/${over_floor_workload}" \
                  --namespace=${namespace} \
                  --for=jsonpath='{.status.conditions[?(@.type=="QuotaReserved")].status}'=False \
                  --timeout=180s >/dev/null
                kubectl get "workload/${over_floor_workload}" \
                  --namespace=${namespace} --output=json | jq --exit-status '
                    (.status.admission == null) and
                    any(.status.conditions[];
                      .type == "QuotaReserved" and .status == "False")
                  ' >/dev/null
      finally:
        - command:
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                kubectl delete jobs --all --namespace=availability-classes-e2e \
                  --ignore-not-found=true --wait=true --timeout=120s
                kubectl delete workloads --all --namespace=availability-classes-e2e \
                  --ignore-not-found=true --wait=true --timeout=120s
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pods-ready-timeout-requeues-workload
  labels:
    cadence: daily
    capability: scheduling
    mutates: scratch
spec:
  namespace: pods-ready-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    cleanup: 3m
    exec: 18m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            env:
              - name: BUSYBOX_IMAGE
                value: ($values.busyboxImage)
            args:
              - -ceu
              - |-
                namespace=pods-ready-e2e
                fixture=fixtures/scheduling/pods-ready-timeout-workload.test.k8s.yaml
                kubectl label namespace/${namespace} \
                  kueue.x-k8s.io/managed=true team=examples --overwrite
                kubectl apply --filename=- <<'EOF'
                apiVersion: kueue.x-k8s.io/v1beta2
                kind: LocalQueue
                metadata: {name: wa, namespace: pods-ready-e2e}
                spec: {clusterQueue: team-examples-wa}
                EOF
                sed -e "s|image: (\$values.busyboxImage)|image: ${BUSYBOX_IMAGE}|" \
                  "${fixture}" | kubectl apply --filename=-

                job_uid="$(kubectl get job/pods-ready-timeout \
                  --namespace=${namespace} --output=jsonpath='{.metadata.uid}')"
                kubectl wait workloads --namespace=${namespace} \
                  --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                  --for=create --timeout=120s >/dev/null
                workload="$(kubectl get workloads --namespace=${namespace} \
                  --selector="kueue.x-k8s.io/job-uid=${job_uid}" \
                  --output=jsonpath='{.items[0].metadata.name}')"
                kubectl wait "workload/${workload}" --namespace=${namespace} \
                  --for=condition=Admitted --timeout=180s >/dev/null
                kubectl wait pod --namespace=${namespace} \
                  --selector=job-name=pods-ready-timeout \
                  --for=condition=PodScheduled=true --timeout=180s >/dev/null
                kubectl wait pod --namespace=${namespace} \
                  --selector=job-name=pods-ready-timeout \
                  --for=condition=Ready=false --timeout=180s >/dev/null
                kubectl wait "workload/${workload}" --namespace=${namespace} \
                  --for=jsonpath='{.status.requeueState.count}'=1 \
                  --timeout=1020s >/dev/null
                kubectl get "workload/${workload}" --namespace=${namespace} \
                  --output=json | jq --exit-status '
                    .status.requeueState.count >= 1 and
                    (.status.requeueState.requeueAt | type == "string")
                  ' >/dev/null
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - job/pods-ready-timeout
              - --namespace=pods-ready-e2e
              - --ignore-not-found=true
              - --wait=true
---
