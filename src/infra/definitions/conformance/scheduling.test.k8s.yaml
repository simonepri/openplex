# Proves Kueue topology placement, availability-class preemption, HTTP scale-to-zero admission, and pod timeout requeuing defend scheduler quotas.

# yamllint disable rule:line-length
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: admit-and-run-workload-through-kueue
  labels:
    cadence: commit
    capability: scheduling
    mutates: scratch
spec:
  namespace: conformance-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    assert: 30s
    cleanup: 30s
    exec: 30s
  steps:
    - try:
        - apply:
            cluster: cell-eaws-lh1
            file: fixtures/scheduling/conformance-probe-queue.test.k8s.yaml
        - apply:
            cluster: cell-eaws-lh1
            file: fixtures/scheduling/conformance-probe-job.test.k8s.yaml
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - get
              - job/admit-and-run-workload-through-kueue
              - --namespace=conformance-workloads
              - --output=jsonpath={.metadata.uid}
            outputs:
              - name: probeJobUID
                value: (trim_space($stdout))
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            env:
              - name: JOB_UID
                value: ($probeJobUID)
            args:
              - wait
              - workloads
              - --namespace=conformance-workloads
              - --selector=kueue.x-k8s.io/job-uid=$JOB_UID
              - --for=create
              - --timeout=30s
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            env:
              - name: JOB_UID
                value: ($probeJobUID)
            args:
              - wait
              - workloads
              - --namespace=conformance-workloads
              - --selector=kueue.x-k8s.io/job-uid=$JOB_UID
              - --for=condition=Admitted
              - --timeout=30s
        - command:
            cluster: cell-eaws-lh1
            entrypoint: sh
            args:
              - -ceu
              - |-
                attempt=0
                while [ "${attempt}" -lt 30 ]; do
                  phase="$(kubectl get pods --namespace=conformance-workloads --selector=job-name=admit-and-run-workload-through-kueue --output=jsonpath='{.items[0].status.phase}' 2>/dev/null || true)"
                  if [ "${phase}" = "Succeeded" ]; then
                    exit 0
                  fi
                  if [ "${phase}" = "Failed" ]; then
                    printf 'Pod for admit-and-run-workload-through-kueue failed\n' >&2
                    exit 1
                  fi
                  attempt=$((attempt + 1))
                  sleep 1
                done
                printf 'Pod for admit-and-run-workload-through-kueue timed out\n' >&2
                exit 1
      finally:
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - logs
              - --selector=job-name=admit-and-run-workload-through-kueue
              - --namespace=conformance-workloads
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - describe
              - pod
              - --selector=job-name=admit-and-run-workload-through-kueue
              - --namespace=conformance-workloads
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - delete
              - job/admit-and-run-workload-through-kueue
              - --namespace=conformance-workloads
              - --ignore-not-found=true
              - --wait=false
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: topology-aware-scheduling
  labels:
    cadence: commit
    capability: scheduling
    mutates: scratch
spec:
  namespace: scheduling-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    exec: 3m
  steps:
    - try:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - --filename=fixtures/scheduling/topology-placement.test.k8s.yaml
              - --ignore-not-found=true
              - --wait=true
        - command:
            entrypoint: kubectl
            args:
              - label
              - namespace/scheduling-e2e
              - kueue.x-k8s.io/managed=true
              - --overwrite
        - apply:
            file: fixtures/scheduling/topology-placement.test.k8s.yaml
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=create
              - pod
              - --selector=job-name=topology-placement
              - --namespace=scheduling-e2e
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=condition=Ready
              - pod
              - --selector=job-name=topology-placement
              - --namespace=scheduling-e2e
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - get
              - job/topology-placement
              - --namespace=scheduling-e2e
              - --output=jsonpath={.metadata.uid}
            outputs:
              - name: topologyPlacementJobUID
                value: (trim_space($stdout))
        - command:
            entrypoint: kubectl
            env:
              - name: JOB_UID
                value: ($topologyPlacementJobUID)
            args:
              - wait
              - workloads
              - --namespace=scheduling-e2e
              - --selector=kueue.x-k8s.io/job-uid=$JOB_UID
              - --for=create
              - --timeout=90s
        - command:
            entrypoint: kubectl
            env:
              - name: JOB_UID
                value: ($topologyPlacementJobUID)
            args:
              - get
              - workloads
              - --namespace=scheduling-e2e
              - --selector=kueue.x-k8s.io/job-uid=$JOB_UID
              - --output=jsonpath={.items[0].status.admission.podSetAssignments[0].topologyAssignment.levels[0]}
            check:
              (trim_space($stdout) != ''): true
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=condition=complete
              - job/topology-placement
              - --namespace=scheduling-e2e
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - get
              - job/topology-unsatisfiable
              - --namespace=scheduling-e2e
              - --output=jsonpath={.metadata.uid}
            outputs:
              - name: topologyUnsatisfiableJobUID
                value: (trim_space($stdout))
        - command:
            entrypoint: kubectl
            env:
              - name: JOB_UID
                value: ($topologyUnsatisfiableJobUID)
            args:
              - wait
              - workloads
              - --namespace=scheduling-e2e
              - --selector=kueue.x-k8s.io/job-uid=$JOB_UID
              - --for=create
              - --timeout=180s
        - command:
            entrypoint: kubectl
            env:
              - name: JOB_UID
                value: ($topologyUnsatisfiableJobUID)
            args:
              - wait
              - workloads
              - --namespace=scheduling-e2e
              - --selector=kueue.x-k8s.io/job-uid=$JOB_UID
              - --for=jsonpath={.status.conditions[?(@.type=="QuotaReserved")].status}=False
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - wait
              - job/topology-unsatisfiable
              - --namespace=scheduling-e2e
              - --for=jsonpath={.spec.suspend}=true
              - --timeout=180s
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-class-agreement
  labels:
    cadence: commit
    capability: scheduling
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    exec: 2m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            env:
              - name: BUSYBOX_IMAGE
                value: ($values.busyboxImage)
            args:
              - -ceu
              - |-
                fixture=fixtures/scheduling/workload-class-agreement.test.k8s.yaml
                proxy_log="$(mktemp)"
                request="$(mktemp)"
                response="$(mktemp)"
                cleanup() {
                  kubectl delete job/workload-class-agreement \
                    --namespace=team-examples-workloads \
                    --as=conformance-user \
                    --as-group=cluster:group:team:examples \
                    --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
                  kill "${proxy_pid:-}" 2>/dev/null || true
                  rm -f "${proxy_log}" "${request}" "${response}"
                }
                trap cleanup EXIT

                base="$(sed \
                  -e "s|image: (\$values.busyboxImage)|image: ${BUSYBOX_IMAGE}|" \
                  "${fixture}" | kubectl create --dry-run=client \
                    --filename=- --output=json)"

                kubectl proxy --port=18087 --as=conformance-user \
                  --as-group=cluster:group:team:examples \
                  >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null \
                    http://127.0.0.1:18087/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                post_dry_run() {
                  code="$(curl --silent --show-error --noproxy '*' \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data-binary "@${request}" \
                    --output "${response}" \
                    --write-out '%{http_code}' \
                    'http://127.0.0.1:18087/apis/batch/v1/namespaces/team-examples-workloads/jobs?dryRun=All')"
                }

                while read -r availability latency priority; do
                  printf '%s' "${base}" | jq \
                    --arg availability "${availability}" \
                    --arg latency "${latency}" \
                    --arg priority "${priority}" '
                      .metadata.labels["availability-class"] = $availability |
                      .metadata.labels["latency-class"] = $latency |
                      del(.metadata.labels["kueue.x-k8s.io/queue-name"]) |
                      del(.spec.template.spec.priorityClassName)
                    ' >"${request}"
                  post_dry_run
                  test "${code}" = 201
                  jq --exit-status \
                    --arg availability "${availability}" \
                    --arg priority "${priority}" '
                      .apiVersion == "batch/v1" and
                      .kind == "Job" and
                      .metadata.labels["kueue.x-k8s.io/queue-name"] == $availability and
                      .spec.template.spec.priorityClassName == $priority
                    ' "${response}" >/dev/null
                done <<'EOF'
                ha ls ha-ls
                ha lt ha-lt
                ma ls ma-ls
                ma lt ma-lt
                wa ls wa-ls
                wa lt wa-lt
                be ls be-ls
                be lt be-lt
                EOF

                assert_invalid() {
                  jq_filter="${1}"
                  printf '%s' "${base}" | jq "${jq_filter}" >"${request}"
                  post_dry_run
                  test "${code}" = 422
                  jq --exit-status '
                    .apiVersion == "v1" and
                    .kind == "Status" and
                    .status == "Failure" and
                    .reason == "Invalid" and
                    .code == 422 and
                    .details.name == "workload-class-agreement"
                  ' "${response}" >/dev/null
                }

                assert_rejected() {
                  jq_filter="${1}"
                  printf '%s' "${base}" | jq "${jq_filter}" >"${request}"
                  post_dry_run
                  test "${code}" != 201
                  jq --exit-status '
                    .apiVersion == "v1" and
                    .kind == "Status" and
                    .status == "Failure"
                  ' "${response}" >/dev/null
                }

                # LINT.IfChange(workload_scheduling_admission_cases)
                assert_invalid 'del(.metadata.labels["availability-class"])'
                assert_invalid '.metadata.labels["availability-class"]="unknown"'
                assert_invalid 'del(.metadata.labels["latency-class"])'
                assert_invalid '.metadata.labels["latency-class"]="unknown"'
                assert_rejected '.metadata.labels["kueue.x-k8s.io/queue-name"]="wa"'
                assert_rejected '.spec.template.spec.priorityClassName="wa-lt"'
                # LINT.ThenChange(//src/infra/argocd/components/kueue/kustomize/scheduling-defaults.yaml:team_scheduling_classes,//src/infra/argocd/components/kueue/kustomize/team-governance.yaml:team_scheduling_classes)

                printf '%s' "${base}" >"${request}"
                code="$(curl --silent --show-error --noproxy '*' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data-binary "@${request}" \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18087/apis/batch/v1/namespaces/team-examples-workloads/jobs')"
                test "${code}" = 201

                code="$(curl --silent --show-error --noproxy '*' \
                  --request PATCH \
                  --header 'Content-Type: application/json-patch+json' \
                  --data-binary '[
                    {"op":"remove","path":"/metadata/labels/kueue.x-k8s.io~1queue-name"},
                    {"op":"remove","path":"/spec/template/spec/priorityClassName"}
                  ]' \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18087/apis/batch/v1/namespaces/team-examples-workloads/jobs/workload-class-agreement?dryRun=All')"
                test "${code}" = 200
                jq --exit-status '
                  .metadata.labels["kueue.x-k8s.io/queue-name"] == "wa" and
                  .spec.template.spec.priorityClassName == "wa-lt"
                ' "${response}" >/dev/null

                code="$(curl --silent --show-error --noproxy '*' \
                  --request PATCH \
                  --header 'Content-Type: application/json-patch+json' \
                  --data-binary '[
                    {"op":"replace","path":"/metadata/labels/availability-class","value":"ha"},
                    {"op":"replace","path":"/metadata/labels/latency-class","value":"ls"},
                    {"op":"replace","path":"/metadata/labels/kueue.x-k8s.io~1queue-name","value":"ha"},
                    {"op":"replace","path":"/spec/template/spec/priorityClassName","value":"ha-ls"}
                  ]' \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18087/apis/batch/v1/namespaces/team-examples-workloads/jobs/workload-class-agreement?dryRun=All')"
                test "${code}" = 422
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .reason == "Invalid" and
                  .code == 422
                ' "${response}" >/dev/null
---
