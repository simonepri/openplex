# Stages an isolated CloudNativePG cluster with Barman ObjectStore plugin configuration to defend PostgreSQL backup and recovery conformance tests.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ($cnpgCluster)
  namespace: observability
  labels:
    app.kubernetes.io/name: ($cnpgCluster)
    app.kubernetes.io/component: database-recovery-drill
spec:
  instances: 1
  imageName: ($values.postgresImage)
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: false
  inheritedMetadata:
    labels:
      app.kubernetes.io/component: database-recovery-drill
  bootstrap:
    initdb:
      database: recovery_fixture
      owner: app
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: signoz-postgres-backups
        serverName: ($cnpgCluster)
  storage:
    size: 256Mi
    storageClass: general-expandable
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: false
  podSecurityContext:
    fsGroup: 26
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
