# Stages workspace pods and workload probes to defend platform-managed NetworkPolicy isolation rules for the shared workspaces namespace.

apiVersion: v1
kind: Pod
metadata:
  name: workspace-server
  namespace: workspaces
  labels:
    app.kubernetes.io/name: coder-workspace
    app.kubernetes.io/part-of: coder
    com.coder.resource: "true"
    role: server
    cost-center: workspaces
    environment: production
    availability-class: be
    latency-class: ls
spec:
  automountServiceAccountToken: false
  containers:
    - name: http
      image: ($values.busyboxImage)
      command: [sh, -ceu]
      args:
        - echo workspace-networking-ok >/www/index.html; exec httpd -f -p 8080 -h /www
      ports: [{name: http, containerPort: 8080}]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      volumeMounts: [{name: content, mountPath: /www}]
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  volumes: [{name: content, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-server
  namespace: workspaces
  labels: {app.kubernetes.io/managed-by: chainsaw}
spec:
  selector:
    app.kubernetes.io/name: coder-workspace
    role: server
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: workspace-client
  namespace: workspaces
  labels:
    app.kubernetes.io/name: coder-workspace
    app.kubernetes.io/part-of: coder
    com.coder.resource: "true"
    role: client
    cost-center: workspaces
    environment: production
    availability-class: be
    latency-class: ls
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: ($values.busyboxImage)
      args: [sleep, "600"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
---
