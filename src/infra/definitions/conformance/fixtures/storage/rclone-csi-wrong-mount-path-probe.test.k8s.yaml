# Attempts Rclone CSI volume mounts outside permitted developer paths to defend admission policy rejection of invalid mount targets.

apiVersion: v1
kind: Pod
metadata:
  name: rclone-csi-wrong-mount-path-probe
  namespace: team-examples-workloads
  labels:
    app.kubernetes.io/name: ray-runner
    availability-class: be
    cost-center: examples
    environment: production
    latency-class: ls
    team: examples
spec:
  containers:
    - name: probe
      image: ($values.busyboxImage)
      command: [sleep]
      args: [1]
      volumeMounts:
        - {mountPath: /s3/home, name: home, readOnly: false}
  serviceAccountName: ray-runner
  volumes:
    - name: home
      csi:
        driver: rclone.csi.veloxpack.io
        nodePublishSecretRef: {name: team-s3}
        volumeAttributes: {gid: "1000", no-checksum: "true", remote: home, remotePath: "", uid: "1000", umask: "0022", vfs-cache-mode: "off"}
