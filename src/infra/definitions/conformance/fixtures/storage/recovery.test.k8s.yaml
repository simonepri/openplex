# Stages a StatefulSet with persistent volume claims to defend storage durability across pod termination and workload recreation.

apiVersion: v1
kind: Namespace
metadata:
  name: storage-e2e
---
apiVersion: v1
kind: Service
metadata:
  name: storage-recovery
  namespace: storage-e2e
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: storage-recovery
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-recovery
  namespace: storage-e2e
spec:
  replicas: 1
  serviceName: storage-recovery
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-recovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-recovery
    spec:
      automountServiceAccountToken: false
      containers:
        - name: storage-recovery
          image: ($values.busyboxImage)
          command:
            - /bin/sh
            - -ceu
            - trap 'exit 0' TERM INT; while true; do sleep 3600; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /data
              name: data
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Mi
        storageClassName: general-expandable
