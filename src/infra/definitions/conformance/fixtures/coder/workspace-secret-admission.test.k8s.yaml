# Declares mock protected credentials, test identities, and workspace deployments to defend admission policy checks against unauthorized secret access.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-secret-admission-conformance
  namespace: workspace-secret-admission-e2e
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, patch, update]
  - apiGroups: [""]
    resources: [pods/attach, pods/exec, pods/portforward]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/ephemeralcontainers]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, update]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [create, get, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [create, patch, update]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-secret-admission-conformance
  namespace: workspace-secret-admission-e2e
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: conformance-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-secret-admission-conformance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-secret-admission-controllers
  namespace: workspace-secret-admission-e2e
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-secret-admission-controllers
  namespace: workspace-secret-admission-e2e
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:kube-controller-manager
  - kind: ServiceAccount
    name: deployment-controller
    namespace: kube-system
  - kind: ServiceAccount
    name: replicaset-controller
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-secret-admission-controllers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-secret-admission-provisioner
  namespace: workspace-secret-admission-e2e
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-secret-admission-provisioner
  namespace: workspace-secret-admission-e2e
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: cluster:test:coder-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-secret-admission-provisioner
---
apiVersion: v1
kind: Secret
metadata:
  name: workspace-backups
  namespace: workspace-secret-admission-e2e
type: Opaque
data:
  access_key_id: Zml4dHVyZS1vcmdhbml6YXRpb24tYWNjZXNz
  secret_access_key: Zml4dHVyZS1vcmdhbml6YXRpb24tc2VjcmV0
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-11111111-1111-4111-8111-111111111111-runtime
  namespace: workspace-secret-admission-e2e
  labels:
    app.kubernetes.io/component: runtime-credentials
    app.kubernetes.io/name: coder-workspace-runtime
    app.kubernetes.io/part-of: coder
    com.coder.resource: "true"
    com.coder.user.id: 22222222-2222-4222-8222-222222222222
    com.coder.workspace.id: 11111111-1111-4111-8111-111111111111
type: Opaque
data:
  backup_proxy_access_key: Zml4dHVyZS1sb2NhbC1hY2Nlc3M=
  backup_proxy_auth_key: ImZpeHR1cmUtbG9jYWwtYWNjZXNzLGZpeHR1cmUtbG9jYWwtc2VjcmV0Ig==
  backup_proxy_secret_key: Zml4dHVyZS1sb2NhbC1zZWNyZXQ=
  coder_agent_token: Zml4dHVyZS1jb2Rlci1hZ2VudC10b2tlbg==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-11111111-1111-4111-8111-111111111111-buildbuddy
  namespace: workspace-secret-admission-e2e
  labels:
    app.kubernetes.io/name: coder-workspace
    app.kubernetes.io/part-of: coder
    com.coder.resource: "true"
    com.coder.user.id: 22222222-2222-4222-8222-222222222222
    com.coder.workspace.id: 11111111-1111-4111-8111-111111111111
data:
  buildbuddy.bazelrc: |-
    import /var/run/workspace/buildbuddy/credentials.bazelrc
    build --remote_cache=grpc://buildbuddy-cache.buildbuddy.svc.cluster.local:1985
    build --bes_backend=grpcs://buildbuddy-events.k8s.example.invalid:443
    build --bes_results_url=https://buildbuddy.k8s.example.invalid/invocation/
---
apiVersion: v1
kind: Secret
metadata:
  name: workspace-buildbuddy-auth
  namespace: workspace-secret-admission-e2e
type: Opaque
data:
  credentials.bazelrc: YnVpbGQgLS1yZW1vdGVfaGVhZGVyPXgtYnVpbGRidWRkeS1hcGkta2V5PWZpeHR1cmUtY2FjaGUKYnVpbGQgLS1yZW1vdGVfY2FjaGVfaGVhZGVyPXgtYnVpbGRidWRkeS1hcGkta2V5PWZpeHR1cmUtY2FjaGUKYnVpbGQgLS1iZXNfaGVhZGVyPXgtYnVpbGRidWRkeS1hcGkta2V5PWZpeHR1cmUtYmVz
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: workspace-buildbuddy-auth
  namespace: workspace-secret-admission-e2e
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-records
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: workspace-buildbuddy-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspace-buildbuddy-auth
  namespace: workspace-secret-admission-e2e
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: workspace-buildbuddy-auth
  target:
    name: workspace-buildbuddy-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        credentials.bazelrc: |-
          build --remote_header=x-buildbuddy-api-key={{ .cache_api_key }}
          build --remote_cache_header=x-buildbuddy-api-key={{ .cache_api_key }}
          build --bes_header=x-buildbuddy-api-key={{ .bes_api_key }}
  data:
    - secretKey: cache_api_key
      remoteRef:
        key: buildbuddy-auth-cell-eaws-lh1
        property: cache_api_key
    - secretKey: bes_api_key
      remoteRef:
        key: buildbuddy-auth-cell-eaws-lh1
        property: bes_api_key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-11111111-1111-4111-8111-111111111111
  namespace: workspace-secret-admission-e2e
  labels:
    app.kubernetes.io/name: coder-workspace
    app.kubernetes.io/part-of: coder
    com.coder.resource: "true"
    com.coder.user.id: 22222222-2222-4222-8222-222222222222
    com.coder.workspace.id: 11111111-1111-4111-8111-111111111111
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
      com.coder.workspace.id: 11111111-1111-4111-8111-111111111111
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-workspace
        app.kubernetes.io/part-of: coder
        com.coder.resource: "true"
        com.coder.user.id: 22222222-2222-4222-8222-222222222222
        com.coder.workspace.id: 11111111-1111-4111-8111-111111111111
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: tailnet
          image: ($values.busyboxImage)
          restartPolicy: Always
          command: [sh, -ceu, "trap 'exit 0' TERM INT; while :; do sleep 30; done"]
          env:
            - name: CODER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-11111111-1111-4111-8111-111111111111-runtime
                  key: coder_agent_token
          resources: &resources
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
          securityContext: &security-context
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        - name: backup-proxy
          image: ($values.backupProxyImage)
          restartPolicy: Always
          command: [sh, -ceu, "trap 'exit 0' TERM INT; while :; do sleep 30; done"]
          env:
            - name: CODER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-11111111-1111-4111-8111-111111111111-runtime
                  key: coder_agent_token
            - name: RCLONE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: coder-11111111-1111-4111-8111-111111111111-runtime
                  key: backup_proxy_auth_key
            - name: RCLONE_CONFIG_BACKEND_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: workspace-backups
                  key: access_key_id
            - name: RCLONE_CONFIG_BACKEND_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: workspace-backups
                  key: secret_access_key
          resources: *resources
          securityContext: *security-context
      volumes:
        - name: buildbuddy
          projected:
            defaultMode: 256
            sources:
              - configMap:
                  name: coder-11111111-1111-4111-8111-111111111111-buildbuddy
                  items:
                    - key: buildbuddy.bazelrc
                      path: buildbuddy.bazelrc
              - secret:
                  name: workspace-buildbuddy-auth
                  items:
                    - key: credentials.bazelrc
                      path: credentials.bazelrc
      containers:
        - name: workspace
          image: ($values.busyboxImage)
          command: [sh, -ceu, "trap 'exit 0' TERM INT; while :; do sleep 30; done"]
          env:
            - name: CODER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-11111111-1111-4111-8111-111111111111-runtime
                  key: coder_agent_token
            - name: KOPIA_REPOSITORY_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: coder-11111111-1111-4111-8111-111111111111-runtime
                  key: backup_proxy_access_key
            - name: KOPIA_REPOSITORY_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: coder-11111111-1111-4111-8111-111111111111-runtime
                  key: backup_proxy_secret_key
          resources: *resources
          securityContext: *security-context
          volumeMounts:
            - name: buildbuddy
              mountPath: /var/run/workspace/buildbuddy
              readOnly: true
