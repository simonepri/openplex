# Probes Coder workspace secret projection via envFrom to verify environment injection without exposing plaintext secret values.

apiVersion: v1
kind: Pod
metadata:
  name: dev-secrets-workspace-probe
  namespace: team-examples-workspaces
  labels:
    app.kubernetes.io/name: coder-workspace
    app.kubernetes.io/part-of: coder
    com.coder.workspace.id: chainsaw-dev-secrets
    availability-class: be
    latency-class: ls
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: workspace
      image: ($values.busyboxImage)
      command:
        - sh
        - -ceu
        - |-
          test -n "${SLACK_BOT_TOKEN}"
      envFrom:
        - secretRef: {name: team-dev-secrets}
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
