# Stages test namespaces, SecretStores, and ExternalSecrets to defend dynamic credential synchronization and rotation conformance tests.

apiVersion: v1
kind: Namespace
metadata:
  name: secrets-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-e2e-runner
  namespace: secrets-e2e
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secrets-e2e-runtime
  namespace: secrets-e2e
spec:
  provider:
    fake:
      data:
        - key: conformance-user-secrets
          value: '{"username":"conformance-user","token":"rotation-v1"}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-e2e-runtime
  namespace: secrets-e2e
spec:
  refreshPolicy: Periodic
  refreshInterval: 2s
  secretStoreRef:
    kind: SecretStore
    name: secrets-e2e-runtime
  target:
    name: secrets-e2e-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: conformance-user-secrets
