# Stages a consumer Pod reading synchronized Secret volumes to defend secret update propagation and application consumption after rotation.

apiVersion: v1
kind: Pod
metadata:
  name: secrets-e2e-consumer
  namespace: secrets-e2e
spec:
  restartPolicy: Never
  serviceAccountName: secrets-e2e-runner
  automountServiceAccountToken: false
  securityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: probe
      image: ($values.busyboxImage)
      command: [sh, -ceu]
      args:
        - |-
          test "$(cat /var/run/runtime-secret/token)" = "rotation-v1"
          test "$(cat /var/run/runtime-secret/username)" = "conformance-user"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: runtime-secret
          mountPath: /var/run/runtime-secret
          readOnly: true
  volumes:
    - name: runtime-secret
      secret:
        secretName: secrets-e2e-runtime
