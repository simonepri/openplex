# Updates SecretStore backend values to defend External Secrets operator change detection and downstream Secret synchronization.

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secrets-e2e-runtime
  namespace: secrets-e2e
spec:
  provider:
    fake:
      data:
        - key: conformance-user-secrets
          value: '{"username":"conformance-user","token":"rotation-v2"}'
