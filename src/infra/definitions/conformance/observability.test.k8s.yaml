# Proves SigNoz telemetry ingestion, query door authentication, and Prometheus compatibility defend cross-cluster observability and identity attribution.

# LINT.IfChange(query-signoz-telemetry-via-egress-door)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: query-signoz-telemetry-via-egress-door
  labels:
    cadence: commit
    capability: observability
    mutates: none
spec:
  namespace: otel-system
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 1m
    cleanup: 1m
    exec: 3m
  steps:
    - try:
        - command:
            entrypoint: kubectl
            args: [delete, job/observability-door-query-probe, --namespace=otel-system, --ignore-not-found=true, --wait=true]
        - apply:
            file: fixtures/observability/door-query.test.k8s.yaml
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                attempt=0
                while [ "${attempt}" -lt 120 ]; do
                  phase="$(kubectl get pods --namespace=otel-system --selector=job-name=observability-door-query-probe --output=jsonpath='{.items[0].status.phase}' 2>/dev/null || true)"
                  if [ "${phase}" = "Succeeded" ]; then
                    exit 0
                  fi
                  if [ "${phase}" = "Failed" ]; then
                    printf 'Pod for observability-door-query-probe failed\n' >&2
                    exit 1
                  fi
                  attempt=$((attempt + 1))
                  sleep 1
                done
                printf 'Pod for observability-door-query-probe timed out\n' >&2
                exit 1
      finally:
        - command:
            entrypoint: kubectl
            args:
              - logs
              - --selector=job-name=observability-door-query-probe
              - --namespace=otel-system
              - --tail=-1
        - command:
            entrypoint: kubectl
            args:
              - describe
              - pod
              - --selector=job-name=observability-door-query-probe
              - --namespace=otel-system
        - command:
            entrypoint: kubectl
            args: [delete, job/observability-door-query-probe, --namespace=otel-system, --ignore-not-found=true, --wait=true]
# LINT.ThenChange(//src/infra/argocd/components/kuberhealthy/kustomize/tests/observability/chainsaw-test.yaml:query-signoz-telemetry-via-egress-door)
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fleet-logs-cpu-and-signoz-resources
  labels:
    cadence: commit
    capability: observability
    mutates: none
spec:
  namespace: observability
  cluster: ctrl-eaws-lh1
  concurrent: false
  timeouts:
    apply: 1m
    cleanup: 1m
    exec: 12m
  steps:
    - try:
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: kubectl
            args: [delete, pod/observability-signal-probe, --namespace=team-examples, --ignore-not-found=true, --wait=true]
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: kubectl
            args: [delete, pod/observability-scanner-transport-probe, --namespace=trivy-system, --ignore-not-found=true, --wait=true]
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args: [delete, pod/observability-signal-probe, --namespace=team-examples-workloads, --ignore-not-found=true, --wait=true]
        - apply:
            cluster: ctrl-eaws-lh1
            file: fixtures/observability/signal-probe.test.k8s.yaml
            bindings:
              - name: probeNamespace
                value: team-examples
        - apply:
            cluster: cell-eaws-lh1
            file: fixtures/observability/signal-probe.test.k8s.yaml
            bindings:
              - name: probeNamespace
                value: team-examples-workloads
        - apply:
            cluster: ctrl-eaws-lh1
            file: fixtures/observability/scanner-transport.test.k8s.yaml
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: kubectl
            args: [wait, pod/observability-signal-probe, --namespace=team-examples, --for=condition=Ready, --timeout=120s]
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args: [wait, pod/observability-signal-probe, --namespace=team-examples-workloads, --for=condition=Ready, --timeout=120s]
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: kubectl
            args: [wait, pod/observability-scanner-transport-probe, --namespace=trivy-system, --for=condition=Ready, --timeout=120s]
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: kubectl
            args: [get, pod/observability-signal-probe, --namespace=team-examples, '--output=jsonpath={.metadata.uid}']
            outputs:
              - name: ctrlProbeUID
                value: (trim_space($stdout))
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args: [get, pod/observability-signal-probe, --namespace=team-examples-workloads, '--output=jsonpath={.metadata.uid}']
            outputs:
              - name: primaryProbeUID
                value: (trim_space($stdout))
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: kubectl
            args: [get, pod/observability-scanner-transport-probe, --namespace=trivy-system, '--output=jsonpath={.metadata.uid}']
            outputs:
              - name: scannerProbeUID
                value: (trim_space($stdout))
        - command:
            entrypoint: sh
            env:
              - {name: CTRL_PROBE_UID, value: (to_string($ctrlProbeUID))}
              - {name: PRIMARY_PROBE_UID, value: (to_string($primaryProbeUID))}
              - {name: SCANNER_PROBE_UID, value: (to_string($scannerProbeUID))}
            args:
              - -ceu
              - |-
                api='/api/v1/namespaces/signoz/services/http:signoz:8080/proxy/api/v5/query_range'
                response="$(mktemp)"
                scanner_response="$(mktemp)"
                trap 'rm -f "${response}" "${scanner_response}"' EXIT
                deadline="$(( $(date +%s) + 300 ))"
                while :; do
                  found=0
                  for expected in \
                    "ctrl-eaws-lh1|${CTRL_PROBE_UID}" \
                    "cell-eaws-lh1|${PRIMARY_PROBE_UID}"; do
                    cluster_name="$(printf '%s' "${expected}" | cut -d '|' -f1)"
                    probe_uid="$(printf '%s' "${expected}" | cut -d '|' -f2)"
                    now_ms="$(( $(date +%s) * 1000 ))"
                    start_ms="$(( now_ms - 600000 ))"
                    filter="body CONTAINS '${probe_uid}' AND k8s.cluster.name = '${cluster_name}'"
                    if jq --null-input --compact-output \
                      --argjson start "${start_ms}" \
                      --argjson end "$(( now_ms + 60000 ))" \
                      --arg filter "${filter}" '
                        {
                          start: $start,
                          end: $end,
                          requestType: "raw",
                          variables: {},
                          compositeQuery: {
                            queries: [{
                              type: "builder_query",
                              spec: {
                                name: "A",
                                signal: "logs",
                                filter: {expression: $filter},
                                order: [
                                  {key: {name: "timestamp"}, direction: "desc"},
                                  {key: {name: "id"}, direction: "desc"}
                                ],
                                offset: 0,
                                limit: 100
                              }
                            }]
                          }
                        }
                      ' | kubectl create --raw "${api}" --filename=- >"${response}" &&
                      jq --exit-status --arg cluster "${cluster_name}" --arg uid "${probe_uid}" '
                        .status == "success" and
                        ([.data.data.results[]?.rows[]?.data |
                          select(.resources_string["k8s.cluster.name"] == $cluster and
                                 .resources_string["k8s.pod.uid"] == $uid)] as $logs |
                          any($logs[];
                            .body == ("observability-signal " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9) and
                          all([["Information", "INFO", 9], ["SUCCESS", "INFO", 9], ["Warning", "WARN", 13]][];
                            . as $severity |
                            any($logs[];
                              .body == ("observability-severity " + $severity[0] + " " + $uid) and
                              .severity_text == $severity[1] and
                              .severity_number == $severity[2])) and
                          all($logs[]; .severity_number < 5 or .severity_number > 8) and
                          any($logs[];
                            .body == ("observability-console " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9 and
                            .attributes_string.probe_context == $uid and
                            .attributes_string["code.file.path"] == "probe.go" and
                            .attributes_number["code.line.number"] == 42) and
                          any($logs[];
                            .body == ("Channel created for target \"probe-" + $uid + ":4000\"") and
                            .severity_text == "INFO" and
                            .severity_number == 9 and
                            .attributes_string["code.file.path"] == "grpclog/grpclog.go" and
                            .attributes_number["code.line.number"] == 141 and
                            .attributes_string["grpc.log.component"] == "core" and
                            .attributes_number["grpc.channel.id"] == 3075) and
                          any($logs[];
                            .body == ("Subchannel created for probe " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9 and
                            .attributes_string["grpc.log.component"] == "core" and
                            .attributes_number["grpc.channel.id"] == 3075 and
                            .attributes_number["grpc.subchannel.id"] == 3076) and
                          any($logs[];
                            .body == ("observability-inf " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9) and
                          any($logs[];
                            .body == ("observability-slash " + $uid) and
                            .severity_text == "UNSPECIFIED" and
                            .severity_number == 0) and
                          any($logs[];
                            .body == ("observability-klog " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9 and
                            .attributes_string["code.file.path"] == "probe.go" and
                            .attributes_number["code.line.number"] == 43) and
                          any($logs[];
                            .body == ("observability-klog-no-pid " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9 and
                            .attributes_string["code.file.path"] == "probe.go" and
                            .attributes_number["code.line.number"] == 45) and
                          any($logs[];
                            .body == ("observability-klog-error " + $uid) and
                            .severity_text == "ERROR" and
                            .severity_number == 17 and
                            .attributes_string["code.file.path"] == "probe.go" and
                            .attributes_number["code.line.number"] == 46) and
                          any($logs[];
                            .body == ("observability-envoy " + $uid) and
                            .severity_text == "WARN" and
                            .severity_number == 13 and
                            .attributes_string["code.file.path"] == "probe.cc" and
                            .attributes_number["code.line.number"] == 44) and
                          any($logs[];
                            .body == ("observability-embedded " + $uid) and
                            .severity_text == "WARN" and
                            .severity_number == 13) and
                          any($logs[];
                            .body == ("[Synced] Successfully synced Bundle " + $uid) and
                            .severity_text == "INFO" and
                            .severity_number == 9) and
                          any($logs[];
                            .body == ("Failed to process request: forbidden for probe " + $uid) and
                            .severity_text == "ERROR" and
                            .severity_number == 17) and
                          any($logs[];
                            .body == ("GRPC Server Exception: ProbeError(actionable " + $uid + ")") and
                            .severity_text == "ERROR" and
                            .severity_number == 17 and
                            .attributes_string["exception.type"] == "probe.ProbeError" and
                            .attributes_string["exception.message"] == ("ProbeError(actionable " + $uid + ")")) and
                          any($logs[];
                            .body == ("observability-record " + $uid) and
                            .severity_text == "WARN" and
                            .severity_number == 13) and
                          any($logs[];
                            .body == ("GET /probe/" + $uid + " -> 200") and
                            .severity_text == "INFO" and
                            .severity_number == 9) and
                          any($logs[];
                            .body == ("HTTP /query/" + $uid + " -> 200") and
                            .severity_text == "INFO" and
                            .severity_number == 9) and
                          any($logs[];
                            .body == ("GET /envoy/" + $uid + " -> 200") and
                            .severity_text == "UNSPECIFIED" and
                            .severity_number == 0) and
                          any($logs[];
                            .body == ("observability-trace " + $uid) and
                            .severity_text == "TRACE" and
                            .severity_number == 1) and
                          any($logs[];
                            .body == ("panic: observability-stack " + $uid + "\nmain.worker()\n\t/go/src/main.go:42") and
                            .severity_text == "UNSPECIFIED" and
                            .severity_number == 0 and
                            .attributes_string["log.iostream"] == "stdout") and
                          any($logs[];
                            .body == ("observability-stderr " + $uid) and
                            .severity_text == "WARN" and
                            .severity_number == 13 and
                            .attributes_string["log.iostream"] == "stderr") and
                          any($logs[];
                            .body == ("observability-unlevelled-stderr " + $uid) and
                            .severity_text == "UNSPECIFIED" and
                            .severity_number == 0 and
                            .attributes_string["log.iostream"] == "stderr") and
                          any($logs[];
                            .body == ("observability-time " + $uid) and
                            ((.timestamp / 1000000000 - (.attributes_string.event_time | tonumber)) | fabs) < 0.00001))
                      ' "${response}" >/dev/null; then
                      found="$(( found + 1 ))"
                    fi
                  done
                  if test "${found}" -eq 2; then
                    break
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    cat "${response}" >&2
                    exit 1
                  fi
                  sleep 5
                done

                deadline="$(( $(date +%s) + 300 ))"
                while :; do
                  now_ms="$(( $(date +%s) * 1000 ))"
                  start_ms="$(( now_ms - 600000 ))"
                  filter="k8s.pod.uid = '${SCANNER_PROBE_UID}' AND k8s.cluster.name = 'ctrl-eaws-lh1'"
                  if jq --null-input --compact-output \
                    --argjson start "${start_ms}" \
                    --argjson end "$(( now_ms + 60000 ))" \
                    --arg filter "${filter}" '
                      {start:$start,end:$end,requestType:"raw",variables:{},compositeQuery:{queries:[{type:"builder_query",spec:{name:"A",signal:"logs",filter:{expression:$filter},order:[{key:{name:"timestamp"},direction:"desc"}],offset:0,limit:100}}]}}' |
                    kubectl create --raw "${api}" --filename=- >"${scanner_response}" &&
                    jq --exit-status --arg uid "${SCANNER_PROBE_UID}" '
                      .status == "success" and
                      ([.data.data.results[]?.rows[]?.data |
                        select(.resources_string["k8s.pod.uid"] == $uid)] as $logs |
                        any($logs[];
                          .body == ("observability-scanner-diagnostic " + $uid) and
                          .severity_text == "WARN" and
                          .attributes_string["log.iostream"] == "stderr" and
                          .resources_string["k8s.pod.label.app_kubernetes_io_component"] == "security-report-scanner") and
                        all($logs[]; .attributes_string["log.iostream"] != "stdout"))
                    ' "${scanner_response}" >/dev/null; then
                    break
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    cat "${scanner_response}" >&2
                    exit 1
                  fi
                  sleep 5
                done
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                query='sum by ("k8s.cluster.name") (rate(container_cpu_usage_seconds_total{container="signal",namespace=~"team-examples|team-examples-workloads",pod="observability-signal-probe"}[1m]))'
                encoded_query="$(jq --null-input --raw-output --arg query "${query}" '$query | @uri')"
                api="/api/v1/namespaces/signoz/services/prometheus-api-bridge:9090/proxy/api/v1/query?query=${encoded_query}"
                response="$(mktemp)"
                trap 'rm -f "${response}"' EXIT
                deadline="$(( $(date +%s) + 300 ))"
                while :; do
                  if kubectl get --request-timeout=35s --raw "${api}" >"${response}" &&
                    jq --exit-status '
                      .status == "success" and
                      (.data.result | length) == 2 and
                      ([.data.result[].metric["k8s.cluster.name"]] | sort) ==
                        ["cell-eaws-lh1", "ctrl-eaws-lh1"] and
                      all(.data.result[]; (.value[1] | tonumber) > 0)
                    ' "${response}" >/dev/null; then
                    exit 0
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    cat "${response}" >&2
                    exit 1
                  fi
                  sleep 5
                done
        - command:
            entrypoint: kubectl
            args:
              - wait
              - dashboard.resources.signoz.io/object-storage
              - --namespace=signoz
              - --for=condition=Ready
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - get
              - dashboard.resources.signoz.io/object-storage
              - --namespace=signoz
              - '--output=jsonpath={.status.signozResource.id}'
            check:
              (length(trim_space($stdout)) > `0`): true
        - command:
            entrypoint: kubectl
            args:
              - wait
              - rule.resources.signoz.io/kubernetes-pod-cpu-saturation
              - --namespace=signoz
              - --for=condition=Ready
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - get
              - rule.resources.signoz.io/kubernetes-pod-cpu-saturation
              - --namespace=signoz
              - '--output=jsonpath={.status.signozResource.id}'
            check:
              (length(trim_space($stdout)) > `0`): true
        - command:
            entrypoint: kubectl
            args:
              - wait
              - savedview.resources.signoz.io/fleet-errors
              - --namespace=signoz
              - --for=condition=Ready
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - get
              - savedview.resources.signoz.io/fleet-errors
              - --namespace=signoz
              - '--output=jsonpath={.status.signozResource.id}'
            check:
              (length(trim_space($stdout)) > `0`): true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kubernetes-warning-events-reach-signoz
  labels:
    cadence: commit
    capability: observability
    mutates: scratch
spec:
  namespace: signoz
  cluster: ctrl-eaws-lh1
  concurrent: false
  timeouts:
    apply: 1m
    cleanup: 1m
    exec: 5m
  steps:
    - try:
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                api='/api/v1/namespaces/signoz/services/http:signoz:8080/proxy/api/v2/settings/ttl'
                kubectl get --raw "${api}" | jq --exit-status '
                  .version == "v2" and
                  .status == "success" and
                  .default_ttl_days == 30
                '
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                api='/api/v1/namespaces/signoz/services/http:signoz:8080/proxy/api/v5/query_range'
                warning_response="$(mktemp)"
                normal_response="$(mktemp)"
                trap 'rm -f "${warning_response}" "${normal_response}"' EXIT

                probe_id="$(date -u +%Y%m%d%H%M%S)"
                warning_name="observability-warning-${probe_id}"
                normal_name="observability-normal-${probe_id}"
                event_time="$(date -u +%Y-%m-%dT%H:%M:%S).000000Z"
                sed \
                  -e "s/name: observability-warning-probe/name: ${warning_name}/" \
                  -e "s/name: observability-normal-probe/name: ${normal_name}/" \
                  -e "s/2026-01-01T00:00:00.000000Z/${event_time}/g" \
                  -e "s/2026-01-01T00:01:00.000000Z/${event_time}/g" \
                  fixtures/observability/warning-event.test.k8s.yaml |
                  kubectl create --filename=-

                query_logs() {
                  query_filter="$1"
                  query_response="$2"
                  now_ms="$(( $(date +%s) * 1000 ))"
                  start_ms="$(( now_ms - 600000 ))"
                  jq --null-input --compact-output \
                    --argjson start "${start_ms}" \
                    --argjson end "$(( now_ms + 60000 ))" \
                    --arg filter "${query_filter}" '
                    {start:$start,end:$end,requestType:"raw",variables:{},compositeQuery:{queries:[{type:"builder_query",spec:{name:"A",signal:"logs",filter:{expression:$filter},order:[{key:{name:"timestamp"},direction:"desc"}],offset:0,limit:100}}]}}' |
                    kubectl create --raw "${api}" --filename=- >"${query_response}"
                }

                warning_filter="k8s.event.reason = 'ObservabilityWarning' AND k8s.event.name = '${warning_name}'"
                deadline="$(( $(date +%s) + 240 ))"
                while :; do
                  if query_logs "${warning_filter}" "${warning_response}" &&
                    jq --arg name "${warning_name}" --exit-status '
                      .status == "success" and
                      ([.data.data.results[]?.rows[]?.data] as $rows |
                        any($rows[]; .attributes_string["k8s.event.reason"] == "ObservabilityWarning" and
                          .attributes_string["k8s.namespace.name"] == "observability" and
                          .attributes_string["k8s.event.name"] == $name and
                          .resources_string["k8s.object.kind"] == "ConfigMap" and
                          .resources_string["k8s.object.name"] == "observability-event-probe" and
                          .attributes_number["k8s.event.count"] == 3 and
                          .severity_text == "WARN" and .severity_number == 13))
                    ' "${warning_response}" >/dev/null; then
                    break
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    cat "${warning_response}" >&2
                    exit 1
                  fi
                  sleep 5
                done

                # The Warning proves this receiver batch reached SigNoz. Give
                # the paired Normal event one further batch interval, then
                # prove independently that the severity filter dropped it.
                sleep 10
                normal_filter="k8s.event.reason = 'ObservabilityNormal' AND k8s.event.name = '${normal_name}'"
                query_logs "${normal_filter}" "${normal_response}"
                jq --arg name "${normal_name}" --exit-status '
                  .status == "success" and
                  ([.data.data.results[]?.rows[]?.data |
                    select(.attributes_string["k8s.event.name"] == $name)] | length == 0)
                ' "${normal_response}"
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - event
              - --namespace=observability
              - --selector=app.kubernetes.io/name=observability-warning-event-probe
              - --ignore-not-found=true
              - --wait=true
