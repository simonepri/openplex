# Proves External Secrets reconciles SecretStore backends and synchronizes secrets into target Kubernetes secrets without leaking credentials.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: synchronize-secret-from-store
  labels:
    cadence: commit
    capability: secrets
    mutates: scratch
spec:
  namespace: secrets-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    assert: 30s
    cleanup: 30s
    exec: 30s
  steps:
    - try:
        - apply:
            cluster: cell-eaws-lh1
            file: fixtures/secrets/chainsaw-fixture.test.k8s.yaml
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - wait
              - externalsecret/secrets-e2e-runtime
              - --namespace=secrets-e2e
              - --for=condition=Ready
              - --timeout=60s
        - assert:
            cluster: cell-eaws-lh1
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: secrets-e2e-runtime
                namespace: secrets-e2e
              data:
                token: cm90YXRpb24tdjE=
                username: Y29uZm9ybWFuY2UtdXNlcg==
        - apply:
            cluster: cell-eaws-lh1
            file: fixtures/secrets/chainsaw-consumer.test.k8s.yaml
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - wait
              - pod/secrets-e2e-consumer
              - --namespace=secrets-e2e
              - --for=jsonpath={.status.phase}=Succeeded
              - --timeout=30s
