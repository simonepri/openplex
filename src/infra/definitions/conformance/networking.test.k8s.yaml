# Proves NetworkPolicies enforce intra-namespace connectivity while denying cross-boundary traffic to defend cluster network isolation.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: isolate-cross-team-network-traffic
  labels:
    cadence: commit
    capability: networking
    mutates: scratch
spec:
  # Keep Chainsaw namespace allocation inside this package's fixture boundary.
  namespace: networking-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    assert: 30s
    cleanup: 2m
    delete: 2m
    exec: 30s
  steps:
    - try:
        - apply:
            cluster: cell-eaws-lh1
            file: fixtures/networking/policy-conformance.test.k8s.yaml
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - wait
              - pod/allowed-server
              - pod/allowed-client
              - --namespace=networking-e2e
              - --for=condition=Ready
              - --timeout=45s
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - wait
              - pod/denied-server
              - pod/denied-client
              - --namespace=networking-denied
              - --for=condition=Ready
              - --timeout=45s
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - exec
              - --namespace=networking-e2e
              - allowed-client
              - --
              - curl
              - -s
              - -o
              - /dev/null
              - -w
              - "%{http_code}"
              - http://allowed-server.networking-e2e.svc:8080
            check:
              (trim_space($stdout)): "200"
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - exec
              - --namespace=networking-denied
              - denied-client
              - --
              - sh
              - -ec
              - >-
                ! curl --connect-timeout 2 --max-time 3 -s http://allowed-server.networking-e2e.svc:8080
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - exec
              - --namespace=networking-e2e
              - allowed-client
              - --
              - sh
              - -ec
              - >-
                ! curl --connect-timeout 2 --max-time 3 -s http://denied-server.networking-denied.svc:8080
      finally:
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - delete
              - pod
              - allowed-server
              - allowed-client
              - --namespace=networking-e2e
              - --grace-period=0
              - --force
              - --ignore-not-found=true
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - delete
              - pod
              - denied-server
              - denied-client
              - --namespace=networking-denied
              - --grace-period=0
              - --force
              - --ignore-not-found=true
        - command:
            cluster: cell-eaws-lh1
            entrypoint: kubectl
            args:
              - delete
              - namespace/networking-e2e
              - namespace/networking-denied
              - --ignore-not-found=true
              - --wait=false
---
# Proves the fleet-owned ingress baseline permits same-namespace traffic while
# denying an otherwise-working client from outside the namespace, on ctrl-eaws-lh1.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fleet-ingress-isolation
  labels:
    cadence: commit
    capability: networking
    mutates: none
spec:
  namespace: networking-baseline
  cluster: ctrl-eaws-lh1
  concurrent: false
  timeouts:
    apply: 30s
    cleanup: 1m
    delete: 1m
    exec: 1m
  steps:
    - try:
        - apply:
            file: fixtures/networking/fleet-ingress-isolation.test.k8s.yaml
        - command:
            entrypoint: kubectl
            args:
              - wait
              - pod/fleet-isolated-server
              - pod/fleet-isolated-client
              - --namespace=profiling
              - --for=condition=Ready
              - --timeout=45s
        - command:
            entrypoint: kubectl
            args:
              - wait
              - pod/fleet-external-server
              - pod/fleet-external-client
              - --namespace=networking-baseline
              - --for=condition=Ready
              - --timeout=45s
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace=networking-baseline
              - fleet-external-client
              - --
              - wget
              - --quiet
              - --output-document=-
              - --timeout=5
              - http://fleet-external-server.networking-baseline.svc:8080
            check:
              (trim_space($stdout)): external-control-ok
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                deadline="$(( $(date +%s) + 30 ))"
                while kubectl exec --namespace=networking-baseline fleet-external-client -- \
                  wget --quiet --output-document=- --timeout=1 \
                  http://fleet-isolated-server.parca.svc:8080 \
                  >/dev/null 2>&1; do
                  if test "$(date +%s)" -ge "$deadline"; then
                    printf '%s\n' 'Fleet ingress isolation did not converge.' >&2
                    kubectl get networkpolicy --namespace=parca --output=yaml >&2
                    kubectl get pods --namespace=parca --output=wide >&2
                    kubectl get pods --namespace=networking-baseline --output=wide >&2
                    exit 1
                  fi
                  sleep 1
                done
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace=networking-baseline
              - fleet-external-client
              - --
              - sh
              - -ec
              - >-
                ! wget --quiet --output-document=- --timeout=2 http://fleet-isolated-server.parca.svc:8080
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace=parca
              - fleet-isolated-client
              - --
              - wget
              - --quiet
              - --output-document=-
              - --timeout=5
              - http://fleet-isolated-server.parca.svc:8080
            check:
              (trim_space($stdout)): fleet-isolation-ok
      finally:
        - delete:
            file: fixtures/networking/fleet-ingress-isolation.test.k8s.yaml
