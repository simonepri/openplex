# Proves Trivy and Kubescape generate non-empty vulnerability and compliance reports for deployed workloads to defend automated vulnerability auditing.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: in-cluster-security-report-producers
  labels:
    cadence: daily
    capability: security
    mutates: scratch
spec:
  namespace: security-reports-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    cleanup: 5m
    delete: 5m
    exec: 20m
  steps:
    - try:
        - command:
            entrypoint: kubectl
            args:
              - get
              - deployment/svelte-web
              - --namespace=team-examples-workloads
              - --output=jsonpath={.spec.template.spec.containers[0].image}
            outputs:
              - name: firstPartyImage
                value: (trim_space($stdout))
        - apply:
            file: fixtures/security_reports/report-producer.test.k8s.yaml
            bindings:
              - name: reportImage
                value: ($firstPartyImage)
        - command:
            entrypoint: kubectl
            args:
              - rollout
              - status
              - deployment/security-report-producer
              - --namespace=security-reports-e2e
              - --timeout=180s
        - command:
            entrypoint: kubectl
            args:
              - get
              - replicasets
              - --namespace=security-reports-e2e
              - --selector=app.kubernetes.io/name=security-report-producer
              - --output=jsonpath={.items[0].metadata.name}
            outputs:
              - name: producerReplicaSet
                value: (trim_space($stdout))
        - command:
            entrypoint: sh
            env:
              - name: PRODUCER_REPLICA_SET
                value: ($producerReplicaSet)
            args:
              - -ceu
              - |-
                deadline="$(( $(date +%s) + 900 ))"
                while :; do
                  reports="$(kubectl get --request-timeout=10s \
                    vulnerabilityreports.aquasecurity.github.io \
                    --namespace=security-reports-e2e \
                    --selector="trivy-operator.resource.name=${PRODUCER_REPLICA_SET}" \
                    --output=json)"
                  if printf '%s' "${reports}" | jq -e '
                    .items | any(
                      .report.scanner.name == "Trivy" and
                      (.report.updateTimestamp | type) == "string"
                    )
                  ' >/dev/null; then
                    exit 0
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    printf '%s\n' 'Timed out waiting for a completed Trivy VulnerabilityReport.' >&2
                    printf '%s\n' "${reports}" >&2
                    exit 1
                  fi
                  sleep 10
                done
        - command:
            entrypoint: sh
            args:
              - -ceu
              - |-
                report_url='/apis/spdx.softwarecomposition.kubescape.io/v1beta1/namespaces/security-reports-e2e/workloadconfigurationscans/deployment-security-report-producer?resourceVersion=fullSpec'
                deadline="$(( $(date +%s) + 900 ))"
                report=''
                while :; do
                  report="$(kubectl get --request-timeout=10s --raw "${report_url}" 2>/dev/null || true)"
                  if printf '%s' "${report}" | jq -e '
                    (.spec.controls | type) == "object" and
                    (.spec.controls | length) > 0
                  ' >/dev/null 2>&1; then
                    exit 0
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    printf '%s\n' 'Timed out waiting for a completed Kubescape WorkloadConfigurationScan.' >&2
                    printf '%s\n' "${report}" >&2
                    exit 1
                  fi
                  sleep 10
                done
