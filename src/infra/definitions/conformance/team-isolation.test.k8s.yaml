# Proves team namespace boundaries, RBAC restrictions, and workload quotas to defend multi-team isolation against unauthorized privilege escalation.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: team-cannot-own-cluster-scoped-or-cross-namespace-resources
  labels:
    cadence: commit
    capability: team-isolation
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    exec: 5m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                set -- --as=conformance-user --as-group=cluster:group:team:examples
                test "$(kubectl auth can-i get secrets --namespace=team-examples-workloads "$@" || true)" = no
                test "$(kubectl auth can-i list secrets --namespace=team-examples-workloads "$@" || true)" = no
                for resource in \
                  httproutes.gateway.networking.k8s.io \
                  backends.gateway.envoyproxy.io \
                  securitypolicies.gateway.envoyproxy.io; do
                  for verb in create delete get list patch update watch; do
                    test "$(kubectl auth can-i "${verb}" "${resource}" \
                      --namespace=team-examples-workloads "$@" || true)" = no
                  done
                done

                for verb in get list watch; do
                  test "$(kubectl auth can-i "${verb}" jobs.batch --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" cronjobs.batch --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" rayjobs.ray.io --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" rayclusters.ray.io --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" rayservices.ray.io --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" scaledjobs.keda.sh --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" workloads.kueue.x-k8s.io --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" clusterqueues.kueue.x-k8s.io "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" pods --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" nodes "$@")" = yes
                done
                for verb in get list; do
                  test "$(kubectl auth can-i "${verb}" pods.metrics.k8s.io --all-namespaces "$@")" = yes
                  test "$(kubectl auth can-i "${verb}" nodes.metrics.k8s.io "$@")" = yes
                done
                for verb in create delete patch update; do
                  test "$(kubectl auth can-i "${verb}" jobs.batch --namespace=kube-system "$@" || true)" = no
                  test "$(kubectl auth can-i "${verb}" rayjobs.ray.io --namespace=kube-system "$@" || true)" = no
                done
                test "$(kubectl auth can-i get pods/log --namespace=kube-system "$@" || true)" = no
                test "$(kubectl auth can-i create pods/exec --namespace=kube-system "$@" || true)" = no
                test "$(kubectl auth can-i get secrets --all-namespaces "$@" || true)" = no


                set -- --as=system:serviceaccount:kyverno:kyverno-background-controller
                for verb in create delete get list patch update watch; do
                  test "$(kubectl auth can-i "${verb}" \
                    httproutes.gateway.networking.k8s.io \
                    --namespace=team-examples-workloads "$@")" = yes
                done
                for verb in get list watch; do
                  test "$(kubectl auth can-i "${verb}" rayjobs.ray.io \
                    --namespace=team-examples-workloads "$@")" = yes
                done

                # TODO(simonepri): grant workspace job submission through the
                # workspace owner's OIDC identity and restore a positive check here.
                set -- --as=system:serviceaccount:workspaces:coder-workspace
                for verb in create delete patch update; do
                  test "$(kubectl auth can-i "${verb}" rayjobs.ray.io \
                    --namespace=team-examples-workloads "$@" || true)" = no
                  test "$(kubectl auth can-i "${verb}" jobs.batch \
                    --namespace=team-examples-workloads "$@" || true)" = no
                  test "$(kubectl auth can-i "${verb}" workloads.kueue.x-k8s.io \
                    --namespace=team-examples-workloads "$@" || true)" = no
                done
                test "$(kubectl auth can-i create rayjobs.ray.io \
                  --namespace=team-chainsaw-other "$@" || true)" = no
                test "$(kubectl auth can-i get secrets \
                  --namespace=team-examples-workloads "$@" || true)" = no
                test "$(kubectl auth can-i get secrets \
                  --namespace=workspaces "$@" || true)" = no

                kubectl delete namespace/team-chainsaw-other \
                  --ignore-not-found=true --wait=true
                kubectl create namespace team-chainsaw-other
                kubectl label namespace/team-chainsaw-other \
                  team=chainsaw-other

                proxy_log="$(mktemp)"
                request="$(mktemp)"
                response="$(mktemp)"
                cleanup() {
                  kill "${proxy_pid:-}" 2>/dev/null || true
                  rm -f "${proxy_log}" "${request}" "${response}"
                }
                trap cleanup EXIT

                kubectl proxy --port=18083 \
                  --as=conformance-user \
                  --as-group=cluster:group:team:examples >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null \
                    http://127.0.0.1:18083/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                assert_forbidden_create() {
                  path="$1"
                  api_version="$2"
                  object_kind="$3"
                  object_name="$4"
                  object_namespace="$5"
                  resource_group="$6"
                  resource_kind="$7"

                  jq --null-input --compact-output \
                    --arg apiVersion "${api_version}" \
                    --arg kind "${object_kind}" \
                    --arg name "${object_name}" \
                    --arg namespace "${object_namespace}" '
                      {
                        apiVersion: $apiVersion,
                        kind: $kind,
                        metadata: ({name: $name} +
                          if $namespace == "" then {}
                          else {namespace: $namespace}
                          end)
                      }
                    ' >"${request}"

                  code="$(curl --silent --show-error --noproxy '*' \
                    --request POST \
                    --header 'Content-Type: application/json' \
                    --data-binary "@${request}" \
                    --output "${response}" \
                    --write-out '%{http_code}' \
                    "http://127.0.0.1:18083${path}?dryRun=All")"
                  test "${code}" = 403
                  jq --exit-status \
                    --arg group "${resource_group}" \
                    --arg kind "${resource_kind}" \
                    --arg name "${object_name}" '
                      .apiVersion == "v1" and
                      .kind == "Status" and
                      .status == "Failure" and
                      .reason == "Forbidden" and
                      .code == 403 and
                      (.details.group // "") == $group and
                      .details.kind == $kind and
                      .details.name == $name
                    ' "${response}" >/dev/null
                }

                assert_forbidden_create \
                  /apis/rbac.authorization.k8s.io/v1/clusterroles \
                  rbac.authorization.k8s.io/v1 ClusterRole \
                  chainsaw-team-denied '' \
                  rbac.authorization.k8s.io clusterroles
                assert_forbidden_create \
                  /apis/apiextensions.k8s.io/v1/customresourcedefinitions \
                  apiextensions.k8s.io/v1 CustomResourceDefinition \
                  chainsaw-denied.fixture.invalid '' \
                  apiextensions.k8s.io customresourcedefinitions
                assert_forbidden_create \
                  /api/v1/namespaces \
                  v1 Namespace chainsaw-team-denied '' '' namespaces
                assert_forbidden_create \
                  /api/v1/namespaces/team-examples-workloads/resourcequotas \
                  v1 ResourceQuota chainsaw-team-denied team-examples-workloads \
                  '' resourcequotas
                assert_forbidden_create \
                  /api/v1/namespaces/team-examples-workloads/limitranges \
                  v1 LimitRange chainsaw-team-denied team-examples-workloads \
                  '' limitranges
                assert_forbidden_create \
                  /apis/kueue.x-k8s.io/v1beta2/namespaces/team-examples-workloads/localqueues \
                  kueue.x-k8s.io/v1beta2 LocalQueue chainsaw-team-denied \
                  team-examples-workloads kueue.x-k8s.io localqueues
                assert_forbidden_create \
                  /api/v1/namespaces/team-chainsaw-other/configmaps \
                  v1 ConfigMap chainsaw-team-denied team-chainsaw-other \
                  '' configmaps
        - command:
            cluster: ctrl-eaws-lh1
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                proxy_log="$(mktemp)"
                response="$(mktemp)"
                cleanup() {
                  kill "${proxy_pid:-}" 2>/dev/null || true
                  rm -f "${proxy_log}" "${response}"
                }
                trap cleanup EXIT

                kubectl proxy --port=18086 \
                  --as=conformance-user \
                  --as-group=cluster:group:team:examples >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null \
                    http://127.0.0.1:18086/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                code="$(jq --null-input --compact-output '
                  {
                    apiVersion: "v1",
                    kind: "ConfigMap",
                    metadata: {
                      name: "chainsaw-team-denied",
                      namespace: "argocd"
                    }
                  }
                ' | curl --silent --show-error --noproxy '*' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data-binary @- \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18086/api/v1/namespaces/argocd/configmaps?dryRun=All')"
                test "${code}" = 403
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .reason == "Forbidden" and
                  .code == 403 and
                  (.details.group // "") == "" and
                  .details.kind == "configmaps" and
                  .details.name == "chainsaw-team-denied"
                ' "${response}" >/dev/null
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - namespace/team-chainsaw-other
              - --ignore-not-found=true
              - --wait=true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: team-cannot-use-cluster-secret-stores
  labels:
    cadence: commit
    capability: team-isolation
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    exec: 5m
  steps:
    - try:
        - command:
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                proxy_log="$(mktemp)"
                request="$(mktemp)"
                response="$(mktemp)"
                cleanup() {
                  kill "${proxy_pid:-}" 2>/dev/null || true
                  rm -f "${proxy_log}" "${request}" "${response}"
                }
                trap cleanup EXIT

                kubectl proxy --port=18087 >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null http://127.0.0.1:18087/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                kubectl get externalsecret/team-s3 \
                  --namespace=team-examples-workloads --output=json |
                  jq --compact-output '
                    del(
                      .metadata.creationTimestamp,
                      .metadata.generation,
                      .metadata.managedFields,
                      .metadata.uid,
                      .status
                    ) |
                    .spec.secretStoreRef = {
                      kind: "ClusterSecretStore",
                      name: "runtime-secrets"
                    }
                  ' >"${request}"

                code="$(curl --silent --show-error --noproxy '*' \
                  --request PUT --header 'Content-Type: application/json' \
                  --data-binary "@${request}" --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18087/apis/external-secrets.io/v1/namespaces/team-examples-workloads/externalsecrets/team-s3?dryRun=All')"
                test "${code}" = 422
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .reason == "Invalid" and
                  .code == 422 and
                  .details.name == "team-s3" and
                  (.details.group // "") == "external-secrets.io" and
                  .details.kind == "externalsecrets" and
                  (.details.causes | length) >= 1
                ' "${response}" >/dev/null

                store_name=org-workspace-backups-workspaces
                kubectl get clustersecretstore "${store_name}" --output=json |
                  jq --exit-status --arg namespace workspaces '
                    .spec.conditions == [{namespaces: [$namespace]}]
                  ' >/dev/null
                kubectl get externalsecret/workspace-backups \
                  --namespace=workspaces --output=json |
                  jq --exit-status --arg store "${store_name}" '
                    .spec.secretStoreRef == {
                      kind: "ClusterSecretStore",
                      name: $store
                    }
                  ' >/dev/null

                kubectl get externalsecret/workspace-backups \
                  --namespace=workspaces --output=json |
                  jq --compact-output '
                    del(
                      .metadata.creationTimestamp,
                      .metadata.generation,
                      .metadata.managedFields,
                      .metadata.uid,
                      .status
                    )
                  ' >"${request}"

                kubectl create role org-workspace-backups-policy-probe \
                  --namespace=workspaces \
                  --verb=update \
                  --resource=externalsecrets.external-secrets.io \
                  --resource-name=workspace-backups \
                  --dry-run=client --output=yaml | kubectl apply --filename=-
                kubectl create rolebinding org-workspace-backups-policy-probe \
                  --namespace=workspaces \
                  --role=org-workspace-backups-policy-probe \
                  --user=conformance-user \
                  --dry-run=client --output=yaml | kubectl apply --filename=-

                code="$(curl --silent --show-error --noproxy '*' \
                  --request PUT --header 'Content-Type: application/json' \
                  --data-binary "@${request}" --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18087/apis/external-secrets.io/v1/namespaces/workspaces/externalsecrets/workspace-backups?dryRun=All')"
                test "${code}" = 200
                jq --exit-status --arg store "${store_name}" '
                  .apiVersion == "external-secrets.io/v1" and
                  .kind == "ExternalSecret" and
                  .metadata.name == "workspace-backups" and
                  .metadata.namespace == "workspaces" and
                  .spec.secretStoreRef == {
                    kind: "ClusterSecretStore",
                    name: $store
                  }
                ' "${response}" >/dev/null

                kill "${proxy_pid}"
                wait "${proxy_pid}" 2>/dev/null || true
                proxy_pid=
                kubectl proxy --port=18087 \
                  --as=conformance-user \
                  --as-group=cluster:group:team:examples >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null http://127.0.0.1:18087/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                code="$(curl --silent --show-error --noproxy '*' \
                  --request PUT --header 'Content-Type: application/json' \
                  --data-binary "@${request}" --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18087/apis/external-secrets.io/v1/namespaces/workspaces/externalsecrets/workspace-backups?dryRun=All')"
                test "${code}" = 422
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .reason == "Invalid" and
                  .code == 422 and
                  .details.name == "workspace-backups" and
                  (.details.group // "") == "external-secrets.io" and
                  .details.kind == "externalsecrets" and
                  (.details.causes | length) >= 1
                ' "${response}" >/dev/null
      finally:
        - command:
            entrypoint: kubectl
            args:
              - delete
              - --namespace=workspaces
              - rolebinding/org-workspace-backups-policy-probe
              - role/org-workspace-backups-policy-probe
              - --ignore-not-found=true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: examples-lane-runs-resident-and-team-submitted-workloads
  labels:
    cadence: daily
    capability: team-isolation
    mutates: scratch
spec:
  namespace: team-examples-workloads
  cluster: cell-eaws-lh1
  concurrent: false
  forceTerminationGracePeriod: 1s
  timeouts:
    apply: 2m
    assert: 2m
    cleanup: 5m
    delete: 5m
    error: 1m
    exec: 20m
  steps:
    - try:
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=condition=available
              - deployment/svelte-web
              - --namespace=team-examples-workloads
              - --timeout=300s
        - command:
            entrypoint: /bin/sh
            args:
              - -ceu
              - |-
                port_forward_log="$(mktemp)"
                cleanup() {
                  kill "${port_forward_pid:-}" 2>/dev/null || true
                  rm -f "${port_forward_log}"
                }
                trap cleanup EXIT
                kubectl port-forward service/svelte-web \
                  --namespace=team-examples-workloads \
                  --address=127.0.0.1 18084:80 >"${port_forward_log}" 2>&1 &
                port_forward_pid=$!
                for attempt in $(seq 1 60); do
                  code="$(curl --silent --show-error --noproxy '*' \
                    --output /dev/null --write-out '%{http_code}' \
                    http://127.0.0.1:18084/ || true)"
                  if test "${code}" = 200; then
                    exit 0
                  fi
                  if test "${attempt}" = 60; then
                    cat "${port_forward_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done
        - command:
            cluster: cell-eaws-lh1
            entrypoint: /bin/sh
            args: [scripts/cleanup_ray_run.sh, ray-data-conformanceuser-]
        - command:
            entrypoint: /bin/sh
            env:
              - name: WORKLOAD_PUBLISH_ONLY
                value: "1"
              - name: WORKLOAD_REGISTRY
                value: ""
            args:
              - -ceu
              - |-
                cd "$(git rev-parse --show-toplevel)"
                test -n "${BAZEL_OUTPUT_ROOT}"
                registry_contract=.tmp/state/origin-registry.json
                test -f "${registry_contract}"
                repository="$(jq --exit-status --raw-output \
                  '.host.repositories["src/examples/ray_data"]' "${registry_contract}")"
                registry_address="$(printf '%s' "${repository}" | cut -d/ -f1)"
                repository_path="$(printf '%s' "${repository}" | cut -d/ -f2-)"
                stream_tag="$(bash src/bazel/rules/oci/stream_tag.sh)"
                WORKLOAD_STREAM_TAG="${stream_tag}" \
                  bazel --output_user_root="${BAZEL_OUTPUT_ROOT}" \
                  run //src/examples/ray_data:submit >/dev/null
                headers="$(curl --fail --silent --show-error --head \
                  --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
                  "http://${registry_address}/v2/${repository_path}/manifests/${stream_tag}")"
                digest="$(printf '%s\n' "${headers}" | tr -d '\r' |
                  awk 'tolower($1) == "docker-content-digest:" {print $2}')"
                test "$(printf '%s\n' "${digest}" | wc -l | tr -d '[:space:]')" = 1
                printf '%s\n' "${digest}" |
                  grep -Eq '^sha256:[0-9a-f]{64}$'
                reference="${repository}@${digest}"
                curl --fail --silent --show-error --head \
                  --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
                  "http://${registry_address}/v2/${repository_path}/manifests/${digest}" \
                  >/dev/null
                printf '%s' "${reference}"
            outputs:
              - name: rayImage
                value: (trim_space($stdout))
        - command:
            entrypoint: date
            args: [-u, +run-%m%dt%H%M%S]
            outputs:
              - name: rayRunId
                value: (trim_space($stdout))
        - command:
            entrypoint: /bin/sh
            env:
              - name: RAY_IMAGE
                value: ($rayImage)
              - name: RAY_RUN_ID
                value: ($rayRunId)
            args:
              - -ceu
              - |-
                request="$(mktemp)"
                forged_request="$(mktemp)"
                response="$(mktemp)"
                proxy_log="$(mktemp)"
                cleanup() {
                  kill "${proxy_pid:-}" 2>/dev/null || true
                  rm -f "${request}" "${forged_request}" "${response}" "${proxy_log}"
                }
                trap cleanup EXIT

                run_name="ray-data-conformanceuser-${RAY_RUN_ID}"

                kubectl create --dry-run=client --output=json \
                  --filename=../../../examples/ray_data/deployment/ray-data.k8s.yaml |
                  jq --compact-output \
                    --arg image "${RAY_IMAGE}" \
                    --arg run_id "${RAY_RUN_ID}" \
                    --arg run_name "${run_name}" '
                      del(.metadata.generateName) |
                      .metadata.name = $run_name |
                      .metadata.namespace = "team-examples-workloads" |
                      .metadata.labels = ((.metadata.labels // {}) + {
                        "app.kubernetes.io/managed-by": "chainsaw",
                        "pipeline": "ray-data",
                        "run-id": $run_id,
                        "team": "forged-team",
                        "user": "conformanceuser"
                      }) |
                      .metadata.annotations = ((.metadata.annotations // {}) + {
                        "dashboard-url": "https://attacker.invalid/"
                      }) |
                      walk(
                        if type == "string" then
                          if startswith("registry.invalid/workloads/ray-data")
                          then $image
                          else gsub("__WORKLOAD_RUN_ID__"; $run_name) |
                            gsub("__WORKLOAD_CELL_VIRTUAL__"; "eaws-lh1")
                          end
                        else . end
                      )
                    ' >"${request}"

                kubectl proxy --port=18085 \
                  --as=conformance-user \
                  --as-group=cluster:group:team:examples >"${proxy_log}" 2>&1 &
                proxy_pid=$!
                for attempt in $(seq 1 60); do
                  if curl --silent --output /dev/null \
                    http://127.0.0.1:18085/version; then
                    break
                  fi
                  if test "${attempt}" = 60; then
                    cat "${proxy_log}" >&2
                    exit 1
                  fi
                  sleep 1
                done

                jq '
                  .metadata.name = ("ray-data-forged-" + .metadata.labels["run-id"]) |
                  .metadata.labels.user = "forged"
                ' "${request}" >"${forged_request}"

                code="$(curl --silent --show-error --noproxy '*' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data-binary "@${forged_request}" \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18085/apis/ray.io/v1/namespaces/team-examples-workloads/rayjobs?dryRun=All')"
                test "${code}" = 400
                jq --exit-status '
                  .apiVersion == "v1" and
                  .kind == "Status" and
                  .status == "Failure" and
                  .code == 400
                ' "${response}" >/dev/null

                code="$(curl --silent --show-error --noproxy '*' \
                  --request POST \
                  --header 'Content-Type: application/json' \
                  --data-binary "@${request}" \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  'http://127.0.0.1:18085/apis/ray.io/v1/namespaces/team-examples-workloads/rayjobs')"
                test "${code}" = 201
                jq --exit-status \
                  --arg image "${RAY_IMAGE}" \
                  --arg run_id "${RAY_RUN_ID}" '
                  .apiVersion == "ray.io/v1" and
                  .kind == "RayJob" and
                  .metadata.namespace == "team-examples-workloads" and
                  .metadata.name == ("ray-data-conformanceuser-" + $run_id) and
                  .metadata.labels.pipeline == "ray-data" and
                  .metadata.labels["run-id"] == $run_id and
                  .metadata.labels.team == "examples" and
                  .metadata.labels.user == "conformanceuser" and
                  (.metadata.annotations["dashboard-url"] |
                    test("^https://ray\\.cell-eaws-lh1\\.[^/]+/teams/examples/namespaces/team-examples-workloads/jobs/ray-data-conformanceuser-" + $run_id + "/$")) and
                  ([
                    .spec.rayClusterSpec.headGroupSpec.template.spec.containers[].image,
                    .spec.rayClusterSpec.workerGroupSpecs[].template.spec.containers[].image,
                    .spec.submitterPodTemplate.spec.containers[].image
                  ] | length == 3 and all(.[]; . == $image))
                ' "${response}" >/dev/null
                jq --compact-output '.' "${response}"
            outputs:
              - name: rayJobName
                value: (json_parse(trim_space($stdout)).metadata.name)
        - command:
            entrypoint: /bin/sh
            env:
              - name: RAY_IMAGE
                value: ($rayImage)
              - name: RAY_JOB_NAME
                value: ($rayJobName)
            args:
              - -ceu
              - |-
                expected_queue=wa
                deadline="$(( $(date +%s) + 300 ))"
                while :; do
                  ray_job="$(kubectl get "rayjob/${RAY_JOB_NAME}" \
                    --namespace=team-examples-workloads --output=json)"
                  ray_cluster="$(printf '%s' "${ray_job}" | jq --raw-output \
                    '.status.rayClusterName // empty')"
                  if test -n "${ray_cluster}"; then
                    break
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    printf '%s\n' "${ray_job}" >&2
                    exit 1
                  fi
                  sleep 2
                done
                test "$(printf '%s' "${ray_job}" | jq --raw-output \
                  '.metadata.labels["kueue.x-k8s.io/queue-name"]')" = \
                  "${expected_queue}"
                kubectl wait --for=create "httproute/${RAY_JOB_NAME}" \
                  --namespace=team-examples-workloads --timeout=300s
                kubectl get "httproute/${RAY_JOB_NAME}" \
                  --namespace=team-examples-workloads --output=json |
                  jq --exit-status --arg name "${RAY_JOB_NAME}" '
                    .spec.parentRefs == [{
                      group: "gateway.networking.k8s.io",
                      kind: "Gateway",
                      name: "private-access",
                      namespace: "envoy-gateway-system",
                      sectionName: "https"
                    }] and
                    .spec.rules[1].backendRefs == [{
                      group: "", kind: "Service",
                      name: ($name + "-head-svc"), port: 8265, weight: 1
                    }]
                  ' >/dev/null
                ! kubectl get "securitypolicy/${RAY_JOB_NAME}" \
                  --namespace=team-examples-workloads >/dev/null 2>&1
                ! kubectl get "backend/${RAY_JOB_NAME}" \
                  --namespace=team-examples-workloads >/dev/null 2>&1
                kubectl get securitypolicy/ray-dashboard-oidc \
                  --namespace=envoy-gateway-system --output=json |
                  jq --exit-status '
                    .spec.authorization.defaultAction == "Deny" and
                    any(.spec.authorization.rules[]?;
                      .name == "team-examples" and
                      .operation.path == {
                        type: "PathPrefix", value: "/teams/examples/"
                      } and
                      .principal.jwt == {
                        provider: "ray-dashboard",
                        claims: [{
                          name: "groups", valueType: "StringArray",
                          values: ["team:examples"]
                        }]
                      })
                  ' >/dev/null
                kubectl wait --for=create "service/${RAY_JOB_NAME}-head-svc" \
                  --namespace=team-examples-workloads --timeout=300s
                kubectl get "service/${RAY_JOB_NAME}-head-svc" \
                  --namespace=team-examples-workloads --output=json |
                  jq --exit-status --arg name "${RAY_JOB_NAME}" '
                    any(.metadata.ownerReferences[]?;
                      .apiVersion == "ray.io/v1" and .kind == "RayJob" and
                      .name == $name and .controller == true) and
                    any(.spec.ports[]?; .port == 8265)
                  ' >/dev/null
                for component in ray-data-head ray-data-worker; do
                  kubectl wait --for=create pod \
                    --namespace=team-examples-workloads \
                    --selector="ray.io/cluster=${ray_cluster},app.kubernetes.io/component=${component}" \
                    --timeout=300s
                done
                images="$(kubectl get pods --namespace=team-examples-workloads \
                  --selector="ray.io/cluster=${ray_cluster}" --output=json |
                  jq --raw-output '
                    .items[] |
                    ((.spec.initContainers // []) + .spec.containers)[] |
                    .image
                  ' | sort -u)"
                test "${images}" = "${RAY_IMAGE}"
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=jsonpath={.status.jobStatus}=SUCCEEDED
              - rayjob/($rayJobName)
              - --namespace=team-examples-workloads
              - --timeout=900s
        - command:
            entrypoint: /bin/sh
            env:
              - name: RAY_JOB_NAME
                value: ($rayJobName)
            args:
              - -ceu
              - |-
                partition="$(kubectl get "rayjob/${RAY_JOB_NAME}" \
                  --namespace=team-examples-workloads \
                  --output=jsonpath='{.spec.runtimeEnvYAML}' |
                  awk '$1 == "RAY_DATA_PARTITION_KEY:" {
                    gsub(/"/, "", $2); print $2
                  }')"
                test -n "${partition}"
                printf '%s' "${partition}"
            outputs:
              - name: rayPartition
                value: (trim_space($stdout))
        - apply:
            file: fixtures/data/pipeline-output-verifier.test.k8s.yaml
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=condition=complete
              - job/pipeline-output-verifier
              - --namespace=team-examples-workloads
              - --timeout=300s
        - apply:
            file: fixtures/data/retained-parquet-authorization.test.k8s.yaml
        - command:
            entrypoint: kubectl
            args:
              - wait
              - --for=condition=complete
              - job/retained-parquet-authorization
              - --namespace=s3-system
              - --timeout=300s
        - command:
            entrypoint: /bin/sh
            env:
              - name: RAY_JOB_NAME
                value: ($rayJobName)
            args:
              - -ceu
              - |-
                namespace=team-examples-workloads
                kubectl delete "rayjob/${RAY_JOB_NAME}" \
                  --namespace="${namespace}" --wait=true --timeout=300s
                deadline="$(( $(date +%s) + 300 ))"
                while :; do
                  if ! kubectl get "httproute/${RAY_JOB_NAME}" \
                    --namespace="${namespace}" >/dev/null 2>&1; then
                    break
                  fi
                  if test "$(date +%s)" -ge "${deadline}"; then
                    kubectl get httproute \
                      --namespace="${namespace}" --output=name >&2
                    exit 1
                  fi
                  sleep 2
                done
      finally:
        - command:
            cluster: cell-eaws-lh1
            entrypoint: /bin/sh
            args: [scripts/cleanup_ray_run.sh, ray-data-conformanceuser-]
