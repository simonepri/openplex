# Proves admission webhooks restrict workspace secret mounting to authorized Coder provisioners to defend credentials from arbitrary pod access.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workspace-secret-admission
  labels:
    cadence: commit
    capability: workspaces
    mutates: scratch
spec:
  namespace: workspace-secret-admission-e2e
  cluster: cell-eaws-lh1
  concurrent: false
  timeouts:
    cleanup: 1m
    exec: 10m
  steps:
    - try:
        - command:
            entrypoint: sh
            env:
              - name: BUSYBOX_IMAGE
                value: ($values.busyboxImage)
              - name: FIXTURE
                value: fixtures/coder/workspace-secret-admission.test.k8s.yaml
            args:
              - scripts/check_workspace_secret_admission.sh
