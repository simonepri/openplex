# Defines team-workloads dashboard reconciled into SigNoz. It presents GPU, CPU, and RAM allocations vs actual usage, compute & VRAM utilization, and Kueue queue states.

apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: team-workloads
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    jsonSpec: |-
      {
        "schemaVersion": "v6",
        "image": "",
        "name": "team-workloads",
        "tags": [
          {"key": "category", "value": "compute"},
          {"key": "category", "value": "workloads"}
        ],
        "spec": {
          "display": {
            "name": "Team Workloads",
            "description": "Cluster compute capacity, GPU model pools (H200, L4), active GPU/CPU/RAM utilization vs total capacity, container requests and limits, and Kueue queue states."
          },
          "variables": [
            {
              "kind": "ListVariable",
              "spec": {
                "name": "cell",
                "display": {"name": "Cell", "description": "Worker cell or cluster"},
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "alphabetical-asc",
                "plugin": {
                  "kind": "signoz/QueryVariable",
                  "spec": {
                    "queryValue": "label_values(DCGM_FI_DEV_GPU_UTIL, cluster)"
                  }
                }
              }
            },
            {
              "kind": "ListVariable",
              "spec": {
                "name": "team",
                "display": {"name": "Team", "description": "Team"},
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "alphabetical-asc",
                "plugin": {
                  "kind": "signoz/QueryVariable",
                  "spec": {
                    "queryValue": "label_values(kube_pod_labels, label_team)"
                  }
                }
              }
            }
          ],
          "panels": {
            "stat-gpu-usage-out-of-total": {
              "kind": "Panel",
              "spec": {
                "display": {"name": "GPU Allocation (Assigned / Total)", "description": "Total GPUs assigned to running workloads out of total cluster allocatable GPUs"},
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time"},
                    "formatting": {"unit": "none", "decimalPrecision": "0"},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "sum(kube_pod_container_resource_requests{resource=\"nvidia.com/gpu\"}) or vector(0)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "stat-vram-usage-out-of-total": {
              "kind": "Panel",
              "spec": {
                "display": {"name": "VRAM In Use (Used / Total MiB)", "description": "Total active GPU framebuffer memory used across physical accelerators"},
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time"},
                    "formatting": {"unit": "megabytes", "decimalPrecision": "1"},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "sum(DCGM_FI_DEV_FB_USED) or vector(0)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "stat-cpu-usage-out-of-total": {
              "kind": "Panel",
              "spec": {
                "display": {"name": "CPU Usage (Cores Used / Allocatable)", "description": "Active container CPU usage rate in cores across cluster workloads"},
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time"},
                    "formatting": {"unit": "none", "decimalPrecision": "1"},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])) or vector(0)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "stat-ram-usage-out-of-total": {
              "kind": "Panel",
              "spec": {
                "display": {"name": "RAM Usage (Working Set Used / Allocatable)", "description": "Active container working set memory consumption across cluster workloads"},
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time"},
                    "formatting": {"unit": "By", "decimalPrecision": "2"},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "sum(container_memory_working_set_bytes{container!=\"\",container!=\"POD\"}) or vector(0)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "stat-kueue-workloads": {
              "kind": "Panel",
              "spec": {
                "display": {"name": "Kueue Pending Workloads", "description": "Active queued backlogs waiting for quota or accelerator capacity"},
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time"},
                    "formatting": {"unit": "none", "decimalPrecision": "0"},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "sum(kueue_pending_workloads) or vector(0)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "stat-total-gpus": {
              "kind": "Panel",
              "spec": {
                "display": {"name": "Total Physical GPUs", "description": "Total allocatable GPU accelerators detected across all nodes"},
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time"},
                    "formatting": {"unit": "none", "decimalPrecision": "0"},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "count(DCGM_FI_DEV_GPU_UTIL) or sum(kube_node_status_allocatable{resource=\"nvidia.com/gpu\"}) or vector(0)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "gpu-utilization-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Average GPU Compute Utilization (%)",
                  "description": "Active compute and tensor core utilization percentage grouped by model"
                },
                "plugin": {
                  "kind": "signoz/TimeSeriesPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time", "fillSpans": false},
                    "formatting": {"unit": "percent", "decimalPrecision": "1"},
                    "chartAppearance": {
                      "lineInterpolation": "linear",
                      "showPoints": false,
                      "lineStyle": "solid",
                      "fillMode": "none",
                      "spanGaps": {"fillOnlyBelow": false, "fillLessThan": ""}
                    },
                    "axes": {"softMin": 0, "softMax": 100, "isLogScale": false},
                    "legend": {"position": "bottom", "mode": "list", "customColors": null},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "avg by (modelName) (DCGM_FI_DEV_GPU_UTIL)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "vram-utilization-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "VRAM Utilization (Used vs Total Capacity)",
                  "description": "GPU framebuffer memory used vs total physical capacity in MiB"
                },
                "plugin": {
                  "kind": "signoz/TimeSeriesPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time", "fillSpans": false},
                    "formatting": {"unit": "megabytes", "decimalPrecision": "1"},
                    "chartAppearance": {
                      "lineInterpolation": "linear",
                      "showPoints": false,
                      "lineStyle": "solid",
                      "fillMode": "none",
                      "spanGaps": {"fillOnlyBelow": false, "fillLessThan": ""}
                    },
                    "axes": {"softMin": 0, "softMax": null, "isLogScale": false},
                    "legend": {"position": "bottom", "mode": "list", "customColors": null},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "label_replace(sum(DCGM_FI_DEV_FB_USED), \"series\", \"Used\", \"\", \"\") or label_replace(sum(DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE), \"series\", \"Total Capacity\", \"\", \"\")",
                          "legend": "{{series}}"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "cpu-utilization-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "CPU Utilization (Used Cores vs Total Allocatable)",
                  "description": "Active container CPU usage rate in cores vs total cluster node allocatable capacity"
                },
                "plugin": {
                  "kind": "signoz/TimeSeriesPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time", "fillSpans": false},
                    "formatting": {"unit": "none", "decimalPrecision": "1"},
                    "chartAppearance": {
                      "lineInterpolation": "linear",
                      "showPoints": false,
                      "lineStyle": "solid",
                      "fillMode": "none",
                      "spanGaps": {"fillOnlyBelow": false, "fillLessThan": ""}
                    },
                    "axes": {"softMin": 0, "softMax": null, "isLogScale": false},
                    "legend": {"position": "bottom", "mode": "list", "customColors": null},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "label_replace(sum(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])), \"series\", \"Used Cores\", \"\", \"\") or label_replace(sum(kube_node_status_allocatable{resource=\"cpu\"}), \"series\", \"Total Allocatable Cores\", \"\", \"\")",
                          "legend": "{{series}}"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "ram-utilization-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "RAM Utilization (Working Set vs Total Allocatable)",
                  "description": "Active container working set memory vs total cluster node allocatable capacity"
                },
                "plugin": {
                  "kind": "signoz/TimeSeriesPanel",
                  "spec": {
                    "visualization": {"timePreference": "global_time", "fillSpans": false},
                    "formatting": {"unit": "By", "decimalPrecision": "2"},
                    "chartAppearance": {
                      "lineInterpolation": "linear",
                      "showPoints": false,
                      "lineStyle": "solid",
                      "fillMode": "none",
                      "spanGaps": {"fillOnlyBelow": false, "fillLessThan": ""}
                    },
                    "axes": {"softMin": 0, "softMax": null, "isLogScale": false},
                    "legend": {"position": "bottom", "mode": "list", "customColors": null},
                    "thresholds": null
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/PromQLQuery",
                        "spec": {
                          "name": "A",
                          "query": "label_replace(sum(container_memory_working_set_bytes{container!=\"\",container!=\"POD\"}), \"series\", \"Working Set Used\", \"\", \"\") or label_replace(sum(kube_node_status_allocatable{resource=\"memory\"}), \"series\", \"Total Allocatable\", \"\", \"\")",
                          "legend": "{{series}}"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "workloads-table": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Active Workloads & Resource Utilization",
                  "description": "Per-pod breakdown of assigned GPUs, compute utilization, VRAM usage, and CPU/RAM requests vs limits"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "formatting": {
                      "columnUnits": {
                        "gpus_requested": "none",
                        "avg_gpu_util_pct": "percent",
                        "vram_used_mib": "megabytes",
                        "cpu_req_cores": "none",
                        "cpu_limit_cores": "none",
                        "mem_req_gib": "decgabytes",
                        "mem_limit_gib": "decgabytes"
                      },
                      "decimalPrecision": "2"
                    },
                    "thresholds": []
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT JSONExtractString(ts.labels, 'namespace') AS namespace, coalesce(nullIf(JSONExtractString(ts.labels, 'label_app_kubernetes_io_name'), ''), JSONExtractString(ts.labels, 'pod')) AS workload, JSONExtractString(ts.labels, 'label_team') AS team, round(maxIf(s.value, s.metric_name = 'kube_pod_container_resource_requests' AND JSONExtractString(ts.labels, 'resource') = 'nvidia.com/gpu'), 0) AS gpus_requested, if(isNaN(round(avgIf(s.value, s.metric_name = 'DCGM_FI_DEV_GPU_UTIL'), 1)), 0, round(avgIf(s.value, s.metric_name = 'DCGM_FI_DEV_GPU_UTIL'), 1)) AS avg_gpu_util_pct, round(sumIf(s.value, s.metric_name = 'DCGM_FI_DEV_FB_USED'), 1) AS vram_used_mib, round(sumIf(s.value, s.metric_name = 'kube_pod_container_resource_requests' AND JSONExtractString(ts.labels, 'resource') = 'cpu'), 2) AS cpu_req_cores, round(sumIf(s.value, s.metric_name = 'kube_pod_container_resource_limits' AND JSONExtractString(ts.labels, 'resource') = 'cpu'), 2) AS cpu_limit_cores, round(sumIf(s.value, s.metric_name = 'kube_pod_container_resource_requests' AND JSONExtractString(ts.labels, 'resource') = 'memory') / (1024 * 1024 * 1024), 2) AS mem_req_gib, round(sumIf(s.value, s.metric_name = 'kube_pod_container_resource_limits' AND JSONExtractString(ts.labels, 'resource') = 'memory') / (1024 * 1024 * 1024), 2) AS mem_limit_gib FROM signoz_metrics.distributed_samples_v4 s JOIN (SELECT fingerprint, any(labels) AS labels FROM signoz_metrics.distributed_time_series_v4 WHERE metric_name IN ('kube_pod_container_resource_requests', 'kube_pod_container_resource_limits', 'DCGM_FI_DEV_GPU_UTIL', 'DCGM_FI_DEV_FB_USED') GROUP BY fingerprint) ts ON s.fingerprint = ts.fingerprint WHERE s.unix_milli >= toUnixTimestamp64Milli(now64() - INTERVAL 15 MINUTE) AND s.metric_name IN ('kube_pod_container_resource_requests', 'kube_pod_container_resource_limits', 'DCGM_FI_DEV_GPU_UTIL', 'DCGM_FI_DEV_FB_USED') GROUP BY namespace, workload, team ORDER BY gpus_requested DESC, avg_gpu_util_pct DESC LIMIT 100"
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "items": [
                  {"x": 0, "y": 0, "width": 2, "height": 3, "content": {"$ref": "#/spec/panels/stat-gpu-usage-out-of-total"}},
                  {"x": 2, "y": 0, "width": 2, "height": 3, "content": {"$ref": "#/spec/panels/stat-vram-usage-out-of-total"}},
                  {"x": 4, "y": 0, "width": 2, "height": 3, "content": {"$ref": "#/spec/panels/stat-cpu-usage-out-of-total"}},
                  {"x": 6, "y": 0, "width": 2, "height": 3, "content": {"$ref": "#/spec/panels/stat-ram-usage-out-of-total"}},
                  {"x": 8, "y": 0, "width": 2, "height": 3, "content": {"$ref": "#/spec/panels/stat-total-gpus"}},
                  {"x": 10, "y": 0, "width": 2, "height": 3, "content": {"$ref": "#/spec/panels/stat-kueue-workloads"}},
                  {"x": 0, "y": 3, "width": 6, "height": 6, "content": {"$ref": "#/spec/panels/gpu-utilization-over-time"}},
                  {"x": 6, "y": 3, "width": 6, "height": 6, "content": {"$ref": "#/spec/panels/vram-utilization-over-time"}},
                  {"x": 0, "y": 9, "width": 6, "height": 6, "content": {"$ref": "#/spec/panels/cpu-utilization-over-time"}},
                  {"x": 6, "y": 9, "width": 6, "height": 6, "content": {"$ref": "#/spec/panels/ram-utilization-over-time"}},
                  {"x": 0, "y": 15, "width": 12, "height": 10, "content": {"$ref": "#/spec/panels/workloads-table"}}
                ]
              }
            }
          ],
          "duration": "1h",
          "refreshInterval": "30s"
        }
      }
