                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#6b4d0c",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
