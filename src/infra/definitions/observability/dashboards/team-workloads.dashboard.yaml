            "dash-nodes-gpu-nodes-table": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "GPU nodes capacity and allocations",
                  "description": "Per-node accelerator model, Karpenter provisioner type, allocated vs allocatable GPUs, free capacity, and preemptible load"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "free_gpus": "none",
                        "preemptible_gpus": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "free_gpus",
                        "value": 1,
                        "operator": "below",
                        "unit": "none",
                        "color": "#6b4d0c",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH node_alloc AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'node') AS node,\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    toUInt64(argMax(s.value, s.unix_milli)) AS alloc_gpus\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('node', JSONExtractString(labels, 'node'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_node_status_allocatable'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'kube_node_status_allocatable'\n    AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n  GROUP BY node, cluster\n  HAVING alloc_gpus > 0\n),\nnode_labels AS (\n  SELECT\n    JSONExtractString(labels, 'node') AS node,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster,\n    any(JSONExtractString(labels, 'label_gpu_class')) AS gpu_class,\n    any(JSONExtractString(labels, 'label_karpenter_sh_capacity_type')) AS capacity_type\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_node_labels'\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY node, cluster\n),\nactive_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'label_availability_class') AS class,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    AND (JSONExtractString(labels, 'namespace'), JSONExtractString(labels, 'pod'), JSONExtractString(labels, 'k8s.cluster.name')) GLOBAL NOT IN (\n      SELECT\n        JSONExtractString(ts.lbl, 'namespace') AS namespace,\n        JSONExtractString(ts.lbl, 'pod') AS pod,\n        JSONExtractString(ts.lbl, 'cluster') AS cluster\n      FROM signoz_metrics.distributed_samples_v4 s\n      GLOBAL JOIN (\n        SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n        FROM signoz_metrics.distributed_time_series_v4_1day\n        WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n          AND metric_name = 'kube_pod_status_phase'\n          AND JSONExtractString(labels, 'phase') NOT IN ('Running', 'Pending')\n          AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n        GROUP BY fingerprint\n      ) ts ON s.fingerprint = ts.fingerprint\n      WHERE s.metric_name = 'kube_pod_status_phase'\n        AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY namespace, pod, cluster\n      HAVING argMax(s.value, s.unix_milli) = 1\n    )\n  GROUP BY namespace, pod, class, cluster\n),\npod_node_map AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'node') AS node,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_info'\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY namespace, pod, node, cluster\n),\npod_gpu_requests AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'namespace') AS namespace,\n    JSONExtractString(ts.lbl, 'pod') AS pod,\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    toUInt64(sum(s.v)) AS gpus\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'kube_pod_container_resource_requests'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_pod_container_resource_requests'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY namespace, pod, cluster\n),\nnode_gpu_usage AS (\n  SELECT\n    pnm.node AS node,\n    pnm.cluster AS cluster,\n    sum(pgr.gpus) AS used_gpus,\n    sumIf(pgr.gpus, ap.class IN ('wa', 'be')) AS preemptible_gpus\n  FROM active_pods ap\n  GLOBAL INNER JOIN pod_node_map pnm ON ap.namespace = pnm.namespace AND ap.pod = pnm.pod AND ap.cluster = pnm.cluster\n  GLOBAL INNER JOIN pod_gpu_requests pgr ON ap.namespace = pgr.namespace AND ap.pod = pgr.pod AND ap.cluster = pgr.cluster\n  GROUP BY node, cluster\n)\nSELECT\n  na.node AS node,\n  coalesce(nullIf(nl.gpu_class, ''), '-') AS gpu_class,\n  coalesce(nullIf(nl.capacity_type, ''), '-') AS capacity_type,\n  concat(toString(coalesce(ngu.used_gpus, 0)), ' / ', toString(na.alloc_gpus)) AS used_allocatable,\n  toUInt64(greatest(0, toInt64(na.alloc_gpus) - toInt64(coalesce(ngu.used_gpus, 0)))) AS free_gpus,\n  toUInt64(coalesce(ngu.preemptible_gpus, 0)) AS preemptible_gpus\nFROM node_alloc na\nGLOBAL LEFT JOIN node_labels nl ON na.node = nl.node AND na.cluster = nl.cluster\nGLOBAL LEFT JOIN node_gpu_usage ngu ON na.node = ngu.node AND na.cluster = ngu.cluster\nORDER BY na.node"
                        }
                      }
                    }
                  }
                ]
              }
            },
