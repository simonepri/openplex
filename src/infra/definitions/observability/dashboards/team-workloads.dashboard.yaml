                "display": {
                  "name": "Assigned GPUs by team over time",
                  "description": "Stacked area chart of total requested GPUs aggregated by team across active workloads"
                },
                "plugin": {
                  "kind": "signoz/AreaChartPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "chartAppearance": {
                      "lineInterpolation": "linear",
                      "showPoints": false,
