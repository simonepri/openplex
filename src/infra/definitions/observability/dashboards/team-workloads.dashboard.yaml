                        "spec": {
                          "name": "A",
                          "query": "WITH per_series AS (\n  SELECT\n    toStartOfInterval(toDateTime(intDiv(s.unix_milli, 1000)), INTERVAL 15 MINUTE) AS ts,\n    arrayStringConcat(arraySlice(splitByChar('-', JSONExtractString(ts.lbl, 'cluster_queue')), 2, length(splitByChar('-', JSONExtractString(ts.lbl, 'cluster_queue'))) - 2), '-') AS team,\n    s.fingerprint AS fingerprint,\n    avg(s.value) AS series_val\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('cluster_queue', JSONExtractString(labels, 'cluster_queue'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kueue_pending_workloads'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'kueue_pending_workloads'\n    AND s.unix_milli >= $start_timestamp * 1000 AND s.unix_milli <= $end_timestamp * 1000\n    AND team IN $team\n    AND splitByChar('-', JSONExtractString(ts.lbl, 'cluster_queue'))[-1] IN $class\n  GROUP BY ts, team, fingerprint\n)\nSELECT\n  ts,\n  team,\n  toUInt64(coalesce(sum(series_val), 0)) AS value\nFROM per_series\nGROUP BY ts, team\nORDER BY ts, team"
                        }
                      }
                    }
                  }
                ]
              }
            },
