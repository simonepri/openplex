                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toUInt64(sum(gpus)) AS value\nFROM (\n  SELECT\n    argMax(body, timestamp) AS workload,\n    arrayExists(c -> JSONExtractString(c, 'type') IN ('QuotaReserved', 'Finished') AND JSONExtractString(c, 'status') = 'True', JSONExtractArrayRaw(workload, 'status', 'conditions')) AS placed,\n    arraySum(ps -> JSONExtractUInt(ps, 'count') * arraySum(c -> toUInt64OrZero(trim(BOTH '\"' FROM JSONExtractRaw(c, 'resources', 'requests', 'nvidia.com/gpu'))), JSONExtractArrayRaw(ps, 'template', 'spec', 'containers')), JSONExtractArrayRaw(workload, 'spec', 'podSets')) AS gpus\n  FROM signoz_logs.distributed_logs_v2\n  WHERE ts_bucket_start BETWEEN $end_timestamp - 2400 AND $end_timestamp\n    AND timestamp BETWEEN ($end_timestamp - 600) * 1000000000 AND $end_timestamp_nano\n    AND attributes_string['log.source'] = 'kueue-workload'\n    AND resources_string['k8s.cluster.name'] IN $cluster\n    AND attributes_string['kueue.team'] IN $team\n    AND attributes_string['kueue.queue'] IN $class\n  GROUP BY resources_string['k8s.cluster.name'], attributes_string['kueue.workload.namespace'], attributes_string['kueue.workload.name']\n)\nWHERE NOT placed"
