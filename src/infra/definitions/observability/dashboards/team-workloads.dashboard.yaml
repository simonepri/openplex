# Defines team-workloads dashboard reconciled into SigNoz. It presents GPU, CPU, and RAM allocations vs actual usage, compute & VRAM utilization, and Kueue queue states.

apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: team-workloads
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    jsonSpec: |-
      {
        "schemaVersion": "v6",
        "image": "/assets/Logos/nvidia-dcgm",
        "name": "team-workloads",
        "tags": [
          {
            "key": "category",
            "value": "compute"
          },
          {
            "key": "category",
            "value": "workloads"
          }
        ],
        "spec": {
          "display": {
            "name": "Team Workloads",
            "description": "Cluster compute capacity, GPU allocations by availability class, Kueue workload queues, GPU efficiency, and Coder developer workspaces."
          },
          "variables": [
            {
              "kind": "ListVariable",
              "spec": {
                "name": "cluster",
                "display": {
                  "name": "Cluster",
                  "description": "Filter by Kubernetes cluster name"
                },
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "alphabetical-asc",
                "plugin": {
                  "kind": "signoz/QueryVariable",
                  "spec": {
                    "queryValue": "SELECT DISTINCT JSONExtractString(labels, 'k8s.cluster.name') AS cluster FROM signoz_metrics.distributed_time_series_v4_1day WHERE metric_name = 'kube_pod_labels' AND cluster != '' ORDER BY cluster"
                  }
                }
              }
            },
            {
              "kind": "ListVariable",
              "spec": {
                "name": "team",
                "display": {
                  "name": "Team",
                  "description": "Filter by workload team"
                },
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "alphabetical-asc",
                "plugin": {
                  "kind": "signoz/QueryVariable",
                  "spec": {
                    "queryValue": "SELECT DISTINCT JSONExtractString(labels, 'label_team') AS team FROM signoz_metrics.distributed_time_series_v4_1day WHERE metric_name = 'kube_pod_labels' AND team != '' ORDER BY team"
                  }
                }
              }
            },
            {
              "kind": "ListVariable",
              "spec": {
                "name": "class",
                "display": {
                  "name": "Class",
                  "description": "Filter by availability class (ha, ma, wa, be)"
                },
                "defaultValue": [
                  "ha",
                  "ma",
                  "wa",
                  "be"
                ],
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "none",
                "plugin": {
                  "kind": "signoz/CustomVariable",
                  "spec": {
                    "customValue": "ha,ma,wa,be"
                  }
                }
              }
            }
          ],
          "panels": {
            "dash-capacity-intro": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Capacity & cluster headroom",
                  "description": "Capacity overview and headline numbers"
                },
                "plugin": {
                  "kind": "signoz/TextPanel",
                  "spec": {
                    "mode": "markdown",
                    "text": "Allocatable GPU accelerators, active assignments by availability class, available headroom, queued demand, and idle GPU capacity.",
                    "presentation": {
                      "textAlign": "left",
                      "verticalAlign": "top"
                    },
                    "headerOptions": {
                      "hide": true
                    }
                  }
                },
                "queries": []
              }
            },
            "dash-capacity-gpus-allocatable": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "GPUs allocatable",
                  "description": "Total allocatable GPU accelerators detected across cluster nodes"
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#16263d",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toUInt64(coalesce(sum(v), 0)) AS value\nFROM (\n  SELECT fingerprint, argMax(value, unix_milli) AS v\n  FROM signoz_metrics.distributed_samples_v4\n  WHERE metric_name = 'kube_node_status_allocatable'\n    AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n  GROUP BY fingerprint\n) s\nGLOBAL JOIN (\n  SELECT fingerprint\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_node_status_allocatable'\n    AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY fingerprint\n) ts ON s.fingerprint = ts.fingerprint"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-capacity-assigned-hama": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Assigned ha+ma",
                  "description": "GPUs assigned to active team workloads with high-availability or medium-availability classes"
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH active_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN ('ha', 'ma')\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    AND (JSONExtractString(labels, 'namespace'), JSONExtractString(labels, 'pod'), JSONExtractString(labels, 'k8s.cluster.name')) GLOBAL NOT IN (\n      SELECT\n        JSONExtractString(ts.lbl, 'namespace') AS namespace,\n        JSONExtractString(ts.lbl, 'pod') AS pod,\n        JSONExtractString(ts.lbl, 'cluster') AS cluster\n      FROM signoz_metrics.distributed_samples_v4 s\n      GLOBAL JOIN (\n        SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n        FROM signoz_metrics.distributed_time_series_v4_1day\n        WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n          AND metric_name = 'kube_pod_status_phase'\n          AND JSONExtractString(labels, 'phase') NOT IN ('Running', 'Pending')\n          AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n        GROUP BY fingerprint\n      ) ts ON s.fingerprint = ts.fingerprint\n      WHERE s.metric_name = 'kube_pod_status_phase'\n        AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY namespace, pod, cluster\n      HAVING argMax(s.value, s.unix_milli) = 1\n    )\n  GROUP BY namespace, pod, cluster\n),\npod_requests AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'namespace') AS namespace,\n    JSONExtractString(ts.lbl, 'pod') AS pod,\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    sum(s.v) AS gpus\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'kube_pod_container_resource_requests'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_pod_container_resource_requests'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY namespace, pod, cluster\n)\nSELECT toUInt64(coalesce(sum(pr.gpus), 0)) AS value\nFROM active_pods ap\nGLOBAL INNER JOIN pod_requests pr ON ap.namespace = pr.namespace AND ap.pod = pr.pod AND ap.cluster = pr.cluster"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-capacity-assigned-wabe": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Assigned wa+be",
                  "description": "GPUs assigned to active team workloads with workload-aware or best-effort classes"
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#16263d",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH active_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN ('wa', 'be')\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    AND (JSONExtractString(labels, 'namespace'), JSONExtractString(labels, 'pod'), JSONExtractString(labels, 'k8s.cluster.name')) GLOBAL NOT IN (\n      SELECT\n        JSONExtractString(ts.lbl, 'namespace') AS namespace,\n        JSONExtractString(ts.lbl, 'pod') AS pod,\n        JSONExtractString(ts.lbl, 'cluster') AS cluster\n      FROM signoz_metrics.distributed_samples_v4 s\n      GLOBAL JOIN (\n        SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n        FROM signoz_metrics.distributed_time_series_v4_1day\n        WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n          AND metric_name = 'kube_pod_status_phase'\n          AND JSONExtractString(labels, 'phase') NOT IN ('Running', 'Pending')\n          AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n        GROUP BY fingerprint\n      ) ts ON s.fingerprint = ts.fingerprint\n      WHERE s.metric_name = 'kube_pod_status_phase'\n        AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY namespace, pod, cluster\n      HAVING argMax(s.value, s.unix_milli) = 1\n    )\n  GROUP BY namespace, pod, cluster\n),\npod_requests AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'namespace') AS namespace,\n    JSONExtractString(ts.lbl, 'pod') AS pod,\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    sum(s.v) AS gpus\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'kube_pod_container_resource_requests'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_pod_container_resource_requests'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY namespace, pod, cluster\n)\nSELECT toUInt64(coalesce(sum(pr.gpus), 0)) AS value\nFROM active_pods ap\nGLOBAL INNER JOIN pod_requests pr ON ap.namespace = pr.namespace AND ap.pod = pr.pod AND ap.cluster = pr.cluster"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-capacity-free-now": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Free now",
                  "description": "Immediately available allocatable GPUs not assigned to any active team workload"
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 1,
                        "operator": "below",
                        "unit": "",
                        "color": "#6b4d0c",
                        "format": "background"
                      },
                      {
                        "value": 1,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH alloc AS (\n  SELECT toInt64(coalesce(sum(v), 0)) AS alloc_gpus\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'kube_node_status_allocatable'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_node_status_allocatable'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n),\nactive_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    AND (JSONExtractString(labels, 'namespace'), JSONExtractString(labels, 'pod'), JSONExtractString(labels, 'k8s.cluster.name')) GLOBAL NOT IN (\n      SELECT\n        JSONExtractString(ts.lbl, 'namespace') AS namespace,\n        JSONExtractString(ts.lbl, 'pod') AS pod,\n        JSONExtractString(ts.lbl, 'cluster') AS cluster\n      FROM signoz_metrics.distributed_samples_v4 s\n      GLOBAL JOIN (\n        SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n        FROM signoz_metrics.distributed_time_series_v4_1day\n        WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n          AND metric_name = 'kube_pod_status_phase'\n          AND JSONExtractString(labels, 'phase') NOT IN ('Running', 'Pending')\n          AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n        GROUP BY fingerprint\n      ) ts ON s.fingerprint = ts.fingerprint\n      WHERE s.metric_name = 'kube_pod_status_phase'\n        AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY namespace, pod, cluster\n      HAVING argMax(s.value, s.unix_milli) = 1\n    )\n  GROUP BY namespace, pod, cluster\n),\nassigned AS (\n  SELECT toInt64(coalesce(sum(pr.gpus), 0)) AS assigned_gpus\n  FROM active_pods ap\n  GLOBAL INNER JOIN (\n    SELECT\n      JSONExtractString(ts.lbl, 'namespace') AS namespace,\n      JSONExtractString(ts.lbl, 'pod') AS pod,\n      JSONExtractString(ts.lbl, 'cluster') AS cluster,\n      sum(s.v) AS gpus\n    FROM (\n      SELECT fingerprint, argMax(value, unix_milli) AS v\n      FROM signoz_metrics.distributed_samples_v4\n      WHERE metric_name = 'kube_pod_container_resource_requests'\n        AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY fingerprint\n    ) s\n    GLOBAL JOIN (\n      SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n      FROM signoz_metrics.distributed_time_series_v4_1day\n      WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n        AND metric_name = 'kube_pod_container_resource_requests'\n        AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n        AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      GROUP BY fingerprint\n    ) ts ON s.fingerprint = ts.fingerprint\n    GROUP BY namespace, pod, cluster\n  ) pr ON ap.namespace = pr.namespace AND ap.pod = pr.pod AND ap.cluster = pr.cluster\n)\nSELECT toUInt64(greatest(0, alloc.alloc_gpus - assigned.assigned_gpus)) AS value\nFROM alloc CROSS JOIN assigned"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-capacity-free-after-preemption": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Free after wa/be preemption",
                  "description": "GPUs available if all preemptible (wa/be) workloads are evicted (allocatable - ha/ma assigned)"
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 1,
                        "operator": "below",
                        "unit": "",
                        "color": "#7a2020",
                        "format": "background"
                      },
                      {
                        "value": 1,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH alloc AS (\n  SELECT toInt64(coalesce(sum(v), 0)) AS alloc_gpus\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'kube_node_status_allocatable'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_node_status_allocatable'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n),\nactive_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN ('ha', 'ma')\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    AND (JSONExtractString(labels, 'namespace'), JSONExtractString(labels, 'pod'), JSONExtractString(labels, 'k8s.cluster.name')) GLOBAL NOT IN (\n      SELECT\n        JSONExtractString(ts.lbl, 'namespace') AS namespace,\n        JSONExtractString(ts.lbl, 'pod') AS pod,\n        JSONExtractString(ts.lbl, 'cluster') AS cluster\n      FROM signoz_metrics.distributed_samples_v4 s\n      GLOBAL JOIN (\n        SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n        FROM signoz_metrics.distributed_time_series_v4_1day\n        WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n          AND metric_name = 'kube_pod_status_phase'\n          AND JSONExtractString(labels, 'phase') NOT IN ('Running', 'Pending')\n          AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n        GROUP BY fingerprint\n      ) ts ON s.fingerprint = ts.fingerprint\n      WHERE s.metric_name = 'kube_pod_status_phase'\n        AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY namespace, pod, cluster\n      HAVING argMax(s.value, s.unix_milli) = 1\n    )\n  GROUP BY namespace, pod, cluster\n),\nassigned AS (\n  SELECT toInt64(coalesce(sum(pr.gpus), 0)) AS assigned_gpus\n  FROM active_pods ap\n  GLOBAL INNER JOIN (\n    SELECT\n      JSONExtractString(ts.lbl, 'namespace') AS namespace,\n      JSONExtractString(ts.lbl, 'pod') AS pod,\n      JSONExtractString(ts.lbl, 'cluster') AS cluster,\n      sum(s.v) AS gpus\n    FROM (\n      SELECT fingerprint, argMax(value, unix_milli) AS v\n      FROM signoz_metrics.distributed_samples_v4\n      WHERE metric_name = 'kube_pod_container_resource_requests'\n        AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY fingerprint\n    ) s\n    GLOBAL JOIN (\n      SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n      FROM signoz_metrics.distributed_time_series_v4_1day\n      WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n        AND metric_name = 'kube_pod_container_resource_requests'\n        AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n        AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      GROUP BY fingerprint\n    ) ts ON s.fingerprint = ts.fingerprint\n    GROUP BY namespace, pod, cluster\n  ) pr ON ap.namespace = pr.namespace AND ap.pod = pr.pod AND ap.cluster = pr.cluster\n)\nSELECT toUInt64(greatest(0, alloc.alloc_gpus - assigned.assigned_gpus)) AS value\nFROM alloc CROSS JOIN assigned"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-capacity-pending-gpus": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Pending GPUs",
