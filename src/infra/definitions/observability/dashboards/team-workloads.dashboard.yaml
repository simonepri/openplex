            "dash-efficiency-gpu-util-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "GPU compute utilization by team",
                  "description": "Average percentage of GPU compute and tensor cores utilized over time grouped by team"
                },
                "plugin": {
                  "kind": "signoz/AreaChartPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "percent",
                      "decimalPrecision": "1"
                    },
                    "chartAppearance": {
                      "lineInterpolation": "linear",
                      "showPoints": false,
                      "lineStyle": "solid",
                      "fillMode": "solid",
                      "spanGaps": {
                        "fillOnlyBelow": false,
                        "fillLessThan": ""
                      }
                    },
                    "axes": {
                      "softMin": 0,
                      "softMax": 100,
                      "isLogScale": false
                    },
                    "legend": {
                      "position": "bottom",
                      "mode": "list",
                      "customColors": {
                        "examples": "#3987e5"
                      }
                    },
                    "thresholds": []
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH team_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'label_team') AS team,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY namespace, pod, team, cluster\n)\nSELECT\n  toStartOfInterval(toDateTime(intDiv(s.unix_milli, 1000)), INTERVAL 15 MINUTE) AS ts,\n  tp.team AS team,\n  round(avg(s.value), 1) AS value\nFROM signoz_metrics.distributed_samples_v4 s\nGLOBAL JOIN (\n  SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'DCGM_FI_DEV_GPU_UTIL'\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY fingerprint\n) ts ON s.fingerprint = ts.fingerprint\nGLOBAL INNER JOIN team_pods tp ON JSONExtractString(ts.lbl, 'namespace') = tp.namespace AND JSONExtractString(ts.lbl, 'pod') = tp.pod AND JSONExtractString(ts.lbl, 'cluster') = tp.cluster\nWHERE s.metric_name = 'DCGM_FI_DEV_GPU_UTIL'\n  AND s.unix_milli >= $start_timestamp * 1000 AND s.unix_milli <= $end_timestamp * 1000\nGROUP BY ts, team\nORDER BY ts, team"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-efficiency-low-util-jobs-table": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Workloads with low GPU utilization",
                  "description": "Jobs holding GPU allocations with average DCGM compute utilization below 20%"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "gpus": "none",
                        "avg_util_pct": "percent"
                      },
                      "decimalPrecision": "1"
                    },
                    "thresholds": [
                      {
                        "columnName": "avg_util_pct",
                        "value": 10,
                        "operator": "below",
                        "unit": "percent",
                        "color": "#7a2020",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH active_pods AS (\n  SELECT\n    JSONExtractString(labels, 'namespace') AS namespace,\n    JSONExtractString(labels, 'pod') AS pod,\n    JSONExtractString(labels, 'label_team') AS team,\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_pod_labels'\n    AND JSONExtractString(labels, 'label_team') != ''\n    AND JSONExtractString(labels, 'label_team') IN $team\n    AND JSONExtractString(labels, 'label_availability_class') IN $class\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    AND (JSONExtractString(labels, 'namespace'), JSONExtractString(labels, 'pod'), JSONExtractString(labels, 'k8s.cluster.name')) GLOBAL NOT IN (\n      SELECT\n        JSONExtractString(ts.lbl, 'namespace') AS namespace,\n        JSONExtractString(ts.lbl, 'pod') AS pod,\n        JSONExtractString(ts.lbl, 'cluster') AS cluster\n      FROM signoz_metrics.distributed_samples_v4 s\n      GLOBAL JOIN (\n        SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n        FROM signoz_metrics.distributed_time_series_v4_1day\n        WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n          AND metric_name = 'kube_pod_status_phase'\n          AND JSONExtractString(labels, 'phase') NOT IN ('Running', 'Pending')\n          AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n        GROUP BY fingerprint\n      ) ts ON s.fingerprint = ts.fingerprint\n      WHERE s.metric_name = 'kube_pod_status_phase'\n        AND s.unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n      GROUP BY namespace, pod, cluster\n      HAVING argMax(s.value, s.unix_milli) = 1\n    )\n  GROUP BY namespace, pod, team, cluster\n),\ngpu_requests AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'namespace') AS namespace,\n    JSONExtractString(ts.lbl, 'pod') AS pod,\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    toUInt64(sum(s.v)) AS gpus\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'kube_pod_container_resource_requests'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_pod_container_resource_requests'\n      AND JSONExtractString(labels, 'resource') = 'nvidia.com/gpu'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY namespace, pod, cluster\n  HAVING gpus > 0\n),\ndcgm_util AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'namespace') AS namespace,\n    JSONExtractString(ts.lbl, 'pod') AS pod,\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    avg(s.value) AS avg_util\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'pod', JSONExtractString(labels, 'pod'), 'cluster', JSONExtractString(labels, 'k8s.cluster.name')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'DCGM_FI_DEV_GPU_UTIL'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'DCGM_FI_DEV_GPU_UTIL'\n    AND s.unix_milli >= $start_timestamp * 1000 AND s.unix_milli <= $end_timestamp * 1000\n  GROUP BY namespace, pod, cluster\n)\nSELECT\n  concat(ap.namespace, '/', ap.pod) AS workload,\n  ap.team AS team,\n  gr.gpus AS gpus,\n  round(coalesce(du.avg_util, 0), 1) AS avg_util_pct\nFROM active_pods ap\nGLOBAL INNER JOIN gpu_requests gr ON ap.namespace = gr.namespace AND ap.pod = gr.pod AND ap.cluster = gr.cluster\nGLOBAL LEFT JOIN dcgm_util du ON ap.namespace = du.namespace AND ap.pod = du.pod AND ap.cluster = du.cluster\nWHERE coalesce(du.avg_util, 0) < 20\nORDER BY avg_util_pct ASC, gpus DESC\nLIMIT 50"
                        }
                      }
                    }
                  }
                ]
              }
            },
