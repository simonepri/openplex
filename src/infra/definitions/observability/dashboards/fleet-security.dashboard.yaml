                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "B",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "B",
                          "legend": "internal 401: {{host}}",
                          "query": "SELECT toStartOfHour(toDateTime(timestamp / 1000000000)) AS ts, attributes_string['authority'] AS host, count() AS value FROM signoz_logs.distributed_logs_v2 WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano AND resources_string['k8s.container.name'] = 'envoy' AND resources_string['k8s.cluster.name'] IN $cluster AND toUInt16(attributes_number['response_code']) = 401 AND attributes_string['user_agent'] NOT LIKE 'openplex-conformance-probe%' AND attributes_string['user_agent'] NOT LIKE 'Python-urllib%' AND attributes_string['authority'] GLOBAL NOT IN (SELECT DISTINCT attributes_string['authority'] FROM signoz_logs.distributed_logs_v2 WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano AND resources_string['k8s.container.name'] = 'envoy' AND resources_string['k8s.cluster.name'] IN $cluster AND has(mapKeys(attributes_string), 'x_forwarded_for') AND trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]) != '' AND isIPv4String(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1])) AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '10.0.0.0/8') AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '172.16.0.0/12') AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '192.168.0.0/16') AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '127.0.0.0/8') AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '100.64.0.0/10')) GROUP BY ts, host ORDER BY ts"
                        }
                      }
                    }
                  }
                ]
              }
