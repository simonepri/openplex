                    },
                    "thresholds": [
                      {
                        "columnName": "public_clients",
                        "value": 500,
                        "operator": "above",
                        "unit": "none",
                        "color": "#6b4d0c",
                        "format": "background"
                      },
                      {
                        "columnName": "pct_denied",
                        "value": 20,
                        "operator": "above",
                        "unit": "percent",
                        "color": "#7a2020",
                        "format": "background"
                      },
                      {
                        "columnName": "pct_denied",
                        "value": 5,
                        "operator": "above",
                        "unit": "percent",
                        "color": "#6b4d0c",
                        "format": "background"
                      }
                    ]
