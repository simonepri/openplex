                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "bytes": "By"
                      },
                      "decimalPrecision": "0"
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH flows AS (\n  SELECT JSONExtractString(ts.lbl, 'src_ns') AS src_namespace, JSONExtractString(ts.lbl, 'src_owner') AS src_owner, JSONExtractString(ts.lbl, 'dst_ns') AS dst_namespace, JSONExtractString(ts.lbl, 'dst_owner') AS dst_owner, JSONExtractString(ts.lbl, 'dst_cidr') AS dst_cidr, greatest(0, max(s.value) - min(s.value)) AS bytes\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('src_ns', JSONExtractString(labels, 'k8s.src.namespace'), 'src_owner', JSONExtractString(labels, 'k8s.src.owner.name'), 'dst_ns', JSONExtractString(labels, 'k8s.dst.namespace'), 'dst_owner', JSONExtractString(labels, 'k8s.dst.owner.name'), 'dst_cidr', JSONExtractString(labels, 'dst.cidr')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'obi.network.flow.bytes'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      AND (JSONExtractString(labels, 'k8s.src.namespace') IN $namespace OR JSONExtractString(labels, 'k8s.dst.namespace') IN $namespace)\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'obi.network.flow.bytes'\n    AND s.unix_milli >= $start_timestamp * 1000\n    AND s.unix_milli <= $end_timestamp * 1000\n  GROUP BY s.fingerprint, src_namespace, src_owner, dst_namespace, dst_owner, dst_cidr\n)\nSELECT concat(src_namespace, '/', src_owner, ' -> ', if(dst_owner != '', concat(dst_namespace, '/', dst_owner), if(dst_cidr != '', dst_cidr, 'unlabelled'))) AS flow, toUInt64(sum(bytes)) AS bytes\nFROM flows\nWHERE src_owner != '' OR dst_owner != '' OR dst_cidr != ''\nGROUP BY flow\nORDER BY bytes DESC\nLIMIT 50"
