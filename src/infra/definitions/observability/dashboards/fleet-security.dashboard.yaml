                          "name": "A",
                          "query": "SELECT service, fail, rate FROM (\nWITH run AS (\n  SELECT argMax(resources_string['k8s.pod.name'], timestamp) AS pod\n  FROM signoz_logs.distributed_logs_v2\n  WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n    AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n    AND has(mapKeys(attributes_string), 'status_code')\n    AND resources_string['k8s.namespace.name'] = 'prowler'\n    AND attributes_string['status_code'] != ''\n)\nSELECT JSONExtractString(attributes_string['resources'], 1, 'group', 'name') AS service, countIf(attributes_string['status_code'] = 'FAIL') AS fail, countIf(attributes_string['status_code'] = 'PASS') AS pass_count, toInt64(round(100.0 * pass_count / greatest(1, pass_count + fail))) AS rate\nFROM signoz_logs.distributed_logs_v2\nWHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n  AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n  AND has(mapKeys(attributes_string), 'status_code')\n  AND resources_string['k8s.namespace.name'] = 'prowler'\n  AND resources_string['k8s.pod.name'] = (SELECT pod FROM run)\n  AND attributes_string['status_code'] IN ('PASS', 'FAIL')\n  AND service != ''\nGROUP BY service\nORDER BY fail DESC\n)\nORDER BY fail DESC"
