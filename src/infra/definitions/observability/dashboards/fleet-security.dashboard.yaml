# Defines the fleet-security dashboard displaying runtime threats, ingress denials, admission policy blocks, posture findings, vulnerabilities, and CIS compliance.

apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: fleet-security
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    jsonSpec: |-
      {
        "schemaVersion": "v6",
        "image": "/assets/Icons/siren",
        "name": "fleet-security",
        "tags": [
          {
            "key": "category",
            "value": "security"
          }
        ],
        "spec": {
          "display": {
            "name": "Security",
            "description": "Unified fleet security telemetry: runtime threats from Falco eBPF, ingress security denials, admission policy blocks, CSPM posture findings, container image vulnerabilities, and CIS configuration compliance."
          },
          "variables": [
            {
              "kind": "ListVariable",
              "spec": {
                "name": "cluster",
                "display": {
                  "name": "Cluster",
                  "description": "Filter by Kubernetes cluster name"
                },
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "alphabetical-asc",
                "plugin": {
                  "kind": "signoz/QueryVariable",
                  "spec": {
                    "queryValue": "SELECT DISTINCT resources_string['k8s.cluster.name'] AS cluster FROM signoz_logs.distributed_logs_v2 WHERE ts_bucket_start >= toUnixTimestamp(now() - INTERVAL 24 HOUR) AND resources_string['k8s.cluster.name'] != '' ORDER BY cluster"
                  }
                }
              }
            },
            {
              "kind": "ListVariable",
              "spec": {
                "name": "namespace",
                "display": {
                  "name": "Namespace",
                  "description": "Filter by Kubernetes namespace"
                },
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "alphabetical-asc",
                "plugin": {
                  "kind": "signoz/QueryVariable",
                  "spec": {
                    "queryValue": "SELECT DISTINCT JSONExtractString(labels, 'namespace') AS namespace FROM signoz_metrics.distributed_time_series_v4_1day WHERE namespace != '' ORDER BY namespace"
                  }
                }
              }
            },
            {
              "kind": "ListVariable",
              "spec": {
                "name": "priority",
                "display": {
                  "name": "Falco priority",
                  "description": "Filter by Falco event priority level"
                },
                "defaultValue": [
                  "Emergency",
                  "Alert",
                  "Critical",
                  "Error",
                  "Warning"
                ],
                "allowAllValue": true,
                "allowMultiple": true,
                "sort": "none",
                "plugin": {
                  "kind": "signoz/CustomVariable",
                  "spec": {
                    "customValue": "Emergency,Alert,Critical,Error,Warning,Notice,Informational,Debug"
                  }
                }
              }
            }
          ],
          "panels": {
            "dash-posture-intro": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Security posture",
                  "description": "Section introduction and posture overview"
                },
                "plugin": {
                  "kind": "signoz/TextPanel",
                  "spec": {
                    "mode": "markdown",
                    "text": "Headline numbers for the selected range; tiles turn **amber** or **red** past their threshold.",
                    "presentation": {
                      "textAlign": "left",
                      "verticalAlign": "top"
                    },
                    "headerOptions": {
                      "hide": true
                    }
                  }
                },
                "queries": []
              }
            },
            "dash-posture-runtime-alerts": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Runtime alerts \u2265 Warning",
                  "description": "Falco priority variable defaults to Warning. Two Notice rules make up 99.99% of raw volume: tune them in Falco."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT count() AS value\nFROM signoz_logs.distributed_logs_v2\nWHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n  AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n  AND has(mapKeys(attributes_string), 'priority')\n  AND resources_string['k8s.container.name'] = 'falco'\n  AND resources_string['k8s.cluster.name'] IN $cluster\n  AND attributes_string['priority'] IN ('Emergency', 'Alert', 'Critical', 'Error', 'Warning')"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-critical-cves": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Critical CVEs in running images",
                  "description": "Deduplicate by image: the same image in N pods reports the same CVE N times."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4f1717",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toUInt64(coalesce(sum(crit_count), 0)) AS value\nFROM (\n  SELECT\n    coalesce(nullIf(JSONExtractString(ts.lb, 'image_digest'), ''), JSONExtractString(ts.lb, 'image_repository')) AS img,\n    max(v) AS crit_count\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'trivy_image_vulnerabilities'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('image_digest', JSONExtractString(labels, 'image_digest'), 'image_repository', JSONExtractString(labels, 'image_repository')))) AS lb\n    FROM signoz_metrics.distributed_time_series_v4\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'trivy_image_vulnerabilities'\n      AND JSONExtractString(labels, 'severity') = 'Critical'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY img\n)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-secrets-in-images": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Secrets baked into images",
                  "description": "Exposed secrets detected by Trivy in running container images."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4f1717",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toUInt64(coalesce(sum(sec_count), 0)) AS value\nFROM (\n  SELECT\n    coalesce(nullIf(JSONExtractString(ts.lb, 'image_digest'), ''), JSONExtractString(ts.lb, 'image_repository')) AS img,\n    max(v) AS sec_count\n  FROM (\n    SELECT fingerprint, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'trivy_image_exposedsecrets'\n      AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n    GROUP BY fingerprint\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('image_digest', JSONExtractString(labels, 'image_digest'), 'image_repository', JSONExtractString(labels, 'image_repository')))) AS lb\n    FROM signoz_metrics.distributed_time_series_v4\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'trivy_image_exposedsecrets'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY img\n)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-internet-facing-hosts": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Internet-facing hosts",
                  "description": "Hosts behind Envoy Gateway that received requests from public IPs (X-Forwarded-For)."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 1,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT uniqExactIf(\n  attributes_string['authority'],\n  trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]) != ''\n  AND isIPv4String(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]))\n  AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '10.0.0.0/8')\n  AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '172.16.0.0/12')\n  AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '192.168.0.0/16')\n  AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '127.0.0.0/8')\n  AND NOT isIPAddressInRange(trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]), '100.64.0.0/10')\n) AS value\nFROM signoz_logs.distributed_logs_v2\nWHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n  AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n  AND has(mapKeys(attributes_string), 'x_forwarded_for')\n  AND resources_string['k8s.container.name'] = 'envoy'\n  AND resources_string['k8s.cluster.name'] IN $cluster"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-aws-cis-pass-rate": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "AWS CIS pass rate",
                  "description": "AWS CIS v3.0 benchmark pass percentage from the latest Prowler scan."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "percent",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 90,
                        "operator": "below",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 90,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT coalesce(\n  (\n    SELECT round(100.0 * pass / max2(1, pass + fail))\n    FROM (\n      SELECT\n        resources_string['k8s.pod.name'] AS pod,\n        max(timestamp) AS last_ts,\n        countIf(attributes_string['status_code'] = 'PASS') AS pass,\n        countIf(attributes_string['status_code'] = 'FAIL') AS fail\n      FROM signoz_logs.distributed_logs_v2\n      WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n        AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n        AND resource_fingerprint LIKE '%service.namespace=prowler%'\n        AND has(mapKeys(attributes_string), 'status_code')\n        AND resources_string['k8s.namespace.name'] = 'prowler'\n        AND attributes_string['status_code'] IN ('PASS', 'FAIL')\n      GROUP BY pod\n      ORDER BY last_ts DESC\n      LIMIT 1\n    )\n  ),\n  0\n) AS value"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-telemetry-gaps": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Telemetry gaps",
                  "description": "Configured security sources that went silent longer than allowed. Not-yet-collected sources are listed in the Coverage section, not counted here."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4f1717",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH \n  clusters AS (\n    SELECT DISTINCT resources_string['k8s.cluster.name'] AS cluster\n    FROM signoz_logs.distributed_logs_v2\n    WHERE ts_bucket_start >= $end_timestamp - 172800\n      AND resources_string['k8s.cluster.name'] != ''\n      AND resources_string['k8s.cluster.name'] IN $cluster\n  ),\n  cluster_limits AS (\n    SELECT tupleElement(e, 1) AS source, tupleElement(e, 2) AS limit_min, c.cluster AS cluster\n    FROM (SELECT arrayJoin([\n      ('Falco runtime', 120),\n      ('Envoy access logs', 120),\n      ('kubernetes-audit', 120),\n      ('NetworkPolicy denials', 1000000000),\n      ('OBI flows', 120),\n      ('Trivy CVE metrics', 120),\n      ('Trivy config audit', 120),\n      ('Kyverno', 120),\n      ('cert-manager', 120)\n    ]) AS e) AS src\n    CROSS JOIN clusters AS c\n  ),\n  global_limits AS (\n    SELECT tupleElement(e, 1) AS source, tupleElement(e, 2) AS limit_min, 'aws' AS cluster\n    FROM (SELECT arrayJoin([\n      ('cloud-audit', 120),\n      ('network-flow', 120),\n      ('DNS logs', 120),\n      ('Prowler AWS CIS', 2160)\n    ]) AS e)\n  ),\n  expected AS (\n    SELECT * FROM cluster_limits\n    UNION ALL\n    SELECT * FROM global_limits\n  ),\n  seen AS (\n    SELECT multiIf(resources_string['k8s.container.name'] = 'falco', 'Falco runtime',\n                   resources_string['k8s.container.name'] = 'envoy', 'Envoy access logs', 'Prowler AWS CIS') AS source,\n      if(resources_string['k8s.namespace.name'] = 'prowler', 'aws', resources_string['k8s.cluster.name']) AS cluster, count() AS volume, max(timestamp) AS last_ns\n    FROM signoz_logs.distributed_logs_v2\n    WHERE ts_bucket_start BETWEEN $end_timestamp - 129600 - 1800 AND $end_timestamp\n      AND timestamp BETWEEN ($end_timestamp - 129600) * 1000000000 AND $end_timestamp * 1000000000\n      AND (resources_string['k8s.container.name'] IN ('falco', 'envoy') OR resources_string['k8s.namespace.name'] = 'prowler')\n      AND (resources_string['k8s.namespace.name'] = 'prowler' OR resources_string['k8s.cluster.name'] IN $cluster)\n    GROUP BY source, cluster\n    UNION ALL\n    SELECT multiIf(attributes_string['log.source'] = 'network-policy', 'NetworkPolicy denials',\n                   attributes_string['log.source'] = 'dns-query', 'DNS logs',\n                   attributes_string['log.source']) AS source,\n      if(attributes_string['log.source'] IN ('cloud-audit', 'network-flow', 'dns-query'), 'aws', resources_string['k8s.cluster.name']) AS cluster,\n      count(), max(timestamp)\n    FROM signoz_logs.distributed_logs_v2\n    WHERE ts_bucket_start BETWEEN $end_timestamp - 129600 - 1800 AND $end_timestamp\n      AND timestamp BETWEEN ($end_timestamp - 129600) * 1000000000 AND $end_timestamp * 1000000000\n      AND attributes_string['log.source'] IN ('kubernetes-audit', 'cloud-audit', 'network-flow', 'dns-query', 'network-policy')\n      AND (attributes_string['log.source'] IN ('cloud-audit', 'network-flow', 'dns-query') OR resources_string['k8s.cluster.name'] IN $cluster)\n    GROUP BY 1, 2\n    UNION ALL\n    SELECT multiIf(metric_name = 'trivy_image_vulnerabilities', 'Trivy CVE metrics',\n                   metric_name = 'trivy_resource_configaudits', 'Trivy config audit',\n                   metric_name = 'obi.network.flow.bytes', 'OBI flows',\n                   metric_name LIKE 'kyverno%', 'Kyverno', 'cert-manager'),\n      JSONExtractString(labels, 'k8s.cluster.name'), uniqExact(fingerprint), max(unix_milli) * 1000000\n    FROM signoz_metrics.distributed_time_series_v4\n    WHERE metric_name IN ('trivy_image_vulnerabilities', 'trivy_resource_configaudits', 'obi.network.flow.bytes',\n                          'kyverno_policy_results_total', 'certmanager_certificate_expiration_timestamp_seconds')\n      AND unix_milli BETWEEN ($end_timestamp - 129600) * 1000 AND $end_timestamp * 1000\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY 1, 2\n  ),\n  rows AS (\n    SELECT e.source AS source, e.cluster AS cluster, coalesce(s.volume, 0) AS volume,\n      if(isNull(s.last_ns) OR s.last_ns = 0, NULL, dateDiff('minute', toDateTime(intDiv(s.last_ns, 1000000000)), toDateTime($end_timestamp))) AS minutes_since_data,\n      if(isNull(s.last_ns) OR s.last_ns = 0 OR e.limit_min > 100000, NULL, round(100 * minutes_since_data / e.limit_min)) AS pct_of_allowed_delay,\n      if(e.source = 'NetworkPolicy denials', 'OK', if(isNull(s.last_ns) OR s.last_ns = 0 OR minutes_since_data > e.limit_min, 'STALE', 'OK')) AS status\n    FROM expected AS e\n    LEFT JOIN seen AS s ON s.source = e.source AND s.cluster = e.cluster\n  )\nSELECT countIf(status = 'STALE') AS value FROM rows"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-human-privileged-actions": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Human privileged actions",
                  "description": "SSO users only (AWSReservedSSO roles) in Kubernetes audit; service accounts excluded."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT count() AS value\nFROM signoz_logs.distributed_logs_v2\nWHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n  AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n  AND has(mapKeys(attributes_string), 'log.source')\n  AND attributes_string['log.source'] = 'kubernetes-audit'\n  AND (resources_string['k8s.cluster.name'] = '' OR resources_string['k8s.cluster.name'] IN $cluster)\n  AND attributes_string['k8s.audit.user'] LIKE '%assumed-role/AWSReservedSSO%'\n  AND (\n    attributes_string['k8s.audit.subresource'] IN ('exec', 'attach', 'portforward')\n    OR attributes_string['k8s.audit.resource'] = 'secrets'\n    OR attributes_string['k8s.audit.resource'] LIKE '%rolebindings'\n  )"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-aws-access-denied": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "AWS access denied",
                  "description": "CloudTrail AccessDenied and Unauthorized events across AWS principals."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 100,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT count() AS value\nFROM signoz_logs.distributed_logs_v2\nWHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n  AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n  AND has(mapKeys(attributes_string), 'log.source')\n  AND attributes_string['log.source'] = 'cloud-audit'\n  AND (attributes_string['aws.error_code'] LIKE '%AccessDenied%' OR attributes_string['aws.error_code'] LIKE '%Unauthorized%')"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-admission-blocks": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Admission blocks",
                  "description": "Kyverno enforce-mode rejections over the selected window. Network policy denials join this tile once VPC CNI policy event logs are on."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toUInt64(coalesce(sum(d), 0)) AS value\nFROM (\n  SELECT fingerprint, max(value) - min(value) AS d\n  FROM signoz_metrics.distributed_samples_v4\n  WHERE metric_name = 'kyverno_policy_results_total'\n    AND unix_milli BETWEEN $start_timestamp * 1000 AND $end_timestamp * 1000\n  GROUP BY fingerprint\n) s\nGLOBAL JOIN (\n  SELECT fingerprint\n  FROM signoz_metrics.distributed_time_series_v4\n  WHERE metric_name = 'kyverno_policy_results_total'\n    AND JSONExtractString(labels, 'rule_result') = 'fail'\n    AND JSONExtractString(labels, 'policy_validation_mode') = 'enforce'\n    AND JSONExtractString(labels, 'rule_execution_cause') = 'admission_request'\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY fingerprint\n) ts ON s.fingerprint = ts.fingerprint"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-admin-policies-attached": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Admin policies attached",
                  "description": "Prowler high-severity fails in AWS IAM and security configuration."
                },
                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4f1717",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT coalesce(\n  (\n    SELECT toUInt64(fail_high)\n    FROM (\n      SELECT\n        resources_string['k8s.pod.name'] AS pod,\n        max(timestamp) AS last_ts,\n        countIf(attributes_string['status_code'] = 'FAIL' AND attributes_string['severity'] IN ('Critical', 'High')) AS fail_high\n      FROM signoz_logs.distributed_logs_v2\n      WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n        AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n        AND resource_fingerprint LIKE '%service.namespace=prowler%'\n        AND has(mapKeys(attributes_string), 'status_code')\n        AND resources_string['k8s.namespace.name'] = 'prowler'\n        AND attributes_string['status_code'] != ''\n      GROUP BY pod\n      ORDER BY last_ts DESC\n      LIMIT 1\n    )\n  ),\n  0\n) AS value"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-certificates-expiring": {
              "kind": "Panel",
