                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "critical": "none",
                        "high": "none",
                        "medium": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "critical",
                        "value": 0,
                        "operator": "above",
                        "color": "#7a2020",
                        "format": "background"
                      },
                      {
                        "columnName": "high",
                        "value": 50,
                        "operator": "above",
