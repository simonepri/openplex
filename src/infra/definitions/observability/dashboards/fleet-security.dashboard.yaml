                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH c AS (\n    SELECT ts.metric_name AS metric, JSONExtractString(ts.lbl, 'title') AS title, JSONExtractString(ts.lbl, 'status') AS status, JSONExtractString(ts.lbl, 'k8s.cluster.name') AS k8s_cluster_name, argMax(s.value, s.unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4 s\n    GLOBAL JOIN (\n      SELECT fingerprint, metric_name, any(toJSONString(map('k8s.cluster.name', JSONExtractString(labels, 'k8s.cluster.name'), 'status', JSONExtractString(labels, 'status'), 'title', JSONExtractString(labels, 'title')))) AS lbl\n      FROM signoz_metrics.distributed_time_series_v4_1day\n      WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name IN ('trivy_cluster_compliance')\n        AND unix_milli >= ($end_timestamp - 86400 * 2) * 1000\n        AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      GROUP BY fingerprint, metric_name\n    ) ts ON s.fingerprint = ts.fingerprint\n    WHERE s.metric_name IN ('trivy_cluster_compliance')\n      AND s.unix_milli > ($end_timestamp - 7200) * 1000\n      AND s.unix_milli <= $end_timestamp * 1000\n    GROUP BY s.fingerprint, metric, title, status, k8s_cluster_name\n)\nSELECT title AS framework, k8s_cluster_name AS cluster,\n  toUInt64(sumIf(v, status = 'Fail')) AS failed,\n  if(failed + sumIf(v, status = 'Pass') = 0, NULL, round(100 * sumIf(v, status = 'Pass') / (failed + sumIf(v, status = 'Pass')))) AS pass_pct\nFROM c\nGROUP BY framework, cluster\nORDER BY pass_pct ASC, framework, cluster"
                        }
