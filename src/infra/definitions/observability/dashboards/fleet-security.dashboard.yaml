                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH kyv AS (\n  SELECT JSONExtractString(ts.lbl, 'policy_name') AS policy, JSONExtractString(ts.lbl, 'rule_result') AS result, max(s.value) - min(s.value) AS d\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('policy_name', JSONExtractString(labels, 'policy_name'), 'rule_result', JSONExtractString(labels, 'rule_result')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'kyverno_policy_results_total'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      AND JSONExtractString(labels, 'resource_namespace') IN $namespace\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'kyverno_policy_results_total'\n    AND s.unix_milli >= $start_timestamp * 1000\n    AND s.unix_milli <= $end_timestamp * 1000\n  GROUP BY s.fingerprint, policy, result\n)\nSELECT policy, toUInt64(sumIf(d, result = 'pass')) AS pass, toUInt64(sumIf(d, result = 'fail')) AS fail, toUInt64(sumIf(d, result = 'skip')) AS skip\nFROM kyv\nWHERE policy != ''\nGROUP BY policy\nORDER BY fail DESC, pass DESC\nLIMIT 10"
