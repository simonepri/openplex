                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH m AS (\n    SELECT ts.metric_name AS metric, JSONExtractString(ts.lbl, 'severity') AS severity, JSONExtractString(ts.lbl, 'namespace') AS namespace, argMax(s.value, s.unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4 s\n    GLOBAL JOIN (\n      SELECT fingerprint, metric_name, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'severity', JSONExtractString(labels, 'severity')))) AS lbl\n      FROM signoz_metrics.distributed_time_series_v4_1day\n      WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name IN ('trivy_resource_configaudits', 'trivy_role_rbacassessments', 'trivy_clusterrole_clusterrbacassessments')\n        AND unix_milli >= ($end_timestamp - 86400 * 2) * 1000\n        AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster AND JSONExtractString(labels, 'severity') IN ('Critical', 'High')\n      GROUP BY fingerprint, metric_name\n    ) ts ON s.fingerprint = ts.fingerprint\n    WHERE s.metric_name IN ('trivy_resource_configaudits', 'trivy_role_rbacassessments', 'trivy_clusterrole_clusterrbacassessments')\n      AND s.unix_milli > ($end_timestamp - 7200) * 1000\n      AND s.unix_milli <= $end_timestamp * 1000\n    GROUP BY s.fingerprint, metric, severity, namespace\n)\nSELECT toUInt64(sum(v)) AS value FROM m WHERE namespace IN $namespace OR metric = 'trivy_clusterrole_clusterrbacassessments'"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-compliance-misconfigurations-by-namespace": {
              "kind": "Panel",
              "spec": {
                "display": {
