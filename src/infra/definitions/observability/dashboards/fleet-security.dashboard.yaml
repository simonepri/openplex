            "dash-coverage-telemetry-sources": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Telemetry sources",
                  "description": "Current state of every security telemetry source, measured over the 36 hours before the end of the selected range. STALE: configured but silent longer than allowed (pct_of_allowed_delay > 100). NOT COLLECTED: sources we have not wired up yet."
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "formatting": {
                      "columnUnits": {
                        "volume": "none",
                        "minutes_since_data": "none",
                        "pct_of_allowed_delay": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "pct_of_allowed_delay",
                        "value": 100,
                        "operator": "above",
                        "unit": "",
                        "color": "#7a2020",
                        "format": "background"
                      },
                      {
                        "columnName": "pct_of_allowed_delay",
                        "value": 75,
                        "operator": "above",
                        "unit": "",
                        "color": "#6b4d0c",
                        "format": "background"
                      },
                      {
                        "columnName": "pct_of_allowed_delay",
                        "value": 75,
                        "operator": "below_or_equal",
                        "unit": "",
                        "color": "#1c5a2f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH \n  clusters AS (\n    SELECT DISTINCT resources_string['k8s.cluster.name'] AS cluster\n    FROM signoz_logs.distributed_logs_v2\n    WHERE ts_bucket_start >= $end_timestamp - 172800\n      AND resources_string['k8s.cluster.name'] != ''\n      AND resources_string['k8s.cluster.name'] IN $cluster\n  ),\n  cluster_limits AS (\n    SELECT tupleElement(e, 1) AS source, tupleElement(e, 2) AS limit_min, c.cluster AS cluster\n    FROM (SELECT arrayJoin([\n      ('Falco runtime', 120),\n      ('Envoy access logs', 120),\n      ('kubernetes-audit', 120),\n      ('NetworkPolicy denials', 1000000000),\n      ('OBI flows', 120),\n      ('Trivy CVE metrics', 120),\n      ('Trivy config audit', 120),\n      ('Kyverno', 120),\n      ('cert-manager', 120)\n    ]) AS e) AS src\n    CROSS JOIN clusters AS c\n  ),\n  global_limits AS (\n    SELECT tupleElement(e, 1) AS source, tupleElement(e, 2) AS limit_min, 'aws' AS cluster\n    FROM (SELECT arrayJoin([\n      ('cloud-audit', 120),\n      ('network-flow', 120),\n      ('DNS logs', 120),\n      ('Prowler AWS CIS', 2160)\n    ]) AS e)\n  ),\n  expected AS (\n    SELECT * FROM cluster_limits\n    UNION ALL\n    SELECT * FROM global_limits\n  ),\n  seen AS (\n    SELECT multiIf(resources_string['k8s.container.name'] = 'falco', 'Falco runtime',\n                   resources_string['k8s.container.name'] = 'envoy', 'Envoy access logs', 'Prowler AWS CIS') AS source,\n      if(resources_string['k8s.namespace.name'] = 'prowler', 'aws', resources_string['k8s.cluster.name']) AS cluster, count() AS volume, max(timestamp) AS last_ns\n    FROM signoz_logs.distributed_logs_v2\n    WHERE ts_bucket_start BETWEEN $end_timestamp - 129600 - 1800 AND $end_timestamp\n      AND timestamp BETWEEN ($end_timestamp - 129600) * 1000000000 AND $end_timestamp * 1000000000\n      AND (resources_string['k8s.container.name'] IN ('falco', 'envoy') OR resources_string['k8s.namespace.name'] = 'prowler')\n      AND (resources_string['k8s.namespace.name'] = 'prowler' OR resources_string['k8s.cluster.name'] IN $cluster)\n    GROUP BY source, cluster\n    UNION ALL\n    SELECT multiIf(attributes_string['log.source'] = 'network-policy', 'NetworkPolicy denials',\n                   attributes_string['log.source'] = 'dns-query', 'DNS logs',\n                   attributes_string['log.source']) AS source,\n      if(attributes_string['log.source'] IN ('cloud-audit', 'network-flow', 'dns-query'), 'aws', resources_string['k8s.cluster.name']) AS cluster,\n      count(), max(timestamp)\n    FROM signoz_logs.distributed_logs_v2\n    WHERE ts_bucket_start BETWEEN $end_timestamp - 129600 - 1800 AND $end_timestamp\n      AND timestamp BETWEEN ($end_timestamp - 129600) * 1000000000 AND $end_timestamp * 1000000000\n      AND attributes_string['log.source'] IN ('kubernetes-audit', 'cloud-audit', 'network-flow', 'dns-query', 'network-policy')\n      AND (attributes_string['log.source'] IN ('cloud-audit', 'network-flow', 'dns-query') OR resources_string['k8s.cluster.name'] IN $cluster)\n    GROUP BY 1, 2\n    UNION ALL\n    SELECT multiIf(metric_name = 'trivy_image_vulnerabilities', 'Trivy CVE metrics',\n                   metric_name = 'trivy_resource_configaudits', 'Trivy config audit',\n                   metric_name = 'obi.network.flow.bytes', 'OBI flows',\n                   metric_name LIKE 'kyverno%', 'Kyverno', 'cert-manager'),\n      JSONExtractString(labels, 'k8s.cluster.name'), uniqExact(fingerprint), max(unix_milli) * 1000000\n    FROM signoz_metrics.distributed_time_series_v4\n    WHERE metric_name IN ('trivy_image_vulnerabilities', 'trivy_resource_configaudits', 'obi.network.flow.bytes',\n                          'kyverno_policy_results_total', 'certmanager_certificate_expiration_timestamp_seconds')\n      AND unix_milli BETWEEN ($end_timestamp - 129600) * 1000 AND $end_timestamp * 1000\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n    GROUP BY 1, 2\n  ),\n  rows AS (\n    SELECT e.source AS source, e.cluster AS cluster, coalesce(s.volume, 0) AS volume,\n      if(isNull(s.last_ns) OR s.last_ns = 0, NULL, dateDiff('minute', toDateTime(intDiv(s.last_ns, 1000000000)), toDateTime($end_timestamp))) AS minutes_since_data,\n      if(isNull(s.last_ns) OR s.last_ns = 0 OR e.limit_min > 100000, NULL, round(100 * minutes_since_data / e.limit_min)) AS pct_of_allowed_delay,\n      if(e.source = 'NetworkPolicy denials', 'OK', if(isNull(s.last_ns) OR s.last_ns = 0 OR minutes_since_data > e.limit_min, 'STALE', 'OK')) AS status\n    FROM expected AS e\n    LEFT JOIN seen AS s ON s.source = e.source AND s.cluster = e.cluster\n  )\nSELECT * FROM (\n  SELECT source, cluster, volume, minutes_since_data, pct_of_allowed_delay, status FROM rows\n  UNION ALL\n  SELECT arrayJoin(['GuardDuty', 'GitHub audit log', 'Kubernetes audit (k3s/GKE)', 'Node journald (SSH, sudo)']), '-', 0, NULL, NULL, 'NOT COLLECTED'\n)\nORDER BY multiIf(status = 'STALE', 1, status = 'OK', 2, 3), source, cluster"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-posture-misconfigurations": {
              "kind": "Panel",
              "spec": {
                "display": {
