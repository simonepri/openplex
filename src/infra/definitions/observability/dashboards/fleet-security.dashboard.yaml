            "dash-guardrails-admissions-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Blocked admissions by policy over time",
                  "description": "Kyverno enforce-mode admission rejections grouped by policy name"
                },
                "plugin": {
                  "kind": "signoz/BarChartPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time",
                      "fillSpans": false,
                      "stackedBarChart": true
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "axes": {
                      "softMin": 0,
                      "softMax": null,
                      "isLogScale": false
                    },
                    "legend": {
                      "position": "bottom",
                      "mode": "list",
                      "customColors": {
                        "production-pod-security": "#3987e5",
                        "service-account-token-hardening": "#d95926",
                        "production-image-digest-pinning": "#199e70",
                        "workload-vpa-generation-v2": "#c98500"
                      }
                    },
                    "thresholds": []
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH ts_matches AS (SELECT fingerprint, any(JSONExtractString(labels, 'policy_name')) AS policy FROM signoz_metrics.distributed_time_series_v4 WHERE metric_name = 'kyverno_policy_results_total' AND JSONExtractString(labels, 'rule_result') = 'fail' AND JSONExtractString(labels, 'policy_validation_mode') = 'enforce' AND JSONExtractString(labels, 'rule_execution_cause') = 'admission_request' AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster GROUP BY fingerprint) SELECT toStartOfHour(toDateTime(intDiv(s.unix_milli, 1000))) AS ts, m.policy AS policy, sum(if(s.value >= s.prev_value, s.value - s.prev_value, s.value)) AS value FROM (SELECT fingerprint, unix_milli, value, lagInFrame(value, 1, value) OVER (PARTITION BY fingerprint ORDER BY unix_milli) AS prev_value FROM signoz_metrics.distributed_samples_v4 WHERE metric_name = 'kyverno_policy_results_total' AND unix_milli >= ($start_timestamp - 300) * 1000 AND unix_milli <= $end_timestamp * 1000 AND fingerprint GLOBAL IN (SELECT fingerprint FROM ts_matches)) s GLOBAL JOIN ts_matches m ON s.fingerprint = m.fingerprint WHERE s.unix_milli >= $start_timestamp * 1000 GROUP BY ts, policy HAVING value > 0 ORDER BY ts, policy"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-guardrails-netpol-denials-over-time": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Network policy denials over time",
                  "description": "Network policy dropped packets by destination namespace and port (data source being enabled on VPC CNI)"
                },
                "plugin": {
                  "kind": "signoz/BarChartPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time",
                      "fillSpans": false,
                      "stackedBarChart": true
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "axes": {
                      "softMin": 0,
                      "softMax": null,
                      "isLogScale": false
                    },
                    "legend": {
                      "position": "bottom",
                      "mode": "list",
                      "customColors": {}
                    },
                    "thresholds": []
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toStartOfHour(toDateTime(intDiv(timestamp, 1000000000))) AS ts, concat(if(attributes_string['k8s.namespace.name'] != '', attributes_string['k8s.namespace.name'], attributes_string['dst_ip']), ':', attributes_string['dst_port']) AS destination, count() AS value FROM signoz_logs.distributed_logs_v2 WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano AND has(mapValues(attributes_string), 'network-policy') AND attributes_string['log.source'] = 'network-policy' AND resources_string['k8s.cluster.name'] IN $cluster GROUP BY ts, destination ORDER BY ts, destination"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-guardrails-blocked-resources": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "What was blocked, and where",
                  "description": "Kyverno admission rejections and audit violations by cluster, policy, rule, namespace, and resource kind"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "count": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "count",
                        "operator": "above",
                        "value": 50,
                        "unit": "",
                        "color": "#6b4d0c",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH ts_matches AS (SELECT fingerprint, any(toJSONString(map('k8s.cluster.name', JSONExtractString(labels, 'k8s.cluster.name'), 'policy_name', JSONExtractString(labels, 'policy_name'), 'policy_validation_mode', JSONExtractString(labels, 'policy_validation_mode'), 'resource_kind', JSONExtractString(labels, 'resource_kind'), 'resource_namespace', JSONExtractString(labels, 'resource_namespace'), 'rule_name', JSONExtractString(labels, 'rule_name')))) AS lb FROM signoz_metrics.distributed_time_series_v4 WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'kyverno_policy_results_total' AND JSONExtractString(labels, 'rule_result') = 'fail' AND JSONExtractString(labels, 'rule_execution_cause') = 'admission_request' AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster GROUP BY fingerprint) SELECT JSONExtractString(m.lb, 'k8s.cluster.name') AS cluster, JSONExtractString(m.lb, 'policy_name') AS policy, JSONExtractString(m.lb, 'rule_name') AS rule, JSONExtractString(m.lb, 'resource_namespace') AS namespace, JSONExtractString(m.lb, 'resource_kind') AS kind, if(JSONExtractString(m.lb, 'policy_validation_mode') = 'enforce', 'blocked', 'audit only') AS outcome, sum(s.delta) AS count FROM (SELECT fingerprint, if(value >= prev_value, value - prev_value, value) AS delta FROM (SELECT fingerprint, unix_milli, value, lagInFrame(value, 1, value) OVER (PARTITION BY fingerprint ORDER BY unix_milli) AS prev_value FROM signoz_metrics.distributed_samples_v4 WHERE metric_name = 'kyverno_policy_results_total' AND unix_milli >= ($start_timestamp - 300) * 1000 AND unix_milli <= $end_timestamp * 1000 AND fingerprint GLOBAL IN (SELECT fingerprint FROM ts_matches)) WHERE unix_milli >= $start_timestamp * 1000) s GLOBAL JOIN ts_matches m ON s.fingerprint = m.fingerprint GROUP BY cluster, policy, rule, namespace, kind, outcome HAVING count > 0 ORDER BY count DESC LIMIT 50"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-guardrails-netpol-denials-table": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Network policy denials",
                  "description": "Network policy drop events by source, destination, port, and protocol"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "count": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "count",
                        "operator": "above",
                        "value": 0,
                        "unit": "",
                        "color": "#7a2020",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH denials AS (\n  SELECT\n    id,\n    attributes_string['src_ip'] AS src_ip,\n    attributes_string['dst_ip'] AS dst_ip,\n    attributes_string['dst_port'] AS port,\n    attributes_string['protocol'] AS protocol,\n    timestamp,\n    resources_string['k8s.cluster.name'] AS cluster\n  FROM signoz_logs.distributed_logs_v2\n  WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n    AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n    AND has(mapValues(attributes_string), 'network-policy')\n    AND attributes_string['log.source'] = 'network-policy'\n    AND resources_string['k8s.cluster.name'] IN $cluster\n),\ndenial_ips AS (\n  SELECT DISTINCT arrayJoin([src_ip, dst_ip]) AS ip\n  FROM denials\n  WHERE ip != ''\n),\npod_lookup AS (\n  SELECT\n    JSONExtractString(ts.lbl, 'cluster') AS cluster,\n    JSONExtractString(ts.lbl, 'pod_ip') AS ip,\n    multiIf(\n      JSONExtractString(ts.lbl, 'host_network') = 'true', concat('node/', JSONExtractString(ts.lbl, 'node')),\n      JSONExtractString(ts.lbl, 'created_by_name') != '' AND JSONExtractString(ts.lbl, 'created_by_name') != '<none>', concat(JSONExtractString(ts.lbl, 'namespace'), '/', if(JSONExtractString(ts.lbl, 'created_by_kind') = 'ReplicaSet', replaceRegexpOne(JSONExtractString(ts.lbl, 'created_by_name'), '-[a-z0-9]{6,10}$', ''), JSONExtractString(ts.lbl, 'created_by_name'))),\n      concat(JSONExtractString(ts.lbl, 'namespace'), '/', JSONExtractString(ts.lbl, 'pod'))\n    ) AS workload,\n    toUInt64(min(s.unix_milli)) * 1000000 AS min_ts,\n    toUInt64(max(s.unix_milli)) * 1000000 AS max_ts\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map(\n      'cluster', JSONExtractString(labels, 'k8s.cluster.name'),\n      'pod_ip', JSONExtractString(labels, 'pod_ip'),\n      'namespace', JSONExtractString(labels, 'namespace'),\n      'pod', JSONExtractString(labels, 'pod'),\n      'created_by_kind', JSONExtractString(labels, 'created_by_kind'),\n      'created_by_name', JSONExtractString(labels, 'created_by_name'),\n      'node', JSONExtractString(labels, 'node'),\n      'host_network', JSONExtractString(labels, 'host_network')\n    ))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp - 300, $end_timestamp - 7200) - 172800) * 1000\n      AND metric_name = 'kube_pod_info'\n      AND JSONExtractString(labels, 'pod_ip') GLOBAL IN (SELECT ip FROM denial_ips)\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'kube_pod_info'\n    AND s.unix_milli >= ($start_timestamp - 300) * 1000\n    AND s.unix_milli <= ($end_timestamp + 300) * 1000\n  GROUP BY cluster, ip, workload\n),\nservice_lookup AS (\n  SELECT\n    JSONExtractString(labels, 'k8s.cluster.name') AS cluster,\n    JSONExtractString(labels, 'cluster_ip') AS ip,\n    concat(JSONExtractString(labels, 'namespace'), '/', JSONExtractString(labels, 'service')) AS workload,\n    toUInt64(0) AS min_ts,\n    toUInt64(18446744073709551615) AS max_ts\n  FROM signoz_metrics.distributed_time_series_v4_1day\n  WHERE unix_milli >= (least($start_timestamp - 300, $end_timestamp - 7200) - 172800) * 1000\n    AND metric_name = 'kube_service_info'\n    AND JSONExtractString(labels, 'cluster_ip') GLOBAL IN (SELECT ip FROM denial_ips)\n  GROUP BY cluster, ip, workload\n),\nworkloads AS (\n  SELECT cluster, ip, workload, min_ts, max_ts FROM pod_lookup\n  UNION ALL\n  SELECT cluster, ip, workload, min_ts, max_ts FROM service_lookup\n),\nresolved AS (\n  SELECT\n    d.id,\n    d.port,\n    d.protocol,\n    argMax(if(src_w.workload = '', concat(d.src_ip, ' (unresolved)'), concat(src_w.cluster, ': ', src_w.workload)), src_w.max_ts) AS source,\n    argMax(if(dst_w.workload = '', concat(d.dst_ip, ' (unresolved)'), concat(dst_w.cluster, ': ', dst_w.workload)), dst_w.max_ts) AS destination\n  FROM denials d\n  LEFT JOIN workloads src_w ON d.src_ip = src_w.ip AND d.timestamp >= src_w.min_ts AND d.timestamp <= src_w.max_ts\n  LEFT JOIN workloads dst_w ON d.dst_ip = dst_w.ip AND d.timestamp >= dst_w.min_ts AND d.timestamp <= dst_w.max_ts\n  GROUP BY d.id, d.port, d.protocol\n)\nSELECT\n  source,\n  destination,\n  port,\n  protocol,\n  count() AS count\nFROM resolved\nGROUP BY source, destination, port, protocol\nORDER BY count DESC\nLIMIT 50"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-vulns-header": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "4 \u00b7 Vulnerabilities: what is exploitable?",
                  "description": "Section introduction and normal operational baseline"
                },
                "plugin": {
                  "kind": "signoz/TextPanel",
                  "spec": {
                    "mode": "markdown",
                    "text": "CVEs and secrets in running images. **Normal:** critical count trends down; no image has both runtime alerts and critical CVEs.",
                    "presentation": {
                      "textAlign": "left",
