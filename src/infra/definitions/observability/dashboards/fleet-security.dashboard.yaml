                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT formatDateTime(max(toDateTime(timestamp / 1000000000)), '%m-%d %H:%i') AS t, replaceRegexpOne(attributes_string['k8s.audit.user'], '.*assumed-role/[^/]+/', '') AS user, concat(attributes_string['k8s.audit.resource'], if(attributes_string['k8s.audit.subresource'] != '', '/' || attributes_string['k8s.audit.subresource'], '')) AS what, attributes_string['k8s.audit.namespace'] AS ns, attributes_string['k8s.audit.name'] AS name, count() AS n FROM signoz_logs.distributed_logs_v2 WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano AND attributes_string['log.source'] = 'kubernetes-audit' AND resources_string['k8s.cluster.name'] IN $cluster AND attributes_string['k8s.audit.user'] LIKE '%assumed-role/AWSReservedSSO%' AND (attributes_string['k8s.audit.subresource'] IN ('exec', 'attach', 'portforward') OR attributes_string['k8s.audit.resource'] = 'secrets' OR attributes_string['k8s.audit.resource'] LIKE '%rolebindings') GROUP BY user, what, ns, name ORDER BY max(timestamp) DESC LIMIT 10"
                        }
