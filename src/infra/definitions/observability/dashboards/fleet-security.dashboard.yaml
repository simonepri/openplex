                "plugin": {
                  "kind": "signoz/NumberPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "value": 0,
                        "operator": "above",
                        "unit": "",
                        "color": "#4a3608",
                        "format": "background"
                      },
                      {
                        "value": 0,
                        "operator": "above_or_equal",
                        "unit": "",
                        "color": "#123b1f",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "SELECT toUInt64(countIf(exp_ts > 0 AND exp_ts < $end_timestamp + 14 * 86400)) AS value\nFROM (\n  SELECT fingerprint, argMax(value, unix_milli) AS exp_ts\n  FROM signoz_metrics.distributed_samples_v4\n  WHERE metric_name = 'certmanager_certificate_expiration_timestamp_seconds'\n    AND unix_milli BETWEEN ($end_timestamp - 7200) * 1000 AND $end_timestamp * 1000\n  GROUP BY fingerprint\n) s\nGLOBAL JOIN (\n  SELECT fingerprint\n  FROM signoz_metrics.distributed_time_series_v4\n  WHERE metric_name = 'certmanager_certificate_expiration_timestamp_seconds'\n    AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n  GROUP BY fingerprint\n) ts ON s.fingerprint = ts.fingerprint"
                        }
                      }
                    }
                  }
                ]
              }
            },
