            "dash-threats-latest-runtime-alerts": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Latest runtime alerts",
                  "description": "Falco detections at the selected priorities, newest first. Open a row for the full event, including process, container and pod."
                },
                "plugin": {
                  "kind": "signoz/ListPanel",
                  "spec": {
                    "selectFields": [
                      {
                        "name": "timestamp",
                        "signal": "logs"
                      },
                      {
                        "name": "priority",
                        "signal": "logs",
                        "fieldContext": "attribute",
                        "fieldDataType": "string"
                      },
                      {
                        "name": "rule",
                        "signal": "logs",
                        "fieldContext": "attribute",
                        "fieldDataType": "string"
                      },
                      {
                        "name": "k8s.cluster.name",
                        "signal": "logs",
                        "fieldContext": "resource",
                        "fieldDataType": "string"
                      },
                      {
                        "name": "output",
                        "signal": "logs",
                        "fieldContext": "attribute",
                        "fieldDataType": "string"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "raw",
                    "spec": {
                      "plugin": {
                        "kind": "signoz/BuilderQuery",
                        "spec": {
                          "name": "A",
                          "signal": "logs",
                          "aggregations": [
                            {
                              "expression": "count()"
                            }
                          ],
                          "filter": {
