                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH trim(splitByChar(',', attributes_string['x_forwarded_for'])[1]) AS client_ip, (client_ip != '' AND isIPv4String(client_ip) AND NOT isIPAddressInRange(client_ip, '10.0.0.0/8') AND NOT isIPAddressInRange(client_ip, '172.16.0.0/12') AND NOT isIPAddressInRange(client_ip, '192.168.0.0/16') AND NOT isIPAddressInRange(client_ip, '127.0.0.0/8') AND NOT isIPAddressInRange(client_ip, '100.64.0.0/10')) AS is_public SELECT attributes_string['authority'] AS host, uniqExactIf(client_ip, is_public) AS public_clients, count() AS requests, round(100 * countIf(attributes_number['response_code'] IN (401, 403)) / count(), 1) AS pct_denied FROM signoz_logs.distributed_logs_v2 WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano AND resources_string['k8s.container.name'] = 'envoy' AND resources_string['k8s.cluster.name'] IN $cluster GROUP BY host HAVING public_clients > 0 ORDER BY public_clients DESC LIMIT 10"
                        }
                      }
                    }
                  }
                ]
              }
