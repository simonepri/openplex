                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH trivy_latest AS (\n  SELECT JSONExtractString(ts.lbl, 'image_repository') AS image, JSONExtractString(ts.lbl, 'severity') AS severity, JSONExtractString(ts.lbl, 'resource_name') AS resource_name, JSONExtractString(ts.lbl, 'namespace') AS namespace, argMax(s.value, s.unix_milli) AS v\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('image_repository', JSONExtractString(labels, 'image_repository'), 'namespace', JSONExtractString(labels, 'namespace'), 'resource_name', JSONExtractString(labels, 'resource_name'), 'severity', JSONExtractString(labels, 'severity')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'trivy_image_vulnerabilities'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      AND JSONExtractString(labels, 'namespace') IN $namespace\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'trivy_image_vulnerabilities'\n    AND s.unix_milli > ($end_timestamp - 7200) * 1000\n    AND s.unix_milli <= $end_timestamp * 1000\n  GROUP BY s.fingerprint, image, severity, resource_name, namespace\n)\nSELECT image, toUInt64(maxIf(v, severity = 'Critical')) AS crit, toUInt64(maxIf(v, severity = 'High')) AS high, uniqExact(resource_name) AS workloads, substring(arrayStringConcat(arraySort(groupUniqArray(namespace)), ', '), 1, 40) AS ns\nFROM trivy_latest\nWHERE image != ''\nGROUP BY image\nORDER BY crit DESC, high DESC\nLIMIT 10"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-vulns-runtime-alerts-on-vulnerable-images": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "\u2605 Runtime alerts on vulnerable images",
                  "description": "Joins Falco's container image with Trivy results"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "alerts": "none",
                        "critical_cves": "none",
                        "high_cves": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "critical_cves",
                        "value": 10,
                        "operator": "above",
                        "color": "#7a2020",
                        "format": "background"
                      },
                      {
                        "columnName": "critical_cves",
                        "value": 0,
                        "operator": "above",
                        "color": "#7a3d22",
                        "format": "background"
                      },
                      {
                        "columnName": "high_cves",
                        "value": 0,
                        "operator": "above",
                        "color": "#6b4d0c",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH vulns AS (\n  SELECT replaceRegexpOne(replaceRegexpOne(image, '^(?:[^/]+\\\\.[^/]+/|docker/)+', ''), '^library/', '') AS img, toUInt64(maxIf(v, severity = 'Critical')) AS crit, toUInt64(maxIf(v, severity = 'High')) AS high\n  FROM (\n    SELECT JSONExtractString(ts.lbl, 'image_repository') AS image, JSONExtractString(ts.lbl, 'severity') AS severity, argMax(s.value, s.unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4 s\n    GLOBAL JOIN (\n      SELECT fingerprint, any(toJSONString(map('image_repository', JSONExtractString(labels, 'image_repository'), 'severity', JSONExtractString(labels, 'severity')))) AS lbl\n      FROM signoz_metrics.distributed_time_series_v4_1day\n      WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'trivy_image_vulnerabilities'\n        AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      GROUP BY fingerprint\n    ) ts ON s.fingerprint = ts.fingerprint\n    WHERE s.metric_name = 'trivy_image_vulnerabilities'\n      AND s.unix_milli > ($end_timestamp - 7200) * 1000\n      AND s.unix_milli <= $end_timestamp * 1000\n      GROUP BY s.fingerprint, image, severity\n  )\n  GROUP BY img\n  HAVING crit + high > 0\n)\nSELECT f.img AS image, f.rule AS rule, f.n AS alerts, vulns.crit AS critical_cves, vulns.high AS high_cves\nFROM (\n  SELECT replaceRegexpOne(replaceRegexpOne(coalesce(nullIf(JSONExtractString(attributes_string['output_fields'], 'container.image.repository'), ''), JSONExtractString(attributes_string['output_fields'], 'container.image')), '^(?:[^/]+\\\\.[^/]+/|docker/)+', ''), '^library/', '') AS img, attributes_string['rule'] AS rule, count() AS n\n  FROM signoz_logs.distributed_logs_v2\n  WHERE ts_bucket_start BETWEEN $start_timestamp - 1800 AND $end_timestamp\n    AND timestamp BETWEEN $start_timestamp_nano AND $end_timestamp_nano\n    AND has(mapKeys(attributes_string), 'priority')\n    AND has(mapKeys(attributes_string), 'output_fields')\n    AND resources_string['k8s.container.name'] = 'falco'\n    AND resources_string['k8s.cluster.name'] IN $cluster\n    AND attributes_string['priority'] IN $priority\n  GROUP BY img, rule\n  HAVING img != ''\n) f\nGLOBAL INNER JOIN vulns ON vulns.img = f.img\nORDER BY critical_cves DESC, alerts DESC\nLIMIT 8"
                        }
                      }
                    }
                  }
                ]
              }
            },
