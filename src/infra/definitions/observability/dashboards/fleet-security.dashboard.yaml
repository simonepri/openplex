                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH flows AS (\n  SELECT toStartOfHour(toDateTime(intDiv(s.unix_milli, 1000))) AS ts, JSONExtractString(ts.lbl, 'src_ns') AS namespace, greatest(0, max(s.value) - min(s.value)) AS bytes\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('src_ns', JSONExtractString(labels, 'k8s.src.namespace'), 'dst_cidr', JSONExtractString(labels, 'dst.cidr')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'obi.network.flow.bytes'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      AND JSONExtractString(labels, 'k8s.src.namespace') IN $namespace\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'obi.network.flow.bytes'\n    AND s.unix_milli >= $start_timestamp * 1000\n    AND s.unix_milli <= $end_timestamp * 1000\n    AND JSONExtractString(ts.lbl, 'dst_cidr') != '' AND JSONExtractString(ts.lbl, 'dst_cidr') NOT LIKE 'vpc-%'\n    AND JSONExtractString(ts.lbl, 'dst_cidr') NOT LIKE 'services-%'\n  GROUP BY ts, s.fingerprint, namespace\n)\nSELECT ts, namespace, toUInt64(sum(bytes)) AS value\nFROM flows\nWHERE namespace != ''\nGROUP BY ts, namespace\nORDER BY ts, namespace"
