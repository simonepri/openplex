                        "format": "background"
                      },
                      {
                        "columnName": "high",
                        "value": 0,
                        "operator": "above",
                        "color": "#6b4d0c",
                        "format": "background"
                      }
                    ]
                  }
                },
                "queries": [
                  {
                    "kind": "scalar",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "query": "WITH m AS (\n    SELECT ts.metric_name AS metric, JSONExtractString(ts.lbl, 'severity') AS severity, JSONExtractString(ts.lbl, 'namespace') AS namespace, JSONExtractString(ts.lbl, 'resource_kind') AS resource_kind, JSONExtractString(ts.lbl, 'resource_name') AS resource_name, argMax(s.value, s.unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4 s\n    GLOBAL JOIN (\n      SELECT fingerprint, metric_name, any(toJSONString(map('namespace', JSONExtractString(labels, 'namespace'), 'resource_kind', JSONExtractString(labels, 'resource_kind'), 'resource_name', JSONExtractString(labels, 'resource_name'), 'severity', JSONExtractString(labels, 'severity')))) AS lbl\n      FROM signoz_metrics.distributed_time_series_v4_1day\n      WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name IN ('trivy_resource_configaudits', 'trivy_role_rbacassessments')\n        AND unix_milli >= ($end_timestamp - 86400 * 2) * 1000\n        AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      GROUP BY fingerprint, metric_name\n    ) ts ON s.fingerprint = ts.fingerprint\n    WHERE s.metric_name IN ('trivy_resource_configaudits', 'trivy_role_rbacassessments')\n      AND s.unix_milli > ($end_timestamp - 7200) * 1000\n      AND s.unix_milli <= $end_timestamp * 1000\n    GROUP BY s.fingerprint, metric, severity, namespace, resource_kind, resource_name\n)\nSELECT namespace,\n  toUInt64(sumIf(v, severity = 'Critical')) AS critical,\n  toUInt64(sumIf(v, severity = 'High')) AS high,\n  toUInt64(sumIf(v, severity = 'Medium')) AS medium\nFROM m\nWHERE namespace IN $namespace\nGROUP BY namespace\nHAVING critical + high + medium > 0\nORDER BY critical DESC, high DESC, medium DESC\nLIMIT 15"
                        }
                      }
                    }
                  }
                ]
              }
            },
