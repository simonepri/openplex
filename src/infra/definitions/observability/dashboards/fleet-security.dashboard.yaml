            "dash-vulns-cves-by-day": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "CVEs in running images, by day",
                  "description": "Deduplicated by image digest"
                },
                "plugin": {
                  "kind": "signoz/BarChartPanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time",
                      "stackedBarChart": true
                    },
                    "formatting": {
                      "unit": "none",
                      "decimalPrecision": "0"
                    },
                    "axes": {
                      "isLogScale": false
                    },
                    "legend": {
                      "position": "bottom",
                      "mode": "list",
                      "customColors": {
                        "Critical": "#d03b3b",
                        "High": "#ec835a",
                        "Medium": "#fab219",
                        "Low": "#3987e5",
                        "Unknown": "#5c5b57"
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "time_series",
                    "spec": {
                      "name": "A",
                      "plugin": {
                        "kind": "signoz/ClickHouseSQL",
                        "spec": {
                          "name": "A",
                          "legend": "{{severity}}",
                          "query": "SELECT toDateTime(toStartOfDay(toDateTime(day))) AS ts, sev AS severity, sum(v) AS value\nFROM (\n  SELECT s.day AS day, JSONExtractString(ts.lbl, 'severity') AS sev, coalesce(nullIf(JSONExtractString(ts.lbl, 'image_digest'), ''), JSONExtractString(ts.lbl, 'image_repository')) AS img, max(s.v) AS v\n  FROM (\n    SELECT fingerprint, toDate(toDateTime(unix_milli / 1000)) AS day, argMax(value, unix_milli) AS v\n    FROM signoz_metrics.distributed_samples_v4\n    WHERE metric_name = 'trivy_image_vulnerabilities'\n      AND unix_milli >= $start_timestamp * 1000\n      AND unix_milli <= $end_timestamp * 1000\n    GROUP BY fingerprint, day\n  ) s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('image_digest', JSONExtractString(labels, 'image_digest'), 'image_repository', JSONExtractString(labels, 'image_repository'), 'severity', JSONExtractString(labels, 'severity')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'trivy_image_vulnerabilities'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      AND JSONExtractString(labels, 'namespace') IN $namespace\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  GROUP BY day, sev, img\n)\nGROUP BY ts, severity\nORDER BY ts, severity"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "dash-vulns-most-vulnerable-images": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Most vulnerable images",
                  "description": "Images currently running across the fleet sorted by critical and high vulnerability counts"
                },
                "plugin": {
                  "kind": "signoz/TablePanel",
                  "spec": {
                    "visualization": {
                      "timePreference": "global_time"
                    },
                    "formatting": {
                      "columnUnits": {
                        "crit": "none",
                        "high": "none",
                        "workloads": "none"
                      },
                      "decimalPrecision": "0"
                    },
                    "thresholds": [
                      {
                        "columnName": "crit",
                        "value": 10,
                        "operator": "above",
                        "color": "#7a2020",
                        "format": "background"
                      },
                      {
                        "columnName": "crit",
                        "value": 0,
                        "operator": "above",
                        "color": "#7a3d22",
                        "format": "background"
                      },
                      {
                        "columnName": "high",
                        "value": 50,
                        "operator": "above",
                        "color": "#7a3d22",
                        "format": "background"
                      },
                      {
                        "columnName": "high",
                        "value": 0,
