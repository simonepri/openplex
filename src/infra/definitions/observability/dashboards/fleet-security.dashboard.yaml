                        "spec": {
                          "name": "A",
                          "query": "WITH flows AS (\n  SELECT JSONExtractString(ts.lbl, 'src_ns') AS src_namespace, JSONExtractString(ts.lbl, 'src_owner') AS src_owner, if(JSONExtractString(ts.lbl, 'dst_cidr') = '', 'unlabelled', JSONExtractString(ts.lbl, 'dst_cidr')) AS destination_range, greatest(0, max(s.value) - min(s.value)) AS bytes\n  FROM signoz_metrics.distributed_samples_v4 s\n  GLOBAL JOIN (\n    SELECT fingerprint, any(toJSONString(map('src_ns', JSONExtractString(labels, 'k8s.src.namespace'), 'src_owner', JSONExtractString(labels, 'k8s.src.owner.name'), 'dst_cidr', JSONExtractString(labels, 'dst.cidr')))) AS lbl\n    FROM signoz_metrics.distributed_time_series_v4_1day\n    WHERE unix_milli >= (least($start_timestamp, $end_timestamp - 7200) - 172800) * 1000 AND metric_name = 'obi.network.flow.bytes'\n      AND JSONExtractString(labels, 'k8s.cluster.name') IN $cluster\n      AND JSONExtractString(labels, 'k8s.src.namespace') IN $namespace\n    GROUP BY fingerprint\n  ) ts ON s.fingerprint = ts.fingerprint\n  WHERE s.metric_name = 'obi.network.flow.bytes'\n    AND s.unix_milli >= $start_timestamp * 1000\n    AND s.unix_milli <= $end_timestamp * 1000\n  GROUP BY s.fingerprint, src_namespace, src_owner, destination_range\n)\nSELECT src_namespace, src_owner, destination_range, toUInt64(sum(bytes)) AS bytes\nFROM flows\nWHERE destination_range != 'unlabelled' AND destination_range NOT LIKE 'vpc-%' AND destination_range NOT LIKE 'services-%'\nGROUP BY src_namespace, src_owner, destination_range\nORDER BY if(destination_range = 'instance-metadata', 0, 1) ASC, bytes DESC\nLIMIT 50"
                        }
                      }
                    }
                  }
                ]
              }
            }
