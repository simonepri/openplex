# Defines the slow and errored traces saved view in SigNoz.

apiVersion: resources.signoz.io/v1alpha1
kind: SavedView
metadata:
  name: slow-traces
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: saved-view
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    jsonSpec: |-
      {
        "name": "slow-traces",
        "source": "traces",
        "schemaVersion": "v2",
        "spec": {
          "displayName": "Slow & Errored Traces",
          "panelType": "list",
          "requestType": "trace",
          "queries": [
            {
              "type": "builder_query",
              "spec": {
                "name": "A",
                "signal": "traces",
                "filter": {
                  "expression": "hasError = true"
                }
              }
            }
          ]
        }
      }
