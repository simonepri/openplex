# Defines the Kyverno admission denial spike alert reconciled into SigNoz. Alerts when an elevated rate of workload submissions are rejected by admission policies.

apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: kyverno-admission-denial
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: alert-rule
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    spec:
      alert: Kyverno admission denial spike detected
      alertType: METRIC_BASED_ALERT
      labels: {severity: warning}
      condition:
        compositeQuery:
          panelType: graph
          queries:
            - type: promql
              spec:
                name: A
                query: >-
                  sum by (policy_name, rule_name) (increase(kyverno_policy_results_total{rule_result="fail",policy_validation_mode="enforce"}[5m]))
                disabled: false
                step: 60
                legend: "{{policy_name}} / {{rule_name}}"
          queryType: promql
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
            - name: warning
              matchType: at_least_once
              op: above
              target: 5
      description: Kyverno admission controller rejected multiple workload submissions within five minutes; verify whether untrusted images or privileged manifests are being submitted.
      evaluation:
        kind: rolling
        spec: {evalWindow: 5m, frequency: 1m}
      notificationSettings:
        usePolicy: true
        renotify: {alertStates: [firing], enabled: true, interval: 2h}
      ruleType: threshold_rule
      schemaVersion: v2alpha1
