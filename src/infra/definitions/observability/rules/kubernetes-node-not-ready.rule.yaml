# Defines the Kubernetes node readiness alert reconciled into SigNoz.

apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: kubernetes-node-not-ready
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: alert-rule
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    spec:
      alert: Kubernetes node not ready
      alertType: METRIC_BASED_ALERT
      labels: {severity: critical}
      condition:
        compositeQuery:
          panelType: graph
          queries:
            - type: builder_query
              spec:
                name: A
                aggregations:
                  - metricName: k8s.node.condition
                    spaceAggregation: max
                    timeAggregation: max
                filter:
                  expression: "condition = 'Ready'"
                groupBy:
                  - name: k8s.cluster.name
                    fieldContext: resource
                    fieldDataType: string
                  - name: k8s.node.name
                    fieldContext: resource
                    fieldDataType: string
                signal: metrics
                stepInterval: 1m
          queryType: builder
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
            - name: critical
              matchType: all_the_times
              op: below
              target: 1
      description: Kubelet reported Ready=false or Ready=unknown continuously for five minutes; inspect the named node before rescheduling work onto it.
      evaluation:
        kind: rolling
        spec: {evalWindow: 5m, frequency: 1m}
      notificationSettings:
        usePolicy: true
        renotify: {alertStates: [firing], enabled: true, interval: 4h}
      ruleType: threshold_rule
      schemaVersion: v2alpha1
