# Alerts when a discovered CloudNativePG database has no successful Barman base backup within the daily cadence plus a two-hour completion margin.

apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: cnpg-backup-stale
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: alert-rule
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    spec:
      alert: CNPG backup is stale
      alertType: METRIC_BASED_ALERT
      labels: {severity: critical}
      condition:
        compositeQuery:
          panelType: graph
          queries:
            - type: promql
              spec:
                name: A
                query: >-
                  time() - (max by (cluster, namespace, database) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) or on (cluster, namespace, database) (0 * max by (cluster, namespace, database) (cnpg_collector_up)))
                disabled: false
                step: 60
                legend: "{{cluster}} / {{namespace}} / {{database}}"
          queryType: promql
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
            - name: critical
              matchType: all_the_times
              op: above
              target: 93600
      description: A CNPG database has no successful Barman base backup within 26 hours.
      evaluation:
        kind: rolling
        spec: {evalWindow: 15m, frequency: 5m}
      notificationSettings:
        usePolicy: true
        renotify: {alertStates: [firing], enabled: true, interval: 4h}
      ruleType: threshold_rule
      schemaVersion: v2alpha1
