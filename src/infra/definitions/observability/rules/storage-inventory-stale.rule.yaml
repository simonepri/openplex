# Alerts when the daily storage inventory rollup has not updated within 72 hours.

apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: storage-inventory-stale
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/component: alert-rule
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: signoz
spec:
  providerConfigRef:
    name: signoz
  reclaimPolicy: Delete
  objectTemplate:
    spec:
      alert: Storage inventory is stale
      alertType: METRIC_BASED_ALERT
      labels: {severity: critical}
      condition:
        compositeQuery:
          panelType: graph
          queries:
            - type: clickhouse_sql
              spec:
                name: A
                query: >-
                  SELECT toUnixTimestamp(now()) AS timestamp, toFloat64(dateDiff('second', toDateTime(max(day)), now())) AS value, cell, storage_class AS bucket FROM storage_stats.storage_prefix_daily FINAL GROUP BY cell, bucket HAVING toYear(max(day)) > 1970
                disabled: false
                legend: "{{cell}} / {{bucket}}"
          queryType: clickhouse_sql
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
            - name: critical
              matchType: all_the_times
              op: above
              target: 259200
      description: The daily storage inventory rollup has not completed within 72 hours.
      evaluation:
        kind: rolling
        spec: {evalWindow: 15m, frequency: 5m}
      notificationSettings:
        usePolicy: true
        renotify: {alertStates: [firing], enabled: true, interval: 4h}
      ruleType: threshold_rule
      schemaVersion: v2alpha1
