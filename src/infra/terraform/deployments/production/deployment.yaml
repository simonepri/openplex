# Self-contained production deployment manifest declaring installation coordinates and cluster definitions.

installation:
  name: openplex
  display_name: OpenPlex
  public_domain: openplex.org
  intranet_domain: corp.openplex.org
  hosted_domains: ["openplex.org"]
  operator_group_email: operators@openplex.org
  operator_emails: ["operators@openplex.org"]
  git:
    url: git@github.com:simonepri/openplex.git

clusters:
  ctrl-aws-usw2:
    account_scope: aws-main
    cloud: aws
    labels:
      cloud: aws
      profile: production
      provider: aws
      role: ctrl
    name: ctrl-aws-usw2
    network:
      index: 0
      pod_cidr: 10.0.0.0/16
      pod_cidrs_v6: []
      service_cidr: 172.16.0.0/20
      service_cidrs_v6: []
    provider: aws
    region: usw2
    role: ctrl
    vpc_cidr: 10.0.0.0/16
    availability_zones: ["us-west-2a", "us-west-2b", "us-west-2c"]
    tier_subnets:
      private: ["10.0.1.0/24", "10.0.2.0/24", "10.0.3.0/24"]
      public: ["10.0.10.0/24", "10.0.11.0/24", "10.0.12.0/24"]
      pod: ["10.0.64.0/18", "10.0.128.0/18", "10.0.192.0/18"]
    core:
      enable_argo_workflows: false
      enable_cloud_operator: true
      enable_external_dns: true
      enable_karpenter: true
      enable_keda: true
      enable_kueue: false
      enable_local_storage_inventory_producer: false
      enable_metrics_server: true
      enable_node_problem_detector: true
      enable_parca_agent: true
      enable_velero: true
      enable_vpa: true
    shared:
      enable_atlantis: true
      enable_cert_manager: true
      enable_cert_manager_issuers: true
      enable_coder: true
      enable_coder_snapshot_portal: true
      enable_coder_workspace_secret_store: true
      enable_coredns: true
      enable_dragonfly: true
      enable_envoy_gateway: true
      enable_falco: true
      enable_headlamp: true
      enable_homer: true
      enable_kargo: true
      enable_kuberhealthy: true
      enable_kubescape_operator: true
      enable_kyverno: true
      enable_network_isolation: true
      enable_oauth2_proxy: true
      enable_opencost: true
      enable_parca: true
      enable_routing_registry: true
      enable_signoz: true
      enable_storage_classes: true
      enable_tailscale_operator: true
      enable_trivy_operator: true
      enable_trivy_server: true
    tenants:
      openplex:
        enable_buildbuddy: false
        enable_buildbuddy_cache: false
        enable_clickhouse: false
        enable_cloudnative_pg: false
        enable_valkey: false
        enable_victoriametrics: false
