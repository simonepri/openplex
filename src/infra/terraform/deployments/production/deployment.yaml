# Self-contained production deployment manifest declaring installation coordinates and cluster definitions.

installation:
  name: openplex
  display_name: Openplex
  # nosemgrep: repository.lint.forbidden-domain-patterns
  public_domain: local.internal
  intranet_domain: corp.local.internal
  git:
    url: https://github.com/simonepri/openplex.git

clusters:
  ctrl-aws-usw2:
    account_scope: aws-main
    cloud: aws
    labels:
      cloud: aws
      profile: production
      provider: aws
      role: ctrl
    name: ctrl-aws-usw2
    network:
      index: 0
      pod_cidr: 10.0.0.0/16
      pod_cidrs_v6: []
      service_cidr: 172.16.0.0/20
      service_cidrs_v6: []
    provider: aws
    region: usw2
    role: ctrl
    vpc_cidr: 10.0.0.0/16
    availability_zones: ["us-west-2a", "us-west-2b", "us-west-2c"]
    tier_subnets:
      private: ["10.0.1.0/24", "10.0.2.0/24", "10.0.3.0/24"]
      public: ["10.0.10.0/24", "10.0.11.0/24", "10.0.12.0/24"]
      pod: ["10.0.64.0/18", "10.0.128.0/18", "10.0.192.0/18"]
  cell-aws-usw2:
    account_scope: aws-main
    cloud: aws
    compute:
      ceiling:
        cpu: "128"
        memory: 512Gi
        nvidia.com/gpu: "16"
      cpu_capabilities:
        - avx2
      floors:
        be:
          cpu: "0"
          memory: "0"
        ha:
          cpu: "16"
          memory: 64Gi
          nvidia.com/gpu: "2"
        ma:
          cpu: "32"
          memory: 128Gi
          nvidia.com/gpu: "4"
        wa:
          cpu: "16"
          memory: 64Gi
          nvidia.com/gpu: "2"
      gpu_classes:
        a100-40gb: {max_count: 8}
        a100-80gb: {max_count: 8}
        a10g: {max_count: 8}
        b200: {max_count: 8}
        b300: {max_count: 8}
        h100: {max_count: 8}
        h200: {max_count: 8}
        l4: {max_count: 8}
        l40s: {max_count: 8}
        rtx-pro-server-6000: {max_count: 8}
        t4: {max_count: 8}
        v100: {max_count: 8}
      tpu_classes: {}
    labels:
      cloud: aws
      gpu: "true"
      profile: production
      provider: aws
      role: cell
    name: cell-aws-usw2
    network:
      index: 16
      pod_cidr: 10.16.0.0/16
      pod_cidrs_v6: []
      service_cidr: 172.17.0.0/20
      service_cidrs_v6: []
    provider: aws
    region: usw2
    role: cell
    vpc_cidr: 10.1.0.0/16
    availability_zones: ["us-west-2a", "us-west-2b", "us-west-2c"]
    tier_subnets:
      private: ["10.1.1.0/24", "10.1.2.0/24", "10.1.3.0/24"]
      public: ["10.1.10.0/24", "10.1.11.0/24", "10.1.12.0/24"]
      pod: ["10.1.64.0/18", "10.1.128.0/18", "10.1.192.0/18"]
    workspaces:
      enabled: true
      resource_envelope:
        cpu: {default: 10, max: 190, min: 1}
        gpu_offers: {}
        memory_gib: {default: 32, max: 1400, min: 1}
        storage_gib: {default: 16, max: 1024, min: 8}
        tmp_storage_gib: 256
        tpu_offers: {}
  cell-gcp-euw4:
    account_scope: gcp-main
    cloud: gcp
    compute:
      ceiling:
        cpu: "128"
        google.com/tpu: "8"
        memory: 512Gi
        nvidia.com/gpu: "16"
      cpu_capabilities:
        - avx2
      fixed_pools:
        tpu:
          class: v5e-2x2
          nodes: 1
        tpu-spot:
          class: v5e-2x2
          nodes: 1
      floors:
        be:
          cpu: "0"
          google.com/tpu: "0"
          memory: "0"
          nvidia.com/gpu: "0"
        ha:
          cpu: "16"
          google.com/tpu: "0"
          memory: 64Gi
          nvidia.com/gpu: "2"
        ma:
          cpu: "32"
          google.com/tpu: "4"
          memory: 128Gi
          nvidia.com/gpu: "4"
        wa:
          cpu: "16"
          google.com/tpu: "4"
          memory: 64Gi
          nvidia.com/gpu: "2"
      gpu_classes:
        a100-40gb: {max_count: 1}
        a100-80gb: {max_count: 1}
        l4: {max_count: 1}
        rtx-pro-server-6000: {max_count: 1}
      tpu_classes:
        v5e-2x2: {max_count: 4}
    labels:
      cloud: gcp
      gpu: "true"
      profile: production
      provider: gcp
      role: cell
    name: cell-gcp-euw4
    network:
      index: 17
      pod_cidr: 10.17.0.0/16
      pod_cidrs_v6: []
      service_cidr: 172.17.16.0/20
      service_cidrs_v6: []
    provider: gcp
    region: euw4
    role: cell
    vpc_cidr: 10.2.0.0/16
    availability_zones: ["europe-west4-a", "europe-west4-b", "europe-west4-c"]
    tier_subnets:
      private: ["10.2.1.0/24", "10.2.2.0/24", "10.2.3.0/24"]
      public: ["10.2.10.0/24", "10.2.11.0/24", "10.2.12.0/24"]
      pod: ["10.2.64.0/18", "10.2.128.0/18", "10.2.192.0/18"]
    workspaces:
      enabled: true
      resource_envelope:
        cpu: {default: 4, max: 7, min: 1}
        gpu_offers: {}
        memory_gib: {default: 16, max: 25, min: 1}
        storage_gib: {default: 16, max: 1024, min: 8}
        tmp_storage_gib: 256
        tpu_offers: {}
