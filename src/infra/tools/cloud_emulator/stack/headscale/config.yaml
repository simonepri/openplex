# Configures the Headscale control plane server and coordination endpoints for local fleet mesh.

server_url: https://headscale.ctrl-eaws-lh1.c.corp.local.internal
listen_addr: 0.0.0.0:443
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: true
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: true
    region_id: 999
    region_code: eaws-lh1
    region_name: eAWS lh1 DERP
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: false
  urls: []
  paths: [/etc/headscale/derp.yaml]
  auto_update_enabled: false
  update_frequency: 24h
disable_check_updates: true
node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
policy:
  mode: file
  path: /etc/headscale/policy.hujson
dns:
  magic_dns: true
  base_domain: tailnet.c.corp.local.internal
  override_local_dns: false
  nameservers:
    global: []
    split:
      corp.local.internal:
        - 172.31.0.10
      c.corp.local.internal:
        - 172.31.0.10
  search_domains: []
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
log:
  format: text
  level: info
logtail:
  enabled: false
taildrop:
  enabled: false
auto_update:
  enabled: false
tls_cert_path: /etc/headscale/tls/tls.crt
tls_key_path: /etc/headscale/tls/tls.key
