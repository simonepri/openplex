# Configures commit message validation rules.

style = "conventional"
subject_capitalized = false
subject_length = 72
line_length = 72
imperative_subject = true
subject_not_punctuated = true
no_fixup = true
no_wip = true
merge_commit = true
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
