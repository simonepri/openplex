# BuildBuddy Workflows continuous integration configuration.

actions:
  - name: "CI / Format"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    os: "linux"
    container_image: "ubuntu-24.04"
    platform_properties:
      EstimatedFreeDiskBytes: 100GB
      recycle-runner: true
      preserve-workspace: true
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    git_fetch_depth: 0
    steps:
      - name: "Reset pristine workspace"
        run: git clean -ffdx -e buildbuddy.bazelrc && git reset --hard HEAD && (command -v git-lfs >/dev/null && git lfs pull || true)

      - name: "Configure CI credentials and authentication"
        run: python3 src/bazel/tools/ci/auth.py

      - name: "Verify formatting and code generation"
        run: |
          export BAZEL_CONFIG_FLAGS="--config=ci --config=bb-cloud --remote_executor="
          bazel run ${BAZEL_CONFIG_FLAGS} --build_metadata=COMMIT_STATUS_LABEL="CI / Format" //:fix -- --check

  - name: "CI / Build"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    os: "linux"
    container_image: "ubuntu-24.04"
    platform_properties:
      EstimatedCPU: 8
      EstimatedMemory: 16GB
      EstimatedFreeDiskBytes: 100GB
      recycle-runner: true
      preserve-workspace: true
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    git_fetch_depth: 0
    steps:
      - name: "Reset pristine workspace"
        run: git clean -ffdx -e buildbuddy.bazelrc && git reset --hard HEAD && (command -v git-lfs >/dev/null && git lfs pull || true)

      - name: "Configure CI credentials and authentication"
        run: python3 src/bazel/tools/ci/auth.py

      - name: "Build targets and validate aspects"
        run: |
          export BAZEL_CONFIG_FLAGS="--config=ci --config=bb-cloud --remote_executor="
          bazel build ${BAZEL_CONFIG_FLAGS} --build_metadata=COMMIT_STATUS_LABEL="CI / Build" //...

  - name: "CI / Test"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    os: "linux"
    container_image: "ubuntu-24.04"
    platform_properties:
      EstimatedCPU: 8
      EstimatedMemory: 16GB
      EstimatedFreeDiskBytes: 100GB
      recycle-runner: true
      preserve-workspace: true
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    git_fetch_depth: 0
    steps:
      - name: "Reset pristine workspace"
        run: git clean -ffdx -e buildbuddy.bazelrc && git reset --hard HEAD && (command -v git-lfs >/dev/null && git lfs pull || true)

      - name: "Configure CI credentials and authentication"
        run: python3 src/bazel/tools/ci/auth.py

      - name: "Run test suite"
        run: |
          export BAZEL_CONFIG_FLAGS="--config=ci --config=bb-cloud --remote_executor="
          bazel test ${BAZEL_CONFIG_FLAGS} --build_metadata=COMMIT_STATUS_LABEL="CI / Test" //...

  - name: "CI / Review"
    triggers:
      pull_request:
        branches:
          - "*"
    os: "linux"
    container_image: "ubuntu-24.04"
    platform_properties:
      EstimatedFreeDiskBytes: 100GB
      recycle-runner: true
      preserve-workspace: true
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    git_fetch_depth: 0
    timeout: "30m"
    env:
      IS_SANDBOX: "1"
      MISE_YES: "1"
    steps:
      - name: "Reset pristine workspace"
        run: git clean -ffdx -e buildbuddy.bazelrc && git reset --hard HEAD && (command -v git-lfs >/dev/null && git lfs pull || true)

      - name: "Configure CI credentials and authentication"
        run: python3 src/bazel/tools/ci/auth.py

      - name: "Execute PR review gate"
        run: |
          export BAZEL_CONFIG_FLAGS="--config=ci --config=bb-cloud --remote_executor="
          bazel run ${BAZEL_CONFIG_FLAGS} --build_metadata=COMMIT_STATUS_LABEL="CI / Review" //src/infra/tools/review:ci
